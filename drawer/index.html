<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Arcade - Drawer</title>
    <!-- On charge ton dictionnaire externe -->
    <script src="words.js"></script>
    <style>
        :root { --bg: #0b0c10; --panel: rgba(31, 40, 51, 0.95); --cyan: #66fcf1; --teal: #45a29e; --text: #c5c6c7; --draw-bg: #ffffff; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; user-select: none; }
        h1 { color: var(--cyan); text-transform: uppercase; letter-spacing: 3px; margin: 10px 0; text-shadow: 0 0 15px rgba(102, 252, 241, 0.5); }
        
        #game-wrapper { background: var(--panel); border: 1px solid rgba(102, 252, 241, 0.3); border-radius: 15px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); max-width: 1200px; width: 100%; display: flex; flex-direction: column; gap: 20px; position: relative; }
        
        /* MENU */
        #lobby { text-align: center; }
        .player-input-group { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 20px 0; }
        .p-input { padding: 10px; border-radius: 5px; border: 1px solid var(--teal); background: #111; color: #fff; text-align: center; font-weight: bold; width: 120px; }
        .lang-select { padding: 10px; border-radius: 5px; background: #222; color: #fff; font-weight: bold; border: 1px solid var(--cyan); cursor: pointer; }
        .btn { background: var(--cyan); color: #000; border: none; padding: 12px 25px; font-weight: bold; border-radius: 8px; cursor: pointer; text-transform: uppercase; transition: 0.2s; box-shadow: 0 0 10px rgba(102, 252, 241, 0.3); margin: 5px; }
        .btn:hover { transform: scale(1.05); box-shadow: 0 0 20px var(--cyan); }
        
        /* LAYOUT JEU */
        #game-area { display: none; gap: 20px; align-items: stretch; }
        
        /* PANNEAU GAUCHE (Joueurs / Chat) */
        #left-panel { flex: 1; display: flex; flex-direction: column; gap: 10px; min-width: 250px; }
        #players-panel { background: rgba(0,0,0,0.5); padding: 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); flex: 1; overflow-y: auto; }
        .player-card { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; border-left: 4px solid var(--teal); margin-bottom: 5px; }
        .player-card.active-turn { border-color: var(--cyan); background: rgba(102, 252, 241, 0.1); }
        
        /* CHAT BOX */
        #chat-box { background: rgba(0,0,0,0.8); border-radius: 10px; border: 1px solid var(--teal); display: flex; flex-direction: column; height: 250px; }
        #chat-messages { flex: 1; overflow-y: auto; padding: 10px; font-size: 0.9em; display: flex; flex-direction: column; gap: 5px; }
        .chat-msg { background: rgba(255,255,255,0.05); padding: 5px 10px; border-radius: 5px; }
        .chat-success { background: rgba(57, 255, 20, 0.2); color: #39ff14; font-weight: bold; }
        #chat-input-area { display: flex; padding: 10px; background: #111; border-top: 1px solid var(--teal); border-radius: 0 0 10px 10px; gap: 5px; }
        #chat-guesser { width: 40%; background: #222; color: #fff; border: 1px solid #444; border-radius: 5px; }
        #chat-input { flex: 1; padding: 8px; border-radius: 5px; border: 1px solid #444; background: #000; color: #fff; }

        /* ZONE DESSIN */
        #drawing-zone { flex: 3; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        #top-bar { display: flex; justify-content: space-between; width: 100%; align-items: center; background: #111; padding: 10px 20px; border-radius: 8px; box-sizing: border-box; border: 1px solid var(--teal); }
        #word-display { font-size: 2em; letter-spacing: 5px; font-weight: bold; color: #fff; }
        #timer { font-size: 1.5em; color: #ff007f; font-weight: bold; }
        
        .canvas-container { position: relative; width: 100%; max-width: 800px; aspect-ratio: 16/9; }
        canvas { background: var(--draw-bg); border-radius: 8px; cursor: crosshair; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); width: 100%; height: 100%; touch-action: none; }
        #gartic-image-display { position: absolute; top:0; left:0; width:100%; height:100%; background: #fff; border-radius: 8px; object-fit: contain; display: none; }
        
        /* Outils Paint */
        #toolbar { display: flex; gap: 10px; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 10px; width: 100%; justify-content: center; align-items: center; flex-wrap: wrap; border: 1px solid rgba(255,255,255,0.1); }
        .tool-btn { background: #222; border: 1px solid #444; color: white; padding: 10px; border-radius: 5px; cursor: pointer; transition: 0.2s; }
        .tool-btn.active { background: var(--cyan); color: #000; border-color: #fff; }
        input[type="color"] { cursor: pointer; height: 35px; border: none; background: none; }
        
        /* OVERLAYS */
        .game-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; border-radius: 15px; }
        .gartic-input { font-size: 1.5em; padding: 15px; width: 80%; max-width: 500px; border-radius: 10px; border: 2px solid var(--cyan); background: #111; color: #fff; text-align: center; margin: 20px 0; }

        /* GARTIC EVOLUTION SCREEN */
        #gartic-evolution { display: none; flex-direction: column; gap: 20px; padding: 20px; overflow-y: auto; max-height: 80vh; width: 100%; }
        .evo-step { background: #111; border: 1px solid var(--teal); border-radius: 10px; padding: 15px; text-align: center; }
        .evo-step img { max-width: 100%; height: 200px; object-fit: contain; background: #fff; border-radius: 5px; margin-top: 10px; }

        .hub-link { position: absolute; top: 15px; left: 15px; color: rgba(255,255,255,0.7); text-decoration: none; font-weight: bold; background: rgba(0,0,0,0.6); padding: 10px 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); }
    </style>
</head>
<body>
    <a href="../index.html" class="hub-link">⬅ Retour au Hub</a>
    <h1>Drawer</h1>

    <div id="game-wrapper">
        <!-- LOBBY -->
        <div id="lobby">
            <h2 style="color: var(--teal);">Configuration (2 à 8 Joueurs)</h2>
            <select id="lang-selector" class="lang-select">
                <option value="fr">Dictionnaire : Français 🇫🇷</option>
                <option value="en">Dictionary : English 🇬🇧</option>
            </select>
            
            <div class="player-input-group" id="player-inputs"></div>
            <button class="btn" style="background:#333;color:#fff;" onclick="addPlayerField()">+ Ajouter Joueur</button>
            <br><br>
            <button class="btn" style="background:#00f0ff; padding: 15px 30px; font-size:1.2em;" onclick="startGame('classic')">Mode Classique (Points)</button>
            <button class="btn" style="background:#ff007f; padding: 15px 30px; font-size:1.2em;" onclick="startGame('gartic')">Mode Gartic Phone (Téléphone Arabe)</button>
        </div>

        <!-- ZONE DE JEU -->
        <div id="game-area">
            <div id="left-panel">
                <div id="players-panel"></div>
                <div id="chat-box" style="display:none;">
                    <div id="chat-messages"></div>
                    <div id="chat-input-area">
                        <select id="chat-guesser"></select>
                        <input type="text" id="chat-input" placeholder="Devine ici..." onkeypress="checkChatGuess(event)">
                    </div>
                </div>
            </div>

            <div id="drawing-zone">
                <div id="top-bar">
                    <div style="font-weight:bold; color:var(--cyan);" id="current-drawer-txt">Tour de : ???</div>
                    <div id="word-display">_ _ _ _</div>
                    <div id="timer">--</div>
                </div>

                <div class="canvas-container">
                    <canvas id="drawCanvas" width="800" height="450"></canvas>
                    <img id="gartic-image-display" src="">
                    
                    <!-- Overlay Pass-and-Play -->
                    <div class="game-overlay" id="turn-overlay" style="display:none;">
                        <h2 id="turn-title" style="color:var(--cyan); font-size:2em;"></h2>
                        <p id="turn-desc">Les autres joueurs ne regardent pas !</p>
                        
                        <!-- Input Gartic Phone -->
                        <input type="text" id="gartic-input" class="gartic-input" style="display:none;" placeholder="Tape ton mot ou ta phrase ici...">
                        
                        <!-- Affichage Mot Classique -->
                        <h1 id="secret-word-big" style="color:#ff007f; font-size:4em; text-transform:uppercase; display:none;"></h1>
                        
                        <button class="btn" id="btn-start-action" onclick="startAction()">Go !</button>
                    </div>
                </div>

                <div id="toolbar">
                    <button class="tool-btn active" onclick="setTool('pen', this)">✏️ Pinceau</button>
                    <button class="tool-btn" onclick="setTool('eraser', this)">🧹 Gomme</button>
                    <button class="tool-btn" onclick="setTool('line', this)">📏 Ligne</button>
                    <input type="color" id="colorPicker" value="#000000">
                    <input type="range" id="sizePicker" min="1" max="50" value="5">
                    <button class="tool-btn" style="background:#ff2a2a;" onclick="clearCanvas()">🗑️ Effacer</button>
                </div>
            </div>
        </div>

        <!-- ECRAN EVOLUTION GARTIC -->
        <div id="gartic-evolution">
            <h2 style="text-align:center; color:var(--cyan);">L'évolution de votre oeuvre :</h2>
            <div id="evo-container"></div>
            <button class="btn" style="margin: 0 auto; display:block;" onclick="location.reload()">Rejouer</button>
        </div>
    </div>

    <script>
        // ==========================================
        // NORMALISATION (Retire accents, majuscules)
        // ==========================================
        function normalizeWord(str) {
            return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
        }

        // ==========================================
        // VARIABLES GLOBALES
        // ==========================================
        let players = [];
        let currentMode = ""; // 'classic' ou 'gartic'
        let currentLang = "fr";
        
        // Classic Variables
        let currentTurnIndex = 0;
        let currentWord = "";
        let hintArray = [];
        let timer = null;
        let timeLeft = 45;
        let isTurnActive = false;
        let correctGuessers = [];

        // Gartic Variables
        let garticChain = []; // [{player: "Bob", type: "text", content: "Un chat"}, {player: "Alice", type: "img", content: "data:..."}]
        let garticTurnIndex = 0;

        // Init UI Joueurs
        for(let i=1; i<=3; i++) addPlayerField();

        function addPlayerField() {
            if(document.querySelectorAll('.p-input').length >= 8) return;
            let nb = document.querySelectorAll('.p-input').length + 1;
            let input = document.createElement('input');
            input.type = 'text'; input.className = 'p-input'; input.value = `Joueur ${nb}`;
            document.getElementById('player-inputs').appendChild(input);
        }

        function startGame(mode) {
            let inputs = document.querySelectorAll('.p-input');
            players = [];
            inputs.forEach(inp => { if(inp.value.trim() !== "") players.push({name: inp.value.trim(), score: 0}); });
            
            if(players.length < 2) { alert("Il faut au moins 2 joueurs !"); return; }
            
            currentMode = mode;
            currentLang = document.getElementById('lang-selector').value;
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('game-area').style.display = 'flex';
            
            if(mode === 'classic') {
                document.getElementById('chat-box').style.display = 'flex';
                currentTurnIndex = -1;
                nextClassicTurn();
            } else {
                document.getElementById('chat-box').style.display = 'none';
                document.getElementById('players-panel').style.display = 'none';
                document.getElementById('timer').style.display = 'none';
                garticTurnIndex = 0;
                garticChain = [];
                nextGarticTurn();
            }
        }

        // ==========================================
        // MODE CLASSIQUE (Points & Chat)
        // ==========================================
        function updatePlayersUI() {
            let panel = document.getElementById('players-panel');
            panel.innerHTML = '<h3 style="margin:0; color:var(--cyan); text-align:center;">Scores</h3>';
            let sorted = [...players].sort((a,b) => b.score - a.score);
            
            sorted.forEach(p => {
                let isDrawer = (players[currentTurnIndex] && players[currentTurnIndex].name === p.name);
                let div = document.createElement('div');
                div.className = `player-card ${isDrawer ? 'active-turn' : ''}`;
                div.innerHTML = `<b>${p.name}</b> <span>${p.score} pts ${isDrawer ? '✏️' : ''}</span>`;
                panel.appendChild(div);
            });

            // Update Chat Select
            let select = document.getElementById('chat-guesser');
            select.innerHTML = "";
            players.forEach((p, i) => {
                if(i !== currentTurnIndex) {
                    let opt = document.createElement('option');
                    opt.value = p.name; opt.innerText = p.name;
                    select.appendChild(opt);
                }
            });
        }

        function nextClassicTurn() {
            clearInterval(timer);
            isTurnActive = false;
            correctGuessers = [];
            currentTurnIndex = (currentTurnIndex + 1) % players.length;
            
            let drawer = players[currentTurnIndex];
            document.getElementById('current-drawer-txt').innerText = `Dessinateur : ${drawer.name}`;
            document.getElementById('timer').innerText = "45s";
            document.getElementById('chat-messages').innerHTML = ""; // Clear chat
            clearCanvas();
            updatePlayersUI();

            // Choix du mot
            let randItem = dictionary[Math.floor(Math.random() * dictionary.length)];
            currentWord = randItem[currentLang];

            // Overlay secret
            document.getElementById('turn-overlay').style.display = 'flex';
            document.getElementById('turn-title').innerText = `À toi de dessiner, ${drawer.name} !`;
            document.getElementById('turn-desc').innerText = "Les autres joueurs, fermez les yeux !";
            document.getElementById('secret-word-big').style.display = 'block';
            document.getElementById('secret-word-big').innerText = currentWord;
            document.getElementById('gartic-input').style.display = 'none';
        }

        function startAction() {
            document.getElementById('turn-overlay').style.display = 'none';
            
            if(currentMode === 'classic') {
                // Setup Hints
                hintArray = currentWord.split('').map(c => c === ' ' ? ' ' : '_');
                document.getElementById('word-display').innerText = hintArray.join(' ');
                
                isTurnActive = true;
                timeLeft = 45;
                
                timer = setInterval(() => {
                    timeLeft--;
                    document.getElementById('timer').innerText = timeLeft + "s";
                    
                    // Indices
                    if(timeLeft === 30 || timeLeft === 15) {
                        let unrevealed = [];
                        for(let i=0; i<hintArray.length; i++) { if(hintArray[i] === '_') unrevealed.push(i); }
                        if(unrevealed.length > 0) {
                            let rIdx = unrevealed[Math.floor(Math.random() * unrevealed.length)];
                            hintArray[rIdx] = currentWord[rIdx];
                            document.getElementById('word-display').innerText = hintArray.join(' ');
                        }
                    }

                    if(timeLeft <= 0) endClassicTurn("Temps écoulé ! Le mot était : " + currentWord);
                }, 1000);
            } 
            else if (currentMode === 'gartic') {
                // Sauvegarde l'action
                let pName = players[garticTurnIndex].name;
                
                if (garticTurnIndex === 0 || garticTurnIndex % 2 === 2 /* 2,4,6 = deviner */) { // C'est un tour d'écriture
                    let val = document.getElementById('gartic-input').value;
                    if(!val) val = "Rien du tout";
                    garticChain.push({player: pName, type: "text", content: val});
                } else { // C'est un tour de dessin, le joueur vient de cliquer sur Go pour valider son dessin
                    let data = drawCanvas.toDataURL();
                    garticChain.push({player: pName, type: "img", content: data});
                    clearCanvas();
                }
                
                garticTurnIndex++;
                if(garticTurnIndex >= players.length) showGarticEvolution();
                else nextGarticTurn();
            }
        }

        function checkChatGuess(e) {
            if(e.key === 'Enter' && isTurnActive) {
                let guess = normalizeWord(e.target.value);
                let target = normalizeWord(currentWord);
                let guesserName = document.getElementById('chat-guesser').value;
                let chatDiv = document.getElementById('chat-messages');
                
                if(guess === target) {
                    if(!correctGuessers.includes(guesserName)) {
                        correctGuessers.push(guesserName);
                        // Calcul des points
                        let maxPoints = players.length - 1;
                        let pointsWon = maxPoints - (correctGuessers.length - 1);
                        
                        let p = players.find(x => x.name === guesserName);
                        p.score += pointsWon;
                        
                        // Le dessinateur gagne 1 point par personne qui trouve
                        players[currentTurnIndex].score += 1;
                        
                        chatDiv.innerHTML += `<div class="chat-msg chat-success">✅ ${guesserName} a trouvé le mot ! (+${pointsWon}pts)</div>`;
                        
                        if(correctGuessers.length >= players.length - 1) {
                            setTimeout(() => endClassicTurn("Tout le monde a trouvé !"), 1000);
                        }
                    }
                } else {
                    chatDiv.innerHTML += `<div class="chat-msg"><b>${guesserName}:</b> ${e.target.value}</div>`;
                }
                
                e.target.value = "";
                chatDiv.scrollTop = chatDiv.scrollHeight; // Auto-scroll
                updatePlayersUI();
            }
        }

        function endClassicTurn(msg) {
            clearInterval(timer);
            isTurnActive = false;
            alert(msg);
            nextClassicTurn();
        }

        // ==========================================
        // MODE GARTIC PHONE (Pass & Play)
        // ==========================================
        function nextGarticTurn() {
            let pName = players[garticTurnIndex].name;
            document.getElementById('turn-overlay').style.display = 'flex';
            document.getElementById('secret-word-big').style.display = 'none';
            document.getElementById('current-drawer-txt').innerText = `Joueur actuel : ${pName}`;
            
            let isDrawTurn = (garticTurnIndex % 2 !== 0); // 1, 3, 5... dessinent
            
            if(garticTurnIndex === 0) {
                // 1er joueur invente
                document.getElementById('turn-title').innerText = `${pName}, invente un mot ou une phrase !`;
                document.getElementById('turn-desc').innerText = "Les autres ne regardent pas.";
                document.getElementById('gartic-input').style.display = 'block';
                document.getElementById('gartic-input').value = "";
                document.getElementById('gartic-input').placeholder = "Ex: Un singe astronaute";
                document.getElementById('drawCanvas').style.display = 'none';
                document.getElementById('toolbar').style.display = 'none';
                document.getElementById('word-display').innerText = "INVENTION";
            } else if (isDrawTurn) {
                // Dessin du concept précédent
                let previousConcept = garticChain[garticTurnIndex - 1].content;
                document.getElementById('turn-title').innerText = `${pName}, dessine ça :`;
                document.getElementById('turn-desc').innerText = previousConcept;
                document.getElementById('gartic-input').style.display = 'none';
                document.getElementById('drawCanvas').style.display = 'block';
                document.getElementById('toolbar').style.display = 'flex';
                document.getElementById('word-display').innerText = "DESSINE";
                document.getElementById('gartic-image-display').style.display = 'none';
            } else {
                // Devine le dessin précédent
                let previousImg = garticChain[garticTurnIndex - 1].content;
                document.getElementById('turn-title').innerText = `${pName}, que représente ce dessin ?`;
                document.getElementById('turn-desc').innerText = "Observe l'image et décris-la.";
                document.getElementById('gartic-input').style.display = 'block';
                document.getElementById('gartic-input').value = "";
                document.getElementById('gartic-input').placeholder = "Je vois...";
                document.getElementById('drawCanvas').style.display = 'none';
                document.getElementById('toolbar').style.display = 'none';
                
                // Afficher l'image précédente
                document.getElementById('gartic-image-display').src = previousImg;
                document.getElementById('gartic-image-display').style.display = 'block';
                document.getElementById('word-display').innerText = "DEVINE";
            }
        }

        function showGarticEvolution() {
            document.getElementById('game-area').style.display = 'none';
            document.getElementById('turn-overlay').style.display = 'none';
            
            let evoContainer = document.getElementById('evo-container');
            evoContainer.innerHTML = "";
            
            garticChain.forEach((step, i) => {
                let div = document.createElement('div');
                div.className = 'evo-step';
                if(step.type === 'text') {
                    div.innerHTML = `<h3 style="color:var(--teal);">✏️ ${step.player} a écrit :</h3><h2>"${step.content}"</h2>`;
                } else {
                    div.innerHTML = `<h3 style="color:var(--cyan);">🎨 ${step.player} a dessiné :</h3><img src="${step.content}">`;
                }
                evoContainer.appendChild(div);
            });
            
            document.getElementById('gartic-evolution').style.display = 'flex';
        }

        // ==========================================
        // MOTEUR DE DESSIN (CANVAS)
        // ==========================================
        const drawCanvas = document.getElementById('drawCanvas');
        const ctx = drawCanvas.getContext('2d');
        let isDrawing = false; let startX = 0, startY = 0; let currentTool = 'pen'; 

        ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, drawCanvas.width, drawCanvas.height);
        
        function getMousePos(e) {
            let rect = drawCanvas.getBoundingClientRect();
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            // Ajustement car le canvas est redimensionné en CSS avec width:100%
            let scaleX = drawCanvas.width / rect.width;
            let scaleY = drawCanvas.height / rect.height;
            return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
        }

        function setTool(tool, btn) {
            currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function clearCanvas() { ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, drawCanvas.width, drawCanvas.height); }

        drawCanvas.addEventListener('mousedown', startDraw); drawCanvas.addEventListener('mousemove', drawing);
        drawCanvas.addEventListener('mouseup', stopDraw); drawCanvas.addEventListener('mouseout', stopDraw);
        drawCanvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDraw(e); });
        drawCanvas.addEventListener('touchmove', (e) => { e.preventDefault(); drawing(e); });
        drawCanvas.addEventListener('touchend', stopDraw);

        function startDraw(e) {
            isDrawing = true; let pos = getMousePos(e); startX = pos.x; startY = pos.y;
            ctx.beginPath(); ctx.moveTo(startX, startY);
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            ctx.lineWidth = document.getElementById('sizePicker').value;
            ctx.strokeStyle = currentTool === 'eraser' ? '#ffffff' : document.getElementById('colorPicker').value;
        }

        function drawing(e) {
            if (!isDrawing) return; let pos = getMousePos(e);
            if (currentTool === 'pen' || currentTool === 'eraser') { ctx.lineTo(pos.x, pos.y); ctx.stroke(); }
            else if (currentTool === 'line') {
                // Pour une ligne droite, on trace du start au current point
                // (Idéalement, il faudrait sauvegarder l'état du canvas, mais pour simplifier sur Drawer, c'est tracé en direct)
                ctx.lineTo(pos.x, pos.y); ctx.stroke(); 
                startX = pos.x; startY = pos.y; // Transforme l'outil ligne en stylo droit
            }
        }
        function stopDraw() { isDrawing = false; }
    </script>
</body>
</html>
