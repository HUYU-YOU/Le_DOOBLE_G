<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Slime-Garou : Infection Protocol</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        /* =========================================
           1. VARIABLES CYBERPUNK ET RESET
           ========================================= */
        :root {
            --bg-color: #0b0c10;
            --container-bg: #1a1e24;
            --inner-bg: #0d1117;
            --neon-cyan: #00e5ff;
            --neon-pink: #ff007f;
            --neon-green: #39ff14;
            --neon-yellow: #fce803;
            --neon-purple: #9b59b6;
            --text-color: #e0e0e0;
            --font-ui: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --font-mono: 'Courier New', Courier, monospace;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; min-height: 100vh;
            background-color: var(--bg-color); color: var(--text-color);
            font-family: var(--font-ui); overflow-x: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            font-size: 1.1rem;
        }

        /* Video Background */
        #bg-video {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -100; object-fit: cover; opacity: 0.4; transition: opacity 1s ease-in-out;
            pointer-events: none;
        }

        /* =========================================
           2. BOUTON RETOUR HUB & TIMER
           ========================================= */
        #btn-retour-hub {
            position: fixed; top: 20px; left: 20px; z-index: 9999;
            background-color: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff; padding: 12px 20px; font-family: var(--font-ui);
            font-size: 1.1rem; border-radius: 6px; cursor: pointer;
            display: flex; align-items: center; gap: 8px;
            text-decoration: none; transition: 0.3s ease;
        }
        #btn-retour-hub:hover { background-color: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.5); }

        #timer-display {
            position: fixed; top: 20px; right: 20px; z-index: 9999;
            font-size: 1.8rem; font-weight: bold; color: var(--neon-yellow);
            text-shadow: 0 0 10px rgba(252, 232, 3, 0.8); display: none;
            background: rgba(0,0,0,0.7); padding: 8px 20px; border-radius: 8px; border: 1px solid var(--neon-yellow);
        }

        .main-title {
            color: var(--neon-cyan); text-shadow: 0 0 15px rgba(0, 229, 255, 0.6);
            text-transform: uppercase; margin-top: 60px; margin-bottom: 30px;
            font-size: 3rem; letter-spacing: 4px; font-weight: bold;
        }

        /* =========================================
           3. CONTENEUR PRINCIPAL
           ========================================= */
        .container {
            background: var(--container-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; padding: 40px; width: 95%; max-width: 800px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-bottom: 40px; text-align: center;
        }

        .no-swipe { touch-action: none; }
        h2 { font-size: 2.2rem; }
        h3 { color: var(--neon-cyan); margin-top: 0; margin-bottom: 15px; font-weight: 600; font-size: 1.6rem; }
        
        /* =========================================
           4. INPUTS ET BOUTONS
           ========================================= */
        input[type="text"], input[type="number"] {
            background: var(--inner-bg); border: 1px solid rgba(255,255,255,0.2);
            color: #fff; padding: 15px; margin: 10px 0; width: 100%;
            box-sizing: border-box; font-family: inherit; font-size: 1.2rem;
            border-radius: 6px; outline: none; transition: 0.3s; text-align: center;
        }
        input:focus { border-color: var(--neon-cyan); box-shadow: 0 0 10px rgba(0,229,255,0.3); }

        .btn-solid {
            width: 100%; padding: 18px; margin: 15px 0; border: none; border-radius: 8px;
            font-size: 1.3rem; font-weight: bold; text-transform: uppercase;
            cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; font-family: inherit;
        }
        .btn-solid:active { transform: scale(0.98); }
        
        .btn-pink { background-color: var(--neon-pink); color: #fff; box-shadow: 0 0 15px rgba(255, 0, 127, 0.5); }
        .btn-pink:hover { box-shadow: 0 0 25px rgba(255, 0, 127, 0.8); }

        .btn-cyan { background-color: var(--neon-cyan); color: #000; box-shadow: 0 0 15px rgba(0, 229, 255, 0.5); }
        .btn-cyan:hover { box-shadow: 0 0 25px rgba(0, 229, 255, 0.8); }

        .btn-outline {
            background: transparent; border: 2px solid gray; color: gray;
            padding: 12px 20px; border-radius: 6px; cursor: pointer; transition: 0.3s; margin: 5px;
            font-size: 1.1rem; font-weight: 600;
        }
        .btn-outline.selected { background-color: rgba(255,255,255,0.1); transform: scale(1.05); }

        .lang-selector { display: flex; justify-content: center; gap: 20px; margin: 25px 0; }
        .lang-btn { 
            background: transparent; border: none; font-size: 2.5rem; 
            cursor: pointer; opacity: 0.4; transition: 0.3s; padding: 0; filter: grayscale(100%);
        }
        .lang-btn.active { opacity: 1; filter: grayscale(0%) drop-shadow(0 0 10px rgba(255,255,255,0.5)); transform: scale(1.1); }

        /* =========================================
           5. ZONES SPÉCIFIQUES
           ========================================= */
        .share-code-text { font-size: 1.3rem; color: #aaa; margin-bottom: 20px; }
        .share-code-val { color: var(--neon-cyan); font-weight: bold; font-size: 2rem; letter-spacing: 2px; user-select: all; display: block; margin-top:10px; }

        .player-box {
            background: var(--inner-bg); border: 1px solid rgba(0, 229, 255, 0.3);
            border-radius: 8px; padding: 20px; margin-bottom: 25px; min-height: 100px; text-align: center;
        }
        .player-box h4 { margin: 0 0 15px 0; color: #fff; font-weight: 500; font-size: 1.3rem; }
        
        .players-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; }
        .player-badge { background: transparent; border: 1px solid #555; color: #ccc; padding: 8px 15px; border-radius: 4px; font-size: 1.1rem; font-weight: 500;}

        .config-grid { 
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px; text-align: left; 
            background: var(--inner-bg); padding: 20px; border-radius: 8px; margin-bottom: 25px;
        }
        .checkbox-group { display: flex; align-items: center; justify-content: space-between; font-size: 1.1rem; }
        input[type="checkbox"] { accent-color: var(--neon-pink); width: 22px; height: 22px; }

        #game-area { display: none; }
        .role-card {
            border: 3px solid var(--neon-cyan); padding: 30px; margin: 30px 0;
            box-shadow: 0 0 25px rgba(0,229,255,0.2); background: var(--inner-bg); border-radius: 12px; transition: all 0.5s;
        }
        .role-img { max-width: 300px; width: 100%; display: block; margin: 0 auto 20px; filter: drop-shadow(0 0 15px var(--neon-cyan)); }
        #role-name { font-size: 2.5rem; margin-bottom: 10px;}
        #role-desc { font-size: 1.2rem; }
        
        #game-over-screen { display: none; margin-top: 30px; border: 3px solid var(--neon-yellow); padding: 30px; border-radius: 12px; box-shadow: 0 0 30px rgba(252, 232, 3, 0.2); background: var(--inner-bg);}
        #winner-text { font-size: 2.8rem; margin-bottom: 10px; }
        #winner-desc { font-size: 1.4rem; }

        /* Chat Loup-Garou */
        #ww-chat-container { display: none; border: 2px solid var(--neon-pink); background: rgba(255,0,127,0.05); padding: 15px; border-radius: 8px; margin-bottom: 30px;}
        #ww-chat-messages { height: 120px; overflow-y: auto; text-align: left; margin-bottom: 10px; font-size: 1rem; color: #fff; }
        #ww-chat-messages p { margin: 4px 0; }
        .ww-chat-sender { color: var(--neon-pink); font-weight: bold; }

        /* Chat Global */
        #global-chat-container { border: 2px solid #555; background: var(--inner-bg); padding: 15px; border-radius: 8px; margin-top: 30px; }
        #global-chat-messages { height: 180px; overflow-y: auto; text-align: left; margin-bottom: 10px; font-size: 1rem; color: #ddd; font-family: var(--font-mono); }
        #global-chat-messages p { margin: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 4px; }
        .global-chat-sender { color: var(--neon-cyan); font-weight: bold; font-family: var(--font-ui);}
        .sys-log-msg { color: var(--neon-green); font-weight: bold; }
    </style>
</head>
<body>

    <a href="../index.html" id="btn-retour-hub">&#11013; Retour au Hub</a>
    <div id="timer-display">05:00</div>

    <!-- FIX VIDEO BACKGROUND DIRECT SRC -->
    <video id="bg-video" autoplay loop muted playsinline>
        <source src="img/backgroundnight.mp4" type="video/mp4">
    </video>
    <div id="yt-player" style="display: none;"></div>

    <script>
        document.addEventListener('touchstart', (e) => {
            if(e.target.closest('.no-swipe')) { e.stopPropagation(); }
        }, {passive: false});
    </script>

    <div class="main-title" id="ui-title">SLIME-GAROU</div>

    <div class="container no-swipe">
        
        <div id="menu">
            <h2 class="ui-text" data-key="menuTitle" style="color: #fff;">Connexion</h2>
            <button id="btn-create" class="btn-solid btn-cyan ui-text" data-key="btnCreate">Créer une partie</button>
            <hr style="border-color: rgba(255,255,255,0.1); margin: 35px 0;">
            <input type="text" id="join-id" placeholder="Code de la partie (ex: GAR8369)" style="text-transform: uppercase;">
            <input type="text" id="player-name" placeholder="Votre Pseudo">
            <button id="btn-join" class="btn-solid btn-pink ui-text" data-key="btnJoin">Rejoindre</button>
        </div>

        <div id="lobby" style="display: none;">
            <h2 class="ui-text" data-key="configTitle">Configuration</h2>
            <p class="share-code-text">
                <span class="ui-text" data-key="shareText">Partagez ce code aux joueurs :</span> 
                <span id="my-id" class="share-code-val">Génération...</span>
            </p>
            <div class="player-box">
                <h4 class="ui-text" data-key="playersConnected">Player connected :</h4>
                <div id="players-list-container" class="players-container">
                    <span class="player-badge">Toi</span>
                </div>
            </div>

            <p style="color: #fff; font-weight: 500; margin-bottom: 10px;" class="ui-text" data-key="dictLang">Dictionary language</p>
            <div class="lang-selector">
                <button id="lang-fr" class="lang-btn active" title="Français">🇫🇷</button>
                <button id="lang-en" class="lang-btn" title="English">🇬🇧</button>
            </div>

            <div id="host-config" style="display: none;">
                <div class="config-grid">
                    <div style="display: flex; align-items: center; justify-content: space-between;">
                        <label class="ui-text" data-key="cfgWolves">Garous :</label>
                        <input type="number" id="cfg-wolves" value="1" min="1" max="3" style="width: 70px; margin: 0; padding: 10px;">
                    </div>
                    <div class="checkbox-group"><label class="ui-text" data-key="roleSeer">Voyante</label><input type="checkbox" id="cfg-seer" checked></div>
                    <div class="checkbox-group"><label class="ui-text" data-key="roleWitch">Sorcière</label><input type="checkbox" id="cfg-witch" checked></div>
                    <div class="checkbox-group"><label class="ui-text" data-key="roleCupid">Cupidon</label><input type="checkbox" id="cfg-cupid"></div>
                    <div class="checkbox-group"><label class="ui-text" data-key="roleHunter">Chasseur</label><input type="checkbox" id="cfg-hunter"></div>
                </div>
                
                <p id="min-players-msg" style="color: var(--neon-yellow); font-size: 1.1rem;" class="ui-text" data-key="waitingMinPlayers">(En attente d'au moins 3 joueurs)</p>
                <button id="btn-start" class="btn-solid btn-pink ui-text" data-key="btnStart" style="display:none;">Lancer la partie</button>
            </div>
            <p id="waiting-host-msg" style="color: gray; display:none; font-size: 1.2rem;" class="ui-text" data-key="waitingHost">En attente de l'hôte...</p>
        </div>

        <div id="game-area" class="no-swipe">
            <h2 id="phase-title" style="color: #fff; font-size: 2.5rem;">...</h2>
            
            <div class="role-card" id="my-role-card">
                <img id="role-image" class="role-img" src="" alt="Role Image">
                <h3 id="role-name" style="margin:0;">...</h3>
                <p id="role-desc">...</p>
                <p id="lovers-info" style="color: #ff69b4; font-weight: bold; display:none; font-size: 1.3rem; margin-top: 15px;"></p>
            </div>

            <!-- CHAT GAROU -->
            <div id="ww-chat-container">
                <h4 class="ui-text" data-key="wwChatTitle" style="color: var(--neon-pink); margin-top:0; font-size: 1.4rem;">Canal Sécurisé : Loups-Garous</h4>
                <div id="ww-chat-messages"></div>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="ww-chat-input" placeholder="..." style="margin:0; flex-grow: 1; padding: 12px;">
                    <button onclick="sendWWChat()" class="btn-solid btn-pink ui-text" data-key="btnSend" style="margin:0; padding: 12px 20px; width: auto;">Go</button>
                </div>
            </div>

            <h3 class="ui-text" data-key="actionInterface" style="color: #fff; font-size: 1.8rem;">Action</h3>
            <div id="action-panel" style="margin-bottom: 30px; min-height: 60px;"></div>

            <!-- CHAT GLOBAL -->
            <div id="global-chat-container">
                <h4 class="ui-text" data-key="globalChatTitle" style="color: var(--neon-cyan); margin-top:0; font-size: 1.4rem; text-align: left;">Chat Général</h4>
                <div id="global-chat-messages"></div>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="global-chat-input" placeholder="..." style="margin:0; flex-grow: 1; padding: 12px;">
                    <button onclick="sendGlobalChat()" class="btn-solid btn-cyan ui-text" data-key="btnSend" style="margin:0; padding: 12px 20px; width: auto;">Go</button>
                </div>
            </div>

            <div id="game-over-screen">
                <h2 id="winner-text" style="color: var(--neon-yellow);">...</h2>
                <p id="winner-desc" style="color: white;"></p>
                <!-- BOUTON REJOUER -->
                <button id="btn-replay" class="btn-solid btn-cyan ui-text" data-key="btnReplay" style="margin-top: 20px; display: none;">Rejouer</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 🎵 GESTION AUDIO & VIDEO (YOUTUBE API)
        // ==========================================
        let ytPlayer;
        let currentBgm = 'night';
        let audioStarted = false;

        const YOUTUBE_NIGHT = '3ecxZy8luDg'; 
        const YOUTUBE_DAY = 'vyg5jJrZ42s';   

        window.onYouTubeIframeAPIReady = function() {
            ytPlayer = new YT.Player('yt-player', {
                height: '0', width: '0', videoId: YOUTUBE_NIGHT,
                playerVars: { 'autoplay': 0, 'controls': 0, 'disablekb': 1 },
                events: {
                    'onReady': (event) => { event.target.setVolume(5); },
                    'onStateChange': (event) => { if (event.data === YT.PlayerState.ENDED) ytPlayer.playVideo(); }
                }
            });
        };

        function initAudio() {
            if (audioStarted) return;
            if (ytPlayer && typeof ytPlayer.playVideo === 'function') {
                ytPlayer.playVideo(); audioStarted = true;
            }
        }

        // FIX ROBUSTE CHARGEMENT VIDEO BACKGROUND DIRECTEMENT SUR LE NODE VIDEO
        function setMediaEnvironment(type) {
            if (currentBgm === type) return; 
            currentBgm = type;
            const video = document.getElementById('bg-video');
            
            video.style.opacity = 0;
            setTimeout(() => {
                if (type === 'day') {
                    video.src = 'img/backgroundday.mp4';
                    if(ytPlayer) ytPlayer.loadVideoById({videoId: YOUTUBE_DAY});
                } else {
                    video.src = 'img/backgroundnight.mp4';
                    if(ytPlayer) ytPlayer.loadVideoById({videoId: YOUTUBE_NIGHT});
                }
                video.load(); 
                let playPromise = video.play();
                if (playPromise !== undefined) {
                    playPromise.catch(error => {
                        console.warn("Autoplay prevented:", error);
                    });
                }
                video.style.opacity = 0.4; 
            }, 500); 
        }

        // ==========================================
        // 🌍 DICTIONNAIRE MULTILINGUE AVANCÉ
        // ==========================================
        const i18n = {
            fr: {
                roles: {
                    werewolf: { name: "Slime-Garou", desc: "Dévore un joueur chaque nuit.", img: "img/garou.png", color: "var(--neon-pink)" },
                    seer: { name: "Voyante", desc: "Scanne l'identité d'un joueur la nuit.", img: "img/voyante.png", color: "var(--neon-cyan)" },
                    witch: { name: "Sorcière", desc: "Possède une potion de soin et une de poison.", img: "img/sorciere.png", color: "var(--neon-purple)" },
                    hunter: { name: "Chasseur", desc: "Si tu meurs, tu tires sur un joueur.", img: "img/chasseur.png", color: "var(--neon-yellow)" },
                    cupid: { name: "Cupidon", desc: "Désigne deux amoureux la première nuit.", img: "img/cupidon.png", color: "#ff69b4" },
                    villager: { name: "Slime Civil", desc: "Trouve et élimine les infectés le jour.", img: "img/slime.png", color: "var(--neon-green)" }
                },
                ui: {
                    menuTitle: "Connexion", btnCreate: "Créer une partie", btnJoin: "Rejoindre",
                    configTitle: "Configuration", shareText: "Partagez ce code aux joueurs :",
                    playersConnected: "Joueurs connectés :", dictLang: "Langue du jeu",
                    cfgWolves: "Nb Garous :", roleSeer: "Voyante", roleWitch: "Sorcière", roleCupid: "Cupidon", roleHunter: "Chasseur",
                    waitingMinPlayers: "(En attente d'au moins 3 joueurs)",
                    btnStart: "Lancer la partie", waitingHost: "En attente du lancement par l'hôte...",
                    actionInterface: "Actions", waiting: "Vote enregistré. En attente...", dead: "VOUS ÊTES MORT. Connexion rompue.",
                    sleep: "Ferme les yeux, le village s'endort...",
                    selectTarget: "Choisissez une cible :", healMsg: "Ressusciter", poisonMsg: "Empoisonner", skipMsg: "Passer",
                    loversLinked: "Tu es secrètement lié à :", wwChatTitle: "Canal Sécurisé : Loups-Garous",
                    globalChatTitle: "Chat Général", btnSend: "Envoyer", btnReplay: "Rejouer"
                },
                phases: {
                    night_cupid: "[Nuit] Cupidon se réveille...",
                    night_seer: "[Nuit] Voyante...",
                    night_wolves: "[Nuit] Garous...",
                    night_witch: "[Nuit] Sorcière...",
                    day_vote: "[Jour] Débattez et votez (5 minutes).",
                    day_hunter: "⚠️ ALERTE : Le Chasseur ({0}) s'effondre et épaule son arme..."
                },
                sys: {
                    hunterShoot: "PAN ! Le Chasseur emporte {0} dans la mort.",
                    loversDie: "L'amour brise le coeur de {0}. Décès immédiat.",
                    noDeath: "Aucun mort ce matin.",
                    deathList: "Code mort ce matin: {0}",
                    timeOut: "Le temps est écoulé sans vote. Pas d'exécution.",
                    lynched: "Le village a lynché : {0}",
                    vision: "[VISION] {0} est {1}",
                    gameInit: "Partie Initialisée."
                }
            },
            en: {
                roles: {
                    werewolf: { name: "Werewolf", desc: "Devour a player every night.", img: "img/werewolf.png", color: "var(--neon-pink)" },
                    seer: { name: "Seer", desc: "Scan a player's identity at night.", img: "img/seer.png", color: "var(--neon-cyan)" },
                    witch: { name: "Witch", desc: "Has one heal and one poison potion.", img: "img/witch.png", color: "var(--neon-purple)" },
                    hunter: { name: "Hunter", desc: "If you die, you shoot a player.", img: "img/hunter.png", color: "var(--neon-yellow)" },
                    cupid: { name: "Cupid", desc: "Link two lovers on the first night.", img: "img/cupid.png", color: "#ff69b4" },
                    villager: { name: "Villager", desc: "Find and eliminate the infected by day.", img: "img/villager.png", color: "var(--neon-green)" }
                },
                ui: {
                    menuTitle: "Connection", btnCreate: "Create Game", btnJoin: "Join",
                    configTitle: "Configuration", shareText: "Share this code with players:",
                    playersConnected: "Player connected:", dictLang: "Dictionary language",
                    cfgWolves: "Werewolves:", roleSeer: "Seer", roleWitch: "Witch", roleCupid: "Cupid", roleHunter: "Hunter",
                    waitingMinPlayers: "(Waiting for at least 3 players)",
                    btnStart: "Start Game", waitingHost: "Waiting for host to start...",
                    actionInterface: "Action", waiting: "Vote saved. Waiting for others...", dead: "YOU ARE DEAD. Connection lost.",
                    sleep: "Close your eyes, the village goes to sleep...",
                    selectTarget: "Select a target:", healMsg: "Heal", poisonMsg: "Poison", skipMsg: "Skip",
                    loversLinked: "You are secretly bound to:", wwChatTitle: "Secure Channel: Werewolves",
                    globalChatTitle: "Global Chat", btnSend: "Send", btnReplay: "Play Again"
                },
                phases: {
                    night_cupid: "[Night] Cupid wakes up...",
                    night_seer: "[Night] Seer...",
                    night_wolves: "[Night] Werewolves...",
                    night_witch: "[Night] Witch...",
                    day_vote: "[Day] Debate and vote (5 minutes).",
                    day_hunter: "⚠️ ALERT: The Hunter ({0}) collapses and aims their weapon..."
                },
                sys: {
                    hunterShoot: "BANG! The Hunter takes {0} to the grave.",
                    loversDie: "Love breaks the heart of {0}. Immediate death.",
                    noDeath: "No deaths this morning.",
                    deathList: "Casualties this morning: {0}",
                    timeOut: "Time is up without a vote. No execution.",
                    lynched: "The village lynched: {0}",
                    vision: "[VISION] {0} is {1}",
                    gameInit: "Game Initialized."
                }
            }
        };

        let currentLang = 'fr';

        function t(category, key, ...args) {
            let text = "";
            if (i18n[currentLang] && i18n[currentLang][category] && i18n[currentLang][category][key]) {
                text = i18n[currentLang][category][key];
            } else {
                return key;
            }
            args.forEach((arg, i) => { text = text.replace(`{${i}}`, arg); });
            return text;
        }

        function updateLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`lang-${lang}`).classList.add('active');
            document.querySelectorAll('.ui-text').forEach(el => {
                const key = el.getAttribute('data-key');
                if (i18n[lang].ui[key]) el.innerText = i18n[lang].ui[key];
            });
            if (myRole) setupRoleUI(myRole);
            
            if (gameState.phase !== 'lobby' && gameState.phase) {
                let arg = gameState.phase === 'day_hunter' && gameState.pendingHunter ? gameState.pendingHunter : "";
                document.getElementById('phase-title').innerText = t('phases', gameState.phase, arg);
            }
        }

        document.getElementById('lang-fr').addEventListener('click', () => updateLang('fr'));
        document.getElementById('lang-en').addEventListener('click', () => updateLang('en'));

        // ==========================================
        // 🛠️ VARIABLES GLOBALES & RÉSEAU
        // ==========================================
        let peer = null;
        let connections = []; 
        let clientPlayers = []; 
        let wolfPartners = []; 
        let isHost = false;
        let myName = "Hôte";
        let myRole = "";
        let witchPotions = { heal: 1, poison: 1 };
        let firstNight = true; 
        let phaseTimer = null; 

        const menuDiv = document.getElementById('menu');
        const lobbyDiv = document.getElementById('lobby');
        const gameArea = document.getElementById('game-area');
        let cupidTargets = []; 

        function addSysLog(sysKey, ...args) {
            const msg = t('sys', sysKey, ...args);
            const chatBox = document.getElementById('global-chat-messages');
            chatBox.innerHTML += `<p><span class="sys-log-msg">> ${msg}</span></p>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function broadcastSysLog(sysKey, ...args) {
            addSysLog(sysKey, ...args);
            broadcast({ type: 'sys_log', key: sysKey, args: args });
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function initPeer(callback, customId = null) {
            peer = customId ? new Peer(customId) : new Peer();
            peer.on('open', (id) => { if(callback) callback(id); });
            peer.on('error', (err) => { 
                if (err.type === 'unavailable-id') alert("Ce code serveur existe déjà.");
                else alert("Erreur Réseau : " + err); 
            });
        }

        function broadcast(data) {
            if (data.type === 'phase_change') {
                data.players = connections.map(c => ({ name: c.name, isAlive: c.isAlive }));
            }
            connections.forEach(c => { if(!c.isHost && c.conn && c.conn.open) c.conn.send(data); });
        }

        // ==========================================
        // 👑 HÔTE : CRÉATION & RÉCEPTION
        // ==========================================
        document.getElementById('btn-create').addEventListener('click', () => {
            initAudio(); 
            isHost = true;
            myName = document.getElementById('player-name').value.trim() || "Agent_" + Math.floor(Math.random()*100);

            menuDiv.style.display = 'none'; lobbyDiv.style.display = 'block';
            document.getElementById('host-config').style.display = 'block';
            
            connections.push({ isHost: true, name: myName, role: null, isAlive: true, id: 'host' });
            updatePlayerListUI();

            const roomId = 'GAR' + Math.floor(1000 + Math.random() * 9000);

            initPeer((id) => { document.getElementById('my-id').innerText = id; }, roomId);

            peer.on('connection', (conn) => {
                conn.on('data', (data) => {
                    if (data.type === 'join') {
                        connections.push({ conn: conn, name: data.name, role: null, isAlive: true, id: conn.peer });
                        updatePlayerListUI();
                        broadcast({ type: 'lobby_update', count: connections.length, list: connections.map(c => c.name) });
                        
                        if (connections.length >= 3) {
                            document.getElementById('btn-start').style.display = 'block';
                            document.getElementById('min-players-msg').style.display = 'none';
                        }
                    } 
                    else if (data.type === 'action' || data.type === 'ww_chat' || data.type === 'global_chat') {
                        handleNetworkAction(conn.peer, data);
                    }
                });
            });
        });

        // ==========================================
        // 👾 CLIENT : CONNEXION & RÉCEPTION
        // ==========================================
        document.getElementById('btn-join').addEventListener('click', () => {
            initAudio(); 
            const hostId = document.getElementById('join-id').value.trim().toUpperCase();
            myName = document.getElementById('player-name').value.trim() || "Agent_" + Math.floor(Math.random()*100);
            
            if(!hostId) { alert("Veuillez entrer un code."); return; }

            menuDiv.style.display = 'none'; lobbyDiv.style.display = 'block';
            document.getElementById('waiting-host-msg').style.display = 'block'; 
            document.getElementById('my-id').innerText = hostId;

            initPeer(() => {
                const conn = peer.connect(hostId);
                conn.on('open', () => {
                    connections.push({conn: conn}); 
                    conn.send({ type: 'join', name: myName });
                });

                conn.on('data', (data) => {
                    if (data.type === 'lobby_update') {
                        generatePlayerBadges(data.list);
                        clientPlayers = data.list.map(n => ({ name: n, isAlive: true }));
                    }
                    else if (data.type === 'game_start') {
                        lobbyDiv.style.display = 'none'; gameArea.style.display = 'block';
                        if (data.extra && data.extra.wolves) wolfPartners = data.extra.wolves;
                        setupRoleUI(data.role); addSysLog('gameInit');
                    }
                    else if (data.type === 'phase_change') {
                        if (data.players) clientPlayers = data.players;
                        updateClientUI(data.phase, data.extra);
                    }
                    else if (data.type === 'sys_log') {
                        addSysLog(data.key, ...data.args);
                    }
                    else if (data.type === 'seer_result') {
                        const translatedRole = i18n[currentLang].roles[data.roleFound].name;
                        const msg = t('sys', 'vision', data.target, translatedRole);
                        addSysLog('vision', data.target, translatedRole);
                        document.getElementById('action-panel').innerHTML = `<p style="color:var(--neon-cyan); font-size: 1.5rem;">${msg}</p>`;
                    }
                    else if (data.type === 'lovers_linked') {
                        const loveInfo = document.getElementById('lovers-info');
                        loveInfo.style.display = 'block'; loveInfo.innerText = `${i18n[currentLang].ui.loversLinked} ${data.partner}`;
                    }
                    else if (data.type === 'game_over') { showGameOver(data.winner, data.desc); }
                    else if (data.type === 'timer_tick') { updateTimerUI(data.time); }
                    else if (data.type === 'ww_chat_recv') { displayWWChat(data.sender, data.text); }
                    else if (data.type === 'global_chat_recv') { displayGlobalChat(data.sender, data.text); }
                    else if (data.type === 'reset_game') { resetClientToLobby(); }
                });
            });
        });

        function updatePlayerListUI() { generatePlayerBadges(connections.map(c => c.name)); }
        function generatePlayerBadges(namesList) {
            const container = document.getElementById('players-list-container');
            container.innerHTML = namesList.map(n => `<span class="player-badge">${n}</span>`).join('');
        }
        function updateTimerUI(timeLeft) {
            const timerEl = document.getElementById('timer-display');
            timerEl.innerText = formatTime(timeLeft);
            timerEl.style.display = timeLeft > 0 ? 'block' : 'none';
        }

        // ==========================================
        // 🎲 DISTRIBUTION DES RÔLES SÉCURISÉE & ALÉATOIRE
        // ==========================================
        document.getElementById('btn-start').addEventListener('click', () => {
            const numPlayers = connections.length;
            const nbWolves = parseInt(document.getElementById('cfg-wolves').value);
            let roles = [];
            
            for(let i=0; i<nbWolves; i++) { if (roles.length < numPlayers) roles.push('werewolf'); }
            let specialRoles = [];
            if (document.getElementById('cfg-seer').checked) specialRoles.push('seer');
            if (document.getElementById('cfg-witch').checked) specialRoles.push('witch');
            if (document.getElementById('cfg-cupid').checked) specialRoles.push('cupid');
            if (document.getElementById('cfg-hunter').checked) specialRoles.push('hunter');
            
            specialRoles.sort(() => Math.random() - 0.5);
            for (let role of specialRoles) { if (roles.length < numPlayers) roles.push(role); }
            while(roles.length < numPlayers) { roles.push('villager'); }
            
            // Mélange aléatoire absolu du deck de rôles
            roles.sort(() => Math.random() - 0.5);

            document.getElementById('global-chat-messages').innerHTML = ""; 
            document.getElementById('ww-chat-messages').innerHTML = ""; 
            
            connections.forEach((c, index) => {
                c.role = roles[index];
                if(c.isHost) {
                    lobbyDiv.style.display = 'none'; gameArea.style.display = 'block';
                    setupRoleUI(c.role);
                } else {
                    let extraData = {};
                    if (c.role === 'werewolf') extraData.wolves = connections.filter(w => w.role === 'werewolf').map(w => w.name);
                    c.conn.send({ type: 'game_start', role: c.role, extra: extraData });
                }
            });

            setTimeout(() => startNightPhase(), 2000); 
        });

        // ==========================================
        // 🌑 MOTEUR MULTIJOUEUR : STATE MACHINE
        // ==========================================
        let gameState = { phase: 'lobby', votes: {}, deadTonight: [], lovers: [], pendingHunter: null, nextPhaseAfterHunter: null };

        function killPlayer(targetName) {
            if(!gameState.deadTonight.includes(targetName)) {
                gameState.deadTonight.push(targetName);
                const p = connections.find(c => c.name === targetName);
                if(p && p.role === 'hunter') gameState.pendingHunter = targetName;

                if(gameState.lovers.includes(targetName)) {
                    const partner = gameState.lovers.find(l => l !== targetName);
                    if(partner && !gameState.deadTonight.includes(partner)) {
                        broadcastSysLog('loversDie', partner);
                        killPlayer(partner); 
                    }
                }
            }
        }

        function checkWinCondition() {
            const alive = connections.filter(c => c.isAlive);
            const wolves = alive.filter(c => c.role === 'werewolf');
            const others = alive.filter(c => c.role !== 'werewolf');
            
            let winner = null, desc = "";
            if (alive.length === 2 && gameState.lovers.includes(alive[0].name) && gameState.lovers.includes(alive[1].name)) {
                winner = "AMOUR TRIOMPHANT"; desc = "Seuls les amoureux ont survécu.";
            } else if (wolves.length === 0) {
                winner = "VICTOIRE DU VILLAGE"; desc = "Tous les infectés ont été purgés.";
            } else if (wolves.length >= others.length) {
                winner = "DOMINATION GAROU"; desc = "Le village est tombé.";
            }

            if (winner) {
                clearInterval(phaseTimer); broadcast({ type: 'timer_tick', time: 0 }); updateTimerUI(0);
                broadcast({ type: 'game_over', winner: winner, desc: desc }); showGameOver(winner, desc);
                return true; 
            }
            return false;
        }

        function processDeathsAndContinue(nextPhaseFunc) {
            gameState.deadTonight.forEach(d => { let p = connections.find(c => c.name === d); if(p) p.isAlive = false; });
            if(checkWinCondition()) return;

            if(gameState.pendingHunter) {
                const hunterName = gameState.pendingHunter;
                gameState.pendingHunter = null; gameState.nextPhaseAfterHunter = nextPhaseFunc; 
                gameState.phase = 'day_hunter';
                broadcast({ type: 'phase_change', phase: 'day_hunter', extra: { hunter: hunterName } });
                updateClientUI('day_hunter', { hunter: hunterName });
            } else {
                gameState.deadTonight = []; nextPhaseFunc();
            }
        }

        function startNightPhase() {
            gameState.votes = {};
            if(firstNight && connections.find(c => c.role === 'cupid' && c.isAlive)) startCupidPhase();
            else startSeerPhase();
        }

        function startCupidPhase() {
            gameState.phase = 'night_cupid';
            broadcast({ type: 'phase_change', phase: 'night_cupid' });
            updateClientUI('night_cupid');
        }

        function startSeerPhase() {
            gameState.phase = 'night_seer';
            broadcast({ type: 'phase_change', phase: 'night_seer' });
            updateClientUI('night_seer');
            if (!connections.find(c => c.role === 'seer' && c.isAlive)) setTimeout(() => startWolvesPhase(), 3000);
        }

        function startWolvesPhase() {
            gameState.phase = 'night_wolves'; gameState.votes = {};
            broadcast({ type: 'phase_change', phase: 'night_wolves' });
            updateClientUI('night_wolves');
        }

        function startWitchPhase() {
            gameState.phase = 'night_witch';
            const extraData = { dead: gameState.deadTonight[0] };
            broadcast({ type: 'phase_change', phase: 'night_witch', extra: extraData });
            updateClientUI('night_witch', extraData);
            if (!connections.find(c => c.role === 'witch' && c.isAlive)) setTimeout(() => endNightPhase(), 3000);
        }

        function endNightPhase() {
            firstNight = false;
            if (gameState.deadTonight.length > 0) {
                broadcastSysLog('deathList', gameState.deadTonight.join(', '));
            } else {
                broadcastSysLog('noDeath');
            }
            processDeathsAndContinue(() => { startDayVote(); });
        }

        function startDayVote() {
            gameState.phase = 'day_vote'; gameState.votes = {};
            broadcast({ type: 'phase_change', phase: 'day_vote' });
            updateClientUI('day_vote');

            let timeLeft = 300; 
            clearInterval(phaseTimer);
            updateTimerUI(timeLeft); broadcast({ type: 'timer_tick', time: timeLeft });
            
            phaseTimer = setInterval(() => {
                timeLeft--;
                updateTimerUI(timeLeft); broadcast({ type: 'timer_tick', time: timeLeft });
                if(timeLeft <= 0) resolveDayVote(); 
            }, 1000);
        }

        function calculateVoteResult(voteDict) {
            const counts = {};
            Object.values(voteDict).forEach(v => counts[v] = (counts[v] || 0) + 1);
            let max = 0; let tied = [];
            for(let t in counts) {
                if(counts[t] > max) { max = counts[t]; tied = [t]; }
                else if (counts[t] === max) { tied.push(t); }
            }
            if (tied.length === 0) return null;
            return tied[Math.floor(Math.random() * tied.length)];
        }

        function resolveDayVote() {
            clearInterval(phaseTimer); updateTimerUI(0); broadcast({ type: 'timer_tick', time: 0 });
            
            if(Object.keys(gameState.votes).length === 0) {
                broadcastSysLog('timeOut');
                setTimeout(() => { processDeathsAndContinue(() => { startNightPhase(); }); }, 3000);
                return;
            }

            const targetName = calculateVoteResult(gameState.votes);
            killPlayer(targetName); 
            broadcastSysLog('lynched', targetName);
            setTimeout(() => { processDeathsAndContinue(() => { startNightPhase(); }); }, 3000);
        }

        // --- BOUTON REJOUER (HÔTE & CLIENTS) ---
        document.getElementById('btn-replay').addEventListener('click', () => {
            if(!isHost) return;
            broadcast({ type: 'reset_game' });
            resetClientToLobby();
        });

        function resetClientToLobby() {
            gameState = { phase: 'lobby', votes: {}, deadTonight: [], lovers: [], pendingHunter: null, nextPhaseAfterHunter: null };
            firstNight = true;
            witchPotions = { heal: 1, poison: 1 };
            cupidTargets = [];
            wolfPartners = [];
            myRole = "";
            clearInterval(phaseTimer); updateTimerUI(0);

            if(isHost) {
                connections.forEach(c => { c.role = null; c.isAlive = true; });
                document.getElementById('btn-start').style.display = 'block';
            } else {
                clientPlayers.forEach(c => { c.isAlive = true; });
            }

            document.getElementById('game-area').style.display = 'none';
            document.getElementById('game-over-screen').style.display = 'none';
            document.getElementById('btn-replay').style.display = 'none';
            document.getElementById('lovers-info').style.display = 'none';
            document.getElementById('lobby').style.display = 'block';
            
            setMediaEnvironment('night');
        }

        // --- ROUTEUR D'ACTIONS RÉSEAU ---
        function handleNetworkAction(clientId, data) {
            const sender = connections.find(c => c.id === clientId || (c.isHost && clientId === 'host'));
            if (!sender) return; 

            if (data.type === 'ww_chat') {
                const chatMsg = { type: 'ww_chat_recv', sender: sender.name, text: data.text };
                connections.forEach(c => {
                    if (c.role === 'werewolf') {
                        if (c.isHost) displayWWChat(sender.name, data.text);
                        else if (c.conn && c.conn.open) c.conn.send(chatMsg);
                    }
                });
                return;
            }
            if (data.type === 'global_chat') {
                const chatMsg = { type: 'global_chat_recv', sender: sender.name, text: data.text };
                connections.forEach(c => {
                    if (c.isHost) displayGlobalChat(sender.name, data.text);
                    else if (c.conn && c.conn.open) c.conn.send(chatMsg);
                });
                return;
            }

            if (!sender.isAlive && !(gameState.phase === 'day_hunter' && data.role === 'hunter' && sender.name === data.extra?.hunter)) {
                if(gameState.phase !== 'day_hunter') return;
            }

            if (gameState.phase === 'night_cupid' && data.role === 'cupid') {
                gameState.lovers = [data.target1, data.target2];
                connections.forEach(c => {
                    if(c.name === data.target1) {
                        if(c.isHost) { document.getElementById('lovers-info').style.display='block'; document.getElementById('lovers-info').innerText = `${i18n[currentLang].ui.loversLinked} ${data.target2}`; }
                        else { c.conn.send({ type: 'lovers_linked', partner: data.target2 }); }
                    }
                    if(c.name === data.target2) {
                        if(c.isHost) { document.getElementById('lovers-info').style.display='block'; document.getElementById('lovers-info').innerText = `${i18n[currentLang].ui.loversLinked} ${data.target1}`; }
                        else { c.conn.send({ type: 'lovers_linked', partner: data.target1 }); }
                    }
                });
                setTimeout(() => startSeerPhase(), 2000); 
            }
            else if (gameState.phase === 'night_seer' && data.role === 'seer') {
                const targetInfo = connections.find(c => c.name === data.target);
                if(targetInfo) {
                    if(sender.isHost) { 
                        const tRole = i18n[currentLang].roles[targetInfo.role].name;
                        const msg = t('sys', 'vision', targetInfo.name, tRole);
                        addSysLog('vision', targetInfo.name, tRole);
                        document.getElementById('action-panel').innerHTML = `<p style="color:var(--neon-cyan); font-size: 1.5rem;">${msg}</p>`;
                    }
                    else sender.conn.send({ type: 'seer_result', target: targetInfo.name, roleFound: targetInfo.role });
                }
                setTimeout(() => startWolvesPhase(), 2500); 
            }
            else if (gameState.phase === 'night_wolves' && data.role === 'werewolf') {
                gameState.votes[sender.name] = data.target;
                const aliveWolves = connections.filter(c => c.role === 'werewolf' && c.isAlive);
                if (Object.keys(gameState.votes).length === aliveWolves.length) {
                    const finalTarget = calculateVoteResult(gameState.votes);
                    if (finalTarget) killPlayer(finalTarget);
                    setTimeout(() => startWitchPhase(), 1500);
                }
            }
            else if (gameState.phase === 'night_witch' && data.role === 'witch') {
                if (data.action === 'heal' && gameState.deadTonight.includes(data.target)) {
                    gameState.deadTonight = gameState.deadTonight.filter(n => n !== data.target); 
                } else if (data.action === 'poison') { killPlayer(data.target); }
                setTimeout(() => endNightPhase(), 1500);
            }
            else if (gameState.phase === 'day_vote') {
                gameState.votes[sender.name] = data.target;
                const alivePlayers = connections.filter(c => c.isAlive);
                if (Object.keys(gameState.votes).length === alivePlayers.length) {
                    resolveDayVote();
                }
            }
            else if (gameState.phase === 'day_hunter' && data.role === 'hunter') {
                const targetName = data.target; 
                broadcastSysLog('hunterShoot', targetName);
                gameState.deadTonight = []; killPlayer(targetName); 
                setTimeout(() => { processDeathsAndContinue(gameState.nextPhaseAfterHunter); }, 2000);
            }
        }

        // ==========================================
        // 🖥️ INTERFACE ET ENVOI CLIENT
        // ==========================================
        function sendActionToServer(data, btnElement = null) {
            if (btnElement && (data.role === 'day' || data.role === 'werewolf')) {
                document.querySelectorAll('#action-panel button').forEach(b => b.classList.remove('selected'));
                btnElement.classList.add('selected');
                document.getElementById('action-panel').innerHTML = `<p style="color:var(--neon-cyan); font-size: 1.2rem;">${i18n[currentLang].ui.waiting}</p>`;
            } else {
                document.getElementById('action-panel').innerHTML = `<p style="color:var(--neon-cyan); font-size: 1.2rem;">${i18n[currentLang].ui.waiting}</p>`;
            }

            if (isHost) handleNetworkAction('host', data);
            else connections[0].conn.send(data);
        }

        function updateClientUI(phase, extra = null) {
            gameState.phase = phase; 
            let argTitle = phase === 'day_hunter' && extra ? extra.hunter : "";
            document.getElementById('phase-title').innerText = t('phases', phase, argTitle);
            
            const panel = document.getElementById('action-panel');
            panel.innerHTML = ''; 
            const langUI = i18n[currentLang].ui;

            const wwChat = document.getElementById('ww-chat-container');
            if (myRole === 'werewolf' && phase.startsWith('night')) wwChat.style.display = 'block';
            else wwChat.style.display = 'none';

            if (phase.includes('day')) { setMediaEnvironment('day'); }
            else if (phase.includes('night')) { setMediaEnvironment('night'); document.getElementById('timer-display').style.display='none'; }

            const playerList = isHost ? connections : clientPlayers;
            const alivePlayers = playerList.filter(c => c.isAlive && c.name !== myName);
            const allAlivePlayers = playerList.filter(c => c.isAlive); 
            const myStatus = playerList.find(c => c.name === myName);

            if (phase === 'day_hunter') {
                if (myName === extra.hunter) {
                    panel.innerHTML = `<p style="color:var(--neon-yellow); font-size: 1.4rem;">DERNIER SOUFFLE ! Choisis qui emporter :</p>`;
                    allAlivePlayers.forEach(c => { 
                        let btn = createBtn(c.name, 'var(--neon-yellow)', function() { sendActionToServer({type:'action', role:'hunter', target: c.name, extra: {hunter: myName}}, this); });
                        panel.appendChild(btn); 
                    });
                } else { panel.innerHTML = `<p style="color:red; font-size: 1.4rem;">À couvert ! Le Chasseur s'effondre et tire...</p>`; }
                return; 
            }

            if(myStatus && !myStatus.isAlive) { panel.innerHTML = `<p style="color:red; font-weight:bold; font-size: 1.6rem;">${langUI.dead}</p>`; return; }

            if (phase === 'night_cupid' && myRole === 'cupid') {
                panel.innerHTML = `<p style="color:var(--neon-pink); font-size: 1.3rem;">${langUI.selectTarget}</p>`;
                allAlivePlayers.forEach(c => {
                    let btn = createBtn(c.name, 'var(--neon-pink)', function() {
                        this.style.background = 'var(--neon-pink)'; this.style.color = '#fff';
                        cupidTargets.push(c.name);
                        if(cupidTargets.length === 2) {
                            sendActionToServer({ type: 'action', role: 'cupid', target1: cupidTargets[0], target2: cupidTargets[1] });
                            cupidTargets = [];
                        }
                    });
                    panel.appendChild(btn);
                });
            }
            else if (phase === 'night_seer' && myRole === 'seer') {
                panel.innerHTML = `<p style="color:var(--neon-cyan); font-size: 1.3rem;">${langUI.selectTarget}</p>`;
                alivePlayers.forEach(c => { 
                    panel.appendChild(createBtn(c.name, 'var(--neon-cyan)', function() { sendActionToServer({type:'action', role:'seer', target: c.name}, this); })); 
                });
            }
            else if (phase === 'night_wolves' && myRole === 'werewolf') {
                panel.innerHTML = `<p style="color:var(--neon-pink); font-size: 1.3rem;">${langUI.selectTarget}</p>`;
                alivePlayers.forEach(c => { 
                    if(!wolfPartners.includes(c.name)) {
                        panel.appendChild(createBtn(c.name, 'var(--neon-pink)', function() { sendActionToServer({type:'action', role:'werewolf', target: c.name}, this); })); 
                    }
                });
            } 
            else if (phase === 'night_witch' && myRole === 'witch') {
                let html = `<p style="color:var(--neon-purple); font-size: 1.3rem;">Victime(s): ${gameState.deadTonight && gameState.deadTonight.length>0 ? gameState.deadTonight.join(', ') : extra.dead || 'Personne'}</p>`;
                if (extra.dead && witchPotions.heal > 0) {
                    html += `<button class="btn-outline" onclick="witchPotions.heal--; sendActionToServer({type:'action', role:'witch', action:'heal', target:'${extra.dead}'}, this);" style="border-color:#2ecc71; color:#2ecc71;">${langUI.healMsg}</button>`;
                }
                if (witchPotions.poison > 0) {
                    alivePlayers.forEach(c => { html += `<button class="btn-outline" onclick="witchPotions.poison--; sendActionToServer({type:'action', role:'witch', action:'poison', target:'${c.name}'}, this);" style="border-color:#e74c3c; color:#e74c3c; margin-left:10px;">${langUI.poisonMsg} ${c.name}</button>`; });
                }
                html += `<button class="btn-outline" onclick="sendActionToServer({type:'action', role:'witch', action:'skip'}, this)" style="border-color:gray; color:gray; margin-left:10px;">${langUI.skipMsg}</button>`;
                panel.innerHTML = html;
            }
            else if (phase.startsWith('night') && myRole !== 'werewolf' && myRole !== 'cupid') {
                panel.innerHTML = `<p style="color:gray; font-size: 1.4rem;">${langUI.sleep}</p>`;
            }
            else if (phase === 'day_vote') {
                panel.innerHTML = `<p style="color:var(--neon-yellow); font-size: 1.3rem;">${langUI.selectTarget}</p>`;
                alivePlayers.forEach(c => { 
                    panel.appendChild(createBtn(c.name, 'var(--neon-yellow)', function() { sendActionToServer({type:'action', role:'day', target: c.name}, this); })); 
                });
            }
        }

        function createBtn(text, color, onClickCallback) {
            let btn = document.createElement('button');
            btn.className = "btn-outline";
            btn.innerText = text; btn.style.borderColor = color; btn.style.color = color;
            btn.onclick = onClickCallback; return btn;
        }

        function setupRoleUI(role) {
            myRole = role;
            const rData = i18n[currentLang].roles[role] || i18n[currentLang].roles['villager'];
            document.getElementById('role-name').innerText = rData.name;
            document.getElementById('role-desc').innerText = rData.desc;
            document.getElementById('role-image').src = rData.img; 
            const card = document.getElementById('my-role-card');
            card.style.borderColor = rData.color;
            card.style.boxShadow = `0 0 35px rgba(${rData.color === 'var(--neon-pink)' ? '255,0,127' : rData.color === 'var(--neon-cyan)' ? '0,229,255' : '155,89,182'}, 0.5)`;
            document.getElementById('role-name').style.color = rData.color;
        }

        function showGameOver(winner, desc) {
            document.getElementById('action-panel').innerHTML = "";
            document.getElementById('ww-chat-container').style.display = 'none';
            const goScreen = document.getElementById('game-over-screen');
            goScreen.style.display = 'block';
            document.getElementById('winner-text').innerText = winner;
            document.getElementById('winner-desc').innerText = desc;
            
            if (isHost) {
                document.getElementById('btn-replay').style.display = 'block';
            }
        }

        // --- GESTION DES CHATS ---
        function sendWWChat() {
            const input = document.getElementById('ww-chat-input');
            const text = input.value.trim();
            if (text === "") return;
            if (isHost) handleNetworkAction('host', { type: 'ww_chat', text: text });
            else connections[0].conn.send({ type: 'ww_chat', text: text });
            input.value = "";
        }
        document.getElementById('ww-chat-input').addEventListener('keypress', function (e) { if (e.key === 'Enter') sendWWChat(); });
        function displayWWChat(senderName, text) {
            const chatBox = document.getElementById('ww-chat-messages');
            chatBox.innerHTML += `<p><span class="ww-chat-sender">${senderName} :</span> ${text}</p>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function sendGlobalChat() {
            const input = document.getElementById('global-chat-input');
            const text = input.value.trim();
            if (text === "") return;
            if (isHost) handleNetworkAction('host', { type: 'global_chat', text: text });
            else connections[0].conn.send({ type: 'global_chat', text: text });
            input.value = "";
        }
        document.getElementById('global-chat-input').addEventListener('keypress', function (e) { if (e.key === 'Enter') sendGlobalChat(); });
        function displayGlobalChat(senderName, text) {
            const chatBox = document.getElementById('global-chat-messages');
            chatBox.innerHTML += `<p><span class="global-chat-sender">${senderName} :</span> ${text}</p>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        updateLang('fr'); // Init Langue
    </script>
</body>
</html>
