<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Slime-Garou : Infection Protocol</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        /* =========================================
           1. VARIABLES CYBERPUNK ET RESET
           ========================================= */
        :root {
            --bg-color: #0b0c10;
            --container-bg: #1a1e24; /* Couleur gris/bleu sombre du Drawer */
            --inner-bg: #0d1117;     /* Couleur plus sombre pour les inputs/box */
            --neon-cyan: #00e5ff;
            --neon-pink: #ff007f;
            --neon-green: #39ff14;
            --neon-yellow: #fce803;
            --neon-purple: #9b59b6;
            --text-color: #e0e0e0;
            /* Police plus moderne pour l'UI, monospace pour les logs */
            --font-ui: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --font-mono: 'Courier New', Courier, monospace;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; min-height: 100vh;
            background-color: var(--bg-color); color: var(--text-color);
            font-family: var(--font-ui); overflow-x: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
        }

        /* Video Background */
        #bg-video {
            position: fixed; top: 50%; left: 50%; min-width: 100%; min-height: 100%;
            z-index: -100; transform: translateX(-50%) translateY(-50%);
            object-fit: cover; opacity: 0.2; transition: opacity 1s ease-in-out;
        }

        /* =========================================
           2. BOUTON RETOUR HUB
           ========================================= */
        #btn-retour-hub {
            position: fixed; top: 20px; left: 20px; z-index: 9999;
            background-color: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff; padding: 8px 15px; font-family: var(--font-ui);
            font-size: 14px; border-radius: 6px; cursor: pointer;
            display: flex; align-items: center; gap: 8px;
            text-decoration: none; transition: 0.3s ease;
        }
        #btn-retour-hub:hover { background-color: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.5); }

        /* Titre Haut de page */
        .main-title {
            color: var(--neon-cyan); text-shadow: 0 0 15px rgba(0, 229, 255, 0.6);
            text-transform: uppercase; margin-top: 50px; margin-bottom: 20px;
            font-size: 2.5rem; letter-spacing: 3px; font-weight: bold;
        }

        /* =========================================
           3. CONTENEUR PRINCIPAL (Style Drawer)
           ========================================= */
        .container {
            background: var(--container-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; padding: 30px; width: 90%; max-width: 600px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-bottom: 40px; text-align: center;
        }

        .no-swipe { touch-action: none; }

        h2, h3 { color: var(--neon-cyan); margin-top: 0; margin-bottom: 15px; font-weight: 600; }
        
        /* =========================================
           4. INPUTS ET BOUTONS
           ========================================= */
        input[type="text"], input[type="number"] {
            background: var(--inner-bg); border: 1px solid rgba(255,255,255,0.2);
            color: #fff; padding: 12px; margin: 10px 0; width: 100%;
            box-sizing: border-box; font-family: inherit; font-size: 16px;
            border-radius: 6px; outline: none; transition: 0.3s; text-align: center;
        }
        input:focus { border-color: var(--neon-cyan); box-shadow: 0 0 10px rgba(0,229,255,0.3); }

        /* Boutons Solid Neon (Style Drawer) */
        .btn-solid {
            width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 8px;
            font-size: 1.1rem; font-weight: bold; text-transform: uppercase;
            cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; font-family: inherit;
        }
        .btn-solid:active { transform: scale(0.98); }
        
        .btn-pink {
            background-color: var(--neon-pink); color: #fff;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.5);
        }
        .btn-pink:hover { box-shadow: 0 0 25px rgba(255, 0, 127, 0.8); }

        .btn-cyan {
            background-color: var(--neon-cyan); color: #000;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.5);
        }
        .btn-cyan:hover { box-shadow: 0 0 25px rgba(0, 229, 255, 0.8); }

        /* Boutons secondaires (Outlined) */
        .btn-outline {
            background: transparent; border: 2px solid gray; color: gray;
            padding: 10px; border-radius: 6px; cursor: pointer; transition: 0.3s;
        }

        /* Lang Selector (Drapeaux/Boutons) */
        .lang-selector { display: flex; justify-content: center; gap: 15px; margin: 20px 0; }
        .lang-btn { 
            background: transparent; border: none; font-size: 2rem; 
            cursor: pointer; opacity: 0.4; transition: 0.3s; padding: 0;
            filter: grayscale(100%);
        }
        .lang-btn.active { opacity: 1; filter: grayscale(0%) drop-shadow(0 0 10px rgba(255,255,255,0.5)); transform: scale(1.1); }

        /* =========================================
           5. ZONES SPÉCIFIQUES (LOBBY & JEU)
           ========================================= */
        .share-code-text { font-size: 1.1rem; color: #aaa; margin-bottom: 20px; }
        .share-code-val { color: var(--neon-cyan); font-weight: bold; font-size: 1.6rem; letter-spacing: 2px; user-select: all; }

        /* Player Connected Box */
        .player-box {
            background: var(--inner-bg);
            border: 1px solid rgba(0, 229, 255, 0.3);
            border-radius: 8px; padding: 15px; margin-bottom: 20px;
            min-height: 80px; text-align: center;
        }
        .player-box h4 { margin: 0 0 15px 0; color: #fff; font-weight: 500; }
        
        .players-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
        .player-badge {
            background: transparent; border: 1px solid #555; color: #ccc;
            padding: 6px 12px; border-radius: 4px; font-size: 0.9rem;
        }

        /* Config Grid */
        .config-grid { 
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; text-align: left; 
            background: var(--inner-bg); padding: 15px; border-radius: 8px; margin-bottom: 20px;
        }
        .checkbox-group { display: flex; align-items: center; justify-content: space-between; font-size: 0.95rem; }
        input[type="checkbox"] { accent-color: var(--neon-pink); width: 18px; height: 18px; }

        /* Game Area */
        #game-area { display: none; }
        .role-card {
            border: 2px solid var(--neon-cyan); padding: 20px; margin: 20px 0;
            box-shadow: 0 0 20px rgba(0,229,255,0.2); background: var(--inner-bg); border-radius: 8px; transition: all 0.5s;
        }
        .role-img { max-width: 120px; display: block; margin: 0 auto 15px; filter: drop-shadow(0 0 10px var(--neon-cyan)); }
        
        .sys-log {
            font-size: 0.9em; font-family: var(--font-mono); color: var(--neon-green);
            background: #000; padding: 10px; border-radius: 5px; height: 120px;
            overflow-y: auto; text-align: left; border: 1px solid rgba(57, 255, 20, 0.3); margin-top: 20px;
        }

        #game-over-screen { display: none; margin-top: 20px; border: 2px solid var(--neon-yellow); padding: 20px; border-radius: 8px; box-shadow: 0 0 20px rgba(252, 232, 3, 0.2); background: var(--inner-bg);}
    </style>
</head>
<body>

    <!-- BOUTON RETOUR HUB -->
    <a href="../index.html" id="btn-retour-hub">
        &#11013; Retour au Hub
    </a>

    <!-- MEDIA DYNAMIQUE -->
    <video id="bg-video" autoplay loop muted playsinline>
        <source id="bg-video-source" src="backgroundnight.mp4" type="video/mp4">
    </video>
    <div id="yt-player" style="display: none;"></div>

    <script>
        // Swipe global protection pour le Hub
        document.addEventListener('touchstart', (e) => {
            if(e.target.closest('.no-swipe')) { e.stopPropagation(); }
        }, {passive: false});
    </script>

    <div class="main-title" id="ui-title">SLIME-GAROU</div>

    <div class="container no-swipe">
        
        <!-- MENU PRINCIPAL -->
        <div id="menu">
            <h2 class="ui-text" data-key="menuTitle" style="color: #fff;">Connexion</h2>
            
            <button id="btn-create" class="btn-solid btn-cyan ui-text" data-key="btnCreate">Créer une partie</button>
            
            <hr style="border-color: rgba(255,255,255,0.1); margin: 25px 0;">
            
            <input type="text" id="join-id" placeholder="Code de la partie (ex: GAR8369)" style="text-transform: uppercase;">
            <input type="text" id="player-name" placeholder="Votre Pseudo">
            <button id="btn-join" class="btn-solid btn-pink ui-text" data-key="btnJoin">Rejoindre</button>
        </div>

        <!-- LOBBY -->
        <div id="lobby" style="display: none;">
            <h2 class="ui-text" data-key="configTitle">Configuration</h2>
            
            <p class="share-code-text">
                <span class="ui-text" data-key="shareText">Partagez ce code aux joueurs :</span> 
                <span id="my-id" class="share-code-val">Génération...</span>
            </p>
            
            <!-- Zone Joueurs -->
            <div class="player-box">
                <h4 class="ui-text" data-key="playersConnected">Player connected :</h4>
                <div id="players-list-container" class="players-container">
                    <span class="player-badge">Toi</span>
                </div>
            </div>

            <!-- Langues -->
            <p style="color: #fff; font-weight: 500; margin-bottom: 5px;" class="ui-text" data-key="dictLang">Dictionary language</p>
            <div class="lang-selector">
                <button id="lang-fr" class="lang-btn active" title="Français">🇫🇷</button>
                <button id="lang-en" class="lang-btn" title="English">🇬🇧</button>
            </div>

            <!-- Configuration Hôte -->
            <div id="host-config" style="display: none;">
                <div class="config-grid">
                    <div style="display: flex; align-items: center; justify-content: space-between;">
                        <label class="ui-text" data-key="cfgWolves">Garous :</label>
                        <input type="number" id="cfg-wolves" value="1" min="1" max="3" style="width: 60px; margin: 0; padding: 8px;">
                    </div>
                    <div class="checkbox-group"><label class="ui-text" data-key="roleSeer">Voyante</label><input type="checkbox" id="cfg-seer" checked></div>
                    <div class="checkbox-group"><label class="ui-text" data-key="roleWitch">Sorcière</label><input type="checkbox" id="cfg-witch" checked></div>
                    <div class="checkbox-group"><label class="ui-text" data-key="roleCupid">Cupidon</label><input type="checkbox" id="cfg-cupid"></div>
                    <div class="checkbox-group"><label class="ui-text" data-key="roleHunter">Chasseur</label><input type="checkbox" id="cfg-hunter"></div>
                </div>
                
                <button id="btn-start" class="btn-solid btn-pink ui-text" data-key="btnStart" style="display:none;">Lancer la partie</button>
            </div>
            <p id="waiting-host-msg" style="color: gray; display:none;" class="ui-text" data-key="waitingHost">En attente de l'hôte...</p>
        </div>

        <!-- ZONE DE JEU -->
        <div id="game-area" class="no-swipe">
            <h2 id="phase-title" style="color: #fff;">...</h2>
            
            <div class="role-card" id="my-role-card">
                <img id="role-image" class="role-img" src="" alt="Role Image">
                <h3 id="role-name" style="margin:0;">...</h3>
                <p id="role-desc" style="font-size: 0.9em; color: #aaa;">...</p>
                <p id="lovers-info" style="color: #ff69b4; font-weight: bold; display:none;"></p>
            </div>

            <h3 class="ui-text" data-key="actionInterface" style="color: #fff; font-size: 1.2rem;">Action</h3>
            <div id="action-panel" style="margin-bottom: 20px; min-height: 50px;"></div>

            <!-- ECRAN DE FIN DE JEU -->
            <div id="game-over-screen">
                <h2 id="winner-text" style="color: var(--neon-yellow);">...</h2>
                <p id="winner-desc" style="color: white;"></p>
            </div>

            <div class="sys-log" id="sys-log">> SYSTEM_READY</div>
        </div>
    </div>

    <!-- SCRIPT COMPLET INTACT (LOGIQUE DE JEU) -->
    <script>
        // ==========================================
        // 🎵 GESTION AUDIO & VIDEO (YOUTUBE API)
        // ==========================================
        let ytPlayer;
        let currentBgm = 'night';
        let audioStarted = false;

        const YOUTUBE_NIGHT = '3ecxZy8luDg'; 
        const YOUTUBE_DAY = 'vyg5jJrZ42s';   

        window.onYouTubeIframeAPIReady = function() {
            ytPlayer = new YT.Player('yt-player', {
                height: '0', width: '0', videoId: YOUTUBE_NIGHT,
                playerVars: { 'autoplay': 0, 'controls': 0, 'disablekb': 1 },
                events: {
                    'onReady': (event) => { event.target.setVolume(5); },
                    'onStateChange': (event) => { if (event.data === YT.PlayerState.ENDED) ytPlayer.playVideo(); }
                }
            });
        };

        function initAudio() {
            if (audioStarted) return;
            if (ytPlayer && typeof ytPlayer.playVideo === 'function') {
                ytPlayer.playVideo(); audioStarted = true;
            }
        }

        function setMediaEnvironment(type) {
            if (currentBgm === type) return; 
            currentBgm = type;
            const vidSource = document.getElementById('bg-video-source');
            const video = document.getElementById('bg-video');
            
            video.style.opacity = 0;
            setTimeout(() => {
                if (type === 'day') {
                    vidSource.src = 'backgroundday.mp4';
                    if(ytPlayer) ytPlayer.loadVideoById({videoId: YOUTUBE_DAY});
                } else {
                    vidSource.src = 'backgroundnight.mp4';
                    if(ytPlayer) ytPlayer.loadVideoById({videoId: YOUTUBE_NIGHT});
                }
                video.load(); video.play(); video.style.opacity = 0.2; 
            }, 500); 
        }

        // ==========================================
        // 🌍 DICTIONNAIRE MULTILINGUE
        // ==========================================
        const i18n = {
            fr: {
                roles: {
                    werewolf: { name: "Slime-Garou", desc: "Dévore un joueur chaque nuit.", img: "garou.png", color: "var(--neon-pink)" },
                    seer: { name: "Voyante", desc: "Scanne l'identité d'un joueur la nuit.", img: "voyante.png", color: "var(--neon-cyan)" },
                    witch: { name: "Sorcière", desc: "Possède une potion de soin et une de poison.", img: "sorciere.png", color: "var(--neon-purple)" },
                    hunter: { name: "Chasseur", desc: "Si tu meurs, tu tires sur un joueur.", img: "chasseur.png", color: "var(--neon-yellow)" },
                    cupid: { name: "Cupidon", desc: "Désigne deux amoureux la première nuit.", img: "cupidon.png", color: "#ff69b4" },
                    villager: { name: "Slime Civil", desc: "Trouve et élimine les infectés le jour.", img: "slime.png", color: "var(--neon-green)" }
                },
                ui: {
                    menuTitle: "Connexion", btnCreate: "Créer une partie", btnJoin: "Rejoindre",
                    configTitle: "Configuration", shareText: "Partagez ce code aux joueurs :",
                    playersConnected: "Joueurs connectés :", dictLang: "Langue du jeu",
                    cfgWolves: "Nb Garous :", roleSeer: "Voyante", roleWitch: "Sorcière", roleCupid: "Cupidon", roleHunter: "Chasseur",
                    btnStart: "Lancer la partie", waitingHost: "En attente du lancement par l'hôte...",
                    actionInterface: "Actions", waiting: "En attente des autres joueurs...", dead: "VOUS ÊTES MORT. Connexion rompue.",
                    sleep: "Ferme les yeux, le village s'endort...",
                    selectTarget: "Choisissez une cible :", healMsg: "Ressusciter", poisonMsg: "Empoisonner", skipMsg: "Passer",
                    loversLinked: "Tu es secrètement lié à :"
                }
            },
            en: {
                roles: {
                    werewolf: { name: "Werewolf", desc: "Devour a player every night.", img: "werewolf.png", color: "var(--neon-pink)" },
                    seer: { name: "Seer", desc: "Scan a player's identity at night.", img: "seer.png", color: "var(--neon-cyan)" },
                    witch: { name: "Witch", desc: "Has one heal and one poison potion.", img: "witch.png", color: "var(--neon-purple)" },
                    hunter: { name: "Hunter", desc: "If you die, you shoot a player.", img: "hunter.png", color: "var(--neon-yellow)" },
                    cupid: { name: "Cupid", desc: "Link two lovers on the first night.", img: "cupid.png", color: "#ff69b4" },
                    villager: { name: "Villager", desc: "Find and eliminate the infected by day.", img: "villager.png", color: "var(--neon-green)" }
                },
                ui: {
                    menuTitle: "Connection", btnCreate: "Create Game", btnJoin: "Join",
                    configTitle: "Configuration", shareText: "Share this code with players:",
                    playersConnected: "Player connected:", dictLang: "Dictionary language",
                    cfgWolves: "Werewolves:", roleSeer: "Seer", roleWitch: "Witch", roleCupid: "Cupid", roleHunter: "Hunter",
                    btnStart: "Start Game", waitingHost: "Waiting for host to start...",
                    actionInterface: "Action", waiting: "Waiting for other players...", dead: "YOU ARE DEAD. Connection lost.",
                    sleep: "Close your eyes, the village goes to sleep...",
                    selectTarget: "Select a target:", healMsg: "Heal", poisonMsg: "Poison", skipMsg: "Skip",
                    loversLinked: "You are secretly bound to:"
                }
            }
        };

        let currentLang = 'fr';
        function updateLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`lang-${lang}`).classList.add('active');
            document.querySelectorAll('.ui-text').forEach(el => {
                const key = el.getAttribute('data-key');
                if (i18n[lang].ui[key]) el.innerText = i18n[lang].ui[key];
            });
            if (myRole) setupRoleUI(myRole);
        }

        document.getElementById('lang-fr').addEventListener('click', () => updateLang('fr'));
        document.getElementById('lang-en').addEventListener('click', () => updateLang('en'));

        // ==========================================
        // 🛠️ VARIABLES GLOBALES & RÉSEAU
        // ==========================================
        let peer = null;
        let connections = []; 
        let isHost = false;
        let myName = "Hôte";
        let myRole = "";
        let witchPotions = { heal: 1, poison: 1 };
        let firstNight = true; 

        const menuDiv = document.getElementById('menu');
        const lobbyDiv = document.getElementById('lobby');
        const gameArea = document.getElementById('game-area');
        const logArea = document.getElementById('sys-log');
        let cupidTargets = []; 

        function addLog(msg) {
            logArea.innerHTML += `<br>> ${msg}`;
            logArea.scrollTop = logArea.scrollHeight;
        }

        // INIT PEER AVEC IDENTIFIANT CUSTOM
        function initPeer(callback, customId = null) {
            // Si l'hôte fournit un ID custom, on l'utilise
            peer = customId ? new Peer(customId) : new Peer();
            
            peer.on('open', (id) => { 
                if(callback) callback(id); 
            });
            
            peer.on('error', (err) => { 
                if (err.type === 'unavailable-id') {
                    alert("Ce code serveur existe déjà ou est indisponible. Veuillez réessayer.");
                } else {
                    alert("Erreur Réseau : " + err); 
                }
            });
        }

        function broadcast(data) {
            connections.forEach(c => { if(!c.isHost && c.conn && c.conn.open) c.conn.send(data); });
        }

        // ==========================================
        // 👑 HÔTE : CRÉATION & RÉCEPTION RÉSEAU
        // ==========================================
        document.getElementById('btn-create').addEventListener('click', () => {
            initAudio(); 
            isHost = true;
            menuDiv.style.display = 'none';
            lobbyDiv.style.display = 'block';
            document.getElementById('host-config').style.display = 'block';
            
            connections.push({ isHost: true, name: "Host", role: null, isAlive: true, id: 'host' });
            updatePlayerListUI();

            // Génération de l'identifiant GARxxxx
            const roomId = 'GAR' + Math.floor(1000 + Math.random() * 9000);

            initPeer((id) => { 
                document.getElementById('my-id').innerText = id; 
            }, roomId);

            peer.on('connection', (conn) => {
                conn.on('data', (data) => {
                    if (data.type === 'join') {
                        connections.push({ conn: conn, name: data.name, role: null, isAlive: true, id: conn.peer });
                        updatePlayerListUI();
                        broadcast({ type: 'lobby_update', count: connections.length, list: connections.map(c => c.name) });
                        if (connections.length >= 3) document.getElementById('btn-start').style.display = 'block';
                    } 
                    else if (data.type === 'action') {
                        handleNetworkAction(conn.peer, data);
                    }
                });
            });
        });

        // ==========================================
        // 👾 CLIENT : CONNEXION & RÉCEPTION RÉSEAU
        // ==========================================
        document.getElementById('btn-join').addEventListener('click', () => {
            initAudio(); 
            const hostId = document.getElementById('join-id').value.trim().toUpperCase();
            myName = document.getElementById('player-name').value.trim() || "Agent_" + Math.floor(Math.random()*100);
            
            if(!hostId) {
                alert("Veuillez entrer un code de partie.");
                return;
            }

            menuDiv.style.display = 'none';
            lobbyDiv.style.display = 'block';
            document.getElementById('waiting-host-msg').style.display = 'block'; 
            document.getElementById('my-id').innerText = hostId; // Montre le code qu'il a rejoint

            initPeer(() => {
                const conn = peer.connect(hostId);
                conn.on('open', () => {
                    connections.push({conn: conn}); 
                    conn.send({ type: 'join', name: myName });
                });

                conn.on('data', (data) => {
                    if (data.type === 'lobby_update') {
                        generatePlayerBadges(data.list);
                    }
                    else if (data.type === 'game_start') {
                        lobbyDiv.style.display = 'none';
                        gameArea.style.display = 'block';
                        setupRoleUI(data.role);
                        addLog("Game Initialized.");
                    }
                    else if (data.type === 'phase_change') {
                        addLog(data.message);
                        updateClientUI(data.phase, data.message, data.extra);
                    }
                    else if (data.type === 'lovers_linked') {
                        const loveInfo = document.getElementById('lovers-info');
                        loveInfo.style.display = 'block';
                        loveInfo.innerText = `${i18n[currentLang].ui.loversLinked} ${data.partner}`;
                        addLog("Tu es lié par Cupidon.");
                    }
                    else if (data.type === 'game_over') {
                        showGameOver(data.winner, data.desc);
                    }
                });
            });
        });

        function updatePlayerListUI() {
            generatePlayerBadges(connections.map(c => c.name));
        }

        function generatePlayerBadges(namesList) {
            const container = document.getElementById('players-list-container');
            container.innerHTML = namesList.map(n => `<span class="player-badge">${n}</span>`).join('');
        }

        // ==========================================
        // 🎲 DISTRIBUTION DES RÔLES
        // ==========================================
        document.getElementById('btn-start').addEventListener('click', () => {
            const numPlayers = connections.length;
            const nbWolves = parseInt(document.getElementById('cfg-wolves').value);
            
            let roles = [];
            for(let i=0; i<nbWolves; i++) roles.push('werewolf');
            if (document.getElementById('cfg-seer').checked) roles.push('seer');
            if (document.getElementById('cfg-witch').checked) roles.push('witch');
            if (document.getElementById('cfg-cupid').checked) roles.push('cupid');
            if (document.getElementById('cfg-hunter').checked) roles.push('hunter');
            
            while(roles.length < numPlayers) roles.push('villager');
            roles.sort(() => Math.random() - 0.5);

            connections.forEach((c, index) => {
                c.role = roles[index];
                if(c.isHost) {
                    lobbyDiv.style.display = 'none';
                    gameArea.style.display = 'block';
                    setupRoleUI(c.role);
                } else {
                    c.conn.send({ type: 'game_start', role: c.role });
                }
            });

            setTimeout(() => startNightPhase(), 2000); 
        });

        // ==========================================
        // 🌑 MOTEUR MULTIJOUEUR : STATE MACHINE
        // ==========================================
        let gameState = { phase: 'lobby', votes: {}, deadTonight: [], lovers: [], pendingHunter: null, nextPhaseAfterHunter: null };

        function killPlayer(targetName) {
            if(!gameState.deadTonight.includes(targetName)) {
                gameState.deadTonight.push(targetName);
                const p = connections.find(c => c.name === targetName);
                if(p && p.role === 'hunter') gameState.pendingHunter = targetName;

                if(gameState.lovers.includes(targetName)) {
                    const partner = gameState.lovers.find(l => l !== targetName);
                    if(partner && !gameState.deadTonight.includes(partner)) {
                        addLog(`[SYSTEM] ${partner} meurt de chagrin.`);
                        killPlayer(partner); 
                    }
                }
            }
        }

        function checkWinCondition() {
            const alive = connections.filter(c => c.isAlive);
            const wolves = alive.filter(c => c.role === 'werewolf');
            const others = alive.filter(c => c.role !== 'werewolf');
            
            let winner = null, desc = "";
            if (alive.length === 2 && gameState.lovers.includes(alive[0].name) && gameState.lovers.includes(alive[1].name)) {
                winner = "AMOUR TRIOMPHANT"; desc = "Seuls les amoureux ont survécu.";
            } else if (wolves.length === 0) {
                winner = "VICTOIRE DU VILLAGE"; desc = "Tous les infectés ont été purgés.";
            } else if (wolves.length >= others.length) {
                winner = "DOMINATION GAROU"; desc = "Le village est tombé.";
            }

            if (winner) {
                broadcast({ type: 'game_over', winner: winner, desc: desc });
                showGameOver(winner, desc);
                return true; 
            }
            return false;
        }

        function processDeathsAndContinue(nextPhaseFunc) {
            gameState.deadTonight.forEach(d => { let p = connections.find(c => c.name === d); if(p) p.isAlive = false; });
            if(checkWinCondition()) return;

            if(gameState.pendingHunter) {
                const hunterName = gameState.pendingHunter;
                gameState.pendingHunter = null; gameState.nextPhaseAfterHunter = nextPhaseFunc; 
                gameState.phase = 'day_hunter';
                const msg = `⚠️ ALERTE : Le Chasseur (${hunterName}) s'effondre...`;
                addLog(msg);
                broadcast({ type: 'phase_change', phase: 'day_hunter', message: msg, extra: { hunter: hunterName } });
                updateClientUI('day_hunter', msg, { hunter: hunterName });
            } else {
                gameState.deadTonight = []; nextPhaseFunc();
            }
        }

        function startNightPhase() {
            gameState.votes = {};
            if(firstNight && connections.find(c => c.role === 'cupid' && c.isAlive)) startCupidPhase();
            else startWolvesPhase();
        }

        function startCupidPhase() {
            gameState.phase = 'night_cupid';
            broadcast({ type: 'phase_change', phase: 'night_cupid', message: "[Night] Cupidon se réveille." });
            updateClientUI('night_cupid', "[Night] Cupidon se réveille.");
        }

        function startWolvesPhase() {
            gameState.phase = 'night_wolves'; gameState.votes = {};
            broadcast({ type: 'phase_change', phase: 'night_wolves', message: "[Night] Garous..." });
            updateClientUI('night_wolves', "[Night] Garous...");
        }

        function startSeerPhase() {
            gameState.phase = 'night_seer';
            broadcast({ type: 'phase_change', phase: 'night_seer', message: "[Night] Voyante..." });
            updateClientUI('night_seer', "[Night] Voyante...");
            if (!connections.find(c => c.role === 'seer' && c.isAlive)) setTimeout(() => startWitchPhase(), 3000);
        }

        function startWitchPhase() {
            gameState.phase = 'night_witch';
            const extraData = { dead: gameState.deadTonight[0] };
            broadcast({ type: 'phase_change', phase: 'night_witch', message: "[Night] Sorcière...", extra: extraData });
            updateClientUI('night_witch', "[Night] Sorcière...", extraData);
            if (!connections.find(c => c.role === 'witch' && c.isAlive)) setTimeout(() => endNightPhase(), 3000);
        }

        function endNightPhase() {
            firstNight = false;
            let deathMsg = gameState.deadTonight.length > 0 ? `Code mort: ${gameState.deadTonight.join(', ')}` : "Aucun mort.";
            addLog(`[DAY] ${deathMsg}`);
            processDeathsAndContinue(() => {
                gameState.phase = 'day_vote'; gameState.votes = {};
                const msg = `[DAY] Débattez et votez.`;
                broadcast({ type: 'phase_change', phase: 'day_vote', message: msg });
                updateClientUI('day_vote', msg);
            });
        }

        // --- ROUTEUR D'ACTIONS RÉSEAU ---
        function handleNetworkAction(clientId, data) {
            const sender = connections.find(c => c.id === clientId || (c.isHost && clientId === 'host'));
            if (!sender) return; 
            if (!sender.isAlive && !(gameState.phase === 'day_hunter' && data.role === 'hunter' && sender.name === data.extra?.hunter)) {
                if(gameState.phase !== 'day_hunter') return;
            }

            if (gameState.phase === 'night_cupid' && data.role === 'cupid') {
                gameState.lovers = [data.target1, data.target2];
                connections.forEach(c => {
                    if(c.name === data.target1) {
                        if(c.isHost) { document.getElementById('lovers-info').style.display='block'; document.getElementById('lovers-info').innerText = `Cupidon lié à: ${data.target2}`; }
                        else { c.conn.send({ type: 'lovers_linked', partner: data.target2 }); }
                    }
                    if(c.name === data.target2) {
                        if(c.isHost) { document.getElementById('lovers-info').style.display='block'; document.getElementById('lovers-info').innerText = `Cupidon lié à: ${data.target1}`; }
                        else { c.conn.send({ type: 'lovers_linked', partner: data.target1 }); }
                    }
                });
                setTimeout(() => startWolvesPhase(), 2000);
            }
            else if (gameState.phase === 'night_wolves' && data.role === 'werewolf') {
                gameState.votes[sender.name] = data.target;
                const aliveWolves = connections.filter(c => c.role === 'werewolf' && c.isAlive);
                if (Object.keys(gameState.votes).length === aliveWolves.length) {
                    killPlayer(Object.values(gameState.votes)[0]);
                    setTimeout(() => startSeerPhase(), 1500);
                }
            }
            else if (gameState.phase === 'night_seer' && data.role === 'seer') {
                const targetInfo = connections.find(c => c.name === data.target);
                if(targetInfo) addLog(`[SCAN HOTE] Cible est ${targetInfo.role}`); 
                setTimeout(() => startWitchPhase(), 1500);
            }
            else if (gameState.phase === 'night_witch' && data.role === 'witch') {
                if (data.action === 'heal' && gameState.deadTonight.includes(data.target)) {
                    gameState.deadTonight = gameState.deadTonight.filter(n => n !== data.target); 
                } else if (data.action === 'poison') { killPlayer(data.target); }
                setTimeout(() => endNightPhase(), 1500);
            }
            else if (gameState.phase === 'day_vote') {
                gameState.votes[sender.name] = data.target;
                const alivePlayers = connections.filter(c => c.isAlive);
                if (Object.keys(gameState.votes).length === alivePlayers.length) {
                    const voteCounts = {};
                    Object.values(gameState.votes).forEach(v => voteCounts[v] = (voteCounts[v] || 0) + 1);
                    const targetName = Object.keys(voteCounts).reduce((a, b) => voteCounts[a] > voteCounts[b] ? a : b);
                    killPlayer(targetName); addLog(`Le village a déconnecté : ${targetName}`);
                    setTimeout(() => { processDeathsAndContinue(() => { startNightPhase(); }); }, 3000);
                }
            }
            else if (gameState.phase === 'day_hunter' && data.role === 'hunter') {
                const targetName = data.target; addLog(`PAN ! Le Chasseur emporte ${targetName}`);
                gameState.deadTonight = []; killPlayer(targetName);
                setTimeout(() => { processDeathsAndContinue(gameState.nextPhaseAfterHunter); }, 2000);
            }
        }

        // ==========================================
        // 🖥️ INTERFACE ET ENVOI CLIENT
        // ==========================================
        function sendActionToServer(data) {
            document.getElementById('action-panel').innerHTML = `<p style="color:var(--neon-cyan)">${i18n[currentLang].ui.waiting}</p>`;
            if (isHost) handleNetworkAction('host', data);
            else connections[0].conn.send(data);
        }

        function updateClientUI(phase, message, extra = null) {
            document.getElementById('phase-title').innerText = message;
            const panel = document.getElementById('action-panel');
            panel.innerHTML = ''; 
            const langUI = i18n[currentLang].ui;

            if (phase.includes('day')) setMediaEnvironment('day');
            else if (phase.includes('night')) setMediaEnvironment('night');

            const alivePlayers = connections.filter(c => c.isAlive && c.name !== myName);
            const allAlivePlayers = connections.filter(c => c.isAlive); 
            const myStatus = connections.find(c => c.name === myName);

            if (phase === 'day_hunter') {
                if (myName === extra.hunter) {
                    panel.innerHTML = `<p style="color:var(--neon-yellow);">DERNIER SOUFFLE ! Choisis qui emporter :</p>`;
                    allAlivePlayers.forEach(c => { panel.appendChild(createBtn(c.name, 'var(--neon-yellow)', () => sendActionToServer({type:'action', role:'hunter', target: c.name, extra: {hunter: myName}}))); });
                } else { panel.innerHTML = `<p style="color:red;">À couvert ! Le Chasseur arme son arme...</p>`; }
                return; 
            }

            if(myStatus && !myStatus.isAlive) { panel.innerHTML = `<p style="color:red; font-weight:bold;">${langUI.dead}</p>`; return; }

            if (phase === 'night_cupid' && myRole === 'cupid') {
                panel.innerHTML = `<p style="color:var(--neon-pink);">${langUI.selectTarget}</p>`;
                allAlivePlayers.forEach(c => {
                    let btn = createBtn(c.name, 'var(--neon-pink)', () => {
                        btn.style.background = 'var(--neon-pink)'; btn.style.color = '#fff';
                        cupidTargets.push(c.name);
                        if(cupidTargets.length === 2) {
                            sendActionToServer({ type: 'action', role: 'cupid', target1: cupidTargets[0], target2: cupidTargets[1] });
                            cupidTargets = [];
                        }
                    });
                    panel.appendChild(btn);
                });
            }
            else if (phase === 'night_wolves' && myRole === 'werewolf') {
                panel.innerHTML = `<p style="color:var(--neon-pink);">${langUI.selectTarget}</p>`;
                alivePlayers.forEach(c => { if(c.role !== 'werewolf') panel.appendChild(createBtn(c.name, 'var(--neon-pink)', () => sendActionToServer({type:'action', role:'werewolf', target: c.name}))); });
            } 
            else if (phase === 'night_seer' && myRole === 'seer') {
                panel.innerHTML = `<p style="color:var(--neon-cyan);">${langUI.selectTarget}</p>`;
                alivePlayers.forEach(c => { panel.appendChild(createBtn(c.name, 'var(--neon-cyan)', () => sendActionToServer({type:'action', role:'seer', target: c.name}))); });
            }
            else if (phase === 'night_witch' && myRole === 'witch') {
                let html = `<p style="color:var(--neon-purple);">Victime: ${extra.dead || 'Personne'}</p>`;
                if (extra.dead && witchPotions.heal > 0) {
                    html += `<button class="btn-outline" onclick="witchPotions.heal--; sendActionToServer({type:'action', role:'witch', action:'heal', target:'${extra.dead}'});" style="border-color:#2ecc71; color:#2ecc71;">${langUI.healMsg}</button>`;
                }
                if (witchPotions.poison > 0) {
                    alivePlayers.forEach(c => { html += `<button class="btn-outline" onclick="witchPotions.poison--; sendActionToServer({type:'action', role:'witch', action:'poison', target:'${c.name}'});" style="border-color:#e74c3c; color:#e74c3c; margin-left:10px;">${langUI.poisonMsg} ${c.name}</button>`; });
                }
                html += `<button class="btn-outline" onclick="sendActionToServer({type:'action', role:'witch', action:'skip'})" style="border-color:gray; color:gray; margin-left:10px;">${langUI.skipMsg}</button>`;
                panel.innerHTML = html;
            }
            else if (phase.startsWith('night') && myRole !== 'werewolf' && myRole !== 'cupid') {
                panel.innerHTML = `<p style="color:gray;">${langUI.sleep}</p>`;
            }
            else if (phase === 'day_vote') {
                panel.innerHTML = `<p style="color:var(--neon-yellow);">${langUI.selectTarget}</p>`;
                alivePlayers.forEach(c => { panel.appendChild(createBtn(c.name, 'var(--neon-yellow)', () => sendActionToServer({type:'action', role:'day', target: c.name}))); });
            }
        }

        function createBtn(text, color, onClickCallback) {
            let btn = document.createElement('button');
            btn.className = "btn-outline";
            btn.innerText = text; btn.style.borderColor = color; btn.style.color = color;
            btn.style.margin = "5px";
            btn.onclick = onClickCallback; return btn;
        }

        function setupRoleUI(role) {
            myRole = role;
            const rData = i18n[currentLang].roles[role] || i18n[currentLang].roles['villager'];
            document.getElementById('role-name').innerText = rData.name;
            document.getElementById('role-desc').innerText = rData.desc;
            document.getElementById('role-image').src = rData.img; 
            const card = document.getElementById('my-role-card');
            card.style.borderColor = rData.color;
            card.style.boxShadow = `0 0 20px rgba(${rData.color === 'var(--neon-pink)' ? '255,0,127' : rData.color === 'var(--neon-cyan)' ? '0,229,255' : '155,89,182'}, 0.4)`;
            document.getElementById('role-name').style.color = rData.color;
        }

        function showGameOver(winner, desc) {
            document.getElementById('action-panel').innerHTML = "";
            const goScreen = document.getElementById('game-over-screen');
            goScreen.style.display = 'block';
            document.getElementById('winner-text').innerText = winner;
            document.getElementById('winner-desc').innerText = desc;
        }

        updateLang('fr'); // Init Langue
    </script>
</body>
</html>
