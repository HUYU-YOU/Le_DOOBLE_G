<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Slime-Garou : Infection Protocol</title>
    
    <!-- Scripts externes (PeerJS et YouTube API) -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    
    <!-- Polices -->
    <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- Feuille de style -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <a href="../index.html" id="btn-retour-hub">&#11013; Hub</a>
    <div id="timer-display">05:00</div>

    <video id="bg-video" autoplay loop muted playsinline src="img/backgroundnight.mp4"></video>
    <div id="yt-player" style="display: none;"></div>

    <div class="main-title" id="ui-title">SLIME-GAROU</div>

    <div class="container no-swipe">
        
        <div id="menu">
            <h2 class="ui-text" data-key="menuTitle">Connexion</h2>
            <button id="btn-create" class="btn-solid btn-green ui-text" data-key="btnCreate">Créer une partie</button>
            <hr style="border: none; border-top: 2px dashed rgba(255,255,255,0.2); margin: 30px 0;">
            <input type="text" id="join-id" placeholder="Code de la partie (ex: GAR8369)" style="text-transform: uppercase;">
            <input type="text" id="player-name" placeholder="Votre Pseudo">
            <button id="btn-join" class="btn-solid btn-pink ui-text" data-key="btnJoin">Rejoindre</button>
        </div>

        <div id="lobby" style="display: none;">
            <h2 class="ui-text" data-key="configTitle">Configuration</h2>
            <p class="share-code-text">
                <span class="ui-text" data-key="shareText">Partagez ce code aux joueurs :</span> 
                <span id="my-id" class="share-code-val">Génération...</span>
            </p>
            <div class="player-box">
                <h4 class="ui-text" data-key="playersConnected">Joueurs connectés :</h4>
                <div id="players-list-container" class="players-container">
                    <span class="player-badge">Toi</span>
                </div>
            </div>

            <p style="color: #bbb; font-weight: bold; margin-bottom: 10px; font-family: var(--font-title); font-size:1.2rem;" class="ui-text" data-key="dictLang">Langue du jeu</p>
            <div class="lang-selector">
                <button id="lang-fr" class="lang-btn active" title="Français">🇫🇷</button>
                <button id="lang-en" class="lang-btn" title="English">🇬🇧</button>
            </div>

            <div id="host-config" style="display: none;">
                <div class="config-grid">
                    <div class="checkbox-group" style="background: rgba(57, 255, 20, 0.1); border: 1px solid rgba(57, 255, 20, 0.3);">
                        <label class="ui-text" data-key="cfgWolves">Nombre de Garous :</label>
                        <input type="number" id="cfg-wolves" value="1" min="1" max="3" style="width: 60px; margin: 0; padding: 8px; border-radius: 8px; background: rgba(0,0,0,0.8);">
                    </div>
                    <div class="checkbox-group">
                        <label class="ui-text" data-key="roleSeer">Voyante</label>
                        <label class="switch"><input type="checkbox" id="cfg-seer" checked><span class="slider"></span></label>
                    </div>
                    <div class="checkbox-group">
                        <label class="ui-text" data-key="roleWitch">Sorcière</label>
                        <label class="switch"><input type="checkbox" id="cfg-witch" checked><span class="slider"></span></label>
                    </div>
                    <div class="checkbox-group">
                        <label class="ui-text" data-key="roleCupid">Cupidon</label>
                        <label class="switch"><input type="checkbox" id="cfg-cupid"><span class="slider"></span></label>
                    </div>
                    <div class="checkbox-group">
                        <label class="ui-text" data-key="roleHunter">Chasseur</label>
                        <label class="switch"><input type="checkbox" id="cfg-hunter"><span class="slider"></span></label>
                    </div>
                </div>
                
                <p id="min-players-msg" style="color: var(--neon-yellow); font-size: 1.1rem; font-weight:bold;" class="ui-text" data-key="waitingMinPlayers">(En attente d'au moins 3 joueurs)</p>
                <button id="btn-start" class="btn-solid btn-green ui-text" data-key="btnStart" style="display:none;">Lancer la partie</button>
            </div>
            <p id="waiting-host-msg" style="color: #aaa; display:none; font-size: 1.2rem; font-weight:bold; animation: breathe 2s infinite;" class="ui-text" data-key="waitingHost">En attente de l'hôte...</p>
        </div>

        <div id="game-area" class="no-swipe">
            <h2 id="phase-title">...</h2>
            
            <div class="role-card" id="my-role-card">
                <img id="role-image" class="role-img" src="" alt="Role Image">
                <h3 id="role-name">...</h3>
                <p id="role-desc">...</p>
                <p id="lovers-info" style="color: #ff69b4; font-weight: bold; display:none; font-size: 1.2rem; margin-top: 15px; font-family: var(--font-title);"></p>
            </div>

            <!-- CHAT GAROU -->
            <div id="ww-chat-container" class="chat-container">
                <h4 class="ui-text" data-key="wwChatTitle" style="color: var(--neon-pink); margin:0; font-family: var(--font-title); font-size: 1.5rem; letter-spacing:1px; text-align: left;">Canal Sécurisé : Loups-Garous</h4>
                <div id="ww-chat-messages" class="chat-messages"></div>
                <div class="chat-input-wrapper">
                    <input type="text" id="ww-chat-input" placeholder="...">
                    <button onclick="sendWWChat()" class="btn-solid btn-pink ui-text" data-key="btnSend">Go</button>
                </div>
            </div>

            <h3 class="ui-text" data-key="actionInterface" style="color: #fff; font-size: 1.8rem;">Action</h3>
            <div id="action-panel" style="margin-bottom: 25px; min-height: 50px;"></div>

            <!-- CHAT GLOBAL -->
            <div id="global-chat-container" class="chat-container">
                <h4 class="ui-text" data-key="globalChatTitle" style="color: var(--neon-cyan); margin:0; font-family: var(--font-title); font-size: 1.5rem; letter-spacing:1px; text-align: left;">Chat Général</h4>
                <div id="global-chat-messages" class="chat-messages"></div>
                <div class="chat-input-wrapper">
                    <input type="text" id="global-chat-input" placeholder="...">
                    <button onclick="sendGlobalChat()" class="btn-solid btn-cyan ui-text" data-key="btnSend">Go</button>
                </div>
            </div>

            <div id="game-over-screen">
                <h2 id="winner-text" style="color: var(--neon-yellow);">...</h2>
                <p id="winner-desc" style="color: white;"></p>
                <button id="btn-replay" class="btn-solid btn-green ui-text" data-key="btnReplay" style="margin-top: 25px; display: none;">Rejouer</button>
            </div>
        </div>
    </div>

    <!-- Script principal -->
    <script src="script.js"></script>
</body>
</html>
