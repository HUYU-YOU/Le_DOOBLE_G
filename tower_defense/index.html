<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Server Defense</title>
    <style>
        :root { --bg: #090a0f; --panel: #111827; --accent: #10b981; --path: #1f2937; --danger: #ef4444; --text: #e5e7eb; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh;}
        h1 { margin-top: 0; color: var(--accent); text-transform: uppercase; letter-spacing: 4px; text-shadow: 0 0 15px rgba(16, 185, 129, 0.5); font-size: 2.2em;}
        #game-container { display: flex; gap: 25px; background: var(--panel); padding: 25px; border-radius: 16px; box-shadow: 0 15px 40px rgba(0,0,0,0.8); border: 1px solid rgba(16, 185, 129, 0.15); }
        canvas { background-color: #0b0f19; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; cursor: crosshair; box-shadow: inset 0 0 40px rgba(0,0,0,0.8); }
        #ui-panel { width: 300px; display: flex; flex-direction: column; gap: 15px; }
        .stat-box { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 12px; font-size: 16px; font-weight: bold; border: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; flex-wrap: wrap; }
        .gold { color: #fbbf24; text-shadow: 0 0 10px rgba(251, 191, 36, 0.4); } .lives { color: var(--danger); text-shadow: 0 0 10px rgba(239, 68, 68, 0.4); } .wave { color: var(--accent); width: 100%; margin-top: 10px; font-size: 1.1em; border-top: 1px dashed rgba(255,255,255,0.1); padding-top: 10px;}
        h3 { margin: 0; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: #9ca3af; }
        .tower-btn { background: rgba(255,255,255,0.03); color: white; border: 1px solid rgba(255,255,255,0.1); padding: 15px; border-radius: 10px; font-size: 14px; cursor: pointer; transition: 0.2s; text-align: left; display: flex; justify-content: space-between; align-items: center; }
        .tower-btn:hover:not(:disabled) { background: rgba(16, 185, 129, 0.1); transform: translateX(5px); border-color: rgba(16, 185, 129, 0.3); }
        .tower-btn.selected { border-color: var(--accent); background: rgba(16, 185, 129, 0.15); box-shadow: inset 0 0 15px rgba(16, 185, 129, 0.2); }
        .tower-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        #upgrade-panel { display: none; background: rgba(239, 68, 68, 0.1); padding: 15px; border-radius: 10px; border: 1px solid rgba(239, 68, 68, 0.3); flex-direction: column; gap: 10px; }
        .action-btn { background: var(--accent); color: #000; border: none; padding: 12px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; text-transform: uppercase;}
        .action-btn:hover:not(:disabled) { transform: scale(1.02); box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
        .action-btn:disabled { background: #374151; color: #9ca3af; cursor: not-allowed; }
        #btn-wave { background: var(--danger); color: white; margin-top: auto; letter-spacing: 1.5px; box-shadow: 0 0 15px rgba(239, 68, 68, 0.3); }
        #btn-wave:hover:not(:disabled) { background: #dc2626; transform: scale(1.03); box-shadow: 0 0 25px rgba(239, 68, 68, 0.6); }
        #game-over { display: none; text-align: center; margin-top: 20px;}
        .hub-link { color: #6b7280; text-decoration: none; margin-top: 20px; display: inline-block; transition: 0.2s; font-size: 0.9em; text-transform: uppercase; letter-spacing: 1px;}
        .hub-link:hover { color: #fff; }
    </style>
</head>
<body>
    <h1>Server Defense</h1>
    <div id="game-container">
        <canvas id="gameCanvas" width="600" height="450"></canvas>
        <div id="ui-panel">
            <div class="stat-box">
                <div>Intégrité: <span class="lives" id="lives-display">20</span> ❤️</div>
                <div>Bande Passante: <span class="gold" id="gold-display">100</span> ⚡</div>
                <div class="wave">Anomalie: <span id="wave-display">0</span> / 15</div>
            </div>
            <h3>Protocoles de Défense</h3>
            <button class="tower-btn selected" id="btn-tower-1" onclick="selectTower(1)"><div><b>Firewall Basique</b><br><small style="color:#9ca3af;">Rapide, Tir auto</small></div><strong class="gold">30 ⚡</strong></button>
            <button class="tower-btn" id="btn-tower-2" onclick="selectTower(2)"><div><b>Canon Anti-Malware</b><br><small style="color:#9ca3af;">Lent, Dégâts massifs</small></div><strong class="gold">75 ⚡</strong></button>
            <button class="tower-btn" id="btn-tower-3" onclick="selectTower(3)"><div><b>Sub-Routine Cryo</b><br><small style="color:#9ca3af;">Ralentit les process</small></div><strong class="gold">60 ⚡</strong></button>
            
            <div id="upgrade-panel">
                <div style="font-weight:bold; color: #fff;">Noeud Sélectionné</div>
                <div id="tower-stats" style="font-size:13px; color: #9ca3af; line-height: 1.5;"></div>
                <button class="action-btn" id="btn-upgrade" onclick="upgradeSelectedTower()">Optimiser</button>
                <button class="action-btn" style="background:transparent; border: 1px solid var(--danger); color:var(--danger);" onclick="sellSelectedTower()">Supprimer</button>
            </div>
            <button class="action-btn" id="btn-wave" onclick="startWave()">Démarrer Scan !</button>
        </div>
    </div>
    <div id="game-over">
        <h2 id="end-message" style="font-size: 2.2em; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 2px;"></h2>
        <button class="action-btn" onclick="location.reload()" style="font-size: 1.2em; padding: 15px 30px;">Rebooter le Serveur</button><br>
        <a href="../index.html" class="hub-link">⬅ Retour Menu</a>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d'); const tileSize = 30;
        let gold = 100, lives = 20, wave = 0, isWaveActive = false, enemiesToSpawn = [], spawnTimer = 0, gameOver = false;
        let towers = [], enemies = [], projectiles = [], particles = [];
        let selectedTowerType = 1, hoveredGrid = {x: -1, y: -1}, selectedTowerInstance = null;
        const pathGrid = [ {x: 0, y: 2}, {x: 1, y: 2}, {x: 2, y: 2}, {x: 3, y: 2}, {x: 4, y: 2}, {x: 5, y: 2}, {x: 5, y: 3}, {x: 5, y: 4}, {x: 5, y: 5}, {x: 5, y: 6}, {x: 5, y: 7}, {x: 5, y: 8}, {x: 5, y: 9}, {x: 6, y: 9}, {x: 7, y: 9}, {x: 8, y: 9}, {x: 9, y: 9}, {x: 10, y: 9}, {x: 11, y: 9}, {x: 12, y: 9}, {x: 13, y: 9}, {x: 14, y: 9}, {x: 14, y: 8}, {x: 14, y: 7}, {x: 14, y: 6}, {x: 14, y: 5}, {x: 14, y: 4}, {x: 14, y: 3}, {x: 15, y: 3}, {x: 16, y: 3}, {x: 17, y: 3}, {x: 18, y: 3}, {x: 19, y: 3} ];
        const path = pathGrid.map(p => ({ x: p.x * tileSize + tileSize/2, y: p.y * tileSize + tileSize/2 }));
        const towerDefs = { 1: { cost: 30, range: 90, damage: 15, cooldown: 20, color: '#3b82f6', pColor: '#60a5fa', type: 'normal' }, 2: { cost: 75, range: 120, damage: 60, cooldown: 80, color: '#8b5cf6', pColor: '#a78bfa', type: 'normal' }, 3: { cost: 60, range: 100, damage: 5, cooldown: 10, color: '#06b6d4', pColor: '#22d3ee', type: 'ice' } };

        canvas.addEventListener('mousemove', (e) => { const rect = canvas.getBoundingClientRect(); hoveredGrid.x = Math.floor((e.clientX - rect.left) / tileSize); hoveredGrid.y = Math.floor((e.clientY - rect.top) / tileSize); });
        canvas.addEventListener('mouseleave', () => { hoveredGrid = {x: -1, y: -1}; });
        canvas.addEventListener('click', () => {
            if (gameOver) return; const hx = hoveredGrid.x; const hy = hoveredGrid.y;
            const clickedTower = towers.find(t => Math.floor(t.x/tileSize) === hx && Math.floor(t.y/tileSize) === hy);
            if (clickedTower) { selectedTowerInstance = clickedTower; updateUpgradePanel(); return; }
            selectedTowerInstance = null; document.getElementById('upgrade-panel').style.display = 'none';
            if (pathGrid.some(p => p.x === hx && p.y === hy)) return;
            const def = towerDefs[selectedTowerType];
            if (gold >= def.cost) { gold -= def.cost; towers.push(new Tower(hx, hy, selectedTowerType)); updateUI(); }
        });

        window.selectTower = (type) => { selectedTowerType = type; selectedTowerInstance = null; document.getElementById('upgrade-panel').style.display = 'none'; [1,2,3].forEach(id => document.getElementById(`btn-tower-${id}`).classList.remove('selected')); document.getElementById(`btn-tower-${type}`).classList.add('selected'); };
        window.upgradeSelectedTower = () => { if (selectedTowerInstance && selectedTowerInstance.level < 3 && gold >= selectedTowerInstance.upgradeCost) { gold -= selectedTowerInstance.upgradeCost; selectedTowerInstance.upgrade(); updateUI(); updateUpgradePanel(); } };
        window.sellSelectedTower = () => { if (selectedTowerInstance) { gold += Math.floor(selectedTowerInstance.totalValue * 0.6); towers = towers.filter(t => t !== selectedTowerInstance); selectedTowerInstance = null; document.getElementById('upgrade-panel').style.display = 'none'; updateUI(); } };

        function updateUpgradePanel() {
            const panel = document.getElementById('upgrade-panel');
            if (selectedTowerInstance) {
                panel.style.display = 'flex'; document.getElementById('tower-stats').innerHTML = `Niveau: <span style="color:#fff">${selectedTowerInstance.level}/3</span><br>Puissance: <span style="color:#fff">${selectedTowerInstance.damage}</span><br>Portée: <span style="color:#fff">${selectedTowerInstance.range}</span>`;
                const btn = document.getElementById('btn-upgrade');
                if (selectedTowerInstance.level < 3) { btn.innerText = `Optimiser (${selectedTowerInstance.upgradeCost} ⚡)`; btn.disabled = gold < selectedTowerInstance.upgradeCost; } 
                else { btn.innerText = "Niveau MAX"; btn.disabled = true; }
            }
        }
        window.startWave = () => { if (!isWaveActive && wave < 15) { wave++; document.getElementById('wave-display').innerText = wave; generateWaveQueue(); isWaveActive = true; document.getElementById('btn-wave').disabled = true; document.getElementById('btn-wave').innerText = "Analyse en cours..."; } };
        function generateWaveQueue() { enemiesToSpawn = []; let count = 5 + (wave * 2); for(let i=0; i<count; i++) { let r = Math.random(); if (wave > 3 && r < 0.2) enemiesToSpawn.push('fast'); else if (wave > 5 && r > 0.85) enemiesToSpawn.push('tank'); else enemiesToSpawn.push('normal'); } }

        class Enemy {
            constructor(type) {
                this.x = path[0].x; this.y = path[0].y; this.pathIndex = 0; this.type = type; let baseHp = 20 + (wave * 12);
                if(type === 'normal') { this.maxHp = baseHp; this.speed = 1.2; this.color = '#ef4444'; this.radius = 7; this.rew = 5; }
                if(type === 'fast') { this.maxHp = baseHp * 0.6; this.speed = 2.2; this.color = '#f59e0b'; this.radius = 5; this.rew = 8; }
                if(type === 'tank') { this.maxHp = baseHp * 3; this.speed = 0.6; this.color = '#ec4899'; this.radius = 10; this.rew = 15; }
                this.hp = this.maxHp; this.freezeTimer = 0;
            }
            draw() {
                if (this.freezeTimer > 0) { ctx.beginPath(); ctx.arc(this.x, this.y, this.radius + 3, 0, Math.PI*2); ctx.fillStyle = 'rgba(34, 211, 238, 0.4)'; ctx.fill(); }
                ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fillStyle = this.color; ctx.shadowBlur = 10; ctx.shadowColor = this.color; ctx.fill(); ctx.shadowBlur = 0; ctx.closePath();
                ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(this.x - 10, this.y - 15, 20, 3); ctx.fillStyle = '#10b981'; ctx.fillRect(this.x - 10, this.y - 15, 20 * (this.hp / this.maxHp), 3);
            }
            update() {
                let cSpd = this.speed; if (this.freezeTimer > 0) { cSpd *= 0.5; this.freezeTimer--; }
                let target = path[this.pathIndex]; let dx = target.x - this.x; let dy = target.y - this.y; let dist = Math.hypot(dx, dy);
                if (dist < cSpd) { this.x = target.x; this.y = target.y; this.pathIndex++; if (this.pathIndex >= path.length) return "reached_end"; } 
                else { this.x += (dx / dist) * cSpd; this.y += (dy / dist) * cSpd; } return "alive";
            }
        }

        class Tower {
            constructor(gx, gy, tK) {
                this.x = gx * tileSize + tileSize / 2; this.y = gy * tileSize + tileSize / 2; let def = towerDefs[tK];
                this.dType = def.type; this.range = def.range; this.damage = def.damage; this.cdMax = def.cooldown; this.cd = 0;
                this.color = def.color; this.pColor = def.pColor; this.angle = 0; this.level = 1; this.baseCost = def.cost; this.upgradeCost = Math.floor(def.cost * 1.5); this.totalValue = def.cost;
            }
            upgrade() { this.level++; this.totalValue += this.upgradeCost; this.damage = Math.floor(this.damage * 1.5); this.range += 15; this.upgradeCost = Math.floor(this.upgradeCost * 1.5); }
            draw() {
                ctx.fillStyle = 'rgba(255,255,255,0.05)'; ctx.fillRect(this.x - 14, this.y - 14, 28, 28);
                ctx.fillStyle = this.color; ctx.fillRect(this.x - 10, this.y - 10, 20, 20);
                ctx.fillStyle = 'white'; for(let i=0; i<this.level; i++) ctx.fillRect(this.x - 6 + (i*5), this.y + 12, 3, 3);
                ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.angle);
                ctx.fillStyle = '#1f2937'; ctx.beginPath(); ctx.arc(0, 0, 7, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = this.pColor; ctx.fillRect(0, -2, 10 + (this.level*3), 4); ctx.restore();
            }
            update() {
                if (this.cd > 0) this.cd--; let target = null, minDst = this.range;
                for (let e of enemies) { let d = Math.hypot(e.x - this.x, e.y - this.y); if (d < minDst) { minDst = d; target = e; } }
                if (target) { this.angle = Math.atan2(target.y - this.y, target.x - this.x); if (this.cd <= 0) { projectiles.push(new Projectile(this.x, this.y, target, this.damage, this.pColor, this.dType)); this.cd = this.cdMax; } }
            }
        }

        class Projectile {
            constructor(x, y, target, dmg, color, type) { this.x = x; this.y = y; this.target = target; this.dmg = dmg; this.color = color; this.type = type; this.speed = 12; }
            draw() { ctx.beginPath(); ctx.arc(this.x, this.y, 3, 0, Math.PI * 2); ctx.fillStyle = this.color; ctx.shadowBlur = 10; ctx.shadowColor = this.color; ctx.fill(); ctx.shadowBlur = 0; }
            update() {
                let dx = this.target.x - this.x, dy = this.target.y - this.y, dist = Math.hypot(dx, dy);
                if (dist < this.speed) { this.target.hp -= this.dmg; if (this.type === 'ice') this.target.freezeTimer = 90;
                    for(let i=0; i<4; i++) particles.push({x: this.x, y: this.y, vx: (Math.random()-0.5)*5, vy: (Math.random()-0.5)*5, life: 12, color: this.color}); return true; } 
                else { this.x += (dx / dist) * this.speed; this.y += (dy / dist) * this.speed; return false; }
            }
        }

        function updateUI() { document.getElementById('gold-display').innerText = gold; document.getElementById('lives-display').innerText = lives; [1,2,3].forEach(i => document.getElementById(`btn-tower-${i}`).disabled = gold < towerDefs[i].cost); if(selectedTowerInstance) updateUpgradePanel(); }
        
        function drawMapAndHover() {
            ctx.fillStyle = 'rgba(255,255,255,0.02)';
            for(let x=0; x<canvas.width; x+=tileSize) { ctx.fillRect(x, 0, 1, canvas.height); }
            for(let y=0; y<canvas.height; y+=tileSize) { ctx.fillRect(0, y, canvas.width, 1); }

            ctx.fillStyle = 'rgba(31, 41, 55, 0.7)'; for (let p of pathGrid) ctx.fillRect(p.x * tileSize, p.y * tileSize, tileSize, tileSize);
            ctx.fillStyle = 'rgba(239, 68, 68, 0.5)'; let end = pathGrid[pathGrid.length - 1]; ctx.fillRect(end.x * tileSize, end.y * tileSize, tileSize, tileSize);
            
            if (selectedTowerInstance) { ctx.beginPath(); ctx.arc(selectedTowerInstance.x, selectedTowerInstance.y, selectedTowerInstance.range, 0, Math.PI*2); ctx.fillStyle = 'rgba(255, 255, 255, 0.05)'; ctx.fill(); ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)'; ctx.stroke(); }
            
            if (hoveredGrid.x >= 0 && !selectedTowerInstance) {
                const hx = hoveredGrid.x; const hy = hoveredGrid.y;
                let onPath = pathGrid.some(p => p.x === hx && p.y === hy), occupied = towers.some(t => Math.floor(t.x/tileSize) === hx && Math.floor(t.y/tileSize) === hy);
                ctx.fillStyle = (onPath || occupied) ? 'rgba(239, 68, 68, 0.3)' : 'rgba(16, 185, 129, 0.3)'; ctx.fillRect(hx * tileSize, hy * tileSize, tileSize, tileSize);
                if (!onPath && !occupied) { ctx.beginPath(); ctx.arc(hx * tileSize + tileSize/2, hy * tileSize + tileSize/2, towerDefs[selectedTowerType].range, 0, Math.PI*2); ctx.fillStyle = 'rgba(255, 255, 255, 0.05)'; ctx.fill(); ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)'; ctx.stroke(); }
            }
        }

        function gameLoop() {
            if (gameOver) return; ctx.clearRect(0, 0, canvas.width, canvas.height); drawMapAndHover();
            if (isWaveActive) {
                spawnTimer++; if (spawnTimer >= 45 && enemiesToSpawn.length > 0) { enemies.push(new Enemy(enemiesToSpawn.shift())); spawnTimer = 0; }
                if (enemiesToSpawn.length === 0 && enemies.length === 0) {
                    isWaveActive = false; const btn = document.getElementById('btn-wave'); btn.disabled = false;
                    if (wave >= 15) { gameOver = true; document.getElementById('game-over').style.display = 'block'; document.getElementById('end-message').innerText = "MENACE NEUTRALISÉE"; document.getElementById('end-message').style.color = '#10b981'; document.getElementById('end-message').style.textShadow = '0 0 15px #10b981'; } 
                    else { btn.innerText = "Démarrer Scan !"; gold += 30 + (wave * 5); }
                }
            }
            towers.forEach(t => { t.update(); t.draw(); });
            for (let i = projectiles.length - 1; i >= 0; i--) { if (projectiles[i].update()) projectiles.splice(i, 1); else projectiles[i].draw(); }
            for (let i = particles.length - 1; i >= 0; i--) { let p = particles[i]; p.x += p.vx; p.y += p.vy; p.life--; ctx.fillStyle = p.color; ctx.globalAlpha = p.life / 12; ctx.fillRect(p.x, p.y, 2, 2); ctx.globalAlpha = 1; if (p.life <= 0) particles.splice(i, 1); }
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i], status = e.update();
                if (status === "reached_end") { lives--; enemies.splice(i, 1); if (lives <= 0) { gameOver = true; document.getElementById('game-over').style.display = 'block'; document.getElementById('end-message').innerText = "SERVEUR CORROMPU"; document.getElementById('end-message').style.color = '#ef4444'; document.getElementById('end-message').style.textShadow = '0 0 15px #ef4444'; } } 
                else if (e.hp <= 0) { gold += e.rew; enemies.splice(i, 1); } else e.draw();
            }
            updateUI(); requestAnimationFrame(gameLoop);
        }
        updateUI(); requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
