<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Server Defense - Infinite Run</title>
    
    <!-- Lien vers le fichier CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- BOUTON RETOUR HUB (Image) -->
    <a href="../index.html" class="hub-link-top"
       onmouseenter="document.getElementById('hub-img').src='../img/returbhub.png'"
       onmouseleave="document.getElementById('hub-img').src='../img/retourhub.png'">
        <img src="../img/retourhub.png" id="hub-img" alt="Retour au Hub">
    </a>
    
    <!-- BOUTON PARAMÈTRES (Animation) -->
    <div class="settings-btn-wrapper" onmouseenter="startSettingsAnim()" onmouseleave="stopSettingsAnim()" onclick="clickSettingsAnim()">
        <div class="orbit-container"><div class="orbit-slime"></div></div>
        <img src="../img/setting.png" alt="Paramètres" id="settings-btn-img" class="settings-btn">
    </div>

    <!-- MODAL PARAMETRES -->
    <div id="settings-modal">
        <div class="settings-content">
            <h2 style="margin-top: 0; color: var(--accent); text-transform: uppercase; letter-spacing: 2px;">Paramètres</h2>
            <div class="setting-item" style="flex-direction: column; gap: 15px; margin-bottom: 30px;">
                <span>Format de l'Écran 🖥️</span>
                <div class="size-options">
                    <button id="btn-sz-classic" class="btn-size" onclick="setGameSize('classic')">Petit</button>
                    <button id="btn-sz-wide" class="btn-size active" onclick="setGameSize('wide')">Plein Page</button>
                    <button id="btn-sz-full" class="btn-size" onclick="setGameSize('full')">Plein Écran</button>
                </div>
            </div>
            <button onclick="toggleSettings()" class="close-btn">Fermer</button>
        </div>
    </div>
    
    <h1>Protocol Defense: Endless</h1>
    
    <div id="game-container" style="position: relative;">
        <!-- ÉCRAN D'ACCUEIL -->
        <div id="start-screen">
            <h2 class="slime-title">PROTOCOL DEFENSE</h2>
            <p style="color: #aaa; margin-bottom: 20px;">Initialisez la matrice de défense.</p>
            <button class="action-btn slime-btn" onclick="startGame()">Démarrer le Système</button>
        </div>

        <!-- Canvas dimensions de base -->
        <canvas id="gameCanvas" width="600" height="450"></canvas>
        <div id="ui-panel">
            <div class="stat-box">
                <div>Health: <span class="lives" id="lives-display">20</span> ❤️</div>
                <div>Money: <span class="gold" id="gold-display">150</span> ⚡</div>
                <div class="wave">Wave: <span id="wave-display">0</span> / ∞</div>
            </div>
            
            <h3>Arsenal</h3>
            <div class="tower-grid">
                <button class="tower-btn selected" id="btn-tower-1" onclick="selectTower(1)">
                    <img src="img/fantassin.png" onerror="this.style.display='none'">
                    <b>Fantassin</b><span>Cadence rapide</span><strong class="gold">20 ⚡</strong>
                </button>
                <button class="tower-btn" id="btn-tower-2" onclick="selectTower(2)">
                    <img src="img/tirreur.png" onerror="this.style.display='none'">
                    <b>Tireur</b><span>Tir à Ricochets</span><strong class="gold">60 ⚡</strong>
                </button>
                <button class="tower-btn" id="btn-tower-3" onclick="selectTower(3)">
                    <img src="img/blindé.png" onerror="this.style.display='none'">
                    <b>Blindé</b><span>Casse l'armure</span><strong class="gold">120 ⚡</strong>
                </button>
                <button class="tower-btn" id="btn-tower-4" onclick="selectTower(4)">
                    <img src="img/sniper.png" onerror="this.style.display='none'">
                    <b>Sniper</b><span>Tir transperçant</span><strong class="gold">100 ⚡</strong>
                </button>
                <button class="tower-btn" id="btn-tower-5" onclick="selectTower(5)">
                    <img src="img/bombardier.png" onerror="this.style.display='none'">
                    <b>Bombardier</b><span>Dégâts de Zone</span><strong class="gold">90 ⚡</strong>
                </button>
                <button class="tower-btn" id="btn-tower-6" onclick="selectTower(6)">
                    <img src="img/alchimiste.png" onerror="this.style.display='none'">
                    <b>Alchimiste</b><span>Poison & Lenteur</span><strong class="gold">80 ⚡</strong>
                </button>
            </div>
            
            <div id="upgrade-panel">
                <div style="font-weight:bold; color: #fff;" id="tower-name-display">Noeud Sélectionné</div>
                <div id="tower-stats" style="font-size:12px; color: #9ca3af; min-height: 55px;"></div>
                <button class="action-btn" id="btn-target" onclick="cycleTargeting()" style="background:#8b5cf6; color:white;">Cible: Premier</button>
                <button class="action-btn" id="btn-upgrade" onclick="upgradeSelectedTower()">Optimiser</button>
                <button class="action-btn" style="background:transparent; border: 1px solid var(--danger); color:var(--danger);" onclick="sellSelectedTower()">Vendre</button>
            </div>
            
            <div class="sys-btns">
                <button class="action-btn" id="btn-auto" onclick="toggleAuto()" style="background:#4b5563; color:white;">Auto-Scan: OFF</button>
                <button class="action-btn" id="btn-speed" onclick="toggleSpeed()" style="background:#3b82f6; color:white;">Speed: x1</button>
            </div>
            <button class="action-btn" id="btn-wave" onclick="startWave()">Ready !</button>
        </div>
    </div>
    <div id="game-over">
        <h2 id="end-message" style="font-size: 2em; margin-bottom: 10px;">SERVEUR CORROMPU</h2>
        <p id="survive-message" style="color:#aaa;"></p>
        <button class="action-btn" onclick="location.reload()" style="padding: 15px 30px;">Rebooter le Serveur</button>
    </div>

    <!-- Lien vers le fichier JavaScript -->
    <script src="script.js"></script>
</body>
</html>
