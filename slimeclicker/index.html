<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Slime Clicker</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --panel-bg: rgba(31, 40, 51, 0.85); /* Un poil plus opaque pour lisibilité sur le fond */
            --neon-cyan: #00f0ff;
            --neon-pink: #ff007f;
            --neon-green: #39ff14;
            --neon-gold: #fce803;
            --text-color: #e0e0e0;
            --font-main: 'Segoe UI', system-ui, sans-serif;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            color: var(--text-color);
            font-family: var(--font-main); overflow-x: hidden;
            display: flex; flex-direction: column;
            user-select: none;
            /* La transition permet un changement fluide entre le jour et la nuit */
            transition: background-image 2s ease-in-out;
            background-color: var(--bg-color); /* Fallback si l'image charge pas */
        }

        /* --- HEADER & BOUTON RETOUR --- */
        header {
            text-align: center; padding: 20px;
            background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, transparent 100%);
        }
        h1 { margin: 0; color: var(--neon-cyan); text-shadow: 0 0 15px var(--neon-cyan), 0 0 5px #000; text-transform: uppercase; letter-spacing: 3px; }

        #btn-retour-hub {
            position: absolute; top: 20px; left: 20px;
            background-color: rgba(0, 0, 0, 0.7); border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan); padding: 8px 15px; border-radius: 5px; cursor: pointer;
            text-decoration: none; font-weight: bold; transition: 0.3s; z-index: 100;
        }
        #btn-retour-hub:hover { background: rgba(0, 240, 255, 0.2); box-shadow: 0 0 10px rgba(0,240,255,0.5); }

        /* --- LAYOUT PRINCIPAL --- */
        #game-container {
            display: flex; flex-wrap: wrap; flex: 1; padding: 20px; gap: 30px;
            max-width: 1200px; margin: 0 auto; width: 100%; box-sizing: border-box;
            align-items: stretch;
        }

        /* --- PANNEAU GAUCHE (La star : Le Slime) --- */
        #click-area {
            flex: 1.5; min-width: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: var(--panel-bg);
            border-radius: 15px; border: 1px solid rgba(57, 255, 20, 0.4);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8), 0 10px 30px rgba(0,0,0,0.5); 
            position: relative; padding: 40px 20px;
            overflow: hidden; backdrop-filter: blur(5px);
        }

        #score-display { 
            font-size: 3.5rem; font-weight: bold; color: var(--neon-green); 
            text-shadow: 0 0 20px rgba(57, 255, 20, 0.6), 0 0 5px #000; margin-bottom: 5px; z-index: 10;
        }
        #sps-display { 
            font-size: 1.2rem; color: #ccc; margin-bottom: 20px; z-index: 10;
            background: rgba(0,0,0,0.6); padding: 5px 15px; border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Indicateur du Buff Doré */
        #golden-buff-ui {
            display: none;
            font-size: 1.3rem; font-weight: bold; color: var(--neon-gold);
            background: rgba(252, 232, 3, 0.1); border: 1px solid var(--neon-gold);
            padding: 8px 20px; border-radius: 8px; margin-bottom: 20px; z-index: 10;
            text-shadow: 0 0 10px var(--neon-gold);
            animation: pulseGold 1.5s infinite;
        }

        @keyframes pulseGold {
            0% { box-shadow: 0 0 10px rgba(252,232,3,0.2); }
            50% { box-shadow: 0 0 25px rgba(252,232,3,0.6); }
            100% { box-shadow: 0 0 10px rgba(252,232,3,0.2); }
        }

        /* L'Image du Slime Dynamique */
        #slime-image {
            width: 250px; height: auto; cursor: pointer;
            filter: drop-shadow(0 15px 25px rgba(57, 255, 20, 0.5));
            transition: transform 0.05s ease-out, filter 0.2s;
            z-index: 10; -webkit-user-drag: none;
        }
        #slime-image:hover { filter: drop-shadow(0 15px 35px rgba(57, 255, 20, 0.8)); }

        /* Le Slime Doré (Événement) */
        #golden-slime {
            display: none; position: fixed; width: 100px; height: auto;
            cursor: pointer; z-index: 999; -webkit-user-drag: none;
            filter: drop-shadow(0 0 30px var(--neon-gold));
            animation: floatSlime 3s ease-in-out infinite, pulseGold 1s infinite;
        }

        @keyframes floatSlime {
            0% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0); }
        }

        /* Particules de clic (+1) */
        .floating-number {
            position: absolute; color: #fff; font-size: 2rem; font-weight: bold;
            pointer-events: none; animation: floatUp 0.8s ease-out forwards; 
            text-shadow: 0 0 10px var(--neon-green), 0 0 2px #000; z-index: 20;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-80px) scale(1.3); }
        }

        /* --- PANNEAU DROIT (Boutique Dresseurs) --- */
        #shop-area {
            flex: 1; min-width: 300px; display: flex; flex-direction: column; gap: 10px;
            background: var(--panel-bg); border-radius: 15px; border: 1px solid rgba(0, 240, 255, 0.4);
            padding: 20px; overflow-y: auto; max-height: 75vh;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); backdrop-filter: blur(5px);
        }
        
        #shop-area h2 { margin-top: 0; color: var(--neon-cyan); border-bottom: 1px dashed var(--neon-cyan); padding-bottom: 10px; text-shadow: 0 0 5px #000;}

        .shop-item {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.6); border: 1px solid #333; border-radius: 8px;
            padding: 15px; cursor: pointer; transition: 0.2s;
        }
        .shop-item:hover { border-color: var(--neon-cyan); background: rgba(0, 240, 255, 0.15); }
        .shop-item.disabled { opacity: 0.5; filter: grayscale(100%); cursor: not-allowed; }
        .shop-item.disabled:hover { border-color: #333; background: rgba(0,0,0,0.6); }

        .item-info { display: flex; align-items: center; gap: 15px; }
        .item-icon { font-size: 2.5rem; filter: drop-shadow(0 0 5px #000); }
        .item-details h3 { margin: 0; color: #fff; font-size: 1.1rem; }
        .item-details p { margin: 3px 0 0 0; color: #aaa; font-size: 0.85rem; }
        .item-cost { color: var(--neon-pink); font-weight: bold; font-size: 1rem; margin-top: 5px; text-shadow: 0 0 5px #000;}
        
        .item-count { font-size: 1.8rem; font-weight: bold; color: rgba(255,255,255,0.3); }

    </style>
</head>
<body>

    <!-- Le fameux Slime Doré -->
    <img id="golden-slime" src="img/goldenslime.png" alt="Golden Slime" draggable="false" onclick="activateGoldenBuff(event)">

    <a href="../index.html" id="btn-retour-hub">&#11013; Retour au Hub</a>

    <header>
        <h1>Slime Clicker</h1>
    </header>

    <div id="game-container">
        
        <!-- ZONE DE JEU -->
        <div id="click-area">
            <div id="score-display">0 Slimes</div>
            <div id="sps-display">0 / sec</div>

            <!-- Indicateur x2 -->
            <div id="golden-buff-ui">🔥 PRODUCTION X2 (<span id="golden-time">00:00</span>) 🔥</div>
            
            <img id="slime-image" src="img/slm1.png" alt="Big Slime" draggable="false">
        </div>

        <!-- BOUTIQUE DES DRESSEURS -->
        <div id="shop-area">
            <h2>Dresseurs de Slimes</h2>
            <div id="shop-list">
                <!-- Généré par JavaScript -->
            </div>
        </div>

    </div>

    <script>
        // ==========================================
        // 🌍 GESTION DU BACKGROUND JOUR/NUIT
        // ==========================================
        function updateBackground() {
            // Récupère l'heure exacte de Lisbonne (Portugal)
            const ptTime = new Date().toLocaleString("en-US", {timeZone: "Europe/Lisbon"});
            const hour = new Date(ptTime).getHours();
            const body = document.body;

            // De 8h (inclus) à 19h (exclu) = Jour, sinon Nuit
            if (hour >= 8 && hour < 19) {
                body.style.backgroundImage = "url('img/backday.png')";
            } else {
                body.style.backgroundImage = "url('img/backnight.png')";
            }
            body.style.backgroundSize = "cover";
            body.style.backgroundPosition = "center";
            body.style.backgroundAttachment = "fixed";
        }
        
        updateBackground(); // Met à jour tout de suite
        setInterval(updateBackground, 60000); // Vérifie toutes les minutes

        // ==========================================
        // 💾 DONNÉES DU JEU & VARIABLES
        // ==========================================
        let game = {
            slimes: 0,
            totalSlimes: 0,
            clickPower: 1,
            lastSaveTime: Date.now()
        };

        // Variables du Buff Doré
        let goldenMultiplier = 1;
        let goldenTimerRemaining = 0; // en secondes
        let goldenTimeout;

        const buildings = [
            { id: 'b1', name: "Clic Musclé", desc: "+1 par clic (Toi)", baseCost: 15, sps: 0, clickBonus: 1, count: 0, icon: "👆" },
            { id: 'b2', name: "Nathan", desc: "Apprenti (+1 slime/s)", baseCost: 50, sps: 1, clickBonus: 0, count: 0, icon: "👦" },
            { id: 'b3', name: "Dylan", desc: "Amateur (+10 slimes/s)", baseCost: 500, sps: 10, clickBonus: 0, count: 0, icon: "🧑‍🎓" },
            { id: 'b4', name: "Lucas", desc: "Expert (+120 slimes/s)", baseCost: 5000, sps: 120, clickBonus: 0, count: 0, icon: "🤠" },
            { id: 'b5', name: "Antoine", desc: "Maître (+1 500 slimes/s)", baseCost: 50000, sps: 1500, clickBonus: 0, count: 0, icon: "🧙‍♂️" },
            { id: 'b6', name: "Romain", desc: "Gourou (+15 000 slimes/s)", baseCost: 1000000, sps: 15000, clickBonus: 0, count: 0, icon: "🦸‍♂️" },
            { id: 'b7', name: "Emre", desc: "Dieu des Slimes (+100 000/s)", baseCost: 50000000, sps: 100000, clickBonus: 0, count: 0, icon: "👑" }
            { id: 'b7', name: "MARC", desc: "Dieu des Slimes (+500 000/s)", baseCost: 500000000, sps: 500000, clickBonus: 0, count: 0, icon: "👑" }
        ];

        function loadGame() {
            const savedGame = localStorage.getItem('slimeClickerSave');
            if (savedGame) {
                const parsed = JSON.parse(savedGame);
                game.slimes = parsed.slimes || 0;
                game.totalSlimes = parsed.totalSlimes || 0;
                game.clickPower = parsed.clickPower || 1;
                
                if (parsed.buildings) {
                    parsed.buildings.forEach((savedB, index) => {
                        if (buildings[index]) buildings[index].count = savedB.count || 0;
                    });
                }
            }
        }

        function saveGame() {
            game.lastSaveTime = Date.now();
            const saveObj = {
                slimes: game.slimes,
                totalSlimes: game.totalSlimes,
                clickPower: game.clickPower,
                buildings: buildings.map(b => ({ count: b.count }))
            };
            localStorage.setItem('slimeClickerSave', JSON.stringify(saveObj));
        }

        // ==========================================
        // 🧮 LOGIQUE DU JEU (Avec Multiplicateurs)
        // ==========================================
        function getBaseSPS() {
            let total = 0;
            buildings.forEach(b => { total += b.sps * b.count; });
            return total;
        }

        function getBaseClick() {
            let power = 1;
            buildings.forEach(b => { power += b.clickBonus * b.count; });
            return power;
        }

        function getSPS() { return getBaseSPS() * goldenMultiplier; }
        function getClickPower() { return getBaseClick() * goldenMultiplier; }

        function getCost(building) { return Math.floor(building.baseCost * Math.pow(1.15, building.count)); }
        function formatNum(num) { return Math.floor(num).toLocaleString('fr-FR'); }

        // Formater le temps pour le buff (03:00)
        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = Math.floor(seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        // ==========================================
        // 🌟 GESTION DU SLIME DORÉ
        // ==========================================
        function scheduleGoldenSlime() {
            // Apparaît aléatoirement entre 2 et 5 minutes
            const delay = (Math.random() * 180000) + 120000;
            setTimeout(spawnGoldenSlime, delay);
        }

        function spawnGoldenSlime() {
            // Ne fait pas spawner si le buff est déjà actif
            if (goldenMultiplier > 1) {
                scheduleGoldenSlime();
                return;
            }

            const gs = document.getElementById('golden-slime');
            // Position aléatoire sur l'écran (10% à 80% pour éviter qu'il sorte de l'écran)
            gs.style.left = (10 + Math.random() * 70) + 'vw';
            gs.style.top = (10 + Math.random() * 70) + 'vh';
            gs.style.display = 'block';

            // Il disparaît si on ne clique pas dessus dans les 8 secondes
            goldenTimeout = setTimeout(() => {
                gs.style.display = 'none';
                scheduleGoldenSlime();
            }, 8000);
        }

        function activateGoldenBuff(e) {
            const gs = document.getElementById('golden-slime');
            gs.style.display = 'none';
            clearTimeout(goldenTimeout);

            // Activation du buff !
            goldenMultiplier = 2;
            goldenTimerRemaining = 180; // 3 minutes = 180 secondes
            document.getElementById('golden-buff-ui').style.display = 'block';
            updateUI();

            // Effet visuel
            spawnFloatingText(e.clientX, e.clientY, "PRODUCTION X2 !!", "var(--neon-gold)");
            
            scheduleGoldenSlime(); // Programme le prochain
        }

        // Lancer la loterie du Slime Doré
        scheduleGoldenSlime();

        // ==========================================
        // 🖱️ GESTION DU CLIC ET PARTICULES
        // ==========================================
        const slimeImg = document.getElementById('slime-image');
        const clickArea = document.getElementById('click-area');

        function spawnFloatingText(x, y, text, color) {
            const floatingEl = document.createElement('div');
            floatingEl.className = 'floating-number';
            floatingEl.innerText = text;
            floatingEl.style.color = color;
            floatingEl.style.textShadow = `0 0 10px ${color}, 0 0 2px #000`;
            floatingEl.style.left = `${x - 30}px`; 
            floatingEl.style.top = `${y - 30}px`;
            
            const randomOffset = (Math.random() - 0.5) * 60;
            floatingEl.style.transform = `translateX(${randomOffset}px)`;

            document.body.appendChild(floatingEl);
            setTimeout(() => floatingEl.remove(), 800);
        }

        function handleSlimePress(e) {
            if (e.cancelable) e.preventDefault();

            slimeImg.src = 'img/slm17.png';
            slimeImg.style.transform = 'scale(0.9) translateY(15px)';

            const power = getClickPower();
            game.slimes += power;
            game.totalSlimes += power;
            updateUI();

            let x, y;
            if (e.touches && e.touches.length > 0) {
                x = e.touches[0].clientX;
                y = e.touches[0].clientY;
            } else {
                x = e.clientX;
                y = e.clientY;
            }

            spawnFloatingText(x, y, `+${formatNum(power)}`, "var(--neon-green)");
        }

        function handleSlimeRelease() {
            slimeImg.src = 'img/slm1.png';
            slimeImg.style.transform = 'scale(1) translateY(0)';
        }

        slimeImg.addEventListener('mousedown', handleSlimePress);
        slimeImg.addEventListener('mouseup', handleSlimeRelease);
        slimeImg.addEventListener('mouseleave', handleSlimeRelease);
        slimeImg.addEventListener('touchstart', handleSlimePress, {passive: false});
        slimeImg.addEventListener('touchend', handleSlimeRelease);
        slimeImg.addEventListener('touchcancel', handleSlimeRelease);

        // ==========================================
        // 🛒 BOUTIQUE & UI
        // ==========================================
        function buyBuilding(index) {
            const b = buildings[index];
            const cost = getCost(b);
            
            if (game.slimes >= cost) {
                game.slimes -= cost;
                b.count++;
                renderShop(); 
                updateUI();
            }
        }

        function updateUI() {
            document.getElementById('score-display').innerText = `${formatNum(game.slimes)}`;
            
            let spsText = `${formatNum(getSPS())} / sec`;
            if (goldenMultiplier > 1) spsText += ` (x2 ACTIF)`;
            document.getElementById('sps-display').innerText = spsText;

            buildings.forEach((b, index) => {
                const el = document.getElementById(`shop-item-${index}`);
                if (el) {
                    if (game.slimes >= getCost(b)) el.classList.remove('disabled');
                    else el.classList.add('disabled');
                }
            });
        }

        function renderShop() {
            const shopList = document.getElementById('shop-list');
            shopList.innerHTML = '';

            buildings.forEach((b, index) => {
                const cost = getCost(b);
                const isAffordable = game.slimes >= cost;

                shopList.innerHTML += `
                    <div id="shop-item-${index}" class="shop-item ${isAffordable ? '' : 'disabled'}" onclick="buyBuilding(${index})">
                        <div class="item-info">
                            <div class="item-icon">${b.icon}</div>
                            <div class="item-details">
                                <h3>${b.name}</h3>
                                <p>${b.desc}</p>
                                <div class="item-cost">🩸 ${formatNum(cost)}</div>
                            </div>
                        </div>
                        <div class="item-count">${b.count}</div>
                    </div>
                `;
            });
        }

        // ==========================================
        // 🔄 GAME LOOP (Avec Delta Time pour Tab Inactive)
        // ==========================================
        loadGame();
        renderShop();
        updateUI();

        // On utilise la date pour calculer le vrai temps passé, même si le navigateur réduit la vitesse du setInterval
        let lastTickTime = Date.now();

        setInterval(() => {
            const now = Date.now();
            const deltaSec = (now - lastTickTime) / 1000; // Temps écoulé en secondes depuis la dernière frame
            lastTickTime = now;

            // Gestion du timer du Slime Doré
            if (goldenTimerRemaining > 0) {
                goldenTimerRemaining -= deltaSec;
                if (goldenTimerRemaining <= 0) {
                    goldenTimerRemaining = 0;
                    goldenMultiplier = 1; // Fin du buff
                    document.getElementById('golden-buff-ui').style.display = 'none';
                    updateUI();
                } else {
                    document.getElementById('golden-time').innerText = formatTime(goldenTimerRemaining);
                }
            }

            const sps = getSPS();
            if (sps > 0) {
                // Grâce à deltaSec, si l'onglet est inactif 10 secondes, le jeu ajoutera directement 10x le SPS
                game.slimes += sps * deltaSec;
                game.totalSlimes += sps * deltaSec;
                updateUI();
            }
        }, 100);

        // Sauvegarde auto
        setInterval(saveGame, 5000);

    </script>
</body>
</html>
