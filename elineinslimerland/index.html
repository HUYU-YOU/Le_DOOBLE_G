<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Éline in Slimerland</title>
    <link rel="stylesheet" href="style.css">
    <!-- Polices Slimesques -->
    <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Rubik+Bubbles&display=swap" rel="stylesheet">
</head>
<body>

    <!-- MENU PRINCIPAL -->
    <div id="main-menu">
        <div class="menu-buttons">
            <!-- On utilise la classe "menu-btn" ici pour qu'ils soient transparents -->
            <button id="menu-text-start" class="menu-btn" onclick="startNewGame()">Nouvelle partie</button>
            <button id="menu-text-option" class="menu-btn" onclick="toggleSettings()">Options</button>
            <button id="menu-text-leave" class="menu-btn" onclick="quitGame()">Quitter</button>
        </div>
    </div>

    <!-- ZONE DE JEU (Cachée au démarrage) -->
    <div id="game-container" style="display: none;">
        <video id="story-video" playsinline></video>
        
        <div id="ui-layer">
            <div id="top-text" class="ui-text"></div>
            <div id="bottom-text" class="ui-text"></div>
            <div id="choices-container"></div>
        </div>
    </div>

    <!-- FENÊTRE DES OPTIONS (Cachée au démarrage) -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title-options">Options</h2>
            
            <label id="modal-text-lang" for="lang-select">Langue 🌍 : </label>
            <select id="lang-select" onchange="changeLanguage()">
                <option value="fr">Français</option>
                <option value="en">English</option>
            </select>
            
            <br><br><br>
            <!-- Bouton classique pour fermer -->
            <button id="modal-text-close" onclick="toggleSettings()" class="choice-btn">Fermer</button>
        </div>
    </div>

    <!-- Connexion au script -->
    <script src="game.js"></script>
</body>
</html>
