<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Éline in Slimerland</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="start-screen">
        <button id="start-btn" onclick="startGame()">Démarrer l'Aventure ▶</button>
    </div>

    <a href="../index.html" class="btn-hub">⬅ Retour</a>

    <div class="settings-btn-wrapper" onmouseenter="startSettingsAnim()" onmouseleave="stopSettingsAnim()" onclick="clickSettingsAnim()">
        <img src="../img/setting.png" alt="Paramètres" id="settings-btn-img" class="settings-btn">
    </div>

    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <h2>Paramètres</h2>
            <div class="setting-item">
                <span>Mode Sombre 🌙</span>
                <label class="switch">
                    <input type="checkbox" id="theme-toggle" onchange="toggleTheme()">
                    <span class="slider"></span>
                </label>
            </div>
            <button onclick="toggleSettings()" class="close-btn">Fermer</button>
        </div>
    </div>

    <div id="game-ui">
        <h1>Éline in Slimerland</h1>
    </div>
    
    <div id="game-container">
        <video id="story-video" playsinline></video>
        
        <div id="video-ui">
            <h2 id="top-text" class="story-text"></h2>
            
            <div id="bottom-section">
                <p id="bottom-text" class="story-text"></p>
                <div id="choices-container">
                    </div>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
