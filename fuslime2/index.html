<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuslime 2</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Moteur physique Matter.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    
    <!-- API YouTube pour la musique de fond -->
    <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>
    <!-- VIDÉO DE FOND JOUR/NUIT -->
    <video autoplay loop muted playsinline class="bg-video-main" id="bg-video">
        <source src="assets/daybackground.mp4" type="video/mp4">
    </video>
    <div class="bg-overlay"></div> 

    <!-- Bouton de retour au Hub -->
    <a href="../index.html" class="btn-hub">⬅ Retour au Hub</a>

    <!-- Bouton Paramètres -->
    <div class="settings-btn-wrapper" onmouseenter="startSettingsAnim()" onmouseleave="stopSettingsAnim()" onclick="clickSettingsAnim()">
        <img src="../img/setting.png" alt="Paramètres" id="settings-btn-img" class="settings-btn">
    </div>

    <!-- Modal des Paramètres -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <h2>Paramètres</h2>
            <div class="setting-item">
                <span>Mode Sombre / Nuit 🌙</span>
                <label class="switch">
                    <input type="checkbox" id="theme-toggle" onchange="toggleTheme()">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="setting-item">
                <span>Plein Écran 🖥️</span>
                <label class="switch">
                    <input type="checkbox" id="fs-toggle" onchange="toggleFullscreen()">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="setting-item">
                <span>Musique (ON/OFF) 🎵</span>
                <label class="switch">
                    <input type="checkbox" id="music-toggle" onchange="toggleMusic()">
                    <span class="slider"></span>
                </label>
            </div>
            <button onclick="toggleSettings()" class="close-btn">Fermer</button>
        </div>
    </div>

    <!-- Interface Scores -->
    <div id="game-ui">
        <h1>Fuslime 2</h1>
        <div class="scores-wrapper">
            <div class="score-container">Score: <span id="score">0</span></div>
            <div class="best-score-container">Best: <span id="best-score">0</span></div>
        </div>
    </div>
    
    <!-- Zone de jeu -->
    <div id="game-container">
        <canvas id="game-canvas" width="600" height="800"></canvas>
        <div id="effects-container"></div>
    </div>

    <!-- Écran de Game Over -->
    <div id="game-over" class="hidden">
        <h2>Le seau déborde !</h2>
        <button onclick="location.reload()">Rejouer</button>
    </div>

    <!-- Lecteur YouTube invisible -->
    <div id="youtube-audio"></div>

    <script src="game.js"></script>
</body>
</html>
