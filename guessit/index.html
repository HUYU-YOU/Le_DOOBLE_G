<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Manga - Survie</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }

        #game-container {
            background-color: #1e1e2e;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px rgba(138, 43, 226, 0.4);
            max-width: 700px; width: 100%;
            margin-top: 2vh;
            border: 2px solid #8a2be2;
            transition: transform 0.1s;
        }

        /* L'effet de tremblement quand on perd une vie */
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
            40%, 60% { transform: translate3d(8px, 0, 0); }
        }

        h1 {
            color: #ff69b4; text-transform: uppercase; letter-spacing: 4px;
            font-size: 2.5em; margin-top: 0; text-align: center;
            text-shadow: 3px 3px 0px #8a2be2;
        }

        .top-bar {
            display: flex; justify-content: space-between; font-size: 1.3em;
            font-weight: bold; margin-bottom: 20px; background: rgba(0,0,0,0.4);
            padding: 15px 20px; border-radius: 10px; border-bottom: 2px solid #333;
        }

        .lives { color: #ff4757; letter-spacing: 3px; text-shadow: 0 0 10px #ff4757;}
        .score-info { color: #2ed573; text-shadow: 0 0 10px #2ed573;}
        .combo { color: #ffa502; font-size: 0.9em; margin-left: 10px; transition: 0.2s; display: inline-block; text-shadow: 0 0 10px #ffa502;}
        .combo-active { transform: scale(1.5) rotate(-10deg); color: #ff6348;}

        /* La barre de temps */
        #timer-container { width: 100%; height: 20px; background-color: #2f3542; border-radius: 10px; margin-bottom: 25px; overflow: hidden; border: 2px solid #000; box-shadow: inset 0 0 10px black;}
        #timer-bar { height: 100%; width: 100%; background-color: #2ed573; transition: width 0.1s linear, background-color 0.3s;}

        #question-area {
            font-size: 1.6em; font-weight: bold; text-align: center;
            min-height: 120px; display: flex; align-items: center; justify-content: center;
            background: #2f3542; border-radius: 10px; padding: 20px; margin-bottom: 25px;
            border-left: 6px solid #ff69b4; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        /* Si tu remplaces une question par une image ( <img src="X"> ) */
        #question-area img { max-width: 100%; max-height: 300px; border-radius: 10px; border: 2px solid #fff;}

        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        button.option-btn {
            background-color: #3742fa; color: white; border: none; padding: 20px;
            font-size: 1.2em; font-weight: bold; border-radius: 10px; cursor: pointer;
            transition: 0.2s; box-shadow: 0 6px 0 #1e90ff; text-transform: uppercase;
        }

        button.option-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 0 #1e90ff; filter: brightness(1.2);}
        button.option-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #1e90ff; }
        
        button.option-btn:disabled { opacity: 0.8; cursor: not-allowed; }

        .correct { background-color: #2ed573 !important; box-shadow: 0 6px 0 #2bad60 !important; color: black !important; }
        .wrong { background-color: #ff4757 !important; box-shadow: 0 6px 0 #ff1e33 !important; }

        #start-screen, #end-screen { text-align: center; }
        .btn-main { background-color: #ff69b4; color: white; border: none; padding: 15px 40px; font-size: 1.5em; font-weight: bold; border-radius: 50px; cursor: pointer; text-transform: uppercase; box-shadow: 0 5px 15px rgba(255, 105, 180, 0.4); transition: 0.3s; margin-top: 20px;}
        .btn-main:hover { transform: scale(1.05); background-color: #ff1493; }

        .hub-link { color: #747d8c; text-decoration: none; display: inline-block; margin-top: 30px; font-weight: bold; font-size: 1.2em; transition: 0.2s;}
        .hub-link:hover { color: white; }
    </style>
</head>
<body>

    <div id="game-container">
        <h1>GUESS THE MANGA</h1>

        <!-- ECRAN D'ACCUEIL -->
        <div id="start-screen">
            <p style="font-size: 1.3em; color: #ced6e0; line-height: 1.6;">
                <b>Mode Survie Activé.</b><br>
                Enchaînez les bonnes réponses le plus vite possible pour faire exploser le <b>Combo</b>.<br>
                <span style="color: #ff4757;">3 erreurs et la partie est terminée.</span>
            </p>
            <button class="btn-main" onclick="startGame()">▶ Lancer la Partie</button><br>
            <a href="../index.html" class="hub-link">⬅ Retour au Menu Principal</a>
        </div>

        <!-- ECRAN DE JEU -->
        <div id="game-screen" style="display: none;">
            <div class="top-bar">
                <div class="lives" id="lives-display">❤️❤️❤️</div>
                <div class="score-info">
                    Score: <span id="current-score" style="color: white;">0</span>
                    <span class="combo" id="combo-display">x1</span>
                </div>
            </div>

            <div id="timer-container"><div id="timer-bar"></div></div>

            <div id="question-area"></div>
            
            <div class="options-grid" id="options-area"></div>
        </div>

        <!-- ECRAN DE FIN -->
        <div id="end-screen" style="display: none;">
            <h2 style="font-size: 3.5em; color: #ff4757; margin-bottom: 10px; text-shadow: 2px 2px 0px #000;">GAME OVER</h2>
            <p style="font-size: 1.8em;">Score Final : <br><strong id="final-score" style="color: #2ed573; font-size: 1.5em; text-shadow: 0 0 10px #2ed573;">0</strong></p>
            <button class="btn-main" onclick="location.reload()">🔄 Rejouer</button><br>
            <a href="../index.html" class="hub-link">⬅ Retour au Menu Principal</a>
        </div>
    </div>

    <script>
        // Ta base de données ! Tu peux ajouter des "<img src='image.jpg'>" à la place du texte !
        const questionsData = [
            { q: "Quel manga met en scène un carnet capable de tuer ?", options: ["Bleach", "Death Note", "Naruto", "Tokyo Ghoul"], correct: 1 },
            { q: "Je veux devenir le roi des pirates !", options: ["One Piece", "Fairy Tail", "Hunter x Hunter", "Dragon Ball"], correct: 0 },
            { q: "Dans quel univers trouve-t-on le Bataillon d'Exploration ?", options: ["Sword Art Online", "Demon Slayer", "L'Attaque des Titans", "My Hero Academia"], correct: 2 },
            { q: "Quel manga a pour héros Izuku Midoriya ?", options: ["Jujutsu Kaisen", "Black Clover", "Blue Lock", "My Hero Academia"], correct: 3 },
            { q: "Qui cherche à retrouver le corps de son frère Alphonse ?", options: ["Edward Elric", "Gintoki", "Tanjiro", "Shinra"], correct: 0 },
            { q: "Quel est le nom de l'attaque signature de Goku ?", options: ["Rasengan", "Getsuga Tensho", "Kamehameha", "Gomu Gomu no Pistol"], correct: 2 },
            { q: "Dans quel manga joue-t-on au volley-ball ?", options: ["Kuroko no Basket", "Blue Lock", "Haikyuu!!", "Slam Dunk"], correct: 2 }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let lives = 3;
        let combo = 1;
        let timeLeft = 100; 
        let timerInterval;
        let isAnswering = false;

        const startScreen = document.getElementById('start-screen');
        const gameScreen = document.getElementById('game-screen');
        const endScreen = document.getElementById('end-screen');
        const questionArea = document.getElementById('question-area');
        const optionsArea = document.getElementById('options-area');
        const timerBar = document.getElementById('timer-bar');
        const container = document.getElementById('game-container');

        function startGame() {
            startScreen.style.display = 'none';
            gameScreen.style.display = 'block';
            questionsData.sort(() => Math.random() - 0.5); // Mélange l'ordre des questions
            loadQuestion();
        }

        function updateHUD() {
            document.getElementById('current-score').innerText = score;
            const comboEl = document.getElementById('combo-display');
            comboEl.innerText = `x${combo}`;
            
            let hearts = "";
            for(let i=0; i<3; i++) hearts += i < lives ? "❤️" : "🖤";
            document.getElementById('lives-display').innerText = hearts;
        }

        function loadQuestion() {
            isAnswering = false;
            timeLeft = 100;
            updateHUD();
            
            const q = questionsData[currentQuestionIndex];
            questionArea.innerHTML = q.q; 
            
            optionsArea.innerHTML = "";
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(index, btn);
                optionsArea.appendChild(btn);
            });

            startTimer();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerBar.style.width = "100%";
            timerBar.style.backgroundColor = "#2ed573";

            timerInterval = setInterval(() => {
                timeLeft -= 0.6; // Vitesse d'écoulement du temps
                timerBar.style.width = Math.max(0, timeLeft) + "%";

                if(timeLeft <= 50) timerBar.style.backgroundColor = "#ffa502";
                if(timeLeft <= 25) timerBar.style.backgroundColor = "#ff4757";

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    checkAnswer(-1, null); // -1 = Temps écoulé
                }
            }, 50);
        }

        function checkAnswer(selectedIndex, buttonClicked) {
            if (isAnswering) return;
            isAnswering = true;
            clearInterval(timerInterval);

            const q = questionsData[currentQuestionIndex];
            const buttons = optionsArea.querySelectorAll('.option-btn');

            // Désactiver les boutons
            buttons.forEach(b => b.disabled = true);
            
            // Met en vert la bonne réponse quoiqu'il arrive
            buttons[q.correct].classList.add('correct');

            if (selectedIndex === q.correct) {
                // Bonne réponse ! Bonus selon le temps restant
                const points = Math.floor(100 + (timeLeft * 2)) * combo;
                score += points;
                combo++;
                
                // Animation du Combo
                const comboEl = document.getElementById('combo-display');
                comboEl.classList.add('combo-active');
                setTimeout(() => comboEl.classList.remove('combo-active'), 300);
                
                setTimeout(nextQuestion, 1200);
            } else {
                // Mauvaise réponse ou temps écoulé
                if (buttonClicked) buttonClicked.classList.add('wrong');
                lives--;
                combo = 1; 
                
                // L'écran tremble !
                container.classList.add('shake');
                setTimeout(() => container.classList.remove('shake'), 400);

                updateHUD();
                
                if (lives <= 0) setTimeout(endGame, 1500);
                else setTimeout(nextQuestion, 1500);
            }
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questionsData.length) {
                loadQuestion();
            } else {
                endGame(); // Si on a fait toutes les questions
            }
        }

        function endGame() {
            gameScreen.style.display = 'none';
            endScreen.style.display = 'block';
            document.getElementById('final-score').innerText = score;
        }
    </script>
</body>
</html>
