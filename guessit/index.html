<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Manga - Dylan</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ff9f43; /* Couleur un peu manga/shonen */
            color: #222;
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        #game-container {
            background-color: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            max-width: 600px;
            width: 100%;
            border: 4px solid #ee5253;
        }

        h1 { margin-top: 0; color: #ee5253; text-transform: uppercase; letter-spacing: 2px;}

        /* Ecrans du jeu */
        #game-screen, #end-screen { display: none; }

        /* Le Timer */
        #timer {
            font-size: 24px;
            font-weight: bold;
            color: #ee5253;
            margin: 15px 0;
        }

        /* La zone de la question ou de l'image */
        #question-area {
            font-size: 22px;
            font-weight: bold;
            margin: 20px 0;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Si tu mets une image plus tard, elle aura cette taille */
        #question-area img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 10px;
        }

        /* Boutons de réponses */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        button {
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: 2px solid #222;
            background-color: #f1f2f6;
            border-radius: 8px;
            transition: 0.2s;
        }

        button:hover { background-color: #dfe4ea; transform: scale(1.05); }
        .btn-start { background-color: #10ac84; color: white; border: none; font-size: 20px; padding: 15px 30px; margin-top: 20px;}
        .btn-start:hover { background-color: #01a3a4; }

        .correct { background-color: #1dd1a1 !important; color: white; border-color: #1dd1a1; }
        .wrong { background-color: #ff6b6b !important; color: white; border-color: #ff6b6b; }

        #score-display { font-size: 18px; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="game-container">
        <h1>Guess the Manga</h1>

        <!-- ECRAN D'ACCUEIL -->
        <div id="start-screen">
            <p>Bienvenue dans le défi de Dylan !<br>Tu as 10 secondes par question pour trouver le bon manga.</p>
            <button class="btn-start" onclick="startGame()">Commencer le Quiz</button>
        </div>

        <!-- ECRAN DE JEU -->
        <div id="game-screen">
            <div id="timer">⏱️ 10</div>
            <div id="question-area">
                <!-- La question ou l'image apparaitra ici -->
            </div>
            <div class="options-grid" id="options-area">
                <!-- Les 4 boutons apparaitront ici -->
            </div>
            <div id="score-display">Score : <span id="current-score">0</span></div>
        </div>

        <!-- ECRAN DE FIN -->
        <div id="end-screen">
            <h2>Partie terminée !</h2>
            <p>Ton score final est de : <strong id="final-score">0</strong></p>
            <button class="btn-start" onclick="location.reload()">Rejouer</button>
            <br><br>
            <!-- Lien pour retourner au hub (à adapter quand ton hub existera) -->
            <a href="../index.html" style="color: #555; text-decoration: none; font-weight: bold;">⬅ Retour au menu principal</a>
        </div>
    </div>

    <script>
        // --- BASE DE DONNÉES DES QUESTIONS ---
        // Tu peux ajouter autant de questions que tu veux ici !
        // Pour utiliser une image au lieu du texte, remplace le texte par : "<img src='chemin/vers/image.jpg'>"
        const questionsData = [
            {
                question: "Quel manga met en scène un carnet capable de tuer la personne dont on y inscrit le nom ?",
                options: ["Bleach", "Death Note", "Naruto", "Tokyo Ghoul"],
                correct: 1 // L'index de la bonne réponse (commence à 0, donc ici 1 = Death Note)
            },
            {
                question: "Je veux devenir le roi des pirates !",
                options: ["One Piece", "Fairy Tail", "Hunter x Hunter", "Dragon Ball"],
                correct: 0
            },
            {
                question: "Dans quel univers trouve-t-on le Bataillon d'Exploration ?",
                options: ["Sword Art Online", "Demon Slayer", "L'Attaque des Titans", "My Hero Academia"],
                correct: 2
            },
            {
                question: "Quel manga a pour héros Izuku Midoriya ?",
                options: ["Jujutsu Kaisen", "Black Clover", "Blue Lock", "My Hero Academia"],
                correct: 3
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let timeLeft = 10;
        let timerInterval;
        let isAnswering = false; // Empêche de cliquer plusieurs fois

        // Récupération des éléments HTML
        const startScreen = document.getElementById('start-screen');
        const gameScreen = document.getElementById('game-screen');
        const endScreen = document.getElementById('end-screen');
        const questionArea = document.getElementById('question-area');
        const optionsArea = document.getElementById('options-area');
        const timerDisplay = document.getElementById('timer');
        const currentScoreDisplay = document.getElementById('current-score');
        const finalScoreDisplay = document.getElementById('final-score');

        // Lancement du jeu
        function startGame() {
            startScreen.style.display = 'none';
            gameScreen.style.display = 'block';
            currentQuestionIndex = 0;
            score = 0;
            currentScoreDisplay.innerText = score;
            
            // Mélange l'ordre des questions (Optionnel mais sympa)
            questionsData.sort(() => Math.random() - 0.5);
            
            loadQuestion();
        }

        // Charger une question
        function loadQuestion() {
            isAnswering = false;
            timeLeft = 10;
            timerDisplay.innerText = `⏱️ ${timeLeft}`;
            
            const currentQuestion = questionsData[currentQuestionIndex];
            questionArea.innerHTML = currentQuestion.question;
            
            optionsArea.innerHTML = ""; // On vide les anciens boutons
            
            // Créer les 4 boutons
            currentQuestion.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.innerText = option;
                btn.onclick = () => checkAnswer(index, btn);
                optionsArea.appendChild(btn);
            });

            // Lancer le chronomètre
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.innerText = `⏱️ ${timeLeft}`;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    checkAnswer(-1, null); // -1 car temps écoulé
                }
            }, 1000);
        }

        // Vérifier la réponse
        function checkAnswer(selectedIndex, buttonClicked) {
            if (isAnswering) return; // Bloque les clics supplémentaires
            isAnswering = true;
            clearInterval(timerInterval);

            const currentQuestion = questionsData[currentQuestionIndex];
            const buttons = optionsArea.querySelectorAll('button');

            // Afficher la bonne réponse en vert
            buttons[currentQuestion.correct].classList.add('correct');

            if (selectedIndex === currentQuestion.correct) {
                // Bonne réponse
                score += 100 + (timeLeft * 10); // Bonus de temps
                currentScoreDisplay.innerText = score;
            } else if (buttonClicked !== null) {
                // Mauvaise réponse (mettre en rouge le bouton cliqué)
                buttonClicked.classList.add('wrong');
            }

            // Passer à la question suivante après 1.5 seconde
            setTimeout(() => {
                currentQuestionIndex++;
                if (currentQuestionIndex < questionsData.length) {
                    loadQuestion();
                } else {
                    endGame();
                }
            }, 1500);
        }

        // Fin de la partie
        function endGame() {
            gameScreen.style.display = 'none';
            endScreen.style.display = 'block';
            finalScoreDisplay.innerText = score;
        }
    </script>
</body>
</html>
