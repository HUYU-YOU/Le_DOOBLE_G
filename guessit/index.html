<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guest it - Survival</title>
    <!-- Styles externes -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- BOUTONS FLOTTANTS HORS DU CONTAINER -->
    <a href="../index.html" class="hub-link">
        <img id="hub-img" src="Le_DOOBLE_G/img/retourhub.png" alt="Retour au Hub">
    </a>

    <!-- SELECTEUR DE LANGUE -->
    <div id="lang-toggle-wrapper">
        <button onclick="setLanguage('fr')" id="btn-fr" class="lang-btn active">FR</button>
        <button onclick="setLanguage('en')" id="btn-en" class="lang-btn">EN</button>
    </div>

    <div class="settings-btn-wrapper" onmouseenter="startSettingsAnim()" onmouseleave="stopSettingsAnim()" onclick="clickSettingsAnim()">
        <div class="orbit-container"><div class="orbit-slime"></div></div>
        <img src="../img/setting.png" alt="Paramètres" id="settings-btn-img" class="settings-btn">
    </div>

    <!-- MODAL PARAMETRES -->
    <div id="settings-modal">
        <div class="settings-content">
            <h2 data-i18n="settingsTitle" style="margin-top: 0; color: var(--cyan); text-transform: uppercase; letter-spacing: 2px;">Paramètres</h2>
            <div class="setting-item" style="flex-direction: column; gap: 15px; margin-bottom: 30px;">
                <span data-i18n="screenFormat">Format de l'Écran 🖥️</span>
                <div class="size-options">
                    <button id="btn-sz-classic" class="btn-size" onclick="setGameSize('classic')" data-i18n="btnClassic">Classique</button>
                    <button id="btn-sz-wide" class="btn-size active" onclick="setGameSize('wide')" data-i18n="btnWide">Pleine Page</button>
                    <button id="btn-sz-full" class="btn-size" onclick="setGameSize('full')" data-i18n="btnFull">Plein Écran</button>
                </div>
            </div>
            <button onclick="toggleSettings()" class="close-btn" data-i18n="btnClose">Fermer</button>
        </div>
    </div>

    <!-- JEU -->
    <div id="game-container" class="size-wide">
        <h1>GUEST IT SURVIVAL</h1>
        
        <!-- ÉCRAN D'ACCUEIL -->
        <div id="start-screen">
            <h2 class="title-slime" style="color: var(--cyan); text-shadow: 0 0 10px var(--cyan); margin-bottom: 20px; text-align: center; font-size: 2.5em;">
                <span data-i18n="bestScore">🏆 MEILLEUR SCORE : </span><span id="best-score-display">0</span>
            </h2>
            <p data-i18n="modeText" style="font-size: 1.5em; color: #a9a9b3; line-height: 1.8; margin-bottom: 30px; text-align: center;">
                Mode <span style="color: var(--cyan);">VISUEL</span>.<br>
                L'image est floue ! Devinez vite pour faire exploser le <b style="color: #f1c40f;">COMBO</b>.<br>
            </p>
            <div style="text-align: center;">
                <button class="btn-main" onclick="startGame()" data-i18n="initBtn">Initier la séquence</button>
            </div>
        </div>

        <!-- ÉCRAN DE JEU -->
        <div id="game-screen" style="display: none;">
            <div class="top-bar">
                <div class="lives" id="lives-display">❤️❤️❤️</div>
                <div class="score-info"><span id="score-label-text">SCORE: </span><span id="current-score" style="color: white;">0</span> <span class="combo" id="combo-display">x1</span></div>
            </div>
            <div id="timer-container"><div id="timer-bar"></div></div>
            
            <div id="question-area">
                <img id="manga-image" src="" alt="Manga Image">
                
                <!-- LE SLIME ANIMÉ QUI CACHE L'IMAGE -->
                <div id="slime-overlay">
                    <img id="slime-anim-img" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="">
                </div>
            </div>
            
            <div class="options-grid" id="options-area"></div>
        </div>

        <!-- ÉCRAN DE FIN -->
        <div id="end-screen" style="display: none; text-align: center;">
            <h2 class="title-slime" data-i18n="sysFail" style="font-size: 3.5em; color: var(--red); margin-bottom: 10px; text-shadow: 0 0 20px var(--red);">SYSTEM FAILURE</h2>
            <p style="font-size: 1.8em; color: #fff;"><span data-i18n="finalScore">Score Final : </span><strong id="final-score" style="color: var(--cyan);">0</strong></p>
            
            <div id="save-score-section">
                <input type="text" id="player-name-input" placeholder="ENTREZ VOTRE NOM" maxlength="10"><br>
                <button class="btn-main" onclick="saveScore()" data-i18n="saveScoreBtn">Enregistrer Score</button>
            </div>
            
            <div id="leaderboard">
                <h3 class="title-slime" data-i18n="hallOfFame" style="color: var(--cyan); margin-top: 0; text-align: center; font-size: 2em;">🏆 HALL OF FAME 🏆</h3>
                <div id="lb-list"></div>
            </div>
            
            <button class="btn-main" style="background: #333; box-shadow: none;" onclick="location.reload()" data-i18n="replayBtn">Rejouer</button>
        </div>
    </div>

    <!-- Script externe -->
    <script src="script.js"></script>
</body>
</html>
