<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Slimy Stax - Tower Balance</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <a href="../index.html" class="hub-link">⬅ Retour au Hub</a>

    <div class="settings-btn-wrapper" id="settings-btn-wrapper">
        <div class="orbit-container"><div class="orbit-slime"></div></div>
        <img src="../img/setting.png" alt="Paramètres" id="settings-btn-img" class="settings-btn">
    </div>

    <div id="settings-modal">
        <div class="settings-content">
            <h2 style="margin-top: 0; color: var(--p1); text-transform: uppercase; letter-spacing: 2px;">Paramètres</h2>
            <div class="setting-item" style="flex-direction: column; gap: 15px; margin-bottom: 30px;">
                <span>Format de l'Écran 🖥️</span>
                <div class="size-options">
                    <button id="btn-sz-classic" class="btn-size" data-size="classic">Petit</button>
                    <button id="btn-sz-wide" class="btn-size active" data-size="wide">Plein Page</button>
                    <button id="btn-sz-full" class="btn-size" data-size="full">Plein Écran</button>
                </div>
            </div>
            <button id="close-settings-btn" class="close-btn">Fermer</button>
        </div>
    </div>
    
    <div id="game-container" class="size-wide">
        
        <div id="hud">
            <div id="ui-container-center">
                <div class="hud-box" id="combo-box" style="border-color: var(--perfect); opacity: 0; transition: 0.3s;">
                    <div class="hud-title" style="color:var(--perfect)">Combo</div>
                    <div class="hud-val" id="ui-combo" style="color:var(--perfect); text-shadow: 0 0 10px var(--perfect);">x0</div>
                </div>
                <div id="wind-warning" style="opacity: 0; color: white; margin-top: 10px; font-weight: bold; text-shadow: 0 0 10px white; transition: 0.3s;">
                    ⚠️ ATTENTION AU VENT ⚠️
                </div>
            </div>
            
            <div id="ui-container-left">
                <div class="hud-box">
                    <div class="hud-title">Hauteur</div>
                    <div class="hud-val" id="ui-height">1</div>
                </div>
            </div>

            <div id="ui-container-right">
                <div class="hud-box" style="border-color: var(--p2);">
                    <div class="hud-title" style="color:var(--p2)">Score</div>
                    <div class="hud-val" id="ui-score" style="text-shadow: 0 0 10px var(--p2);">0</div>
                    <div style="font-size: 0.85em; color: var(--gold); margin-top: 5px; font-weight: bold; text-transform: uppercase;">
                        Best: <span id="ui-best">0</span>
                    </div>
                </div>
            </div>
        </div>

        <canvas id="gameCanvas" width="500" height="700"></canvas>

        <div class="overlay" id="game-over" style="display: none;">
            <h2 id="end-message" style="font-size: 4em; margin-bottom: 10px; color: var(--p2); text-shadow: 0 0 20px var(--p2); text-transform: uppercase;">TOUR EFFONDRÉE</h2>
            <p style="font-size: 1.8em; color: #fff; margin-bottom: 10px;">Score Final : <span id="final-score" style="color:var(--gold)">0</span></p>
            <p style="font-size: 1.2em; color: #aaa; margin-bottom: 30px;">Hauteur atteinte : <span id="final-height">0</span> blocs</p>
            <button class="btn-main" id="btn-replay">Rejouer</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
