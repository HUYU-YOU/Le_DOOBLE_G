    <script>
        // Dès que la page est chargée, on tire au sort la cinématique de Slime Dash
        document.addEventListener("DOMContentLoaded", () => {
            const dashVideo = document.getElementById("dash-video");
            if (dashVideo) {
                // Tire au sort 1 ou 2
                const randomNum = Math.floor(Math.random() * 2) + 1;
                // Assigne la source en fonction du tirage
                dashVideo.src = `slimedash/img/cinematic_dash${randomNum}.mp4`;
            }
        });

        function playVid(card) {
            let vid = card.querySelector('.bg-video');
            if(vid) vid.play();
        }

        function pauseVid(card) {
            let vid = card.querySelector('.bg-video');
            if(vid) {
                vid.pause();
                vid.currentTime = 0; 
            }
        }
    </script>
