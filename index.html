<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade du Bureau</title>

    <link rel="stylesheet" href="style.css">
    
    <style>
        /* --- STYLE DE LA VIDEO DE FOND --- */
        body {
            background-color: transparent !important;
            background-image: none !important;
        }

        .hub-bg-video {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh; 
            object-fit: cover; z-index: -2; pointer-events: none; 
        }

        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 0%, rgba(31, 40, 51, 0.5) 0%, rgba(11, 12, 16, 0.85) 80%);
            z-index: -1; pointer-events: none;
        }

        /* --- LOGO DU HUB --- */
        .hub-logo {
            max-width: 90%; width: 500px; height: auto; margin-bottom: 0px; 
            filter: drop-shadow(0 0 20px rgba(102, 252, 241, 0.6)); display: block; margin: 0 auto;
        }

        /* --- BOUTONS IMAGES (ONGLETS) --- */
        .toggle-container {
            display: flex; justify-content: center; gap: 40px; margin: 15px 0 30px 0; align-items: center;
        }
        .toggle-img-btn {
            width: 200px; height: auto; cursor: pointer; opacity: 0.4; filter: grayscale(80%); 
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .toggle-img-btn:hover { opacity: 0.8; filter: grayscale(0%); transform: scale(1.05); }
        .toggle-img-btn.active { opacity: 1; filter: grayscale(0%) drop-shadow(0 0 15px var(--cyan, #00e5ff)); transform: scale(1.1); }

        /* --- NOUVEAU: CONTENEUR CAROUSEL (STYLE NETFLIX) --- */
        .carousel-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 60px; /* Place pour les flèches */
            box-sizing: border-box;
        }

        /* Flèches de navigation */
        .nav-btn {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #00e5ff; /* Cyan néon par défaut */
            color: white;
            font-size: 2rem;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            z-index: 10;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
        }
        .nav-btn:hover {
            background: #00e5ff;
            color: black;
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.8);
        }
        .prev-btn { left: 5px; }
        .next-btn { right: 5px; }

        /* --- NOUVEAU: GRILLE 3x2 --- */
        .game-grid {
            display: grid !important;
            grid-template-columns: repeat(3, 1fr) !important;
            /* La hauteur s'adapte automatiquement grâce à l'aspect-ratio des cartes */
            gap: 25px !important;
            width: 100%;
        }

        /* --- STYLE DES CARTES --- */
        .game-card {
            position: relative;
            overflow: hidden;
            aspect-ratio: 16 / 9; /* Format rectangulaire parfait */
            display: flex; align-items: center; justify-content: center;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
        }
        /* Animation d'apparition quand on change de page */
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.25, 0.8, 0.25, 1) forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .game-card:hover {
            transform: scale(1.05); /* Léger pop de toute la carte */
            box-shadow: 0 10px 30px rgba(0, 229, 255, 0.3);
            border: 1px solid rgba(0, 229, 255, 0.5);
        }

        .game-icon {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            font-size: 4rem;
            z-index: 2;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .game-logo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: inherit;
        }

        .game-card:hover .game-icon {
            opacity: 0;
            transform: scale(1.1);
        }

        .hidden { display: none !important; }
    </style>
</head>

    <script>
        // --- VARIABLES DE PAGINATION ---
        const ITEMS_PER_PAGE = 6;
        let activeCategory = 'solo';
        let currentPage = { solo: 0, multi: 0 };

        // --- GESTION DE LA PAGINATION ---
        function updatePagination() {
            const grid = document.getElementById(`grid-${activeCategory}`);
            const cards = grid.querySelectorAll('.game-card');
            const totalPages = Math.ceil(cards.length / ITEMS_PER_PAGE);

            // Parcourt toutes les cartes de la catégorie active
            cards.forEach((card, index) => {
                const startIndex = currentPage[activeCategory] * ITEMS_PER_PAGE;
                const endIndex = startIndex + ITEMS_PER_PAGE;

                if (index >= startIndex && index < endIndex) {
                    card.style.display = 'flex';
                    // Relance l'animation d'apparition
                    card.classList.remove('fade-in');
                    void card.offsetWidth; // Trigger reflow
                    card.classList.add('fade-in');
                } else {
                    card.style.display = 'none';
                }
            });

            // Affiche ou cache les flèches
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');

            if (currentPage[activeCategory] > 0) {
                prevBtn.style.visibility = 'visible';
                prevBtn.style.opacity = '1';
            } else {
                prevBtn.style.visibility = 'hidden';
                prevBtn.style.opacity = '0';
            }

            if (currentPage[activeCategory] < totalPages - 1) {
                nextBtn.style.visibility = 'visible';
                nextBtn.style.opacity = '1';
            } else {
                nextBtn.style.visibility = 'hidden';
                nextBtn.style.opacity = '0';
            }
        }

        function nextPage() {
            const grid = document.getElementById(`grid-${activeCategory}`);
            const cards = grid.querySelectorAll('.game-card');
            const totalPages = Math.ceil(cards.length / ITEMS_PER_PAGE);

            if (currentPage[activeCategory] < totalPages - 1) {
                currentPage[activeCategory]++;
                updatePagination();
            }
        }

        function prevPage() {
            if (currentPage[activeCategory] > 0) {
                currentPage[activeCategory]--;
                updatePagination();
            }
        }

        // --- GESTION DES ONGLETS IMAGES SOLO / MULTI ---
        function switchCategory(category) {
            const gridSolo = document.getElementById('grid-solo');
            const gridMulti = document.getElementById('grid-multi');
            const btnSolo = document.getElementById('btn-solo');
            const btnMulti = document.getElementById('btn-multi');

            activeCategory = category;

            if (category === 'solo') {
                gridSolo.classList.remove('hidden');
                gridMulti.classList.add('hidden');
                btnSolo.classList.add('active');
                btnMulti.classList.remove('active');
            } else if (category === 'multi') {
                gridMulti.classList.remove('hidden');
                gridSolo.classList.add('hidden');
                btnMulti.classList.add('active');
                btnSolo.classList.remove('active');
            }
            
            // Met à jour la page dès qu'on change d'onglet
            updatePagination();
        }

        // --- INIT & GESTION DES VIDEOS DE HOVER ---
        document.addEventListener("DOMContentLoaded", () => {
            const dashVideo = document.getElementById("dash-video");
            if (dashVideo) {
                const randomNum = Math.floor(Math.random() * 2) + 1;
                dashVideo.src = `slimedash/img/cinematic_dash${randomNum}.mp4`;
            }
            
            // Initialise la pagination au démarrage
            updatePagination();
        });

        function playVid(card) {
            let vid = card.querySelector('.bg-video');
            if(vid) vid.play();
        }

        function pauseVid(card) {
            let vid = card.querySelector('.bg-video');
            if(vid) {
                vid.pause();
                vid.currentTime = 0; 
            }
        }
    </script>
