<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade du Bureau</title>

    <link rel="stylesheet" href="style.css">
    
    <style>
        /* --- RESET GLOBAL ET BLOCAGE STRICT DU SCROLL --- */
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh; /* Prend exactement 100% de l'écran */
            overflow: hidden !important; /* Coupe toute possibilité de scroller */
        }

        /* --- STYLE DE LA PAGE ET DE LA VIDEO DE FOND --- */
        body {
            background-color: transparent !important;
            background-image: none !important;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; 
            padding-top: 2vh; 
            box-sizing: border-box;
        }

        .hub-bg-video {
            position: absolute; 
            top: 0; left: 0; width: 100vw; height: 100vh; 
            object-fit: cover; z-index: -2; pointer-events: none; 
        }

        body::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at 50% 0%, rgba(31, 40, 51, 0.5) 0%, rgba(11, 12, 16, 0.85) 80%);
            z-index: -1; pointer-events: none;
        }

        /* --- LOGO DU HUB (Agrandi précédemment) --- */
        .hub-logo {
            max-width: 90%; 
            width: 505px; 
            max-height: 32vh; 
            object-fit: contain;
            margin: 0; 
            filter: drop-shadow(0 0 20px rgba(102, 252, 241, 0.6)); 
        }

        /* --- BOUTONS IMAGES ONGLETS (Agrandis précédemment) --- */
        .toggle-container {
            display: flex; justify-content: center; gap: 35px; 
            margin: 2vh 0 3vh 0; 
            align-items: center;
        }
        .toggle-img-btn {
            width: 205px; 
            height: auto; cursor: pointer; opacity: 0.4; filter: grayscale(80%); 
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .toggle-img-btn:hover { opacity: 0.8; filter: grayscale(0%); transform: scale(1.05); }
        .toggle-img-btn.active { opacity: 1; filter: grayscale(0%) drop-shadow(0 0 15px var(--cyan, #00e5ff)); transform: scale(1.1); }

        /* --- CONTENEUR GLOBAL CAROUSEL (-10% DE TAILLE ICI) --- */
        .carousel-wrapper {
            display: flex;
            align-items: stretch;
            justify-content: center;
            gap: 15px;
            width: 100%;
            max-width: 945px; /* RÉDUIT DE ~10% (était 1050px) */
            padding: 0 15px;
            box-sizing: border-box;
        }

        /* --- LES BARRES DE NAVIGATION LATÉRALES --- */
        .nav-bar {
            width: 40px; /* Légèrement affiné pour suivre la baisse de 10% */
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 229, 255, 0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            user-select: none; 
        }

        .nav-bar:hover {
            background: rgba(0, 229, 255, 0.15);
            border-color: #00e5ff;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
        }

        .nav-bar:active { transform: scale(0.95); }

        .nav-icon {
            color: #fff; font-size: 1.5rem; font-weight: bold;
            text-shadow: 0 0 10px #00e5ff; transition: transform 0.3s ease;
        }

        .prev-bar:hover .nav-icon { transform: translateX(-3px); }
        .next-bar:hover .nav-icon { transform: translateX(3px); }

        .grid-container {
            flex-grow: 1;
            width: 100%; 
        }

        /* --- GRILLE 3x2 --- */
        .game-grid {
            display: grid !important;
            grid-template-columns: repeat(3, 1fr) !important;
            gap: 18px !important; /* Espacement ajusté pour la réduction */
            width: 100%;
        }

        /* --- STYLE DES CARTES --- */
        .game-card {
            position: relative; overflow: hidden;
            aspect-ratio: 16 / 9;
            display: flex; align-items: center; justify-content: center;
            border-radius: 12px; background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 8px 20px rgba(0,0,0,0.5); transition: transform 0.3s ease;
        }
        
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.25, 0.8, 0.25, 1) forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .game-card:hover {
            transform: scale(1.05); 
            box-shadow: 0 10px 30px rgba(0, 229, 255, 0.3);
            border: 1px solid rgba(0, 229, 255, 0.5);
            z-index: 10; 
        }

        .game-icon {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center; font-size: 4rem;
            z-index: 2; transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .game-logo { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; }
        .bg-video { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; }
        .game-card:hover .game-icon { opacity: 0; transform: scale(1.1); }

        .hidden { display: none !important; }
    </style>
</head>
<body>

                    <div class="game-icon"><img src="img/logoclic.png" class="game-logo" alt="Slime Clicker"></div>
                </a>
                <a href="cybertank/index.html" class="game-card" onmouseenter="playVid(this)" onmouseleave="pauseVid(this)">
                    <video src="cybertank/img/cinematic_tank.mp4" loop muted playsinline class="bg-video"></video>
                    <div class="game-icon"><img src="img/logotank.png" class="game-logo" alt="Cyber Tanks"></div>
                </a>
                <a href="edgeofwar/index.html" class="game-card" onmouseenter="playVid(this)" onmouseleave="pauseVid(this)">

                    <div class="game-icon"><img src="img/guesswarofslime.png" class="game-logo" alt="War of slime"></div>

                    <video src="poker/img/cinematic_poker.mp4" loop muted playsinline class="bg-video"></video>
                    <div class="game-icon">🃏</div>
                </a>

                    <video src="blindtest/img/cinematic_blindtest.mp4" loop muted playsinline class="bg-video"></video>

        </div> <!-- Fin de la grid-container -->
        
        <!-- Barre Latérale Suivant -->
        <div id="next-bar" class="nav-bar next-bar" onclick="nextPage()">
            <span class="nav-icon">❯</span>
        </div>

    </div> <!-- Fin du Wrapper Carousel -->

    <script>
        const ITEMS_PER_PAGE = 6;
        let activeCategory = 'solo';
        let currentPage = { solo: 0, multi: 0 };

        function updatePagination() {
            const grid = document.getElementById(`grid-${activeCategory}`);
            const cards = grid.querySelectorAll('.game-card');
            const totalPages = Math.ceil(cards.length / ITEMS_PER_PAGE);

            cards.forEach((card, index) => {
                const startIndex = currentPage[activeCategory] * ITEMS_PER_PAGE;
                const endIndex = startIndex + ITEMS_PER_PAGE;

                if (index >= startIndex && index < endIndex) {
                    card.style.display = 'flex';
                    card.classList.remove('fade-in');
                    void card.offsetWidth; 
                    card.classList.add('fade-in');
                } else {
                    card.style.display = 'none';
                }
            });

            const prevBar = document.getElementById('prev-bar');
            const nextBar = document.getElementById('next-bar');

            if (currentPage[activeCategory] > 0) {
                prevBar.style.visibility = 'visible';
                prevBar.style.opacity = '1';
                prevBar.style.pointerEvents = 'auto';
            } else {
                prevBar.style.visibility = 'hidden';
                prevBar.style.opacity = '0';
                prevBar.style.pointerEvents = 'none';
            }

            if (currentPage[activeCategory] < totalPages - 1) {
                nextBar.style.visibility = 'visible';
                nextBar.style.opacity = '1';
                nextBar.style.pointerEvents = 'auto';
            } else {
                nextBar.style.visibility = 'hidden';
                nextBar.style.opacity = '0';
                nextBar.style.pointerEvents = 'none';
            }
        }

        function nextPage() {
            const grid = document.getElementById(`grid-${activeCategory}`);
            const cards = grid.querySelectorAll('.game-card');
            const totalPages = Math.ceil(cards.length / ITEMS_PER_PAGE);

            if (currentPage[activeCategory] < totalPages - 1) {
                currentPage[activeCategory]++;
                updatePagination();
            }
        }

        function prevPage() {
            if (currentPage[activeCategory] > 0) {
                currentPage[activeCategory]--;
                updatePagination();
            }
        }

        function switchCategory(category) {
            const gridSolo = document.getElementById('grid-solo');
            const gridMulti = document.getElementById('grid-multi');
            const btnSolo = document.getElementById('btn-solo');
            const btnMulti = document.getElementById('btn-multi');

            activeCategory = category;

            if (category === 'solo') {
                gridSolo.classList.remove('hidden');
                gridMulti.classList.add('hidden');
                btnSolo.classList.add('active');
                btnMulti.classList.remove('active');
            } else if (category === 'multi') {
                gridMulti.classList.remove('hidden');
                gridSolo.classList.add('hidden');
                btnMulti.classList.add('active');
                btnSolo.classList.remove('active');
            }
            
            updatePagination();
        }

        document.addEventListener("DOMContentLoaded", () => {
            const dashVideo = document.getElementById("dash-video");
            if (dashVideo) {
                const randomNum = Math.floor(Math.random() * 2) + 1;
                dashVideo.src = `slimedash/img/cinematic_dash${randomNum}.mp4`;
            }
            updatePagination();
        });

        function playVid(card) {
            let vid = card.querySelector('.bg-video');
            if(vid) vid.play();
        }

        function pauseVid(card) {
            let vid = card.querySelector('.bg-video');
            if(vid) {
                vid.pause();
                vid.currentTime = 0; 
            }
        }
    </script>
</body>
</html>
