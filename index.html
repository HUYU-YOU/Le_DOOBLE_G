<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade du Bureau</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Arcade Network</h1>
    
    <p class="subtitle">Welcome in the Google space</p>
    
    <div class="game-grid">
        
        <a href="poker/index.html" class="game-card" onmouseenter="playVid(this)" onmouseleave="pauseVid(this)">
            <video src="poker/img/cinematic_poker.mp4" loop muted playsinline class="bg-video"></video>
            <div class="game-icon">🃏</div>
            <div class="game-title">Texas Poker</div>
        </a>
    
        <a href="brawl/index.html" class="game-card" onmouseenter="playVid(this)" onmouseleave="pauseVid(this)">
            <video src="brawl/img/cinematic_brawl.mp4" loop muted playsinline class="bg-video"></video>
            <div class="game-icon">🥊🥊</div>
            <div class="game-title">Cyber Smash</div>
        </a>
    
        <a href="edgeofwar/index.html" class="game-card" onmouseenter="playVid(this)" onmouseleave="pauseVid(this)">
            <video src="edgeofwar/img/cinematic_edgeofwar.mp4" loop muted playsinline class="bg-video"></video>
            <div class="game-icon">⚔️</div>
            <div class="game-title">Edge of War</div>
        </a>
    
        <a href="https://huyu-you.github.io/Go-FAST/" target="_blank" class="game-card" onmouseenter="playVid(this)" onmouseleave="pauseVid(this)">
            <video src="img/gofast_cinematic.mp4" loop muted playsinline class="bg-video"></video>
            <div class="game-icon">🏎️</div>
            <div class="game-title">Go-Fast</div>
        </a>
    
        <a href="https://huyu-you.github.io/The-Prisonner/" style="border-color: #FF0000;" target="_blank" class="game-card" onmouseenter="playVid(this)" onmouseleave="pauseVid(this)">
            <video src="img/prisoner_cinematic.mp4" loop muted playsinline class="bg-video"></video>
            <div class="game-icon">⛓️</div>
            <div class="game-title">The Prisoner</div>
        </a>

        <a href="cybertank/index.html" class="game-card" onmouseenter="playVid(this)" onmouseleave="pauseVid(this)">
            <video src="cybertank/img/cinematic_tank.mp4" loop muted playsinline class="bg-video"></video>
            <div class="game-icon">🪖</div>
            <div class="game-title">Cyber Tanks</div>
        </a>
    
        <a href="drawer/index.html" class="game-card" onmouseenter="playVid(this)" onmouseleave="pauseVid(this)">
            <video src="img/drawer_cinematic.mp4" loop muted playsinline class="bg-video"></video>
            <div class="game-icon">🎨</div>
            <div class="game-title">Drawer</div>
        </a>
            
        <a href="tower_defense/index.html" class="game-card" onmouseenter="playVid(this)" onmouseleave="pauseVid(this)">
            <video src="tower_defense/img/cinematic_towerdef.mp4" loop muted playsinline class="bg-video"></video>
            <div class="game-icon">🏰</div>
            <div class="game-title">Tower Defense</div>
        </a>
            
        <a href="guessit/index.html" class="game-card" onmouseenter="playVid(this)" onmouseleave="pauseVid(this)">
            <video src="guessit/img/cinematic_guessit.mp4" loop muted playsinline class="bg-video"></video>
            <div class="game-icon">👁️</div>
            <div class="game-title">Guess The Manga</div>
        </a>
        
        <a href="blindtest/index.html" class="game-card" onmouseenter="playVid(this)" onmouseleave="pauseVid(this)">
            <video src="blindtest/img/cinematic_blindtest.mp4" loop muted playsinline class="bg-video"></video>
            <div class="game-icon">🎧</div>
            <div class="game-title">Blind Test</div>
        </a>
        
        <a href="worms/index.html" class="game-card" onmouseenter="playVid(this)" onmouseleave="pauseVid(this)">
            <video src="worms/img/cinematic_worms.mp4" loop muted playsinline class="bg-video"></video>
            <div class="game-icon">🚀</div>
            <div class="game-title">Cyber Artillery</div>
        </a>
    </div> 

    <script>
  
        function playVid(card) {
            let vid = card.querySelector('.bg-video');
            if(vid) vid.play();
        }

        function pauseVid(card) {
            let vid = card.querySelector('.bg-video');
            if(vid) {
                vid.pause();
                vid.currentTime = 0; 
            }
        }
    </script>
</body>
</html>
