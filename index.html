<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade du Bureau</title>

    <link rel="stylesheet" href="style.css">
    
    <style>
        /* --- RESET GLOBAL ET BLOCAGE STRICT DU SCROLL --- */
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden !important; 
            transition: background-color 0.5s ease;
        }

        /* --- STYLE DE LA PAGE ET DE LA VIDEO DE FOND --- */
        body {
            background-color: transparent !important;
            background-image: none !important;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; 
            padding-top: 2vh; 
            box-sizing: border-box;
        }

        /* La vidéo pure SANS AUCUN FILTRE PAR DESSUS par défaut */
        .hub-bg-video {
            position: absolute; 
            top: 0; left: 0; width: 100vw; height: 100vh; 
            object-fit: cover; z-index: -2; pointer-events: none; 
        }

        /* --- MODE SOMBRE (S'active via les paramètres) --- */
        body.dark-mode::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at 50% 0%, rgba(31, 40, 51, 0.5) 0%, rgba(11, 12, 16, 0.85) 80%);
            z-index: -1; pointer-events: none;
        }
        
        body.dark-mode .game-card {
            background: rgba(0, 0, 0, 0.8);
        }

        /* --- BOUTON PARAMÈTRES (En haut à droite) --- */
        .settings-btn-wrapper {
            position: absolute;
            top: 20px; right: 25px;
            width: 45px; 
            height: 45px;
            cursor: pointer;
            z-index: 100;
        }

        .settings-btn {
            width: 100%; 
            height: 100%;
            object-fit: contain;
            transition: transform 0.2s ease;
            filter: drop-shadow(0 0 10px rgba(0, 229, 255, 0.8));
            position: relative;
            z-index: 2;
        }

        .settings-btn-wrapper:hover .settings-btn { transform: scale(1.15); }

        /* --- BOUTON "+" IMAGE POUR LES AUTRES JEUX (En bas à droite) --- */
        .other-games-btn-wrapper {
            position: absolute;
            bottom: 20px; right: 25px; /* LA CORRECTION EST ICI */
            width: 65px; 
            height: 65px;
            cursor: pointer;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            animation: pulse-plus 2s infinite;
        }

        .other-games-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: all 0.4s ease;
            filter: drop-shadow(0 0 10px rgba(0, 229, 255, 0.5));
        }

        @keyframes pulse-plus {
            0% { filter: drop-shadow(0 0 5px rgba(0, 229, 255, 0.3)); }
            50% { filter: drop-shadow(0 0 15px rgba(0, 229, 255, 0.8)); }
            100% { filter: drop-shadow(0 0 5px rgba(0, 229, 255, 0.3)); }
        }

        .other-games-btn-wrapper:hover {
            transform: scale(1.15);
        }

        /* Quand on a cliqué sur le bouton (il tourne à 45 degrés pour faire un X) */
        .other-games-btn-wrapper.active {
            animation: none;
        }
        
        .other-games-btn-wrapper.active .other-games-img {
            transform: rotate(45deg);
            filter: drop-shadow(0 0 20px #00e5ff) brightness(1.2);
        }

        /* --- MENU MODAL PARAMÈTRES --- */
        #settings-modal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.85); z-index: 999;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
            backdrop-filter: blur(5px);
        }
        #settings-modal.show { opacity: 1; pointer-events: auto; }
        
        .settings-content {
            background: rgba(15, 20, 30, 0.95);
            border: 2px solid #00e5ff; border-radius: 15px;
            padding: 30px 40px; color: white; text-align: center;
            box-shadow: 0 0 30px rgba(0,229,255,0.4);
            min-width: 320px; font-family: sans-serif;
            transition: all 0.3s ease;
        }
        
        .settings-content h2 { margin-top: 0; color: #00e5ff; text-transform: uppercase; letter-spacing: 2px; }

        .setting-item {
            display: flex; justify-content: space-between; align-items: center;
            margin: 25px 0; font-size: 1.2rem; font-weight: bold;
        }

        .switch { position: relative; display: inline-block; width: 54px; height: 28px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #555; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #00e5ff; box-shadow: 0 0 10px #00e5ff; }
        input:checked + .slider:before { transform: translateX(26px); }

        .close-btn {
            margin-top: 15px; background: #00e5ff; color: #000; border: none;
            padding: 10px 25px; font-size: 1.1rem; font-weight: bold;
            border-radius: 8px; cursor: pointer; transition: 0.2s; text-transform: uppercase;
        }
        .close-btn:hover { box-shadow: 0 0 20px #00e5ff; transform: scale(1.05); }

        /* --- LOGO DU HUB --- */
        .hub-logo {
            max-width: 90%; width: 505px; max-height: 32vh; 
            object-fit: contain; margin: 0; 
            filter: drop-shadow(0 0 20px rgba(102, 252, 241, 0.8)); 
        }

        /* --- BOUTONS IMAGES ONGLETS --- */
        .toggle-container {
            display: flex; justify-content: center; gap: 40px; margin: 2vh 0 3vh 0; align-items: center;
        }
        .toggle-img-btn {
            width: 225px; height: auto; cursor: pointer; opacity: 0.4; filter: grayscale(80%); 
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .toggle-img-btn:hover { opacity: 0.8; filter: grayscale(0%); transform: scale(1.05); }
        .toggle-img-btn.active { opacity: 1; filter: grayscale(0%) drop-shadow(0 0 15px var(--cyan, #00e5ff)); transform: scale(1.1); }

        /* --- CONTENEUR GLOBAL CAROUSEL --- */
        .carousel-wrapper {
            display: flex; align-items: stretch; justify-content: center; gap: 15px;
            width: 100%; max-width: 1040px; padding: 0 15px; box-sizing: border-box;
        }

        /* --- LES BARRES DE NAVIGATION LATÉRALES --- */
        .nav-bar {
            width: 45px; background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(0, 229, 255, 0.3);
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.3s ease; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            user-select: none; 
        }
        .nav-bar:hover { background: rgba(0, 229, 255, 0.25); border-color: #00e5ff; box-shadow: 0 0 20px rgba(0, 229, 255, 0.6); }
        .nav-bar:active { transform: scale(0.95); }
        .nav-icon { color: #fff; font-size: 1.5rem; font-weight: bold; text-shadow: 0 0 10px #00e5ff; transition: transform 0.3s ease; }
        .prev-bar:hover .nav-icon { transform: translateX(-3px); }
        .next-bar:hover .nav-icon { transform: translateX(3px); }

        .grid-container { flex-grow: 1; width: 100%; }

        /* --- GRILLE 3x2 --- */
        .game-grid { display: grid !important; grid-template-columns: repeat(3, 1fr) !important; gap: 20px !important; width: 100%; }

        /* --- STYLE DES CARTES --- */
        .game-card {
            position: relative; overflow: hidden; aspect-ratio: 16 / 9;
            display: flex; align-items: center; justify-content: center; border-radius: 12px; 
            background: rgba(0, 0, 0, 0.6); box-shadow: 0 8px 20px rgba(0,0,0,0.5); transition: transform 0.3s ease;
        }
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.25, 0.8, 0.25, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .game-card:hover { transform: scale(1.05); box-shadow: 0 10px 30px rgba(0, 229, 255, 0.5); border: 1px solid rgba(0, 229, 255, 0.6); z-index: 10; }

        .game-icon { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 4rem; z-index: 2; transition: opacity 0.4s ease, transform 0.4s ease; }
        .game-logo { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; }
        .bg-video { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; }
        .game-card:hover .game-icon { opacity: 0; transform: scale(1.1); }
        .hidden { display: none !important; }
    </style>

    <script>
        // --- 1. GESTION DES PARAMETRES ET DU CYCLE D'IMAGES ---
        const settingImages = ['img/setting.png', 'img/settings1.png', 'img/settings2.png', 'img/settings3.png', 'img/settings5.png'];
        let currentSettingIndex = 0;

        function toggleSettings() {
            const modal = document.getElementById('settings-modal');
            modal.classList.toggle('show');

            currentSettingIndex = (currentSettingIndex + 1) % settingImages.length;
            document.getElementById('settings-btn-img').src = settingImages[currentSettingIndex];
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }
        
        document.addEventListener('fullscreenchange', () => {
            document.getElementById('fs-toggle').checked = !!document.fullscreenElement;
        });

        // --- GESTION AUDIO GLOBALE ---
        let ytPlayer;
        let isMuted = localStorage.getItem('isMuted') === 'true';

        // Mise à jour de l'état du switch dans les paramètres au chargement
        document.addEventListener('DOMContentLoaded', () => {
            const musicToggle = document.getElementById('music-toggle');
            if(musicToggle) musicToggle.checked = !isMuted;
        });

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('youtube-audio', {
                height: '0',
                width: '0',
                videoId: '4RaguYU_SQI',
                playerVars: {
                    'autoplay': 1,
                    'controls': 0,
                    'showinfo': 0,
                    'autohide': 1,
                    'loop': 1,
                    'playlist': '4RaguYU_SQI'
                },
                events: {
                    'onReady': (e) => {
                        if (isMuted) e.target.mute();
                        else e.target.unMute();
                    }
                }
            });
        }

        function toggleMusic() {
            isMuted = !document.getElementById('music-toggle').checked;
            localStorage.setItem('isMuted', isMuted);
            
            if (isMuted) {
                if (ytPlayer && ytPlayer.mute) ytPlayer.mute();
            } else {
                if (ytPlayer && ytPlayer.unMute) {
                    ytPlayer.unMute();
                    ytPlayer.playVideo();
                }
            }
        }

        // --- 3. GESTION DU CAROUSEL ET DES CATEGORIES ---
        const ITEMS_PER_PAGE = 6;
        let activeCategory = 'solo';
        let currentPage = { solo: 0, multi: 0, other: 0 };

        function updatePagination() {
            const grid = document.getElementById(`grid-${activeCategory}`);
            const cards = grid.querySelectorAll('.game-card');
            const totalPages = Math.ceil(cards.length / ITEMS_PER_PAGE);

            cards.forEach((card, index) => {
                const startIndex = currentPage[activeCategory] * ITEMS_PER_PAGE;
                const endIndex = startIndex + ITEMS_PER_PAGE;

                if (index >= startIndex && index < endIndex) {
                    card.style.display = 'flex';
                    card.classList.remove('fade-in');
                    void card.offsetWidth; 
                    card.classList.add('fade-in');
                } else {
                    card.style.display = 'none';
                }
            });

            const prevBar = document.getElementById('prev-bar');
            const nextBar = document.getElementById('next-bar');

            if (currentPage[activeCategory] > 0) {
                prevBar.style.visibility = 'visible'; prevBar.style.opacity = '1'; prevBar.style.pointerEvents = 'auto';
            } else {
                prevBar.style.visibility = 'hidden'; prevBar.style.opacity = '0'; prevBar.style.pointerEvents = 'none';
            }

            if (currentPage[activeCategory] < totalPages - 1) {
                nextBar.style.visibility = 'visible'; nextBar.style.opacity = '1'; nextBar.style.pointerEvents = 'auto';
            } else {
                nextBar.style.visibility = 'hidden'; nextBar.style.opacity = '0'; nextBar.style.pointerEvents = 'none';
            }
        }

        function nextPage() {
            const grid = document.getElementById(`grid-${activeCategory}`);
            const cards = grid.querySelectorAll('.game-card');
            const totalPages = Math.ceil(cards.length / ITEMS_PER_PAGE);

            if (currentPage[activeCategory] < totalPages - 1) {
                currentPage[activeCategory]++;
                updatePagination();
            }
        }

        function prevPage() {
            if (currentPage[activeCategory] > 0) {
                currentPage[activeCategory]--;
                updatePagination();
            }
        }

        function switchCategory(category) {
            // Si on clique sur un bouton principal (Solo/Multi), on désactive le mode "Other" (le +)
            if (category !== 'other') {
                document.getElementById('other-games-btn').classList.remove('active');
            }

            const grids = ['solo', 'multi', 'other'];
            const btns = ['btn-solo', 'btn-multi'];

            activeCategory = category;

            // Masque toutes les grilles
            grids.forEach(g => document.getElementById(`grid-${g}`).classList.add('hidden'));
            
            // Grise les boutons du haut
            btns.forEach(b => {
                let btn = document.getElementById(b);
                if (btn) btn.classList.remove('active');
            });

            // Affiche la bonne grille
            document.getElementById(`grid-${category}`).classList.remove('hidden');

            // Active le bon bouton (si c'est solo ou multi)
            if (category === 'solo') document.getElementById('btn-solo').classList.add('active');
            if (category === 'multi') document.getElementById('btn-multi').classList.add('active');
            
            updatePagination();
        }

        function toggleOtherGames() {
            const btn = document.getElementById('other-games-btn');
            if (activeCategory === 'other') {
                // S'il était déjà actif, on le ferme et on retourne au solo
                btn.classList.remove('active');
                switchCategory('solo');
            } else {
                // Sinon on l'active
                btn.classList.add('active');
                switchCategory('other');
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            const dashVideo = document.getElementById("dash-video");
            if (dashVideo) {
                const randomNum = Math.floor(Math.random() * 2) + 1;
                dashVideo.src = `slimedash/img/cinematic_dash${randomNum}.mp4`;
            }
            
            // ANIMATION DES PARAMETRES AU CHARGEMENT (Fix)
            const settingsBtnImg = document.getElementById('settings-btn-img');
            settingsBtnImg.src = 'img/setting.png';
            
            updatePagination();
        });

        // ANIMATION DES PARAMETRES
        let hoverInterval; 
        let currentFrame = 0;
        const animFrames = ['img/settings1.png', 'img/settings2.png', 'img/settings3.png', 'img/settings5.png'];

        function startSettingsAnim() {
            if (hoverInterval) return;
            currentFrame = 0;
            const settingsBtnImg = document.getElementById('settings-btn-img');
            settingsBtnImg.src = animFrames[currentFrame];
            hoverInterval = setInterval(() => {
                currentFrame = (currentFrame + 1) % animFrames.length;
                settingsBtnImg.src = animFrames[currentFrame];
            }, 100); 
        }

        function stopSettingsAnim() {
            clearInterval(hoverInterval); hoverInterval = null;
            const settingsBtnImg = document.getElementById('settings-btn-img');
            if (!settingsBtnImg.src.includes('settings4.png')) { 
                settingsBtnImg.src = 'img/setting.png'; 
            }
        }

        function clickSettingsAnim() {
            clearInterval(hoverInterval); hoverInterval = null;
            const settingsBtnImg = document.getElementById('settings-btn-img');
            settingsBtnImg.src = 'img/settings4.png';
            toggleSettings();
            setTimeout(() => { settingsBtnImg.src = 'img/setting.png'; }, 300);
        }

        // --- 4. GESTION DES VIDEOS AU SURVOL ---
        function playVid(card) {
            let vid = card.querySelector('.bg-video');
            if(vid) vid.play();
        }

        function pauseVid(card) {
            let vid = card.querySelector('.bg-video');
            if(vid) {
                vid.pause();
                vid.currentTime = 0; 
            }
        }
    </script>
</body>
</html>
