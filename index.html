    <link rel="stylesheet" href="style.css">
    
    <style>
        /* --- STYLE DE LA VIDEO DE FOND --- */
        body {
            background-color: transparent !important;
            background-image: none !important;
        }

        .hub-bg-video {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh; 
            object-fit: cover; z-index: -2; pointer-events: none; 
        }

        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 0%, rgba(31, 40, 51, 0.5) 0%, rgba(11, 12, 16, 0.85) 80%);
            z-index: -1; pointer-events: none;
        }

        /* --- LOGO DU HUB --- */
        .hub-logo {
            max-width: 90%; width: 600px; height: auto; margin-bottom: 0px; 
            filter: drop-shadow(0 0 20px rgba(102, 252, 241, 0.6)); display: block; margin: 0 auto;
        }

        /* --- BOUTONS IMAGES (ONGLETS) --- */
        .toggle-container {
            display: flex; justify-content: center; gap: 40px; margin: 15px 0 40px 0; align-items: center;
        }
        .toggle-img-btn {
            width: 220px; height: auto; cursor: pointer; opacity: 0.4; filter: grayscale(80%); 
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .toggle-img-btn:hover { opacity: 0.8; filter: grayscale(0%); transform: scale(1.05); }
        .toggle-img-btn.active { opacity: 1; filter: grayscale(0%) drop-shadow(0 0 15px var(--cyan)); transform: scale(1.1); }

        /* --- NOUVEAU STYLE DES CARTES FULL IMAGE --- */
        .game-card {
            position: relative;
            overflow: hidden;
            /* Force les cartes à garder une belle forme rectangulaire (façon miniature YouTube) même sans texte */
            aspect-ratio: 16 / 9; 
            min-height: 140px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.4); /* Fond de secours */
        }

        .game-icon {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            font-size: 4rem; /* Taille pour les emojis restants */
            z-index: 2; /* Assure que l'image est au-dessus de la vidéo à l'état de repos */
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .game-logo {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Remplit TOUTE la carte sans la déformer */
            /* Si certains PNG sont trop coupés, tu peux essayer de remplacer "cover" par "contain" */
            border-radius: inherit;
        }

        /* ANIMATION MAGIQUE AU SURVOL */
        /* Quand la souris passe sur la carte, l'image disparaît en zoomant pour laisser la cinématique vidéo prendre le relais */
        .game-card:hover .game-icon {
            opacity: 0;
            transform: scale(1.1);
        }

        .hidden { display: none !important; }
    </style>
</head>

    <script>
        function switchCategory(category) {
            const gridSolo = document.getElementById('grid-solo');
            const gridMulti = document.getElementById('grid-multi');
            const btnSolo = document.getElementById('btn-solo');
            const btnMulti = document.getElementById('btn-multi');

            if (category === 'solo') {
                gridSolo.classList.remove('hidden');
                gridMulti.classList.add('hidden');
                btnSolo.classList.add('active');
                btnMulti.classList.remove('active');
            } else if (category === 'multi') {
                gridMulti.classList.remove('hidden');
                gridSolo.classList.add('hidden');
                btnMulti.classList.add('active');
                btnSolo.classList.remove('active');
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            const dashVideo = document.getElementById("dash-video");
            if (dashVideo) {
                const randomNum = Math.floor(Math.random() * 2) + 1;
                dashVideo.src = `slimedash/img/cinematic_dash${randomNum}.mp4`;
            }
        });

        function playVid(card) {
            let vid = card.querySelector('.bg-video');
            if(vid) vid.play();
        }

        function pauseVid(card) {
            let vid = card.querySelector('.bg-video');
            if(vid) {
                vid.pause();
                vid.currentTime = 0; 
            }
        }
    </script>
