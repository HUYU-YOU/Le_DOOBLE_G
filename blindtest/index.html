    <style>
        :root { 
            --bg: #050508; 
            --panel: rgba(15, 18, 28, 0.75); 
            --panel-border: rgba(0, 240, 255, 0.2);
            --p1: #00f0ff; 
            --p2: #ff007f; 
            --sys: #39ff14;
            --gold: #f1c40f;
            --font-main: 'Rajdhani', sans-serif;
        }
        
        body { 
            font-family: var(--font-main); 
            background-color: var(--bg); 
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 240, 255, 0.05), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(255, 0, 127, 0.05), transparent 25%);
            color: #fff; 
            margin: 0; padding: 20px; 
            display: flex; flex-direction: column; align-items: center; 
            min-height: 100vh; overflow-x: hidden; 
        }

        h1 { 
            color: #fff; text-transform: uppercase; letter-spacing: 8px; margin-top: 0; 
            text-shadow: 0 0 15px var(--p1), 0 0 30px var(--p1); 
            text-align: center; font-size: 2.5em; font-weight: 700;
        }
        
        #game-container { 
            position: relative; background: var(--panel); border-radius: 20px; 
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 240, 255, 0.05); 
            padding: 25px; border: 1px solid var(--panel-border); 
            width: 100%; max-width: 800px; height: 680px; 
            display: flex; flex-direction: column; overflow: hidden; 
            backdrop-filter: blur(12px);
        }
        
        .overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(5, 5, 8, 0.92); display: flex; flex-direction: column; 
            align-items: center; justify-content: center; z-index: 10; text-align: center; 
            padding: 20px; box-sizing: border-box; backdrop-filter: blur(8px); 
        }
        
        .menu-title { font-size: 2.5em; font-weight: 700; margin-bottom: 25px; color: #fff; text-transform: uppercase; letter-spacing: 3px; }
        
        /* BOUTONS CYBERPUNK */
        .btn-main { 
            background: rgba(255,255,255,0.05); color: #fff; border: 2px solid #555; 
            padding: 15px 35px; font-size: 1.3em; font-weight: 700; font-family: var(--font-main);
            border-radius: 8px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); margin: 10px; 
            position: relative; overflow: hidden;
        }
        .btn-main::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
        }
        .btn-main:hover::before { left: 100%; }
        .btn-main:hover { transform: translateY(-3px); box-shadow: 0 5px 20px rgba(255,255,255,0.2); border-color: #fff; }
        
        .btn-cyan { border-color: var(--p1); color: var(--p1); background: rgba(0, 240, 255, 0.05); }
        .btn-cyan:hover { background: var(--p1); color: #000; box-shadow: 0 0 20px var(--p1); border-color: var(--p1); }
        
        .btn-pink { border-color: var(--p2); color: var(--p2); background: rgba(255, 0, 127, 0.05); }
        .btn-pink:hover { background: var(--p2); color: #fff; box-shadow: 0 0 20px var(--p2); border-color: var(--p2); }

        .btn-sys { border-color: var(--sys); color: var(--sys); background: rgba(57, 255, 20, 0.05); }
        .btn-sys:hover { background: var(--sys); color: #000; box-shadow: 0 0 20px var(--sys); }
        
        /* HEADER (SCORES MULTIJOUEURS & TEMPS) */
        #game-header { 
            display: flex; justify-content: space-between; align-items: center; 
            background: rgba(0,0,0,0.4); padding: 15px 20px; border-radius: 12px; 
            border: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; 
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        #scores-container { display: flex; gap: 15px; flex-wrap: wrap; flex: 1; justify-content: flex-start; }
        .score-box { 
            font-size: 1.3em; font-weight: 700; padding: 6px 18px; border-radius: 8px; 
            background: rgba(0,0,0,0.6); border: 1px solid; letter-spacing: 1px;
            backdrop-filter: blur(4px);
        }
        #timer-box { 
            font-size: 3em; color: var(--gold); font-weight: 700; 
            text-shadow: 0 0 15px var(--gold); margin-left: 15px; min-width: 60px; text-align: center; 
            line-height: 1;
        }

        /* TRACK INFO HYBRIDE - DESIGN HOLOGRAMME */
        #track-info { display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; align-items: center; width: 100%; }
        
        .mystery-box { 
            width: 90%; background: linear-gradient(135deg, rgba(20,25,40,0.8), rgba(10,12,20,0.9)); 
            padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); 
            font-size: 1.6em; font-weight: 600; text-align: center; letter-spacing: 3px; 
            text-transform: uppercase; transition: all 0.4s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5); position: relative; overflow: hidden;
            color: #888;
        }
        .mystery-box::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            animation: scan 3s infinite linear;
        }
        @keyframes scan { 0% { left: -100%; } 100% { left: 200%; } }

        .mystery-box.found { 
            background: rgba(57, 255, 20, 0.1); border-color: var(--sys); color: var(--sys); 
            text-shadow: 0 0 10px var(--sys); letter-spacing: 2px; transform: scale(1.02);
            box-shadow: 0 0 25px rgba(57, 255, 20, 0.2), inset 0 0 15px rgba(57, 255, 20, 0.1);
        }
        .mystery-box.found::before { display: none; }
        
        /* TCHAT - TERMINAL STYLE */
        #chat-container { 
            flex-grow: 1; background: rgba(5,5,8,0.8); border-radius: 12px; 
            border: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; 
            overflow: hidden; box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }
        #chat-messages { flex-grow: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        
        #chat-input-area { 
            display: flex; background: rgba(20,25,35,0.9); padding: 15px; 
            border-top: 1px solid rgba(0, 240, 255, 0.2); 
        }
        #guess-input { 
            flex-grow: 1; padding: 12px 20px; border-radius: 8px; border: 1px solid #333; 
            background: rgba(0,0,0,0.6); color: #fff; font-size: 1.3em; font-family: var(--font-main);
            outline: none; transition: 0.3s; letter-spacing: 1px;
        }
        #guess-input:focus { border-color: var(--p1); box-shadow: 0 0 15px rgba(0, 240, 255, 0.3); }
        
        #btn-send { 
            background: var(--p1); color: #000; border: none; font-weight: 700; font-family: var(--font-main);
            padding: 0 30px; margin-left: 15px; border-radius: 8px; cursor: pointer; font-size: 1.3em; 
            letter-spacing: 1px; transition: 0.2s; text-transform: uppercase;
        }
        #btn-send:hover { background: #fff; box-shadow: 0 0 20px var(--p1); transform: scale(1.05); }

        .loader { border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid var(--p1); border-radius: 50%; width: 60px; height: 60px; animation: spin 1s linear infinite; margin: 25px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .hub-link { 
            position: absolute; top: 20px; left: 20px; color: rgba(255,255,255,0.6); 
            text-decoration: none; font-weight: 600; font-size: 1.1em; z-index: 1000; 
            background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 8px; 
            border: 1px solid rgba(255,255,255,0.1); transition: 0.3s; backdrop-filter: blur(5px);
        }
        .hub-link:hover { color: #fff; background: rgba(0, 240, 255, 0.2); border-color: var(--p1); box-shadow: 0 0 15px rgba(0, 240, 255, 0.4); }

        /* BULLES DE TCHAT */
        .msg { padding: 10px 15px; border-radius: 10px; max-width: 80%; word-wrap: break-word; font-size: 1.2em; font-weight: 500; backdrop-filter: blur(4px); }
        .msg-sys { 
            background: rgba(57, 255, 20, 0.05); color: var(--sys); align-self: center; 
            border: 1px solid rgba(57, 255, 20, 0.3); font-weight: 700; text-align: center; 
            width: 90%; margin-top: 5px; box-shadow: 0 0 10px rgba(57, 255, 20, 0.1);
        }
        
        .cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 85%; max-width: 600px; margin-top: 20px;}
        @media (max-width: 600px) { .cat-grid { grid-template-columns: 1fr; } }

        </div>

        <!-- CHAT -->

            <div id="chat-messages"></div>
            <div id="chat-input-area">
                <input type="text" id="guess-input" placeholder="Analyse en attente... Tapez ici." autocomplete="off">
                <button id="btn-send" onclick="submitGuess()">ENVOYER</button>
            </div>
        </div>

        <!-- MENU PRINCIPAL -->

            <button class="btn-main btn-pink" onclick="openMenu('network')">Multijoueur (Réseau)</button>
        </div>

            <div style="background: rgba(0,0,0,0.7); padding: 30px; border-radius: 15px; border: 1px solid var(--p1); width: 340px; margin-bottom: 20px; text-align: center; box-shadow: 0 0 20px rgba(0, 240, 255, 0.1);">

            </div>

            <div style="background: rgba(0,0,0,0.7); padding: 30px; border-radius: 15px; border: 1px solid var(--p2); width: 340px; text-align: center; box-shadow: 0 0 20px rgba(255, 0, 127, 0.1);">
                <h3 style="color: #fff; margin-top: 0; font-size: 1.4em; font-weight: 700;">REJOINDRE UN SALON</h3>
                <input type="text" id="join-id" placeholder="Code de l'hôte..." style="padding: 15px; font-size: 1.4em; border-radius: 8px; border: 1px solid #444; background: #111; color: #fff; outline:none; text-align:center; width: 100%; box-sizing: border-box; text-transform: uppercase; font-family: var(--font-main); font-weight: 700;">
                <button class="btn-main btn-pink" onclick="joinGame()" style="width: 100%; padding: 15px; font-size: 1.1em; margin-top: 20px;">Rejoindre</button>
            </div>
            
            <div id="conn-status" style="margin-top: 25px; font-weight: 700; font-size: 1.2em; transition: 0.3s; text-align: center;"></div>
            <button class="btn-main" style="font-size:1em; margin-top:30px; border-color: #444; color:#888;" onclick="location.reload()">Retour au Menu</button>
        </div>

        <!-- MENU CATÉGORIE -->
        <div class="overlay" id="category-menu" style="display: none;">
            <div class="menu-title" style="color:var(--sys); text-shadow: 0 0 15px var(--sys);">SÉLECTION DE LA PLAYLIST</div>
            <p id="lobby-count" style="color:#0ff; font-weight:700; font-size:1.3em; display:none; margin-bottom: 5px;">1 joueur(s) dans le salon</p>
            
            <div class="cat-grid" id="cat-buttons">
                <button class="btn-main" onclick="launchGame('RAP')" style="border-color: #ff5500; color: #ffaa00;">🎤 RAP</button>
                <button class="btn-main" onclick="launchGame('FR')" style="border-color: #00aaff; color: #88ccff;">🥐 VARIÉTÉ </button>
                <button class="btn-main" onclick="launchGame('POP')" style="border-color: #ff00aa; color: #ff88cc;">🌍 POP INTERNATIONALE</button>
                <button class="btn-main btn-sys" onclick="launchGame('ANIME')">📺 ANIME</button>
                <button class="btn-main" onclick="launchGame('FILMS')" style="border-color: #ffd700; color: #ffeb66; grid-column: 1 / -1;">🎬 MOVIES </button>
            </div>
            
            <div id="loading-api" style="display: none; flex-direction: column; align-items: center;">
                <div class="loader"></div>
                <p style="font-weight:700; color:var(--sys); font-size:1.3em; margin-top: 15px;">Génération des pistes en cours...</p>
            </div>
        </div>

        <!-- ECRAN DE FIN -->
        <div class="overlay" id="end-screen" style="display: none;">

        // --- GESTION RÉSEAU (PEERJS) ---
        function hostGame() { 
            let status = document.getElementById('conn-status');
            status.style.color = "var(--p1)";
            status.innerText = "Création du serveur..."; 
            
            let code = 'BLD' + Math.floor(1000 + Math.random() * 9000);
            
            if (peer) peer.destroy();
            peer = new Peer(code);
            
            peer.on('open', id => {
                document.getElementById('my-id').innerText = id;
                try { if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(id).catch(e=>{}); } catch(e) {}
                
                status.style.color = "var(--sys)";
                status.innerText = "Serveur prêt ! Donnez le code à vos amis."; 
                
                document.getElementById('btn-host').style.display = 'none';
                document.getElementById('btn-start-host').style.display = 'inline-block';
                
                gameMode = 'host'; myPid = 1;
                scores = { 1: 0 };
            });

            peer.on('connection', c => { 
                c.on('open', () => {
                    let newPid = Object.keys(scores).length + 1; 
                    c.pid = newPid; scores[newPid] = 0; conns.push(c); 
                    
                    status.style.color = "var(--sys)";
                    status.innerText = `${conns.length + 1} joueur(s) connectés !`;
                    document.getElementById('lobby-count').innerText = Object.keys(scores).length + " joueur(s) dans le salon";

                    c.send({ type: 'init', pid: newPid });
                    
                    let msg = `Joueur ${newPid} a rejoint la partie !`;
                    broadcast({ type: 'sys', msg: msg });
                    displaySys(msg); updateScoreUI();
                });

                c.on('data', data => { if (data.type === 'guess') processGuess(data.text, c.pid); });
            }); 
            
            peer.on('error', err => { status.style.color = "var(--p2)"; status.innerText = "Erreur de création : " + err.type; });
        }

        function joinGame() { 
            let id = document.getElementById('join-id').value.trim().toUpperCase(); 
            if (!id) return; 
            
            let status = document.getElementById('conn-status');
            status.style.color = "var(--p1)"; status.innerText = "Connexion au salon..."; 
            
            if (peer) peer.destroy(); peer = new Peer(); 
            
            peer.on('open', () => {
                let conn = peer.connect(id, { reliable: true }); 
                gameMode = 'client'; 
                
                conn.on('open', () => {
                    conns = [conn]; 
                    document.getElementById('network-menu').style.display = 'none';
                    document.getElementById('main-menu').style.display = 'flex';
                    document.getElementById('main-menu').innerHTML = '<div class="menu-title" style="color:var(--sys); font-size:2.5em; margin-bottom:20px;">CONNEXION ÉTABLIE</div><p style="font-size:1.5em; color:#fff; font-weight:600;">En attente de l\'hôte...</p><div class="loader"></div>';
                });
                
                conn.on('data', data => {
                    if (data.type === 'init') { myPid = data.pid; }
                    if (data.type === 'chat') { displayChat(data.msg, data.pid); }
                    if (data.type === 'sys') { displaySys(data.msg); }
                    if (data.type === 'start_game') { setupUIForCategory(data.category); } 
                    if (data.type === 'start_round') { clientStartRound(data.track); }
                    if (data.type === 'update_state') { clientUpdateState(data.stateData); }
                    if (data.type === 'end_round') { clientEndRound(data.track); }
                    if (data.type === 'end_game') { showEndScreen(data.scores); }
                });
                conn.on('error', () => { status.style.color = "var(--p2)"; status.innerText = "Échec de connexion."; });
            });
            peer.on('error', err => { status.style.color = "var(--p2)"; status.innerText = err.type === 'peer-unavailable' ? "Le salon n'existe pas !" : "Erreur réseau."; });
        }

        // --- FETCH DYNAMIQUE DE LA PLAYLIST (API BASÉE SUR LES CATALOGUES) ---
        async function launchGame(cat) {
            setupUIForCategory(cat);
            if (gameMode === 'host') broadcast({ type: 'start_game', category: cat });

            document.getElementById('cat-buttons').style.display = 'none';
            document.getElementById('loading-api').style.display = 'flex';

            let selectedTracks = [];
            // Mélange le tableau complet de plus de 50 artistes
            let shuffled = catalogs[cat].sort(() => Math.random() - 0.5);

            for (let i = 0; i < shuffled.length; i++) {
                if (selectedTracks.length >= 10) break; // S'arrête quand on a nos 10 pistes pour la manche
                try {
                    let searchItem = shuffled[i];
                    let searchTerm = (cat === 'ANIME' || cat === 'FILMS') ? searchItem.search : searchItem;
                    
                    let res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(searchTerm)}&media=music&entity=song&limit=10`);
                    let data = await res.json();
                    
                    let validTracks = data.results.filter(t => t.previewUrl);
                    if (validTracks.length > 0) {
                        let rTrack = validTracks[Math.floor(Math.random() * Math.min(validTracks.length, 5))];
                        
                        if (cat === 'ANIME') {
                            selectedTracks.push({
                                animeName: searchItem.anime, aliases: searchItem.aliases,
                                previewUrl: rTrack.previewUrl
                            });
                        } else if (cat === 'FILMS') {
                            selectedTracks.push({
                                filmName: searchItem.film, aliases: searchItem.aliases,
                                previewUrl: rTrack.previewUrl
                            });
                        } else {
                            selectedTracks.push({
                                artistName: rTrack.artistName, trackName: rTrack.trackName, previewUrl: rTrack.previewUrl
                            });
                        }
                    }
                } catch (e) { console.warn("Échec pour : ", shuffled[i]); }
            }

            if (selectedTracks.length === 0) {
                alert("Erreur réseau : Impossible de contacter la base de données musicale.");
                location.reload(); return;
            }

            playlist = selectedTracks;
            document.querySelectorAll('.overlay').forEach(el => el.style.display = 'none'); 
            
            if (gameMode === 'host') broadcast({ type: 'sys', msg: `L'hôte a lancé la catégorie ${cat} !` });
            displaySys(`🎵 DÉBUT DE LA PARTIE (${playlist.length} Manches) 🎵`);
            
            setTimeout(startNextRound, 2000);
        }

        function startFadeOut() {
            if (isFading) return;
            isFading = true; let step = audioPlayer.volume / 30;
            fadeInterval = setInterval(() => {
                if (audioPlayer.volume - step > 0) audioPlayer.volume -= step;
                else { audioPlayer.volume = 0; clearInterval(fadeInterval); }
            }, 100);
        }

        // --- GESTION DES ROUNDS ---
        function startNextRound() {
            currentTrackIndex++;
            if (currentTrackIndex >= playlist.length) { endGame(); return; }

            currentTrack = playlist[currentTrackIndex];
            state = { artistFound: false, titleFound: false, animeFound: false, filmFound: false, timeLeft: 20 };
            
            clearInterval(fadeInterval); isFading = false; audioPlayer.volume = 1;

            resetRoundUI();
            audioPlayer.src = currentTrack.previewUrl;
            audioPlayer.play().catch(e => console.log("Autoplay bloqué"));
            
            isRoundActive = true;
            if (gameMode === 'host') broadcast({ type: 'start_round', track: { previewUrl: currentTrack.previewUrl } });

            displaySys(`▶️ MANCHE ${currentTrackIndex + 1} / 10`);

            clearInterval(roundInterval);
            roundInterval = setInterval(() => {
                state.timeLeft--; timerBox.innerText = state.timeLeft;
                if (state.timeLeft <= 3) timerBox.style.color = '#ff0000'; else timerBox.style.color = 'var(--gold)';
                if (state.timeLeft === 3) startFadeOut();
                if (gameMode === 'host') broadcast({ type: 'update_state', stateData: { ...state, scores: scores } });
                if (state.timeLeft <= 0) endRound();
            }, 1000);
        }

        function endRound() {
            isRoundActive = false;
            clearInterval(roundInterval); clearInterval(fadeInterval); audioPlayer.pause();
            
            revealAnswers(currentTrack);
            displaySys(`Fin de la manche. Préparation de la suivante...`);
            
            if (gameMode === 'host') broadcast({ type: 'end_round', track: currentTrack });
            setTimeout(startNextRound, 5000);

        // --- ALGORITHME DE CORRECTION ORTHOGRAPHIQUE (LEVENSHTEIN) ---
        function cleanText(str) {
            if (!str) return '';
            let s = str.replace(/\([^)]*\)/g, '').replace(/\[[^\]]*\]/g, ''); 
            s = s.split(/feat\.|ft\./i)[0]; 
            s = s.normalize("NFD").replace(/[\u0300-\u036f]/g, ""); 
            return s.toLowerCase().replace(/[^a-z0-9]/g, '').trim();
        }

        function levenshtein(a, b) {
            if(a.length === 0) return b.length;
            if(b.length === 0) return a.length;
            let matrix = [];
            for(let i = 0; i <= b.length; i++) matrix[i] = [i];
            for(let j = 0; j <= a.length; j++) matrix[0][j] = j;
            for(let i = 1; i <= b.length; i++) {
                for(let j = 1; j <= a.length; j++) {
                    if(b.charAt(i-1) == a.charAt(j-1)) matrix[i][j] = matrix[i-1][j-1];
                    else matrix[i][j] = Math.min(matrix[i-1][j-1] + 1, Math.min(matrix[i][j-1] + 1, matrix[i-1][j] + 1));
                }
            }
            return matrix[b.length][a.length];
        }

        function checkMatch(guess, target) {
            let g = cleanText(guess); let t = cleanText(target);
            if (g.length < 2) return false;
            if (g === t || (t.includes(g) && g.length >= t.length * 0.75) || (g.includes(t) && t.length >= g.length * 0.75)) return true;
            
            // Tolérance aux fautes de frappe
            let distance = levenshtein(g, t);
            if (t.length > 5 && distance <= 2) return true; // 2 erreurs max pour mots longs
            if (t.length <= 5 && distance <= 1) return true; // 1 erreur max pour mots courts
            
            return false;
        }

        function submitGuess() {
            const text = guessInput.value.trim();
            if (!text || !isRoundActive) return;
            guessInput.value = '';

            if (gameMode === 'client') conns[0].send({ type: 'guess', text: text });
            else processGuess(text, 1);
        }

        function processGuess(text, pid) {
            let correct = false;

            if (currentCategory === 'ANIME') {
                if (state.animeFound) return;
                
                correct = checkMatch(text, currentTrack.animeName);
                if (!correct && currentTrack.aliases) {
                    for (let alias of currentTrack.aliases) { if (checkMatch(text, alias)) { correct = true; break; } }
                }

                if (correct) {
                    state.animeFound = true; scores[pid]++;
                    let msg = `🔥 Joueur ${pid} a trouvé l'Anime !`;
                    displaySys(msg); if(gameMode === 'host') broadcast({type:'sys', msg:msg});
                    
                    boxAnime.classList.add('found');
                    boxAnime.innerText = gameMode === 'solo' ? `📺 ${currentTrack.animeName}` : "📺 ANIME TROUVÉ !";
                    if (state.timeLeft > 3) { state.timeLeft = 3; startFadeOut(); }
                }
            } else if (currentCategory === 'FILMS') {
                if (state.filmFound) return;
                
                correct = checkMatch(text, currentTrack.filmName);
                if (!correct && currentTrack.aliases) {
                    for (let alias of currentTrack.aliases) { if (checkMatch(text, alias)) { correct = true; break; } }
                }

                if (correct) {
                    state.filmFound = true; scores[pid]++;
                    let msg = `🔥 Joueur ${pid} a trouvé le Film !`;
                    displaySys(msg); if(gameMode === 'host') broadcast({type:'sys', msg:msg});
                    
                    boxAnime.classList.add('found');
                    boxAnime.innerText = gameMode === 'solo' ? `🎬 ${currentTrack.filmName}` : "🎬 FILM TROUVÉ !";
                    if (state.timeLeft > 3) { state.timeLeft = 3; startFadeOut(); }
                }
            } else {
                let aMatch = !state.artistFound && checkMatch(text, currentTrack.artistName);
                let tMatch = !state.titleFound && checkMatch(text, currentTrack.trackName);

                if (aMatch) {
                    state.artistFound = true; scores[pid]++; correct = true;
                    let msg = `🔥 Joueur ${pid} a trouvé l'Artiste !`;
                    displaySys(msg); if(gameMode === 'host') broadcast({type:'sys', msg:msg});
                    boxArtist.classList.add('found'); boxArtist.innerText = gameMode === 'solo' ? `🧑‍🎤 ${currentTrack.artistName}` : "🧑‍🎤 ARTISTE TROUVÉ !";
                }
                if (tMatch) {
                    state.titleFound = true; scores[pid]++; correct = true;
                    let msg = `🔥 Joueur ${pid} a trouvé le Titre !`;
                    displaySys(msg); if(gameMode === 'host') broadcast({type:'sys', msg:msg});
                    boxTitle.classList.add('found'); boxTitle.innerText = gameMode === 'solo' ? `🎵 ${currentTrack.trackName.split('(')[0]}` : "🎵 TITRE TROUVÉ !";
                }
                if (state.artistFound && state.titleFound && state.timeLeft > 3) { state.timeLeft = 3; startFadeOut(); }
            }

            updateScoreUI();
            if (gameMode === 'host') broadcast({ type: 'update_state', stateData: { ...state, scores: scores } });

            if (!correct) {
                displayChat(text, pid);
                if (gameMode === 'host') broadcast({ type: 'chat', msg: text, pid: pid });
            }
        }

        // --- INTERFACE UTILE ---
        function displayChat(msg, pid) {
            let div = document.createElement('div'); div.className = 'msg'; let color = getPlayerColor(pid);
            div.style.alignSelf = pid === myPid ? 'flex-end' : 'flex-start';
            
            if (pid === myPid) {
                div.style.borderRight = `4px solid ${color}`;
                div.style.background = `linear-gradient(90deg, rgba(255,255,255,0.02), rgba(${hexToRgb(color)}, 0.15))`;
            } else {
                div.style.borderLeft = `4px solid ${color}`;
                div.style.background = `linear-gradient(90deg, rgba(${hexToRgb(color)}, 0.15), rgba(255,255,255,0.02))`;
            }
            
            div.style.color = '#fff'; div.innerText = msg;
            chatMsgs.appendChild(div); chatMsgs.scrollTop = chatMsgs.scrollHeight;
        }

        function hexToRgb(hex) {
            var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? `${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}` : null;
        }

        function displaySys(msg) {
            let div = document.createElement('div'); div.className = 'msg msg-sys'; div.innerText = msg;
            chatMsgs.appendChild(div); chatMsgs.scrollTop = chatMsgs.scrollHeight;
        }

                div.style.color = color; div.style.borderColor = color; 
                div.style.boxShadow = `0 0 15px rgba(${hexToRgb(color)}, 0.3)`; 
                div.innerText = `J${pid} : ${scoresData[pid]}`; container.appendChild(div);
            }
        }

                boxTitle.classList.add('found'); boxTitle.innerText = `🎵 ${trackObj.trackName.split('(')[0]}`;
            }
        }

        function showEndScreen(finalScores = scores) {
            document.querySelectorAll('.overlay').forEach(el => el.style.display = 'none');
            document.getElementById('end-screen').style.display = 'flex';
            let t = document.getElementById('final-scores-text');
            
            if (gameMode === 'solo') {
                let maxPts = (currentCategory === 'ANIME' || currentCategory === 'FILMS') ? 10 : 20;
                t.innerHTML = `Score Final : <br><b style="color:var(--sys); font-size: 1.5em; text-shadow: 0 0 20px var(--sys);">${finalScores[1]} / ${maxPts}</b>`;
            } else {
                let sortedPids = Object.keys(finalScores).sort((a,b) => finalScores[b] - finalScores[a]);
                let winnerPid = sortedPids[0]; let winnerColor = getPlayerColor(winnerPid);
                t.innerHTML = `<span style="color:${winnerColor}; font-weight:700; text-shadow: 0 0 15px ${winnerColor};">JOUEUR ${winnerPid} REMPORTE LA PARTIE !</span><br><br>`;
                sortedPids.forEach(pid => { 
                    t.innerHTML += `<div style="color:${getPlayerColor(pid)}; margin: 8px; font-weight:600; font-size: 1.2em;">Joueur ${pid} : ${finalScores[pid]} pts</div>`; 
                });
            }
        }
    </script>
    
    <!-- SCRIPT DE NAVIGATION SWIPE GLOBAL -->
    <script>
        const gamesHubList = [
            "../cybertank/index.html", "../tower_defense/index.html", "../edgeofwar/index.html",
            "../cyber_smash/index.html", "../guessthemanga/index.html", "../drawer/index.html",
            "../texas_poker/index.html", "../blindtest/index.html", "../2048slime/index.html",
            "../worms/index.html"
        ];
        let globalTouchStartX = 0, globalTouchStartY = 0; let globalTouchEndX = 0, globalTouchEndY = 0;
        
        function handleSwipeGesture() {
            const swipeThreshold = 75; 
            let diffX = globalTouchEndX - globalTouchStartX; let diffY = globalTouchEndY - globalTouchStartY;
            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX < -swipeThreshold) navigateGames(1);       
                else if (diffX > swipeThreshold) navigateGames(-1);  
            } else {
                if (diffY < -swipeThreshold) navigateGames(1);       
                else if (diffY > swipeThreshold) navigateGames(-1);  
            }
        }
        function navigateGames(direction) {
            const currentPath = window.location.pathname;
            let currentIndex = gamesHubList.findIndex(game => { let folderName = game.split('/')[1]; return currentPath.includes(folderName); });
            if (currentIndex === -1) return;
            let nextIndex = (currentIndex + direction + gamesHubList.length) % gamesHubList.length;
            window.location.href = gamesHubList[nextIndex];
        }
        function isExcludedElement(target) {
            const tag = target.tagName.toLowerCase();
            if (tag === 'input' || tag === 'button' || tag === 'canvas' || tag === 'select') return true;
            if (target.closest('#game-container') || target.closest('#chat-messages')) return true;
            return false;
        }

        document.addEventListener('touchstart', e => {
            if (isExcludedElement(e.target)) return;
            globalTouchStartX = e.changedTouches[0].screenX; globalTouchStartY = e.changedTouches[0].screenY;
        }, { passive: true });
        document.addEventListener('touchend', e => {
            if (isExcludedElement(e.target)) return;
            globalTouchEndX = e.changedTouches[0].screenX; globalTouchEndY = e.changedTouches[0].screenY;
            handleSwipeGesture();
        }, { passive: true });

        let isMouseDown = false;
        document.addEventListener('mousedown', e => {
            if (isExcludedElement(e.target)) return;
            isMouseDown = true; globalTouchStartX = e.screenX; globalTouchStartY = e.screenY;
        });
        document.addEventListener('mouseup', e => {
            if (isExcludedElement(e.target) || !isMouseDown) { isMouseDown = false; return; }
            isMouseDown = false; globalTouchEndX = e.screenX; globalTouchEndY = e.screenY;
            handleSwipeGesture();
        });
    </script>
</body>
