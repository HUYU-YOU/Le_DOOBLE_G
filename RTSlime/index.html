<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber-Command : Micro RTS</title>
    <style>
        /* =========================================
           1. VARIABLES CYBERPUNK ET RESET
           ========================================= */
        :root {
            --bg-color: #050508;
            --neon-cyan: #00f0ff;
            --neon-pink: #ff007f;
            --neon-green: #39ff14;
            --neon-yellow: #fce803;
            --neon-red: #ff3333;
            --neon-purple: #b000ff;
            --neon-orange: #ff8c00;
            --neon-water: #3388ff;
            --text-color: #e0e0e0;
            --font-ui: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-color); color: var(--text-color);
            font-family: var(--font-ui); overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            user-select: none; -webkit-user-select: none;
        }

        /* Background Grid */
        body::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px; z-index: -1;
        }

        /* =========================================
           2. BOUTON RETOUR HUB
           ========================================= */
        #btn-retour-hub {
            position: fixed; top: 15px; left: 15px; z-index: 9999;
            background-color: rgba(0, 0, 0, 0.8); border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan); padding: 8px 15px; font-weight: bold;
            font-size: 14px; border-radius: 6px; cursor: pointer;
            text-decoration: none; transition: 0.3s ease; text-transform: uppercase;
        }
        #btn-retour-hub:hover { background-color: var(--neon-cyan); color: #000; box-shadow: 0 0 15px var(--neon-cyan); }

        /* =========================================
           3. UI DU RTS (Ressources & Build)
           ========================================= */
        #ui-top {
            position: absolute; top: 15px; right: 20px; z-index: 10;
            background: rgba(0,0,0,0.8); border: 1px solid #333;
            padding: 10px 20px; border-radius: 8px; box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            font-size: 1.1rem; font-weight: bold;
            display: flex; align-items: center; gap: 20px;
        }
        .res-gold { color: var(--neon-yellow); text-shadow: 0 0 5px var(--neon-yellow); }
        .res-wood { color: var(--neon-orange); text-shadow: 0 0 5px var(--neon-orange); }
        .res-food { color: var(--neon-green); text-shadow: 0 0 5px var(--neon-green); }
        .res-pop { color: var(--text-color); }

        #ui-bottom {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10;
            background: rgba(0,0,0,0.85); border: 2px solid var(--neon-cyan);
            padding: 10px; border-radius: 12px; display: flex; gap: 10px; align-items: center;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2); backdrop-filter: blur(5px);
            max-width: 95vw; overflow-x: auto; white-space: nowrap; min-height: 60px;
        }
        
        #ui-bottom::-webkit-scrollbar { height: 6px; }
        #ui-bottom::-webkit-scrollbar-thumb { background: var(--neon-cyan); border-radius: 3px; }

        .build-btn {
            background: transparent; border: 2px solid gray; color: gray;
            padding: 8px 15px; font-size: 0.9rem; font-weight: bold; text-transform: uppercase;
            border-radius: 6px; cursor: pointer; transition: 0.2s;
            display: flex; flex-direction: column; align-items: center; gap: 5px; flex-shrink: 0;
            min-width: 90px;
        }
        .build-btn span { font-size: 0.75rem; opacity: 0.9; }
        .build-btn:hover { transform: translateY(-2px); }
        
        .color-build { border-color: var(--neon-cyan); color: var(--neon-cyan); }
        .color-build:hover { background: var(--neon-cyan); color: #000; box-shadow: 0 0 15px var(--neon-cyan); }
        
        .color-recruit { border-color: var(--neon-pink); color: var(--neon-pink); }
        .color-recruit:hover { background: var(--neon-pink); color: #000; box-shadow: 0 0 15px var(--neon-pink); }

        .color-upgrade { border-color: var(--neon-yellow); color: var(--neon-yellow); }
        .color-upgrade:hover { background: var(--neon-yellow); color: #000; box-shadow: 0 0 15px var(--neon-yellow); }

        .color-destroy { border-color: var(--neon-red); color: var(--neon-red); }
        .color-destroy:hover { background: var(--neon-red); color: #000; box-shadow: 0 0 15px var(--neon-red); }

        .active-mode { background: var(--text-color) !important; color: #000 !important; box-shadow: 0 0 20px white !important; }

        #game-over-screen {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.95); border: 2px solid var(--neon-red);
            padding: 40px; border-radius: 12px; text-align: center; z-index: 50; display: none;
            box-shadow: 0 0 30px var(--neon-red);
        }
        #game-over-screen h1 { color: var(--neon-red); text-shadow: 0 0 15px var(--neon-red); margin-top:0; font-size: 3rem; text-transform: uppercase;}
        .restart-btn {
            background: transparent; border: 2px solid var(--neon-cyan); color: var(--neon-cyan);
            padding: 15px 30px; font-size: 1.2rem; cursor: pointer; border-radius: 6px; text-transform: uppercase; font-weight:bold;
            margin-top: 20px; transition: 0.3s;
        }
        .restart-btn:hover { background: var(--neon-cyan); color: #000; box-shadow: 0 0 20px var(--neon-cyan); }

        #build-instructions {
            position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); color: var(--neon-cyan); padding: 10px 20px; border-radius: 8px;
            border: 1px solid var(--neon-cyan); pointer-events: none; display: none; z-index: 10; font-weight: bold;
        }
        
        .ui-divider { min-width: 2px; height: 40px; background: #555; margin: 0 5px; }

        #game-container { position: relative; width: 100%; height: 100%; touch-action: none; }
        canvas { display: block; width: 100%; height: 100%; }

    </style>
</head>
<body>

    <script>
        document.addEventListener('touchstart', (e) => { 
            if(e.target.closest('.no-swipe')) e.stopPropagation(); 
        }, { passive: false });
        document.addEventListener('contextmenu', event => event.preventDefault());
    </script>

    <a href="../index.html" id="btn-retour-hub">&#11013; HUB</a>

    <div id="game-container" class="no-swipe">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-top">
            <span class="res-gold">💰 <span id="val-gold">50</span></span>
            <span class="res-wood">🪵 <span id="val-wood">100</span></span>
            <span class="res-food">🍞 <span id="val-food">100</span></span>
            <span class="res-pop">👥 <span id="val-pop">0</span>/<span id="val-maxpop">0</span></span>
        </div>

        <div id="build-instructions">Clic Gauche pour Placer - Clic Droit pour Annuler</div>

        <!-- Interface Dynamique -->
        <div id="ui-bottom"></div>

        <div id="game-over-screen">
            <h1>MATRICE DÉTRUITE</h1>
            <p>L'Hôtel de Ville a été corrompu par l'infection.</p>
            <button class="restart-btn" onclick="initGame()">Reboot Système</button>
        </div>
    </div>

    <!-- MOTEUR RTS -->
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        // --- GESTION DES ASSETS GRAPHIQUES ---
        const ASSETS_PATHS = {
            map: 'map/mapRTS.png',
            hdv: 'bat/hdv.png',
            house: 'bat/home.png',
            farm: 'bat/farm.png',
            sawmill: 'bat/scierie.png',
            mine: 'bat/mine.png',
            barracks: 'bat/warriorlearn.png',
            archery: 'bat/shootlearn.png',
            mageTower: 'bat/magicallearn.png',
            tower: 'bat/tower.png',
            farmer: 'skins/farmer.png',
            warrior: 'skins/warrior.png',
            archer: 'skins/archer.png',
            mage: 'skins/mage.png',
            wheat: 'map/wheat.png'
        };
        const images = {};
        for (let key in ASSETS_PATHS) {
            images[key] = new Image();
            images[key].src = ASSETS_PATHS[key];
        }

        // Éléments DOM
        const uiGold = document.getElementById('val-gold');
        const uiWood = document.getElementById('val-wood');
        const uiFood = document.getElementById('val-food');
        const uiPop = document.getElementById('val-pop');
        const uiMaxPop = document.getElementById('val-maxpop');
        const gameOverScreen = document.getElementById('game-over-screen');
        const instructions = document.getElementById('build-instructions');
        const uiBottom = document.getElementById('ui-bottom');

        // Etat du jeu
        let gameState = 'PLAYING';
        let res = { gold: 50, wood: 100, food: 100, pop: 0, maxPop: 0 };
        let buildMode = null;
        let moveMode = null; // Bâtiment en cours de déplacement
        let waveTimer = 0;
        let survivalTimer = 0;

        // Entités
        let base = null;
        let buildings = [];
        let units = [];
        let enemies = [];
        let trees = [];
        let wheats = [];
        let particles = [];
        let lasers = [];

        // Système de Sélection
        let selectedUnits = [];
        let selectedBuilding = null; // Peut être Base ou Bâtiment
        let isSelecting = false;
        let selectionStart = { x: 0, y: 0 };
        let selectionCurrent = { x: 0, y: 0 };
        let inputMode = 'mouse'; 
        let mouseHover = { x: 0, y: 0 };

        // --- CLASSES ---

        class Base {
            constructor(x, y) {
                this.x = x; this.y = y; this.type = 'hdv';
                this.size = 100; 
                this.hp = 2000; this.maxHp = 2000;
                this.color = 'var(--neon-cyan)';
            }
            draw() {
                if (selectedBuilding === this) {
                    ctx.shadowBlur = 15; ctx.shadowColor = 'var(--neon-cyan)';
                    ctx.strokeStyle = 'white'; ctx.lineWidth = 2;
                    ctx.strokeRect(this.x - this.size/2 - 5, this.y - this.size/2 - 5, this.size + 10, this.size + 10);
                    ctx.shadowBlur = 0;
                }

                if (images.hdv.complete && images.hdv.naturalWidth > 0) {
                    ctx.drawImage(images.hdv, this.x - this.size/2, this.y - this.size/2, this.size, this.size);
                } else {
                    ctx.fillStyle = '#0b0c10'; ctx.fillRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);
                    ctx.strokeStyle = this.color; ctx.lineWidth = 4; ctx.strokeRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);
                }
                ctx.fillStyle = 'red'; ctx.fillRect(this.x - this.size/2, this.y - this.size/2 - 15, this.size, 5);
                ctx.fillStyle = 'var(--neon-green)'; ctx.fillRect(this.x - this.size/2, this.y - this.size/2 - 15, this.size * (this.hp / this.maxHp), 5);
            }
        }

        class Building {
            constructor(x, y, type) {
                this.x = x; this.y = y; this.type = type;
                this.size = 64;
                this.farmersInside = 0; 
                this.level = 1; 
                this.attackCooldown = 0; 

                if(type === 'house') { this.color = 'var(--neon-yellow)'; res.maxPop += 4; }
                if(type === 'farm') { this.color = 'var(--neon-green)'; }
                if(type === 'sawmill') { this.color = 'var(--neon-orange)'; }
                if(type === 'mine') { this.color = 'var(--neon-yellow)'; }
                if(type === 'barracks') { this.color = 'var(--neon-red)'; this.size = 80; }
                if(type === 'archery') { this.color = 'var(--neon-pink)'; this.size = 80; }
                if(type === 'mage') { this.color = 'var(--neon-purple)'; this.size = 80; }
                if(type === 'tower') { this.color = 'var(--neon-cyan)'; this.size = 50; }
            }
            
            update(dt) {
                if (this.type === 'tower') {
                    if (this.attackCooldown > 0) this.attackCooldown -= dt;
                    if (this.attackCooldown <= 0) {
                        let closestEnemy = getClosest(this, enemies);
                        if (closestEnemy && dist(this, closestEnemy) <= 250) {
                            closestEnemy.hp -= 40;
                            spawnLaser(this, closestEnemy, 'var(--neon-cyan)');
                            this.attackCooldown = 1.2; 
                        }
                    }
                }
            }

            draw() {
                if (moveMode === this) return; // Caché pendant le déplacement

                if (selectedBuilding === this) {
                    ctx.shadowBlur = 15; ctx.shadowColor = 'var(--text-color)';
                    ctx.strokeStyle = 'white'; ctx.lineWidth = 2;
                    ctx.strokeRect(this.x - this.size/2 - 5, this.y - this.size/2 - 5, this.size + 10, this.size + 10);
                    ctx.shadowBlur = 0;
                }

                let img = null;
                if(this.type === 'house') img = images.house;
                if(this.type === 'farm') img = images.farm;
                if(this.type === 'sawmill') img = images.sawmill;
                if(this.type === 'mine') img = images.mine;
                if(this.type === 'barracks') img = images.barracks;
                if(this.type === 'archery') img = images.archery;
                if(this.type === 'mage') img = images.mageTower;
                if(this.type === 'tower') img = images.tower;

                if (img && img.complete && img.naturalWidth > 0) {
                    ctx.drawImage(img, this.x - this.size/2, this.y - this.size/2, this.size, this.size);
                } else {
                    ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);
                    ctx.strokeStyle = this.color; ctx.lineWidth = 2; ctx.strokeRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);
                }
                
                if (this.level > 1) {
                    ctx.fillStyle = 'var(--neon-yellow)'; ctx.font = '16px Arial'; ctx.fillText('★', this.x + this.size/2 - 10, this.y - this.size/2 + 15);
                }
                if (this.type === 'farm' || this.type === 'sawmill' || this.type === 'mine') {
                    ctx.fillStyle = this.color; ctx.font = '14px Arial'; ctx.textAlign = 'center';
                    ctx.fillText(`${this.farmersInside}/5 🧑‍🌾`, this.x, this.y - this.size/2 - 5);
                }
            }
        }

        class ResourceNode {
            constructor(x, y, type) {
                this.x = x; this.y = y; this.type = type;
                this.radius = 15;
                this.amount = 500; 
                this.color = type === 'tree' ? 'var(--neon-orange)' : 'var(--neon-green)';
            }
            draw() {
                if (this.type === 'wheat' && images.wheat.complete && images.wheat.naturalWidth > 0) {
                    ctx.drawImage(images.wheat, this.x - 20, this.y - 20, 40, 40);
                } else {
                    ctx.shadowBlur = 10; ctx.shadowColor = this.color;
                    ctx.beginPath();
                    if(this.type === 'tree') {
                        for (let i = 0; i < 6; i++) ctx.lineTo(this.x + this.radius * Math.cos(i * Math.PI / 3), this.y + this.radius * Math.sin(i * Math.PI / 3));
                    } else { 
                        ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
                    }
                    ctx.closePath();
                    ctx.fillStyle = '#111'; ctx.fill();
                    ctx.strokeStyle = this.color; ctx.lineWidth = 2; ctx.stroke();
                    ctx.shadowBlur = 0;
                }
            }
        }

        class Unit {
            constructor(x, y, type, element = 'normal') {
                this.x = x; this.y = y; this.type = type; this.element = element;
                this.targetPos = null; this.targetEntity = null;
                this.state = 'idle'; 
                this.radius = 8; 
                this.drawSize = 32; 
                this.payload = 0; this.payloadType = null;
                res.pop++;

                this.elColor = '#fff';
                if(element === 'fire') this.elColor = 'var(--neon-red)';
                if(element === 'water') this.elColor = 'var(--neon-water)';
                if(element === 'plant') this.elColor = 'var(--neon-green)';

                if (type === 'farmer') { this.color = '#ccc'; this.speed = 100; this.hp = 30; }
                if (type === 'warrior') { this.color = 'var(--neon-red)'; this.speed = 90; this.hp = 150; this.damage = 15; this.range = 35; this.cooldown = 1.0; }
                if (type === 'archer') { this.color = 'var(--neon-pink)'; this.speed = 80; this.hp = 80; this.damage = 12; this.range = 180; this.cooldown = 0.8; }
                if (type === 'mage') { this.color = 'var(--neon-purple)'; this.speed = 70; this.hp = 100; this.damage = 25; this.range = 120; this.cooldown = 1.5; }
                
                this.maxHp = this.hp;
                this.currentCooldown = 0;
            }

            setCommand(x, y, entity = null) {
                if(this.state === 'farming' && this.targetEntity) this.targetEntity.farmersInside--;

                this.targetPos = { x, y };
                this.targetEntity = entity;
                
                if (this.type === 'farmer' && entity instanceof ResourceNode) this.state = 'moving_to_res';
                else if (this.type === 'farmer' && entity instanceof Building && ['farm','sawmill','mine'].includes(entity.type)) this.state = 'moving_to_building';
                else if (this.type !== 'farmer' && entity instanceof Enemy) this.state = 'attacking';
                else this.state = 'moving';
            }

            update(dt) {
                if (this.currentCooldown > 0) this.currentCooldown -= dt;

                // --- FERMIER ---
                if (this.type === 'farmer') {
                    if (this.state === 'moving_to_res' && this.targetEntity) {
                        if (dist(this, this.targetEntity) < this.radius + this.targetEntity.radius + 5) {
                            this.state = 'gathering'; this.targetPos = null;
                            this.payloadType = this.targetEntity.type === 'tree' ? 'wood' : 'food';
                        }
                    } 
                    else if (this.state === 'gathering') {
                        if(this.targetEntity.amount > 0) {
                            this.payload += 15 * dt; 
                            this.targetEntity.amount -= 15 * dt;
                            if (this.payload >= 20) {
                                this.payload = 20; this.targetEntity = base;
                                this.targetPos = { x: base.x, y: base.y }; this.state = 'returning';
                            }
                        } else { this.state = 'idle'; }
                    }
                    else if (this.state === 'returning') {
                        if (dist(this, base) < this.radius + base.size/2 + 5) {
                            if(this.payloadType === 'wood') res.wood += Math.floor(this.payload);
                            if(this.payloadType === 'food') res.food += Math.floor(this.payload);
                            this.payload = 0;
                            
                            let pool = this.payloadType === 'wood' ? trees : wheats;
                            let closestRes = getClosest(this, pool);
                            if(closestRes) this.setCommand(closestRes.x, closestRes.y, closestRes);
                            else this.state = 'idle';
                        }
                    }
                    else if (this.state === 'moving_to_building' && this.targetEntity) {
                        if (dist(this, this.targetEntity) < this.targetEntity.size/2 + 5) {
                            if(this.targetEntity.farmersInside < 5) {
                                this.state = 'farming';
                                this.targetEntity.farmersInside++;
                                this.targetPos = null;
                            } else { this.state = 'idle'; }
                        }
                    }
                } 
                // --- COMBATTANTS ---
                else {
                    if (this.state === 'attacking' && this.targetEntity) {
                        if(this.targetEntity.hp <= 0) {
                            this.targetEntity = null; this.state = 'idle';
                        } else if (dist(this, this.targetEntity) <= this.range) {
                            this.targetPos = null; 
                            if (this.currentCooldown <= 0) {
                                this.performAttack(this.targetEntity);
                                this.currentCooldown = this.cooldown;
                            }
                        } else {
                            this.targetPos = { x: this.targetEntity.x, y: this.targetEntity.y }; 
                        }
                    }
                }

                if (this.targetPos) {
                    let d = dist(this, this.targetPos);
                    if (d > 5) {
                        this.x += ((this.targetPos.x - this.x) / d) * this.speed * dt;
                        this.y += ((this.targetPos.y - this.y) / d) * this.speed * dt;
                    } else if (this.state === 'moving' || this.state === 'moving_to_building') {
                        this.state = 'idle'; this.targetPos = null;
                    }
                }
            }

            performAttack(primaryTarget) {
                let colorFX = this.element === 'normal' ? this.color : this.elColor;
                spawnLaser(this, primaryTarget, colorFX);

                if (this.type === 'warrior') {
                    enemies.forEach(e => {
                        if(dist(this, e) <= this.range + 10) this.applyDamage(e);
                    });
                } else {
                    this.applyDamage(primaryTarget);
                    if (this.type === 'mage') {
                        primaryTarget.slowTimer = 2.0; 
                    }
                }
            }

            applyDamage(target) {
                let mult = 1.0;
                if (this.element === 'fire' && target.element === 'plant') mult *= 1.5;
                if (this.element === 'plant' && target.element === 'water') mult *= 1.5;
                if (this.element === 'water' && target.element === 'fire') mult *= 1.5;

                if (this.element === 'fire' && target.element === 'water') mult *= 0.5;
                if (this.element === 'plant' && target.element === 'fire') mult *= 0.5;
                if (this.element === 'water' && target.element === 'plant') mult *= 0.5;

                target.hp -= (this.damage * mult);
            }

            draw() {
                if(this.state === 'farming') return;

                let img = null;
                if(this.type === 'farmer') img = images.farmer;
                if(this.type === 'warrior') img = images.warrior;
                if(this.type === 'archer') img = images.archer;
                if(this.type === 'mage') img = images.mage;

                if (selectedUnits.includes(this)) {
                    ctx.strokeStyle = 'var(--neon-cyan)'; ctx.lineWidth = 1;
                    ctx.strokeRect(this.x - this.drawSize/2 - 2, this.y - this.drawSize/2 - 2, this.drawSize + 4, this.drawSize + 4);
                }

                if (this.element !== 'normal') {
                    ctx.shadowBlur = 10; ctx.shadowColor = this.elColor;
                    ctx.fillStyle = this.elColor; ctx.beginPath(); ctx.arc(this.x, this.y+10, 15, 0, Math.PI*2); ctx.fill();
                    ctx.shadowBlur = 0;
                }

                if (img && img.complete && img.naturalWidth > 0) {
                    ctx.drawImage(img, this.x - this.drawSize/2, this.y - this.drawSize/2, this.drawSize, this.drawSize);
                } else {
                    ctx.fillStyle = '#111'; ctx.beginPath();
                    if (this.type === 'farmer') ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    else if (this.type === 'warrior') { ctx.moveTo(this.x, this.y-this.radius); ctx.lineTo(this.x+this.radius, this.y+this.radius); ctx.lineTo(this.x-this.radius, this.y+this.radius); }
                    else if (this.type === 'archer') { ctx.moveTo(this.x, this.y-this.radius); ctx.lineTo(this.x+this.radius, this.y); ctx.lineTo(this.x, this.y+this.radius); ctx.lineTo(this.x-this.radius, this.y); }
                    else if (this.type === 'mage') { for(let i=0; i<5; i++) { ctx.lineTo(this.x + this.radius * Math.cos(i*Math.PI*2/5 - Math.PI/2), this.y + this.radius * Math.sin(i*Math.PI*2/5 - Math.PI/2)); } }
                    ctx.closePath(); ctx.fill();
                    ctx.strokeStyle = this.color; ctx.lineWidth = 2; ctx.stroke();
                }

                if(this.type !== 'farmer' && this.hp < this.maxHp) {
                    ctx.fillStyle = 'red'; ctx.fillRect(this.x - 10, this.y - this.drawSize/2 - 6, 20, 3);
                    ctx.fillStyle = 'var(--neon-green)'; ctx.fillRect(this.x - 10, this.y - this.drawSize/2 - 6, 20 * (this.hp/this.maxHp), 3);
                }
                if(this.payload > 0) {
                    ctx.fillStyle = this.payloadType === 'wood' ? 'var(--neon-orange)' : 'var(--neon-green)';
                    ctx.fillRect(this.x - 5, this.y - this.drawSize/2 - 6, 10 * (this.payload/20), 3);
                }
            }
        }

        class Enemy {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.radius = 12;
                this.baseSpeed = 40 + Math.random() * 30;
                this.hp = 60 + Math.floor(survivalTimer); 
                this.maxHp = this.hp;
                this.attackCooldown = 0;
                this.slowTimer = 0;
                
                const els = ['normal', 'fire', 'water', 'plant'];
                this.element = els[Math.floor(Math.random() * els.length)];
                if(this.element === 'normal') this.color = 'var(--neon-red)';
                if(this.element === 'fire') this.color = '#ff5500';
                if(this.element === 'water') this.color = 'var(--neon-water)';
                if(this.element === 'plant') this.color = 'var(--neon-green)';
            }

            update(dt) {
                if(this.attackCooldown > 0) this.attackCooldown -= dt;
                if(this.slowTimer > 0) this.slowTimer -= dt;

                let currentSpeed = this.slowTimer > 0 ? this.baseSpeed * 0.5 : this.baseSpeed;

                let target = base;
                for(let b of buildings) {
                    if(b.type === 'tower' && dist(this, b) < 150) { target = b; break; }
                }
                if (target === base) {
                    for(let u of units) {
                        if(dist(this, u) < 150 && u.state !== 'farming') { target = u; break; }
                    }
                }

                let d = dist(this, target);
                let range = target === base ? base.size/2 + this.radius : (target.size ? target.size/2 : target.radius) + this.radius;

                if (d > range + 5) {
                    this.x += ((target.x - this.x) / d) * currentSpeed * dt;
                    this.y += ((target.y - this.y) / d) * currentSpeed * dt;
                } else if (this.attackCooldown <= 0) {
                    target.hp -= 15;
                    this.attackCooldown = 1;
                    spawnParticles(target.x, target.y, this.color, 5);
                }
            }

            draw() {
                ctx.shadowBlur = 10; ctx.shadowColor = this.color;
                ctx.fillStyle = '#111'; ctx.strokeStyle = this.color; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
                ctx.fill(); ctx.stroke();
                
                ctx.beginPath(); ctx.moveTo(this.x-5, this.y-5); ctx.lineTo(this.x+5, this.y+5);
                ctx.moveTo(this.x+5, this.y-5); ctx.lineTo(this.x-5, this.y+5); ctx.stroke();
                ctx.shadowBlur = 0;

                if(this.slowTimer > 0) { 
                    ctx.strokeStyle = 'var(--neon-purple)'; ctx.beginPath(); ctx.arc(this.x, this.y, this.radius+4, 0, Math.PI*2); ctx.stroke();
                }

                if(this.hp < this.maxHp) {
                    ctx.fillStyle = 'red'; ctx.fillRect(this.x - 10, this.y - this.radius - 8, 20, 3);
                    ctx.fillStyle = 'var(--neon-green)'; ctx.fillRect(this.x - 10, this.y - this.radius - 8, 20 * (this.hp/this.maxHp), 3);
                }
            }
        }

        // --- UTILITAIRES ---
        function dist(a, b) { return Math.hypot(b.x - a.x, b.y - a.y); }
        function getClosest(entity, array) {
            let closest = null; let minDist = Infinity;
            for(let o of array) { let d = dist(entity, o); if(d < minDist) { minDist = d; closest = o; } }
            return closest;
        }
        function spawnParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x, y: y, vx: (Math.random()-0.5)*100, vy: (Math.random()-0.5)*100,
                    size: Math.random()*3+1, color: color, life: 0.5 + Math.random()*0.5
                });
            }
        }
        function spawnLaser(a, b, color) { lasers.push({ x1:a.x, y1:a.y, x2:b.x, y2:b.y, color:color, life:0.15 }); }

        function resize() {
            width = window.innerWidth; height = window.innerHeight;
            canvas.width = width; canvas.height = height;
            if(base) { base.x = width/2; base.y = height/2 + 50; }
        }
        window.addEventListener('resize', resize); 

        // --- GESTION UI DYNAMIQUE & BATIMENTS ---
        function renderBottomUI() {

            if (selectedBuilding) {
                if (selectedBuilding.type === 'hdv') {

                    uiBottom.appendChild(createBtn('color-build', 'MINE', '50🪵 50🍞', () => setBuildMode('mine'), null, 'btn-b-mine'));
                    uiBottom.appendChild(createDivider());
                    uiBottom.appendChild(createBtn('color-build', 'CASERNE', '50💰 50🪵', () => setBuildMode('barracks'), null, 'btn-b-barracks'));
                    uiBottom.appendChild(createBtn('color-build', 'STAND TIR', '50💰 50🪵', () => setBuildMode('archery'), null, 'btn-b-archery'));
                    uiBottom.appendChild(createBtn('color-build', 'T. MAGE', '50💰 50🪵', () => setBuildMode('mage'), null, 'btn-b-mage'));
                    uiBottom.appendChild(createBtn('color-build', 'TOUR DEF', '100💰 50🪵', () => setBuildMode('tower'), null, 'btn-b-tower'));
                    uiBottom.appendChild(createDivider());
                    uiBottom.appendChild(createBtn('color-recruit', 'FERMIER', '10🍞', () => buyUnit('farmer', 'normal')));
                    uiBottom.appendChild(createDivider());
                    uiBottom.appendChild(createBtn('color-build', 'FERMER', '', () => { selectedBuilding = null; renderBottomUI(); }));

                } else {
                    // Menu Bâtiment Normal
                    let title = document.createElement('div');
                    title.style.color = 'white'; title.style.marginRight = '15px'; title.innerHTML = `<b>${selectedBuilding.type.toUpperCase()}</b> Lv.${selectedBuilding.level}`;
                    uiBottom.appendChild(title);

                    if (['barracks', 'archery', 'mage'].includes(selectedBuilding.type)) {
                        if (selectedBuilding.level === 1) {
                            let btnUp = createBtn('color-upgrade', 'AMÉLIORER', '100💰 100🪵', () => upgradeBuilding(selectedBuilding));
                            uiBottom.appendChild(btnUp);
                            uiBottom.appendChild(createDivider());
                        }

                        let unitType = selectedBuilding.type === 'barracks' ? 'warrior' : selectedBuilding.type === 'archery' ? 'archer' : 'mage';
                        uiBottom.appendChild(createBtn('color-recruit', 'NORMAL', '20💰 20🍞', () => buyUnit(unitType, 'normal')));
                        
                        if (selectedBuilding.level > 1) {
                            uiBottom.appendChild(createBtn('color-recruit', '🔥 FEU', '40💰 40🍞', () => buyUnit(unitType, 'fire'), 'var(--neon-red)'));
                            uiBottom.appendChild(createBtn('color-recruit', '💧 EAU', '40💰 40🍞', () => buyUnit(unitType, 'water'), 'var(--neon-water)'));
                            uiBottom.appendChild(createBtn('color-recruit', '🌿 PLANTE', '40💰 40🍞', () => buyUnit(unitType, 'plant'), 'var(--neon-green)'));
                        }
                    } else if (['farm', 'sawmill', 'mine'].includes(selectedBuilding.type)) {
                        let info = document.createElement('div');
                        info.style.color = '#aaa'; info.innerText = `Ouvriers: ${selectedBuilding.farmersInside}/5.`;
                        uiBottom.appendChild(info);
                    } else if (selectedBuilding.type === 'house') {
                        let info = document.createElement('div');
                        info.style.color = '#aaa'; info.innerText = "Capacité: 4 unités.";
                        uiBottom.appendChild(info);
                    }

                    uiBottom.appendChild(createDivider());
                    uiBottom.appendChild(createBtn('color-build', 'DÉPLACER', '', () => startMoveBuilding(selectedBuilding), 'var(--neon-cyan)'));
                    uiBottom.appendChild(createBtn('color-destroy', 'DÉTRUIRE', 'Gains 50%', () => destroyBuilding(selectedBuilding)));
                    uiBottom.appendChild(createDivider());
                    uiBottom.appendChild(createBtn('color-build', 'FERMER', '', () => { selectedBuilding = null; renderBottomUI(); }));
                }
            } else {
                let info = document.createElement('div');
                info.style.color = '#aaa'; info.innerText = "Sélectionnez l'Hôtel de Ville ou un bâtiment.";
                uiBottom.appendChild(info);
            }
        }

        function createBtn(colorClass, title, costText, onClick, overrideColor=null, id=null) {
            let b = document.createElement('button');
            b.className = `build-btn ${colorClass}`;
            if(id) b.id = id;
            if(overrideColor) { b.style.borderColor = overrideColor; b.style.color = overrideColor; }
            b.innerHTML = `${title} <span>${costText}</span>`;
            b.onclick = onClick;
            return b;
        }
        function createDivider() {
            let d = document.createElement('div'); d.className = 'ui-divider'; return d;
        }

        // --- DEPLACER / DETRUIRE ---
        function startMoveBuilding(b) {
            moveMode = b;
            selectedBuilding = null;
            renderBottomUI();
            instructions.style.display = 'block';
        }

        function destroyBuilding(b) {
            let cost = getBuildingCost(b.type);
            res.gold += Math.floor(cost.g / 2);
            res.wood += Math.floor(cost.w / 2);
            res.food += Math.floor(cost.f / 2);
            
            if(b.type === 'house') res.maxPop -= 4;
            
            // Éjecte les fermiers du bâtiment détruit
            if(b.farmersInside > 0) {
                units.forEach(u => {
                    if(u.state === 'farming' && u.targetEntity === b) {
                        u.state = 'idle'; u.targetEntity = null;
                    }
                });
            }

            buildings = buildings.filter(x => x !== b);
            spawnParticles(b.x, b.y, 'var(--neon-red)', 30);
            selectedBuilding = null;
            updateUI(); renderBottomUI();
        }

        // --- INITIALISATION ---
        function initGame() {
            gameState = 'PLAYING';
            res = { gold: 50, wood: 50, food: 50, pop: 0, maxPop: 0 }; 
            survivalTimer = 0; waveTimer = 20; 
            units = []; enemies = []; trees = []; wheats = []; buildings = []; particles = []; lasers = []; selectedUnits = [];
            buildMode = null; moveMode = null; selectedBuilding = null;
            gameOverScreen.style.display = 'none';

            resize();
            base = new Base(width/2, height/2 + 50);

            // Génération de la map
            for(let i=0; i<15; i++) {
                let tx = Math.random() * width; let ty = Math.random() * height;
                if (dist({x:tx, y:ty}, base) > 150) trees.push(new ResourceNode(tx, ty, 'tree'));
            }
            for(let i=0; i<10; i++) {
                let wx = Math.random() * width; let wy = Math.random() * height;
                if (dist({x:wx, y:wy}, base) > 150) wheats.push(new ResourceNode(wx, wy, 'wheat'));
            }

            // MAISON DE DEPART (qui génère +4 maxPop et spawn 2 fermiers)
            let startHouse = new Building(base.x - 100, base.y, 'house');
            buildings.push(startHouse);
            
            units.push(new Unit(startHouse.x - 20, startHouse.y + 30, 'farmer'));
            units.push(new Unit(startHouse.x + 20, startHouse.y + 30, 'farmer'));
            
            updateUI();
            renderBottomUI();
        }

        // --- INPUTS ---
        function getPointerPos(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        canvas.addEventListener('mousedown', (e) => {
            if(gameState !== 'PLAYING') return;
            const pos = getPointerPos(e);

            if(moveMode) {
                if(e.button === 0) {
                    moveMode.x = pos.x; moveMode.y = pos.y;
                    spawnParticles(pos.x, pos.y, 'var(--neon-cyan)', 20);
                    moveMode = null; instructions.style.display = 'none'; renderBottomUI();
                }
                if(e.button === 2) { moveMode = null; instructions.style.display = 'none'; }
                return;
            }

            if(buildMode) {
                if(e.button === 0) placeBuilding(pos);
                if(e.button === 2) setBuildMode(null);
                return;
            }

            if(e.button === 0) {
                isSelecting = true; inputMode = 'mouse';
                selectionStart = pos; selectionCurrent = { ...pos };
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            mouseHover = getPointerPos(e);
            if (!isSelecting) return;
            selectionCurrent = mouseHover;
        });

        canvas.addEventListener('mouseup', (e) => {
            if (!isSelecting || gameState !== 'PLAYING') return;
            isSelecting = false;

            let minX = Math.min(selectionStart.x, selectionCurrent.x);
            let maxX = Math.max(selectionStart.x, selectionCurrent.x);
            let minY = Math.min(selectionStart.y, selectionCurrent.y);
            let maxY = Math.max(selectionStart.y, selectionCurrent.y);

            let isClick = (maxX - minX < 10 && maxY - minY < 10);

            if (isClick && inputMode === 'mouse') {
                let clickedUnit = units.find(u => dist(selectionStart, u) < u.radius + 15 && u.state !== 'farming');
                if (clickedUnit) {
                    selectedUnits = [clickedUnit];
                    selectedBuilding = null;
                } else {
                    selectedUnits = [];
                    let clickedBuild = buildings.find(b => dist(selectionStart, b) < b.size/2 + 10);
                    if(clickedBuild) {
                        selectedBuilding = clickedBuild;
                    } else if (dist(selectionStart, base) < base.size/2 + 10) {
                        selectedBuilding = base; // CLIC SUR HDV
                    } else {
                        selectedBuilding = null;
                    }
                }
                renderBottomUI();
            } else if (!isClick) {
                selectedUnits = units.filter(u => u.x > minX && u.x < maxX && u.y > minY && u.y < maxY && u.state !== 'farming');
                selectedBuilding = null; renderBottomUI();
            }
        });

        canvas.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            if(gameState !== 'PLAYING' || selectedUnits.length === 0 || buildMode || moveMode) return;
            const pos = getPointerPos(e);

            let clickedEnemy = enemies.find(en => dist(pos, en) < en.radius + 15);
            let clickedTree = trees.find(t => dist(pos, t) < t.radius + 15);
            let clickedWheat = wheats.find(w => dist(pos, w) < w.radius + 15);
            let clickedBuild = buildings.find(b => ['farm','sawmill','mine'].includes(b.type) && dist(pos, b) < b.size);

            issueCommand(pos.x, pos.y, clickedEnemy || clickedTree || clickedWheat || clickedBuild);
            spawnParticles(pos.x, pos.y, 'var(--neon-cyan)', 5);
        });

        function issueCommand(x, y, entity) {
            selectedUnits.forEach((u, i) => {
                let dx = x + (i%3)*25 - 25; 
                let dy = y + Math.floor(i/3)*25;
                u.setCommand(entity ? entity.x : dx, entity ? entity.y : dy, entity);
            });
        }

        // --- CONSTRUCTION & RECRUTEMENT ---
        function setBuildMode(type) {
            buildMode = buildMode === type ? null : type;
            document.querySelectorAll('.build-btn').forEach(b => b.classList.remove('active-mode'));
            if(buildMode) {
                let el = document.getElementById('btn-b-' + buildMode);
                if(el) el.classList.add('active-mode');
                instructions.style.display = 'block';
            } else {
                instructions.style.display = 'none';
            }
        }

        function getBuildingCost(type) {
            if(type === 'house') return { g: 0, w: 10, f: 10 };
            if(type === 'sawmill') return { g: 0, w: 30, f: 20 };
            if(type === 'farm') return { g: 0, w: 30, f: 20 };
            if(type === 'mine') return { g: 0, w: 50, f: 50 };
            if(type === 'barracks' || type === 'archery' || type === 'mage') return { g: 50, w: 50, f: 0 };
            if(type === 'tower') return { g: 100, w: 50, f: 0 };
            return {g:0,w:0,f:0};
        }

        function placeBuilding(pos) {
            if(buildMode === 'house') {
                let hc = buildings.filter(b => b.type === 'house').length;
                if(hc >= 10) { alert("Limite de 10 maisons atteinte."); setBuildMode(null); return; }
            }

            let cost = getBuildingCost(buildMode);
            if(res.gold >= cost.g && res.wood >= cost.w && res.food >= cost.f) {
                res.gold -= cost.g; res.wood -= cost.w; res.food -= cost.f;
                
                let b = new Building(pos.x, pos.y, buildMode);
                buildings.push(b);
                spawnParticles(pos.x, pos.y, 'var(--neon-cyan)', 20);
                
                // Spawn gratuit de 2 fermiers si c'est une maison !
                if(buildMode === 'house') {
                    units.push(new Unit(pos.x - 20, pos.y + 30, 'farmer'));
                    units.push(new Unit(pos.x + 20, pos.y + 30, 'farmer'));
                }
                
                setBuildMode(null); updateUI();
            } else { alert("Ressources insuffisantes !"); setBuildMode(null); }
        }

        function upgradeBuilding(b) {
            if (res.gold >= 100 && res.wood >= 100) {
                res.gold -= 100; res.wood -= 100;
                b.level = 2;
                spawnParticles(b.x, b.y, 'var(--neon-yellow)', 30);
                updateUI(); renderBottomUI();
            } else { alert("Besoin de 100 Or et 100 Bois."); }
        }

        function buyUnit(type, element) {
            if(res.pop >= res.maxPop) { alert("Population Max ! Construisez des maisons."); return; }
            
            let costGold = 0, costFood = 0;
            if(type === 'farmer') { costGold = 0; costFood = 10; }
            else {
                costGold = element === 'normal' ? 20 : 40;
                costFood = element === 'normal' ? 20 : 40;
            }

            if (res.gold >= costGold && res.food >= costFood) {
                res.gold -= costGold; res.food -= costFood;
                let sx = selectedBuilding ? selectedBuilding.x : base.x;
                let sy = selectedBuilding ? selectedBuilding.y + 60 : base.y + 70;
                units.push(new Unit(sx, sy, type, element));
                updateUI();
            } else { alert("Ressources insuffisantes !"); }
        }

        function updateUI() {
            uiGold.innerText = Math.floor(res.gold);
            uiWood.innerText = Math.floor(res.wood);
            uiFood.innerText = Math.floor(res.food);
            uiPop.innerText = res.pop;
            uiMaxPop.innerText = res.maxPop;
        }

        // --- BOUCLE PRINCIPALE ---
        let lastTime = performance.now();
        let ecoTimer = 0;

        function update(dt) {
            if (gameState !== 'PLAYING') return;
            survivalTimer += dt;
            ecoTimer += dt;

            // ÉCONOMIE PASSIVE AUTOMATISÉE
            if (ecoTimer >= 1) {
                ecoTimer = 0;
                let farmOutput=0, mineOutput=0, sawOutput=0;
                buildings.forEach(b => { 
                    if(b.type === 'farm') farmOutput += b.farmersInside * 2; 
                    if(b.type === 'mine') mineOutput += b.farmersInside * 1.5; 
                    if(b.type === 'sawmill') sawOutput += b.farmersInside * 2; 
                });
                res.food += farmOutput; res.gold += mineOutput; res.wood += sawOutput;
                res.food -= res.pop * 0.2; 
                if(res.food < 0) { res.food = 0; }
                updateUI();
            }

            // Vagues d'ennemis
            waveTimer -= dt;
            if (waveTimer <= 0) {
                let count = 1 + Math.floor(survivalTimer / 60);
                for(let i=0; i<count; i++) {
                    let spawnX = Math.random() > 0.5 ? -20 : width + 20;
                    let spawnY = Math.random() * height;
                    enemies.push(new Enemy(spawnX, spawnY));
                }
                waveTimer = 15;
            }

            if (base.hp <= 0) {
                gameState = 'GAMEOVER'; gameOverScreen.style.display = 'block';
                spawnParticles(base.x, base.y, 'var(--neon-red)', 50);
            }

            buildings.forEach(b => b.update(dt));

            for (let i = units.length - 1; i >= 0; i--) {
                units[i].update(dt);
                if (units[i].hp <= 0) {
                    spawnParticles(units[i].x, units[i].y, units[i].color, 15);
                    if(selectedUnits.includes(units[i])) selectedUnits.splice(selectedUnits.indexOf(units[i]), 1);
                    units.splice(i, 1);
                    res.pop--; updateUI();
                }
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                enemies[i].update(dt);
                if (enemies[i].hp <= 0) {
                    spawnParticles(enemies[i].x, enemies[i].y, enemies[i].color, 15);
                    res.gold += 5; updateUI();
                    enemies.splice(i, 1);
                }
            }

            for (let i = trees.length - 1; i >= 0; i--) { if (trees[i].amount <= 0) trees.splice(i, 1); }
            for (let i = wheats.length - 1; i >= 0; i--) { if (wheats[i].amount <= 0) wheats.splice(i, 1); }

            particles.forEach((p, i) => { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; if(p.life <= 0) particles.splice(i, 1); });
            lasers.forEach((l, i) => { l.life -= dt; if(l.life <= 0) lasers.splice(i, 1); });
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);

            if (images.map.complete && images.map.naturalWidth > 0) ctx.drawImage(images.map, 0, 0, width, height);

            if (gameState === 'PLAYING' || gameState === 'GAMEOVER') {
                trees.forEach(t => t.draw());
                wheats.forEach(w => w.draw());
                buildings.forEach(b => b.draw());
                if (base.hp > 0) base.draw();

                units.forEach(u => u.draw());
                enemies.forEach(e => e.draw());

                lasers.forEach(l => {
                    ctx.strokeStyle = l.color; ctx.lineWidth = 3; ctx.shadowBlur = 10; ctx.shadowColor = l.color;
                    ctx.beginPath(); ctx.moveTo(l.x1, l.y1); ctx.lineTo(l.x2, l.y2); ctx.stroke(); ctx.shadowBlur = 0;
                });

                particles.forEach(p => {
                    ctx.fillStyle = p.color; ctx.globalAlpha = p.life;
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                });
                ctx.globalAlpha = 1;

                if (isSelecting && inputMode === 'mouse') {
                    ctx.strokeStyle = 'rgba(0, 240, 255, 0.5)'; ctx.lineWidth = 1; ctx.fillStyle = 'rgba(0, 240, 255, 0.1)';
                    let w = selectionCurrent.x - selectionStart.x; let h = selectionCurrent.y - selectionStart.y;
                    ctx.fillRect(selectionStart.x, selectionStart.y, w, h); ctx.strokeRect(selectionStart.x, selectionStart.y, w, h);
                }

                // Fantôme de construction & Déplacement
                let activeGhost = buildMode || (moveMode ? moveMode.type : null);
                if (activeGhost) {
                    let img = null;
                    if(activeGhost === 'house') img = images.house;
                    if(activeGhost === 'farm') img = images.farm;
                    if(activeGhost === 'sawmill') img = images.sawmill;
                    if(activeGhost === 'mine') img = images.mine;
                    if(activeGhost === 'barracks') img = images.barracks;
                    if(activeGhost === 'archery') img = images.archery;
                    if(activeGhost === 'mage') img = images.mageTower;
                    if(activeGhost === 'tower') img = images.tower;

                    let size = (activeGhost === 'barracks' || activeGhost === 'archery' || activeGhost === 'mage') ? 80 : 64;
                    if(activeGhost === 'tower') size = 50;

                    ctx.globalAlpha = 0.5;
                    if (img && img.complete && img.naturalWidth > 0) {
                        ctx.drawImage(img, mouseHover.x - size/2, mouseHover.y - size/2, size, size);
                    } else {
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.5)'; ctx.fillRect(mouseHover.x - size/2, mouseHover.y - size/2, size, size);
                    }
                    ctx.globalAlpha = 1.0;
                }
            }
        }

        function loop(timestamp) {
            const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
            lastTime = timestamp;
            update(dt); draw();
            requestAnimationFrame(loop);
        }

        initGame();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
