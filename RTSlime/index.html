<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber-Command : Micro RTS</title>
    <style>
        /* =========================================
           1. VARIABLES CYBERPUNK ET RESET
           ========================================= */
        :root {
            --bg-color: #050508;
            --neon-cyan: #00f0ff;
            --neon-pink: #ff007f;
            --neon-green: #39ff14;
            --neon-yellow: #fce803;
            --neon-red: #ff3333;
            --neon-purple: #b000ff;
            --neon-orange: #ff8c00;
            --text-color: #e0e0e0;
            --font-ui: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-color); color: var(--text-color);
            font-family: var(--font-ui); overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            user-select: none; -webkit-user-select: none;
        }

        /* Background Grid */
        body::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px; z-index: -1;
        }

        /* =========================================
           2. BOUTON RETOUR HUB
           ========================================= */
        #btn-retour-hub {
            position: fixed; top: 15px; left: 15px; z-index: 9999;
            background-color: rgba(0, 0, 0, 0.8); border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan); padding: 8px 15px; font-weight: bold;
            font-size: 14px; border-radius: 6px; cursor: pointer;
            text-decoration: none; transition: 0.3s ease; text-transform: uppercase;
        }
        #btn-retour-hub:hover { background-color: var(--neon-cyan); color: #000; box-shadow: 0 0 15px var(--neon-cyan); }

        /* =========================================
           3. UI DU RTS (Ressources & Build)
           ========================================= */
        #ui-top {
            position: absolute; top: 15px; right: 20px; z-index: 10;
            background: rgba(0,0,0,0.8); border: 1px solid #333;
            padding: 10px 20px; border-radius: 8px; box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            font-size: 1.1rem; font-weight: bold;
            display: flex; align-items: center; gap: 20px;
        }
        .res-gold { color: var(--neon-yellow); text-shadow: 0 0 5px var(--neon-yellow); }
        .res-wood { color: var(--neon-orange); text-shadow: 0 0 5px var(--neon-orange); }
        .res-food { color: var(--neon-green); text-shadow: 0 0 5px var(--neon-green); }
        .res-pop { color: var(--text-color); }

        #ui-bottom {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10;
            background: rgba(0,0,0,0.85); border: 2px solid var(--neon-cyan);
            padding: 10px; border-radius: 12px; display: flex; gap: 10px;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2); backdrop-filter: blur(5px);
            max-width: 95vw; overflow-x: auto; white-space: nowrap;
        }
        
        /* Custom Scrollbar for bottom UI */
        #ui-bottom::-webkit-scrollbar { height: 6px; }
        #ui-bottom::-webkit-scrollbar-thumb { background: var(--neon-cyan); border-radius: 3px; }

        .build-btn {
            background: transparent; border: 2px solid gray; color: gray;
            padding: 8px 15px; font-size: 0.9rem; font-weight: bold; text-transform: uppercase;
            border-radius: 6px; cursor: pointer; transition: 0.2s;
            display: flex; flex-direction: column; align-items: center; gap: 5px; flex-shrink: 0;
        }
        .build-btn span { font-size: 0.75rem; opacity: 0.9; }
        .build-btn:hover { transform: translateY(-2px); }
        
        /* Couleurs dynamiques selon les catégories */
        .color-build { border-color: var(--neon-cyan); color: var(--neon-cyan); }
        .color-build:hover { background: var(--neon-cyan); color: #000; box-shadow: 0 0 15px var(--neon-cyan); }
        
        .color-recruit { border-color: var(--neon-pink); color: var(--neon-pink); }
        .color-recruit:hover { background: var(--neon-pink); color: #000; box-shadow: 0 0 15px var(--neon-pink); }

        .active-mode { background: var(--text-color) !important; color: #000 !important; box-shadow: 0 0 20px white !important; }

        #game-over-screen {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.95); border: 2px solid var(--neon-red);
            padding: 40px; border-radius: 12px; text-align: center; z-index: 50; display: none;
            box-shadow: 0 0 30px var(--neon-red);
        }
        #game-over-screen h1 { color: var(--neon-red); text-shadow: 0 0 15px var(--neon-red); margin-top:0; font-size: 3rem; text-transform: uppercase;}
        .restart-btn {
            background: transparent; border: 2px solid var(--neon-cyan); color: var(--neon-cyan);
            padding: 15px 30px; font-size: 1.2rem; cursor: pointer; border-radius: 6px; text-transform: uppercase; font-weight:bold;
            margin-top: 20px; transition: 0.3s;
        }
        .restart-btn:hover { background: var(--neon-cyan); color: #000; box-shadow: 0 0 20px var(--neon-cyan); }

        #build-instructions {
            position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); color: white; padding: 10px 20px; border-radius: 8px;
            border: 1px solid #555; pointer-events: none; display: none; z-index: 10;
        }

        #game-container { position: relative; width: 100%; height: 100%; touch-action: none; }
        canvas { display: block; width: 100%; height: 100%; }

    </style>
</head>
<body>

    <!-- PROTECTION SWIPE -->
    <script>
        document.addEventListener('touchstart', (e) => { 
            if(e.target.closest('.no-swipe')) e.stopPropagation(); 
        }, { passive: false });
        document.addEventListener('contextmenu', event => event.preventDefault());
    </script>

    <a href="../index.html" id="btn-retour-hub">&#11013; HUB</a>

    <div id="game-container" class="no-swipe">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-top">
            <span class="res-gold">💰 <span id="val-gold">50</span></span>
            <span class="res-wood">🪵 <span id="val-wood">100</span></span>
            <span class="res-food">🍞 <span id="val-food">50</span></span>
            <span class="res-pop">👥 <span id="val-pop">0</span>/<span id="val-maxpop">0</span></span>
        </div>

        <div id="build-instructions">Clic Gauche pour Placer - Clic Droit pour Annuler</div>

        <div id="ui-bottom">
            <!-- BATIMENTS -->
            <button class="build-btn color-build" id="btn-b-house" onclick="setBuildMode('house')">MAISON <span>10💰 20🪵</span></button>
            <button class="build-btn color-build" id="btn-b-farm" onclick="setBuildMode('farm')">FERME <span>10💰 30🪵</span></button>
            <button class="build-btn color-build" id="btn-b-barracks" onclick="setBuildMode('barracks')">CASERNE <span>50💰 50🪵</span></button>
            <button class="build-btn color-build" id="btn-b-archery" onclick="setBuildMode('archery')">STAND TIR <span>50💰 50🪵</span></button>
            <button class="build-btn color-build" id="btn-b-mage" onclick="setBuildMode('mage')">T. MAGE <span>80💰 80🪵</span></button>
            
            <div style="min-width: 2px; background: #555; margin: 0 5px;"></div>
            
            <!-- RECRUTEMENT -->
            <button class="build-btn color-recruit" onclick="buyUnit('farmer')">FERMIER <span>10💰 10🍞</span></button>
            <button class="build-btn color-recruit" onclick="buyUnit('warrior')">GUERRIER <span>20💰 20🍞</span></button>
            <button class="build-btn color-recruit" onclick="buyUnit('archer')">ARCHER <span>30💰 20🍞</span></button>
            <button class="build-btn color-recruit" onclick="buyUnit('mage')">MAGE <span>50💰 30🍞</span></button>
        </div>

        <div id="game-over-screen">
            <h1>MATRICE DÉTRUITE</h1>
            <p>L'Hôtel de Ville a été corrompu par l'infection.</p>
            <button class="restart-btn" onclick="initGame()">Reboot Système</button>
        </div>
    </div>

    <!-- MOTEUR RTS -->
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        // Éléments DOM
        const uiGold = document.getElementById('val-gold');
        const uiWood = document.getElementById('val-wood');
        const uiFood = document.getElementById('val-food');
        const uiPop = document.getElementById('val-pop');
        const uiMaxPop = document.getElementById('val-maxpop');
        const gameOverScreen = document.getElementById('game-over-screen');
        const instructions = document.getElementById('build-instructions');

        // Etat du jeu
        let gameState = 'PLAYING';
        let res = { gold: 50, wood: 100, food: 50, pop: 0, maxPop: 0 };
        let buildMode = null;
        let waveTimer = 0;
        let survivalTimer = 0;

        // Entités
        let base = null;
        let buildings = [];
        let units = [];
        let enemies = [];
        let trees = [];
        let particles = [];
        let lasers = [];

        // Système de Sélection
        let selectedUnits = [];
        let isSelecting = false;
        let selectionStart = { x: 0, y: 0 };
        let selectionCurrent = { x: 0, y: 0 };
        let inputMode = 'mouse'; 
        let mouseHover = { x: 0, y: 0 };

        // --- CLASSES ---

        class Base {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.size = 80;
                this.hp = 1000; this.maxHp = 1000;
                this.color = 'var(--neon-cyan)';
            }
            draw() {
                ctx.fillStyle = '#0b0c10';
                ctx.fillRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);
                ctx.shadowBlur = 20; ctx.shadowColor = this.color;
                ctx.strokeStyle = this.color; ctx.lineWidth = 4;
                ctx.strokeRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);
                ctx.shadowBlur = 0;

                // Barre de vie
                ctx.fillStyle = 'red'; ctx.fillRect(this.x - this.size/2, this.y - this.size/2 - 15, this.size, 5);
                ctx.fillStyle = 'var(--neon-green)'; ctx.fillRect(this.x - this.size/2, this.y - this.size/2 - 15, this.size * (this.hp / this.maxHp), 5);
            }
        }

        class Building {
            constructor(x, y, type) {
                this.x = x; this.y = y; this.type = type;
                this.size = 50;
                this.farmersInside = 0; // Pour les fermes

                if(type === 'house') { this.color = 'var(--neon-yellow)'; res.maxPop += 2; }
                if(type === 'farm') { this.color = 'var(--neon-green)'; }
                if(type === 'barracks') { this.color = 'var(--neon-red)'; this.size = 60; }
                if(type === 'archery') { this.color = 'var(--neon-pink)'; this.size = 60; }
                if(type === 'mage') { this.color = 'var(--neon-purple)'; this.size = 60; }
            }
            draw() {
                ctx.fillStyle = 'rgba(0,0,0,0.8)';
                ctx.fillRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);
                ctx.strokeStyle = this.color; ctx.lineWidth = 2;
                ctx.strokeRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);
                
                // Texte descriptif
                ctx.fillStyle = this.color; ctx.font = '12px Arial'; ctx.textAlign = 'center';
                let icon = '';
                if(this.type === 'house') icon = '🏠';
                if(this.type === 'barracks') icon = '⚔️';
                if(this.type === 'archery') icon = '🏹';
                if(this.type === 'mage') icon = '🔮';
                
                if(this.type === 'farm') {
                    ctx.fillText(`${this.farmersInside}/5 🧑‍🌾`, this.x, this.y + 5);
                } else {
                    ctx.fillText(icon, this.x, this.y + 5);
                }
            }
        }

        class Tree {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.radius = 15;
                this.amount = 500; // Quantité de bois
                this.color = 'var(--neon-orange)';
            }
            draw() {
                ctx.shadowBlur = 10; ctx.shadowColor = this.color;
                ctx.beginPath();
                for (let i = 0; i < 6; i++) {
                    ctx.lineTo(this.x + this.radius * Math.cos(i * Math.PI / 3), this.y + this.radius * Math.sin(i * Math.PI / 3));
                }
                ctx.closePath();
                ctx.fillStyle = '#111'; ctx.fill();
                ctx.strokeStyle = this.color; ctx.lineWidth = 2; ctx.stroke();
                ctx.shadowBlur = 0;
            }
        }

        class Unit {
            constructor(x, y, type) {
                this.x = x; this.y = y; this.type = type;
                this.targetPos = null; this.targetEntity = null;
                this.state = 'idle'; // idle, moving, gathering, returning, attacking, farming
                this.radius = 8;
                res.pop++;

                if (type === 'farmer') { this.color = '#ccc'; this.speed = 100; this.hp = 30; this.payload = 0; }
                if (type === 'warrior') { this.color = 'var(--neon-red)'; this.speed = 90; this.hp = 150; this.damage = 15; this.range = 20; this.cooldown = 1; }
                if (type === 'archer') { this.color = 'var(--neon-pink)'; this.speed = 80; this.hp = 80; this.damage = 10; this.range = 150; this.cooldown = 0.8; }
                if (type === 'mage') { this.color = 'var(--neon-purple)'; this.speed = 70; this.hp = 100; this.damage = 25; this.range = 100; this.cooldown = 1.5; }
                
                this.maxHp = this.hp;
                this.currentCooldown = 0;
            }

            setCommand(x, y, entity = null) {
                // Si on était dans une ferme, on en sort
                if(this.state === 'farming' && this.targetEntity) {
                    this.targetEntity.farmersInside--;
                }

                this.targetPos = { x, y };
                this.targetEntity = entity;
                
                if (this.type === 'farmer' && entity instanceof Tree) this.state = 'moving_to_tree';
                else if (this.type === 'farmer' && entity instanceof Building && entity.type === 'farm') this.state = 'moving_to_farm';
                else if (this.type !== 'farmer' && entity instanceof Enemy) this.state = 'attacking';
                else this.state = 'moving';
            }

            update(dt) {
                if (this.currentCooldown > 0) this.currentCooldown -= dt;

                // --- FERMIER ---
                if (this.type === 'farmer') {
                    if (this.state === 'moving_to_tree' && this.targetEntity) {
                        if (dist(this, this.targetEntity) < this.radius + this.targetEntity.radius + 5) {
                            this.state = 'gathering'; this.targetPos = null;
                        }
                    } 
                    else if (this.state === 'gathering') {
                        if(this.targetEntity.amount > 0) {
                            this.payload += 15 * dt; // Mine 15 bois / sec
                            this.targetEntity.amount -= 15 * dt;
                            if (this.payload >= 20) {
                                this.payload = 20;
                                this.targetEntity = base;
                                this.targetPos = { x: base.x, y: base.y };
                                this.state = 'returning';
                            }
                        } else {
                            this.state = 'idle';
                        }
                    }
                    else if (this.state === 'returning') {
                        if (dist(this, base) < this.radius + base.size/2 + 5) {
                            res.wood += Math.floor(this.payload);
                            this.payload = 0;
                            let closestRes = getClosest(this, trees);
                            if(closestRes) this.setCommand(closestRes.x, closestRes.y, closestRes);
                            else this.state = 'idle';
                        }
                    }
                    else if (this.state === 'moving_to_farm' && this.targetEntity) {
                        if (dist(this, this.targetEntity) < this.targetEntity.size/2 + 5) {
                            if(this.targetEntity.farmersInside < 5) {
                                this.state = 'farming';
                                this.targetEntity.farmersInside++;
                                this.targetPos = null;
                            } else {
                                this.state = 'idle'; // Plein
                            }
                        }
                    }
                } 
                // --- COMBATTANTS ---
                else {
                    if (this.state === 'attacking' && this.targetEntity) {
                        if(this.targetEntity.hp <= 0) {
                            this.targetEntity = null; this.state = 'idle';
                        } else if (dist(this, this.targetEntity) <= this.range) {
                            this.targetPos = null; // Stoppe le mouvement
                            if (this.currentCooldown <= 0) {
                                this.targetEntity.hp -= this.damage;
                                this.currentCooldown = this.cooldown;
                                spawnLaser(this, this.targetEntity, this.color);
                            }
                        } else {
                            this.targetPos = { x: this.targetEntity.x, y: this.targetEntity.y }; // Poursuite
                        }
                    }
                }

                // MOUVEMENT PHYSIQUE
                if (this.targetPos) {
                    let d = dist(this, this.targetPos);
                    if (d > 5) {
                        this.x += ((this.targetPos.x - this.x) / d) * this.speed * dt;
                        this.y += ((this.targetPos.y - this.y) / d) * this.speed * dt;
                    } else if (this.state === 'moving' || this.state === 'moving_to_farm') {
                        this.state = 'idle'; this.targetPos = null;
                    }
                }
            }

            draw() {
                if(this.state === 'farming') return; // Caché dans la ferme

                ctx.fillStyle = '#111';
                if(selectedUnits.includes(this)) {
                    ctx.shadowBlur = 10; ctx.shadowColor = this.color;
                }

                ctx.beginPath();
                if (this.type === 'farmer') ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                else if (this.type === 'warrior') { ctx.moveTo(this.x, this.y-this.radius); ctx.lineTo(this.x+this.radius, this.y+this.radius); ctx.lineTo(this.x-this.radius, this.y+this.radius); }
                else if (this.type === 'archer') { ctx.moveTo(this.x, this.y-this.radius); ctx.lineTo(this.x+this.radius, this.y); ctx.lineTo(this.x, this.y+this.radius); ctx.lineTo(this.x-this.radius, this.y); }
                else if (this.type === 'mage') { 
                    for(let i=0; i<5; i++) { ctx.lineTo(this.x + this.radius * Math.cos(i*Math.PI*2/5 - Math.PI/2), this.y + this.radius * Math.sin(i*Math.PI*2/5 - Math.PI/2)); }
                }
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = this.color; ctx.lineWidth = 2; ctx.stroke();
                ctx.shadowBlur = 0;

                // Barre de vie (Combattants)
                if(this.type !== 'farmer' && this.hp < this.maxHp) {
                    ctx.fillStyle = 'red'; ctx.fillRect(this.x - 10, this.y - this.radius - 8, 20, 3);
                    ctx.fillStyle = 'var(--neon-green)'; ctx.fillRect(this.x - 10, this.y - this.radius - 8, 20 * (this.hp/this.maxHp), 3);
                }
                // Payload Fermier
                if(this.payload > 0) {
                    ctx.fillStyle = 'var(--neon-orange)';
                    ctx.fillRect(this.x - 5, this.y - this.radius - 6, 10 * (this.payload/20), 3);
                }
            }
        }

        class Enemy {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.radius = 12;
                this.speed = 40 + Math.random() * 30;
                this.hp = 60 + Math.floor(survivalTimer); // Plus on survit, plus ils ont de vie
                this.maxHp = this.hp;
                this.color = 'var(--neon-red)';
                this.attackCooldown = 0;
            }

            update(dt) {
                if(this.attackCooldown > 0) this.attackCooldown -= dt;

                let target = base;
                for(let u of units) {
                    if(dist(this, u) < 150 && u.state !== 'farming') { target = u; break; }
                }

                let d = dist(this, target);
                let range = target === base ? base.size/2 + this.radius : this.radius + target.radius;

                if (d > range + 5) {
                    this.x += ((target.x - this.x) / d) * this.speed * dt;
                    this.y += ((target.y - this.y) / d) * this.speed * dt;
                } else if (this.attackCooldown <= 0) {
                    target.hp -= 10;
                    this.attackCooldown = 1;
                    spawnParticles(target.x, target.y, this.color, 5);
                }
            }

            draw() {
                ctx.shadowBlur = 10; ctx.shadowColor = this.color;
                ctx.fillStyle = '#111'; ctx.strokeStyle = this.color; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
                ctx.fill(); ctx.stroke();
                
                // Croix de virus
                ctx.beginPath(); ctx.moveTo(this.x-5, this.y-5); ctx.lineTo(this.x+5, this.y+5);
                ctx.moveTo(this.x+5, this.y-5); ctx.lineTo(this.x-5, this.y+5); ctx.stroke();
                ctx.shadowBlur = 0;

                if(this.hp < this.maxHp) {
                    ctx.fillStyle = 'red'; ctx.fillRect(this.x - 10, this.y - this.radius - 8, 20, 3);
                    ctx.fillStyle = 'var(--neon-green)'; ctx.fillRect(this.x - 10, this.y - this.radius - 8, 20 * (this.hp/this.maxHp), 3);
                }
            }
        }

        // --- UTILITAIRES ---
        function dist(a, b) { return Math.hypot(b.x - a.x, b.y - a.y); }
        function getClosest(entity, array) {
            let closest = null; let minDist = Infinity;
            for(let o of array) { let d = dist(entity, o); if(d < minDist) { minDist = d; closest = o; } }
            return closest;
        }

        function spawnParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x, y: y, vx: (Math.random()-0.5)*100, vy: (Math.random()-0.5)*100,
                    size: Math.random()*3+1, color: color, life: 0.5 + Math.random()*0.5
                });
            }
        }
        function spawnLaser(a, b, color) { lasers.push({ x1:a.x, y1:a.y, x2:b.x, y2:b.y, color:color, life:0.15 }); }

        function resize() {
            width = window.innerWidth; height = window.innerHeight;
            canvas.width = width; canvas.height = height;
            if(base) { base.x = width/2; base.y = height/2 + 50; }
        }
        window.addEventListener('resize', resize); 

        // --- INITIALISATION ---
        function initGame() {
            gameState = 'PLAYING';
            res = { gold: 50, wood: 100, food: 50, pop: 0, maxPop: 0 };
            survivalTimer = 0; waveTimer = 15;
            units = []; enemies = []; trees = []; buildings = []; particles = []; lasers = []; selectedUnits = [];
            buildMode = null; updateBuildUI();
            gameOverScreen.style.display = 'none';

            resize();
            base = new Base(width/2, height/2 + 50);

            // Arbres
            for(let i=0; i<15; i++) {
                let tx = Math.random() * width; let ty = Math.random() * height;
                if (dist({x:tx, y:ty}, base) > 150) trees.push(new Tree(tx, ty));
            }

            units.push(new Unit(base.x - 40, base.y + 40, 'farmer'));
            updateUI();
        }

        // --- INPUTS ---
        function getPointerPos(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        canvas.addEventListener('mousedown', (e) => {
            if(gameState !== 'PLAYING') return;
            const pos = getPointerPos(e);

            if(buildMode) {
                if(e.button === 0) placeBuilding(pos);
                if(e.button === 2) setBuildMode(null);
                return;
            }

            if(e.button === 0) {
                isSelecting = true; inputMode = 'mouse';
                selectionStart = pos; selectionCurrent = { ...pos };
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            mouseHover = getPointerPos(e);
            if (!isSelecting) return;
            selectionCurrent = mouseHover;
        });

        canvas.addEventListener('mouseup', (e) => {
            if (!isSelecting || gameState !== 'PLAYING') return;
            isSelecting = false;

            let minX = Math.min(selectionStart.x, selectionCurrent.x);
            let maxX = Math.max(selectionStart.x, selectionCurrent.x);
            let minY = Math.min(selectionStart.y, selectionCurrent.y);
            let maxY = Math.max(selectionStart.y, selectionCurrent.y);

            let isClick = (maxX - minX < 10 && maxY - minY < 10);

            if (isClick && inputMode === 'mouse') {
                let clickedUnit = units.find(u => dist(selectionStart, u) < u.radius + 10 && u.state !== 'farming');
                if (clickedUnit) selectedUnits = [clickedUnit];
                else selectedUnits = [];
            } else if (!isClick) {
                selectedUnits = units.filter(u => u.x > minX && u.x < maxX && u.y > minY && u.y < maxY && u.state !== 'farming');
            }
        });

        // Tactile (simplifié)
        canvas.addEventListener('touchstart', (e) => {
            if(gameState !== 'PLAYING') return;
            const pos = getPointerPos(e);
            if(buildMode) { placeBuilding(pos); return; }

            inputMode = 'touch'; isSelecting = true;
            selectionStart = pos; selectionCurrent = { ...pos };
        }, {passive: false});

        canvas.addEventListener('touchmove', (e) => {
            mouseHover = getPointerPos(e);
            if (!isSelecting) return;
            selectionCurrent = mouseHover;
        }, {passive: false});

        canvas.addEventListener('touchend', (e) => {
            if (!isSelecting || gameState !== 'PLAYING') return;
            isSelecting = false;
            let isClick = (dist(selectionStart, selectionCurrent) < 10);

            if (isClick && inputMode === 'touch') {
                let clickedEnemy = enemies.find(en => dist(selectionStart, en) < en.radius + 15);
                let clickedTree = trees.find(t => dist(selectionStart, t) < t.radius + 15);
                let clickedFarm = buildings.find(b => b.type === 'farm' && dist(selectionStart, b) < b.size);
                
                if (selectedUnits.length > 0 && (clickedEnemy || clickedTree || clickedFarm || dist(selectionStart, base) > base.size)) {
                    issueCommand(selectionStart.x, selectionStart.y, clickedEnemy || clickedTree || clickedFarm);
                } else {
                    let clickedUnit = units.find(u => dist(selectionStart, u) < u.radius + 15 && u.state !== 'farming');
                    if (clickedUnit) selectedUnits = [clickedUnit];
                    else selectedUnits = [];
                }
            } else if (!isClick) {
                let minX = Math.min(selectionStart.x, selectionCurrent.x);
                let maxX = Math.max(selectionStart.x, selectionCurrent.x);
                let minY = Math.min(selectionStart.y, selectionCurrent.y);
                let maxY = Math.max(selectionStart.y, selectionCurrent.y);
                selectedUnits = units.filter(u => u.x > minX && u.x < maxX && u.y > minY && u.y < maxY && u.state !== 'farming');
            }
        });

        canvas.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            if(gameState !== 'PLAYING' || selectedUnits.length === 0 || buildMode) return;
            const pos = getPointerPos(e);

            let clickedEnemy = enemies.find(en => dist(pos, en) < en.radius + 15);
            let clickedTree = trees.find(t => dist(pos, t) < t.radius + 15);
            let clickedFarm = buildings.find(b => b.type === 'farm' && dist(pos, b) < b.size);

            issueCommand(pos.x, pos.y, clickedEnemy || clickedTree || clickedFarm);
            spawnParticles(pos.x, pos.y, 'var(--neon-cyan)', 5);
        });

        function issueCommand(x, y, entity) {
            selectedUnits.forEach((u, i) => {
                let dx = x + (i%3)*20 - 20;
                let dy = y + Math.floor(i/3)*20;
                u.setCommand(entity ? entity.x : dx, entity ? entity.y : dy, entity);
            });
        }

        // --- GESTION CONSTRUCTION & RECRUTEMENT ---
        function setBuildMode(type) {
            buildMode = buildMode === type ? null : type;
            updateBuildUI();
        }

        function updateBuildUI() {
            document.querySelectorAll('.build-btn').forEach(b => b.classList.remove('active-mode'));
            if(buildMode) {
                document.getElementById('btn-b-' + buildMode).classList.add('active-mode');
                instructions.style.display = 'block';
            } else {
                instructions.style.display = 'none';
            }
        }

        function placeBuilding(pos) {
            let costGold = 0, costWood = 0;
            if(buildMode === 'house') { costGold = 10; costWood = 20; }
            if(buildMode === 'farm') { costGold = 10; costWood = 30; }
            if(buildMode === 'barracks') { costGold = 50; costWood = 50; }
            if(buildMode === 'archery') { costGold = 50; costWood = 50; }
            if(buildMode === 'mage') { costGold = 80; costWood = 80; }

            if(res.gold >= costGold && res.wood >= costWood) {
                res.gold -= costGold; res.wood -= costWood;
                buildings.push(new Building(pos.x, pos.y, buildMode));
                spawnParticles(pos.x, pos.y, 'var(--neon-cyan)', 20);
                setBuildMode(null);
                updateUI();
            } else {
                alert("Ressources insuffisantes !");
                setBuildMode(null);
            }
        }

        function buyUnit(type) {
            if(res.pop >= res.maxPop) { alert("Population Max ! Construisez des maisons."); return; }
            let costGold = 0, costFood = 0;
            if(type === 'farmer') { costGold = 10; costFood = 10; }
            if(type === 'warrior') { costGold = 20; costFood = 20; }
            if(type === 'archer') { costGold = 30; costFood = 20; }
            if(type === 'mage') { costGold = 50; costFood = 30; }

            if (res.gold >= costGold && res.food >= costFood) {
                res.gold -= costGold; res.food -= costFood;
                units.push(new Unit(base.x, base.y + 60, type));
                updateUI();
            } else { alert("Ressources insuffisantes !"); }
        }

        function updateUI() {
            uiGold.innerText = Math.floor(res.gold);
            uiWood.innerText = Math.floor(res.wood);
            uiFood.innerText = Math.floor(res.food);
            uiPop.innerText = res.pop;
            uiMaxPop.innerText = res.maxPop;
        }

        // --- BOUCLE PRINCIPALE ---
        let lastTime = performance.now();
        let ecoTimer = 0;

        function update(dt) {
            if (gameState !== 'PLAYING') return;
            survivalTimer += dt;
            ecoTimer += dt;

            // ÉCONOMIE (Chaque seconde)
            if (ecoTimer >= 1) {
                ecoTimer = 0;
                let houses = buildings.filter(b => b.type === 'house').length;
                res.gold += houses * 1; 

                let farmingCount = 0;
                buildings.forEach(b => { if(b.type === 'farm') farmingCount += b.farmersInside; });
                res.food += farmingCount * 1.5;

                res.food -= res.pop * 0.2; // Unités mangent
                if(res.food < 0) res.food = 0;

                updateUI();
            }

            // Vagues d'ennemis
            waveTimer -= dt;
            if (waveTimer <= 0) {
                let count = 1 + Math.floor(survivalTimer / 45);
                for(let i=0; i<count; i++) {
                    let spawnX = Math.random() > 0.5 ? -20 : width + 20;
                    let spawnY = Math.random() * height;
                    enemies.push(new Enemy(spawnX, spawnY));
                }
                waveTimer = 15;
            }

            // Update Base
            if (base.hp <= 0) {
                gameState = 'GAMEOVER';
                gameOverScreen.style.display = 'block';
                spawnParticles(base.x, base.y, 'var(--neon-red)', 50);
            }

            // Update Entités
            for (let i = units.length - 1; i >= 0; i--) {
                units[i].update(dt);
                if (units[i].hp <= 0) {
                    spawnParticles(units[i].x, units[i].y, units[i].color, 15);
                    if(selectedUnits.includes(units[i])) selectedUnits.splice(selectedUnits.indexOf(units[i]), 1);
                    units.splice(i, 1);
                    res.pop--; updateUI();
                }
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                enemies[i].update(dt);
                if (enemies[i].hp <= 0) {
                    spawnParticles(enemies[i].x, enemies[i].y, enemies[i].color, 15);
                    enemies.splice(i, 1);
                }
            }

            for (let i = trees.length - 1; i >= 0; i--) {
                if (trees[i].amount <= 0) trees.splice(i, 1);
            }

            // FX
            particles.forEach((p, i) => {
                p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
                if(p.life <= 0) particles.splice(i, 1);
            });
            lasers.forEach((l, i) => {
                l.life -= dt;
                if(l.life <= 0) lasers.splice(i, 1);
            });
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);

            if (gameState === 'PLAYING' || gameState === 'GAMEOVER') {
                trees.forEach(t => t.draw());
                buildings.forEach(b => b.draw());
                if (base.hp > 0) base.draw();

                units.forEach(u => u.draw());
                enemies.forEach(e => e.draw());

                lasers.forEach(l => {
                    ctx.strokeStyle = l.color; ctx.lineWidth = 3;
                    ctx.shadowBlur = 10; ctx.shadowColor = l.color;
                    ctx.beginPath(); ctx.moveTo(l.x1, l.y1); ctx.lineTo(l.x2, l.y2); ctx.stroke();
                    ctx.shadowBlur = 0;
                });

                particles.forEach(p => {
                    ctx.fillStyle = p.color; ctx.globalAlpha = p.life;
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                });
                ctx.globalAlpha = 1;

                if (isSelecting && inputMode === 'mouse') {
                    ctx.strokeStyle = 'rgba(0, 240, 255, 0.5)'; ctx.lineWidth = 1;
                    ctx.fillStyle = 'rgba(0, 240, 255, 0.1)';
                    let w = selectionCurrent.x - selectionStart.x;
                    let h = selectionCurrent.y - selectionStart.y;
                    ctx.fillRect(selectionStart.x, selectionStart.y, w, h);
                    ctx.strokeRect(selectionStart.x, selectionStart.y, w, h);
                }

                // Fantôme de construction
                if (buildMode) {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                    let size = (buildMode === 'house' || buildMode === 'farm') ? 50 : 60;
                    ctx.fillRect(mouseHover.x - size/2, mouseHover.y - size/2, size, size);
                }
            }
        }

        function loop(timestamp) {
            const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
            lastTime = timestamp;
            update(dt);
            draw();
            requestAnimationFrame(loop);
        }

        initGame();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
