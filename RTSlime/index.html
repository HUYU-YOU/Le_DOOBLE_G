<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber-Command : Micro RTS</title>
    <!-- Lien vers notre feuille de style séparée -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Scripts externes -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>

    <!-- PROTECTION SWIPE -->
    <script>
        document.addEventListener('touchstart', (e) => { 
            if(e.target.closest('.no-swipe')) e.stopPropagation(); 
        }, { passive: false });
        document.addEventListener('contextmenu', event => event.preventDefault());
    </script>

    <div id="game-container" class="no-swipe">
        <!-- Canvas principal du jeu -->
        <canvas id="gameCanvas"></canvas>

        <!-- Minimap Radar -->
        <div id="minimap-container">
            <canvas id="minimap" width="150" height="150"></canvas>
        </div>

        <a href="../index.html" id="btn-retour-hub">&#11013; HUB</a>

        <div id="ui-top">
            <span class="res-gold">💰 <span id="val-gold">50</span></span>
            <span class="res-wood">🪵 <span id="val-wood">100</span></span>
            <span class="res-food">🍞 <span id="val-food">100</span></span>
            <span class="res-pop">👥 <span id="val-pop">0</span>/<span id="val-maxpop">0</span></span>
        </div>

        <div id="build-instructions">Clic Gauche pour Placer - Clic Droit pour Annuler</div>

        <!-- Interface Dynamique -->
        <div id="ui-bottom"></div>

        <div id="game-over-screen">
            <h1>MATRICE DÉTRUITE</h1>
            <p>L'Hôtel de Ville a été corrompu par l'infection.</p>
            <button class="restart-btn" onclick="initGame()">Reboot Système</button>
        </div>
    </div>

    <!-- Chargement des scripts locaux -->
    <script src="js/entities.js"></script>
    <script src="js/engine.js"></script>

</body>
</html>
