<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber-Dash : Ultimate Overdrive</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --neon-cyan: #00f0ff;
            --neon-pink: #ff007f;
            --neon-green: #39ff14;
            --text-color: #e0e0e0;
            --font-main: 'Courier New', Courier, monospace;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1000px;
            max-height: 600px;
            background: #000;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
            touch-action: none;
            overflow: hidden;
            border: 2px solid rgba(0, 240, 255, 0.2);
            border-radius: 8px;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 25px;
            box-sizing: border-box;
        }

        .score-board {
            display: flex;
            justify-content: space-between;
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--neon-cyan);
            text-shadow: 0 0 12px var(--neon-cyan);
            letter-spacing: 2px;
        }

        #menu-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: auto;
            background: rgba(11, 12, 16, 0.92);
            padding: 40px;
            border: 2px solid var(--neon-pink);
            box-shadow: 0 0 25px var(--neon-pink);
            border-radius: 12px;
            backdrop-filter: blur(8px);
        }

        h1 {
            margin-top: 0;
            color: var(--neon-pink);
            text-shadow: 0 0 15px var(--neon-pink);
            text-transform: uppercase;
            font-size: 3rem;
            letter-spacing: 3px;
        }

        p {
            color: var(--text-color);
            margin-bottom: 25px;
            font-size: 1.1rem;
            line-height: 1.5;
        }

        button {
            background: transparent;
            border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 15px 35px;
            font-size: 1.3rem;
            font-family: inherit;
            text-transform: uppercase;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
            border-radius: 4px;
        }

        button:hover {
            background: var(--neon-cyan);
            color: var(--bg-color);
            box-shadow: 0 0 20px var(--neon-cyan);
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <!-- Protection Swipe Hub -->
    <script>
        document.addEventListener('touchstart', (e) => {
            if(e.target.closest('.no-swipe')) { e.stopPropagation(); }
        }, { passive: false });
        document.addEventListener('mousedown', (e) => {
            if(e.target.closest('.no-swipe')) { e.stopPropagation(); }
        });
    </script>

    <div id="game-container" class="no-swipe">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui-layer">
            <div class="score-board">
                <div>SCORE: <span id="score">0</span></div>
                <div>HI: <span id="hi-score">0</span></div>
            </div>
        </div>

        <div id="menu-screen">
            <h1 id="menu-title">Cyber-Dash</h1>
            <p id="menu-desc">
                ESPACE, CLIC ou TAP pour sauter.<br>Survis à l'Overdrive Quantique.
            </p>
            <button id="start-btn">Système Start</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const hiScoreEl = document.getElementById('hi-score');
        const menuScreen = document.getElementById('menu-screen');
        const startBtn = document.getElementById('start-btn');
        const menuTitle = document.getElementById('menu-title');

        let width, height;
        let gameState = 'START'; // START, PLAYING, GAMEOVER
        let score = 0;
        let hiScore = localStorage.getItem('cyberDashUltimateHiScore') || 0;
        hiScoreEl.innerText = Math.floor(hiScore);
        
        // Physique normalisée Delta Time
        let gameSpeed = 450; // pixels par seconde
        const GRAVITY = 2200; // pixels / sec²
        const JUMP_FORCE = -750; // pixels / sec
        const GROUND_HEIGHT = 90;

        // Effets visuels (Screen Shake)
        let shakeTimer = 0;
        let shakeIntensity = 0;

        // Joueur
        const player = {
            x: 120,
            y: 0,
            size: 42,
            vy: 0,
            isGrounded: false,
            rotation: 0,
            trail: []
        };

        let obstacles = [];
        let particles = [];
        let spawnTimer = 0;
        let bgGridX = 0;

        // --- GESTION HDPI / RETINA CANVAS ---
        function resize() {
            const container = canvas.parentElement;
            const rect = container.getBoundingClientRect();
            width = rect.width;
            height = rect.height;

            const dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            
            ctx.scale(dpr, dpr);

            if(gameState === 'START') {
                player.y = height - GROUND_HEIGHT - player.size;
            }
        }
        window.addEventListener('resize', resize);
        resize();

        // --- SYSTÈME DE PARTICULES ---
        function spawnParticles(x, y, color, count = 10) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 200 + 50;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: Math.random() * 5 + 2,
                    color: color,
                    alpha: 1,
                    decay: Math.random() * 2 + 1.5
                });
            }
        }

        // --- INPUTS ---
        function triggerJump() {
            if (gameState === 'PLAYING') {
                if (player.isGrounded) {
                    player.vy = JUMP_FORCE;
                    player.isGrounded = false;
                    spawnParticles(player.x + player.size/2, player.y + player.size, '#00f0ff', 8);
                }
            } else if (gameState === 'GAMEOVER') {
                resetGame();
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                triggerJump();
            }
        });

        canvas.addEventListener('mousedown', (e) => {
            e.preventDefault();
            triggerJump();
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            triggerJump();
        }, { passive: false });

        startBtn.addEventListener('click', () => {
            if(gameState === 'START' || gameState === 'GAMEOVER') resetGame();
        });

        // --- LOGIQUE DE JEU ---
        function resetGame() {
            player.y = height - GROUND_HEIGHT - player.size;
            player.vy = 0;
            player.rotation = 0;
            player.trail = [];
            obstacles = [];
            particles = [];
            score = 0;
            gameSpeed = 450;
            spawnTimer = 0;
            shakeTimer = 0;
            gameState = 'PLAYING';
            menuScreen.style.display = 'none';
        }

        function spawnObstacle() {
            const type = Math.random() > 0.4 ? 'spike' : 'block';
            const size = 40;
            obstacles.push({
                x: width,
                y: height - GROUND_HEIGHT - size,
                size: size,
                type: type
            });
        }

        function triggerShake(duration, intensity) {
            shakeTimer = duration;
            shakeIntensity = intensity;
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            triggerShake(0.4, 15);
            spawnParticles(player.x + player.size/2, player.y + player.size/2, '#ff007f', 25);

            menuScreen.style.display = 'block';
            menuTitle.innerText = "CRASH SYSTÈME";
            menuTitle.style.color = "#ff007f";
            startBtn.innerText = "Reboot";
            
            if (score > hiScore) {
                hiScore = score;
                localStorage.setItem('cyberDashUltimateHiScore', hiScore);
                hiScoreEl.innerText = Math.floor(hiScore);
            }
        }

        // --- COLLISIONS (AABB Précis) ---
        function checkCollision(p, obs) {
            const tolerance = 6;
            const hitX = (p.x + tolerance < obs.x + obs.size) && (p.x + p.size - tolerance > obs.x);
            let hitY = false;

            if (obs.type === 'block') {
                hitY = (p.y + tolerance < obs.y + obs.size) && (p.y + p.size - tolerance > obs.y);
            } else if (obs.type === 'spike') {
                hitY = (p.y + p.size - tolerance > obs.y + obs.size * 0.35);
            }
            return hitX && hitY;
        }

        // --- BOUCLE PRINCIPALE (FIXED / DELTA TIME) ---
        let lastTime = performance.now();

        function mainLoop(currentTime) {
            const dt = Math.min((currentTime - lastTime) / 1000, 0.1); // Cap delta time
            lastTime = currentTime;

            update(dt);
            draw();

            requestAnimationFrame(mainLoop);
        }

        function update(dt) {
            if (gameState !== 'PLAYING') return;

            // 1. Accélération & Score
            gameSpeed += dt * 8;
            score += gameSpeed * dt * 0.1;
            scoreEl.innerText = Math.floor(score);

            // 2. Parallax Grid
            bgGridX -= gameSpeed * dt;
            if (bgGridX <= -50) bgGridX += 50;

            // 3. Physique Joueur
            player.vy += GRAVITY * dt;
            player.y += player.vy * dt;

            // Trail
            player.trail.push({x: player.x, y: player.y});
            if (player.trail.length > 12) player.trail.shift();

            // Sol & Rotation
            const groundLevel = height - GROUND_HEIGHT - player.size;
            if (player.y >= groundLevel) {
                player.y = groundLevel;
                player.vy = 0;
                if (!player.isGrounded) {
                    spawnParticles(player.x + player.size/2, player.y + player.size, 'rgba(0,240,255,0.6)', 4);
                }
                player.isGrounded = true;
                
                // Snap géométrique de rotation
                let mod = player.rotation % (Math.PI / 2);
                if (mod > 0.05) {
                    player.rotation += (Math.PI / 2 - mod) * 15 * dt;
                } else {
                    player.rotation = Math.round(player.rotation / (Math.PI / 2)) * (Math.PI / 2);
                }
            } else {
                player.isGrounded = false;
                player.rotation += 4 * dt;
            }

            // 4. Gestion Obstacles avec sécurité d'espacement minimal
            spawnTimer -= gameSpeed * dt;
            if (spawnTimer <= 0) {
                spawnObstacle();
                // Délai dynamique basé sur la vitesse pour garantir la jouabilité
                const minDistance = 280 + (gameSpeed * 0.4);
                spawnTimer = minDistance + Math.random() * 150;
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x -= gameSpeed * dt;

                if (checkCollision(player, obs)) {
                    gameOver();
                    break;
                }

                if (obs.x + obs.size < 0) {
                    obstacles.splice(i, 1);
                }
            }

            // 5. Mise à jour Particules
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.alpha -= p.decay * dt;
                if (p.alpha <= 0) particles.splice(i, 1);
            }

            // 6. Screen Shake Update
            if (shakeTimer > 0) {
                shakeTimer -= dt;
            }
        }

        function draw() {
            ctx.save();

            // Application du Screen Shake
            if (shakeTimer > 0) {
                const offsetX = (Math.random() - 0.5) * shakeIntensity;
                const offsetY = (Math.random() - 0.5) * shakeIntensity;
                ctx.translate(offsetX, offsetY);
            }

            // Effet de balayage de fond (Motion trail clean)
            ctx.fillStyle = '#0b0c10';
            ctx.fillRect(0, 0, width, height);

            if (gameState !== 'START') {
                // --- GRILLE CYBERPUNK PARALLAX ---
                ctx.strokeStyle = 'rgba(0, 240, 255, 0.08)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                for(let x = bgGridX; x < width; x += 50) {
                    ctx.moveTo(x, 0); ctx.lineTo(x, height);
                }
                for(let y = 0; y < height; y += 50) {
                    ctx.moveTo(0, y); ctx.lineTo(width, y);
                }
                ctx.stroke();

                // --- SOL ---
                const groundY = height - GROUND_HEIGHT;
                ctx.fillStyle = '#050508';
                ctx.fillRect(0, groundY, width, GROUND_HEIGHT);
                
                ctx.shadowBlur = 15;
                ctx.shadowColor = 'var(--neon-pink)';
                ctx.strokeStyle = '#ff007f';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(0, groundY);
                ctx.lineTo(width, groundY);
                ctx.stroke();
                ctx.shadowBlur = 0;

                // --- TRAIL ---
                player.trail.forEach((pos, index) => {
                    const alpha = index / player.trail.length;
                    ctx.fillStyle = `rgba(0, 240, 255, ${alpha * 0.4})`;
                    ctx.fillRect(pos.x, pos.y, player.size, player.size);
                });

                // --- JOUEUR ---
                ctx.save();
                ctx.translate(player.x + player.size/2, player.y + player.size/2);
                ctx.rotate(player.rotation);
                
                ctx.shadowBlur = 18;
                ctx.shadowColor = '#00f0ff';
                ctx.fillStyle = '#0b0c10';
                ctx.fillRect(-player.size/2, -player.size/2, player.size, player.size);
                
                ctx.strokeStyle = '#00f0ff';
                ctx.lineWidth = 3;
                ctx.strokeRect(-player.size/2, -player.size/2, player.size, player.size);
                ctx.restore();

                // --- OBSTACLES ---
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#ff007f';
                ctx.fillStyle = '#ff007f';
                
                obstacles.forEach(obs => {
                    if (obs.type === 'block') {
                        ctx.fillRect(obs.x, obs.y, obs.size, obs.size);
                        ctx.strokeStyle = '#fff';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(obs.x, obs.y, obs.size, obs.size);
                    } else if (obs.type === 'spike') {
                        ctx.beginPath();
                        ctx.moveTo(obs.x + obs.size/2, obs.y);
                        ctx.lineTo(obs.x + obs.size, obs.y + obs.size);
                        ctx.lineTo(obs.x, obs.y + obs.size);
                        ctx.closePath();
                        ctx.fill();
                        ctx.strokeStyle = '#fff';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }
                });
                ctx.shadowBlur = 0;

                // --- PARTICULES ---
                particles.forEach(p => {
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = Math.max(0, p.alpha);
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                });
                ctx.globalAlpha = 1;
            }

            ctx.restore();
        }

        // Lancement de la boucle principale
        requestAnimationFrame(mainLoop);
    </script>
</body>
</html>
