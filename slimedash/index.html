<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Slime-Dash : Infinite Run & Map Editor</title>
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        /* =========================================
           1. VARIABLES CYBERPUNK ET RESET
           ========================================= */
        :root {
            --bg-color: #0b0c10;
            --neon-cyan: #00f0ff;
            --neon-pink: #ff007f;
            --neon-green: #39ff14;
            --neon-yellow: #fce803;
            --text-color: #e0e0e0;
            --font-main: 'Courier New', Courier, monospace;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-color); color: var(--text-color);
            font-family: var(--font-main); overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        /* MEDIA BACKGROUND */
        #bg-video {
            position: fixed; top: 50%; left: 50%; min-width: 100%; min-height: 100%;
            z-index: -100; transform: translateX(-50%) translateY(-50%);
            object-fit: cover; opacity: 0.3; transition: opacity 1s;
        }

        /* =========================================
           2. BOUTON RETOUR AU HUB (DESIGN EXACT)
           ========================================= */
        #btn-retour-hub {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 9999;
            background-color: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #e0e0e0;
            padding: 8px 15px;
            font-family: inherit;
            font-size: 14px;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.2s ease, border-color 0.2s ease;
            text-decoration: none;
        }

        #btn-retour-hub:hover {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.5);
        }

        /* =========================================
           3. CONTENEUR PRINCIPAL DU JEU
           ========================================= */
        #game-container {
            position: relative; width: 100%; height: 100%; max-width: 1200px; max-height: 700px;
            background: rgba(0, 0, 0, 0.6); box-shadow: 0 0 30px rgba(57, 255, 20, 0.2);
            touch-action: none; overflow: hidden; border: 2px solid rgba(57, 255, 20, 0.3); border-radius: 8px;
            backdrop-filter: blur(3px);
        }

        canvas { display: block; width: 100%; height: 100%; }

        /* =========================================
           4. INTERFACE UTILISATEUR (UI)
           ========================================= */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column;
            justify-content: space-between; padding: 25px; box-sizing: border-box;
        }

        .score-board {
            display: flex; justify-content: space-between; font-size: 1.8rem; font-weight: bold;
            color: var(--neon-green); text-shadow: 0 0 12px var(--neon-green); letter-spacing: 2px;
        }

        #menu-screen {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; pointer-events: auto; background: rgba(11, 12, 16, 0.95);
            padding: 40px; border: 2px solid var(--neon-cyan); box-shadow: 0 0 25px var(--neon-cyan);
            border-radius: 12px; z-index: 10; width: 90%; max-width: 600px;
        }

        h1 {
            margin-top: 0; color: var(--neon-cyan); text-shadow: 0 0 15px var(--neon-cyan);
            text-transform: uppercase; font-size: 3.5rem; letter-spacing: 3px;
        }

        p { color: var(--text-color); margin-bottom: 25px; font-size: 1.1rem; line-height: 1.5; }

        .btn-group { display: flex; flex-direction: column; gap: 15px; justify-content: center; align-items: center; margin-bottom: 20px;}
        .btn-row { display: flex; gap: 15px; justify-content: center; width: 100%; }

        .action-btn-main {
            background: rgba(0,0,0,0.8); border: 2px solid var(--neon-cyan); color: var(--neon-cyan);
            padding: 15px 30px; font-size: 1.2rem; font-family: inherit; text-transform: uppercase;
            font-weight: bold; cursor: pointer; transition: all 0.3s ease; outline: none; border-radius: 4px;
            width: 100%; max-width: 250px; pointer-events: auto; /* Force clickable */
        }
        
        .btn-play { border-color: var(--neon-green); color: var(--neon-green); }
        .btn-play:hover { background: var(--neon-green); color: #000; box-shadow: 0 0 20px var(--neon-green); transform: scale(1.05); }

        .btn-edit { border-color: var(--neon-yellow); color: var(--neon-yellow); }
        .btn-edit:hover { background: var(--neon-yellow); color: #000; box-shadow: 0 0 20px var(--neon-yellow); transform: scale(1.05); }

        .btn-code { border-color: var(--neon-pink); color: var(--neon-pink); }
        .btn-code:hover { background: var(--neon-pink); color: #000; box-shadow: 0 0 20px var(--neon-pink); transform: scale(1.05); }

        /* Code Map Input */
        #code-section {
            border-top: 1px dashed var(--neon-pink); padding-top: 20px;
            display: none; flex-direction: column; gap: 10px; align-items: center;
        }
        input[type="text"] {
            background: rgba(0,0,0,0.7); border: 1px solid var(--neon-pink); color: var(--neon-pink);
            padding: 12px; font-size: 1rem; font-family: inherit; outline: none; text-align: center; width: 100%; max-width: 300px;
        }
        input[type="text"]:focus { box-shadow: 0 0 10px var(--neon-pink); }

        /* =========================================
           5. PANNEAU DE L'ÉDITEUR (DRAGGABLE)
           ========================================= */
        #editor-panel {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(11, 12, 16, 0.95); border: 2px solid var(--neon-yellow);
            padding: 15px 20px; border-radius: 10px; display: none; gap: 15px; pointer-events: auto;
            box-shadow: 0 0 15px var(--neon-yellow); z-index: 20; align-items: center; flex-wrap: nowrap; 
            cursor: grab;
        }
        #editor-panel:active { cursor: grabbing; }

        .tool-btn { 
            padding: 10px; font-size: 1.4rem; border-color: gray; color: gray; min-width: 50px; 
            background: #000; cursor: pointer; border-radius: 5px; border-style: solid; border-width: 2px;
        }
        .tool-btn.active { border-color: var(--neon-yellow); color: var(--neon-yellow); box-shadow: 0 0 10px var(--neon-yellow); }
        
        .divider { width: 2px; height: 40px; background: gray; margin: 0 10px; }

        .action-btn { padding: 10px 20px; font-size: 1.1rem; border-radius: 5px; cursor: pointer; text-transform: uppercase; font-weight: bold; background: #000; font-family: inherit; }
        .action-tester { border: 2px solid var(--neon-green); color: var(--neon-green); }
        .action-exporter { border: 2px solid var(--neon-cyan); color: var(--neon-cyan); }
        .action-quitter { border: 2px solid var(--neon-pink); color: var(--neon-pink); }
        
        .action-tester:hover { background: var(--neon-green); color: #000; }
        .action-exporter:hover { background: var(--neon-cyan); color: #000; }
        .action-quitter:hover { background: var(--neon-pink); color: #000; }
    </style>
</head>
<body>

    <!-- PROTECTION SWIPE HUB -->
    <script>
        document.addEventListener('touchstart', (e) => { 
            if(e.target.closest('.no-swipe')) e.stopPropagation(); 
        }, { passive: false });
        // NOTE: mousedown stopPropagation a été retiré pour garantir que les clics sur les boutons ne soient pas bloqués.
    </script>

    <!-- BOUTON RETOUR HUB (Ajuste le href selon ton arborescence) -->
    <a href="../index.html" id="btn-retour-hub" title="Retour au Hub Global">
        &#11013; Retour au Hub
    </a>

    <!-- MEDIA -->
    <video id="bg-video" autoplay loop muted playsinline>
        <source id="bg-video-source" src="backgroundnight.mp4" type="video/mp4">
    </video>
    <div id="yt-player" style="display: none;"></div>

    <!-- JEU -->
    <div id="game-container" class="no-swipe">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui-layer">
            <div class="score-board">
                <div id="status-text">MENU</div>
                <div id="completion-text" style="color:var(--neon-yellow); display:none;">NIVEAU ACCOMPLI !</div>
            </div>
        </div>

        <!-- MENU PRINCIPAL -->
        <div id="menu-screen">
            <h1 id="menu-title">Slime-Dash</h1>
            <p id="menu-desc">Échappe à l'infection ou crée ton propre enfer quantique.</p>
            
            <div class="btn-group">
                <button id="btn-play-endless" class="action-btn-main btn-play">JOUER (Infini)</button>
                <div class="btn-row">
                    <button id="btn-create-map" class="action-btn-main btn-edit">CRÉER UNE MAP</button>
                    <button id="btn-play-code" class="action-btn-main btn-code">JOUER UN CODE</button>
                </div>
            </div>

            <div id="code-section">
                <input type="text" id="map-code-input" placeholder="Coller le code ici...">
                <button id="load-code-btn" class="action-btn-main btn-code" style="width: auto;">LANCER LA MAP</button>
            </div>
        </div>

        <!-- PANNEAU ÉDITEUR (DRAGGABLE) -->
        <div id="editor-panel">
            <button class="tool-btn active" data-tool="block" title="Bloc">🟦</button>
            <button class="tool-btn" data-tool="spike" title="Pic">🔺</button>
            <button class="tool-btn" data-tool="hole" title="Trou">🕳️</button>
            <button class="tool-btn" data-tool="pad" title="Propulseur">🚀</button>
            <button class="tool-btn" data-tool="holo" title="Hologramme (Fake)">👻</button>
            <button class="tool-btn" data-tool="coin" title="Data Chip (Bonus)">💎</button>
            <button class="tool-btn" data-tool="flag" title="Fin du niveau">🏁</button>
            <button class="tool-btn" data-tool="eraser" title="Gomme">❌</button>
            
            <div class="divider"></div>
            
            <button class="tool-btn" id="cam-left" title="Caméra Gauche">◀</button>
            <button class="tool-btn" id="cam-right" title="Caméra Droite">▶</button>
            
            <div class="divider"></div>

            <button id="test-btn" class="action-btn action-tester">TESTER</button>
            <button id="export-btn" class="action-btn action-exporter">📤 EXPORTER</button>
            <button id="exit-btn" class="action-btn action-quitter">QUITTER</button>
        </div>
    </div>

    <!-- MOTEUR COMPLET (SÉCURISÉ) -->
    <script>
        // ON S'ASSURE QUE LE DOM EST CHARGÉ AVANT D'ATTACHER LES EVENEMENTS
        document.addEventListener('DOMContentLoaded', () => {

            // --- 1. AUDIO YOUTUBE ---
            let ytPlayer;
            let audioStarted = false;
            window.onYouTubeIframeAPIReady = function() {
                ytPlayer = new YT.Player('yt-player', {
                    height: '0', width: '0', videoId: '3ecxZy8luDg',
                    playerVars: { 'autoplay': 0, 'controls': 0, 'disablekb': 1 },
                    events: { 
                        'onReady': (e) => e.target.setVolume(5), 
                        'onStateChange': (e) => { if (e.data === YT.PlayerState.ENDED) ytPlayer.playVideo(); } 
                    }
                });
            };

            function initAudio() {
                if (!audioStarted && ytPlayer && typeof ytPlayer.playVideo === 'function') {
                    try {
                        ytPlayer.playVideo(); 
                        audioStarted = true;
                    } catch(e) { console.warn("Erreur Audio Youtube :", e); }
                }
            }

            // --- 2. VARIABLES GLOBALES ET CONFIGURATION ---
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const menuScreen = document.getElementById('menu-screen');
            const editorPanel = document.getElementById('editor-panel');
            const statusText = document.getElementById('status-text');

            let width, height;
            let gameState = 'START'; 
            
            // Physique & Grille
            const GRID_SIZE = 50; 
            const GROUND_HEIGHT = 90;
            let gameSpeed = 500; 
            const GRAVITY = 2800; 
            const JUMP_FORCE = -850; 

            let cameraX = 0;
            let editorCamTarget = 0;
            let score = 0;
            let hiScore = localStorage.getItem('slimeDashHiScore') || 0;
            document.getElementById('hi-score').innerText = Math.floor(hiScore);

            let particles = [];
            let shakeTimer = 0, shakeIntensity = 0;

            // --- 3. GESTION SÉCURISÉE DES NIVEAUX ---
            let levelData = []; 
            let endlessLevelData = []; 
            let nextEndlessSpawnX = 0; 

            let defaultLevel = [
                {x: 10, y: 0, type: 'block'}, {x: 11, y: 0, type: 'block'}, {x: 12, y: 1, type: 'block'},
                {x: 15, y: 3, type: 'coin'}, {x: 16, y: 3, type: 'coin'},
                {x: 17, y: 0, type: 'spike'}, {x: 22, y: 0, type: 'hole'},  {x: 23, y: 0, type: 'hole'},
                {x: 26, y: 0, type: 'pad'}, {x: 28, y: 4, type: 'block'}, {x: 29, y: 4, type: 'holo'}, {x: 30, y: 4, type: 'block'},
                {x: 35, y: 0, type: 'flag'}
            ];

            // Try-Catch robuste pour éviter le crash au chargement du localStorage
            try {
                let savedLvl = localStorage.getItem('slimeDashLevel');
                if(savedLvl && savedLvl !== "null" && savedLvl !== "undefined") { 
                    levelData = JSON.parse(savedLvl);
                    if(!Array.isArray(levelData)) throw new Error("Format invalide");
                } else {
                    levelData = JSON.parse(JSON.stringify(defaultLevel));
                }
            } catch (err) {
                console.error("Erreur de restauration du niveau, chargement du niveau par défaut.");
                levelData = JSON.parse(JSON.stringify(defaultLevel));
            }

            const typeMap = { 'block': 1, 'spike': 2, 'hole': 3, 'flag': 4, 'pad': 5, 'holo': 6, 'coin': 7 };
            const revTypeMap = { 1: 'block', 2: 'spike', 3: 'hole', 4: 'flag', 5: 'pad', 6: 'holo', 7: 'coin' };

            // --- 4. GESTIONNAIRE DES SPRITES ---
            const sprites = { idle: [], run: [], jump: [], land: [] };
            
            function loadFrames(category, filenames) {
                filenames.forEach(file => { 
                    const img = new Image(); 
                    img.src = file; 
                    sprites[category].push(img); 
                });
            }
            
            loadFrames('idle', ['slm.png', 'slm2.png', 'slm3.png', 'slm4.png']);
            loadFrames('run',  ['slm5.png', 'slm6.png', 'slm7.png', 'slm8.png']);
            loadFrames('jump', ['slm10.png', 'slm11.png', 'slm12.png', 'slm13.png', 'slm14.png', 'slm15.png', 'slm16.png']);
            loadFrames('land', ['slm17.png', 'slm18.png', 'slm19.png', 'slm20.png']);

            // --- 5. OBJET JOUEUR ---
            const player = {
                x: 150, y: 0, size: 50, vy: 0, isGrounded: false, trail: [],
                animState: 'IDLE', frameIndex: 0, animTimer: 0, animSpeed: 0.1
            };

            function setAnimState(newState) {
                if (player.animState === newState) return;
                player.animState = newState; player.frameIndex = 0; player.animTimer = 0;
                if (newState === 'LAND') player.animSpeed = 0.05;
                else if (newState === 'RECOVER') player.animSpeed = 0.08;
                else if (newState === 'RUN') player.animSpeed = 0.08;
                else if (newState === 'JUMP') player.animSpeed = 0.06;
                else player.animSpeed = 0.15;
            }

            // --- 6. RÉSOLUTION HDPI ---
            function resize() {
                const rect = canvas.parentElement.getBoundingClientRect();
                width = rect.width; height = rect.height;
                const dpr = window.devicePixelRatio || 1;
                canvas.width = width * dpr; canvas.height = height * dpr;
                ctx.scale(dpr, dpr);
                if(gameState === 'START' || gameState === 'EDITOR') player.y = height - GROUND_HEIGHT - player.size;
            }
            window.addEventListener('resize', resize); resize();

            // --- 7. EFFETS VISUELS ---
            function spawnParticles(x, y, color, count = 10) {
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 200 + 50;
                    particles.push({
                        x: x, y: y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
                        size: Math.random() * 5 + 2, color: color, alpha: 1, decay: Math.random() * 2 + 1.5
                    });
                }
            }
            function triggerShake(duration, intensity) { shakeTimer = duration; shakeIntensity = intensity; }

            // --- 8. LOGIQUE GLOBALE DES ÉTATS ET ÉCOUTEURS MENUS ---
            document.getElementById('btn-play-endless').addEventListener('click', () => { startGame('PLAYING_ENDLESS'); });
            document.getElementById('btn-create-map').addEventListener('click', () => { startEditor(); });
            document.getElementById('btn-play-code').addEventListener('click', () => {
                const sec = document.getElementById('code-section');
                sec.style.display = sec.style.display === 'flex' ? 'none' : 'flex';
            });

            function startGame(mode) {
                console.log("Game Starting Mode: ", mode); // Log de débug
                initAudio();
                gameState = mode;
                menuScreen.style.display = 'none';
                editorPanel.style.display = 'none';
                document.getElementById('completion-text').style.display = 'none';
                
                player.y = height - GROUND_HEIGHT - player.size;
                player.vy = 0; player.trail = [];
                setAnimState('RUN');
                
                cameraX = 0; score = 0; particles = []; shakeTimer = 0;
                
                if (levelData && Array.isArray(levelData)) {
                    levelData.forEach(obs => obs.collected = false);
                }
                
                if (mode === 'PLAYING_ENDLESS') {
                    gameSpeed = 500;
                    endlessLevelData = [];
                    nextEndlessSpawnX = Math.floor(width / GRID_SIZE) + 10;
                    statusText.innerText = "COURSE INFINIE";
                    statusText.style.color = "var(--neon-pink)";
                } else {
                    gameSpeed = 500; 
                    statusText.innerText = "MAP CUSTOM";
                    statusText.style.color = "var(--neon-green)";
                }
            }

            function startEditor() {
                initAudio();
                gameState = 'EDITOR';
                menuScreen.style.display = 'none';
                
                // On reset le transform pour le repositionner proprement au centre au premier lancement
                editorPanel.style.transform = 'translateX(-50%)';
                editorPanel.style.left = '50%';
                editorPanel.style.top = '20px';
                editorPanel.style.display = 'flex';

                document.getElementById('completion-text').style.display = 'none';
                
                if (levelData && Array.isArray(levelData)) {
                    levelData.forEach(obs => obs.collected = false);
                }
                
                player.y = height - GROUND_HEIGHT - player.size;
                setAnimState('IDLE');
                cameraX = 0; editorCamTarget = 0;
                statusText.innerText = "MODE ÉDITEUR";
                statusText.style.color = "var(--neon-yellow)";
            }

            function gameOver(isVictory = false) {
                triggerShake(0.4, 15);
                setAnimState('IDLE');
                
                if (isVictory) {
                    gameState = 'VICTORY';
                    spawnParticles(player.x + player.size/2, player.y, 'var(--neon-yellow)', 50);
                    document.getElementById('completion-text').style.display = 'block';
                    setTimeout(() => showMenu("NIVEAU ACCOMPLI", "var(--neon-yellow)"), 3000);
                } else {
                    gameState = 'GAMEOVER';
                    spawnParticles(player.x + player.size/2, player.y + player.size/2, '#ff007f', 40);
                    setTimeout(() => showMenu("CRASH CRITIQUE", "var(--neon-pink)"), 1500);

                    if (score > hiScore) {
                        hiScore = score;
                        localStorage.setItem('slimeDashHiScore', hiScore);
                        document.getElementById('hi-score').innerText = Math.floor(hiScore);
                    }
                }
            }

            function showMenu(title, color) {
                gameState = 'START';
                menuScreen.style.display = 'block';
                editorPanel.style.display = 'none';
                document.getElementById('code-section').style.display = 'none';
                const mTitle = document.getElementById('menu-title');
                mTitle.innerText = title; mTitle.style.color = color; mTitle.style.textShadow = `0 0 15px ${color}`;
                statusText.innerText = "MENU"; statusText.style.color = "var(--neon-cyan)";
                
                try {
                    let savedLvl = localStorage.getItem('slimeDashLevel');
                    if(savedLvl && savedLvl !== "null") levelData = JSON.parse(savedLvl);
                } catch(e) { console.error(e); }
            }

            // --- 9. DRAG & DROP DU PANNEAU ÉDITEUR ---
            let isDraggingPanel = false;
            let panelOffsetX, panelOffsetY;

            editorPanel.addEventListener('mousedown', (e) => {
                if(e.target.closest('.tool-btn') || e.target.closest('.action-btn')) return;
                isDraggingPanel = true;
                const rect = editorPanel.getBoundingClientRect();
                editorPanel.style.transform = 'none'; 
                panelOffsetX = e.clientX - rect.left;
                panelOffsetY = e.clientY - rect.top;
            });
            document.addEventListener('mousemove', (e) => {
                if (!isDraggingPanel) return;
                editorPanel.style.left = (e.clientX - panelOffsetX) + 'px';
                editorPanel.style.top = (e.clientY - panelOffsetY) + 'px';
            });
            document.addEventListener('mouseup', () => { isDraggingPanel = false; });

            editorPanel.addEventListener('touchstart', (e) => {
                if(e.target.closest('.tool-btn') || e.target.closest('.action-btn')) return;
                isDraggingPanel = true;
                const rect = editorPanel.getBoundingClientRect();
                editorPanel.style.transform = 'none'; 
                panelOffsetX = e.touches[0].clientX - rect.left;
                panelOffsetY = e.touches[0].clientY - rect.top;
            }, {passive: false});
            document.addEventListener('touchmove', (e) => {
                if (!isDraggingPanel) return;
                editorPanel.style.left = (e.touches[0].clientX - panelOffsetX) + 'px';
                editorPanel.style.top = (e.touches[0].clientY - panelOffsetY) + 'px';
            }, {passive: false});
            document.addEventListener('touchend', () => { isDraggingPanel = false; });

            // --- 10. GESTION DE L'ÉDITEUR AVANCÉ (OUTILS) ---
            let currentTool = 'block';
            let isBuilding = false;
            let hoverGridX = -1, hoverGridY = -1;
            let isHovering = false;

            document.querySelectorAll('.tool-btn[data-tool]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.tool-btn[data-tool]').forEach(b => b.classList.remove('active'));
                    e.currentTarget.classList.add('active'); // CurrentTarget évite de cibler le span s'il y en a un
                    currentTool = e.currentTarget.getAttribute('data-tool');
                });
            });

            document.getElementById('cam-left').addEventListener('click', () => editorCamTarget -= GRID_SIZE * 6);
            document.getElementById('cam-right').addEventListener('click', () => editorCamTarget += GRID_SIZE * 6);
            
            canvas.addEventListener('wheel', (e) => {
                if(gameState === 'EDITOR') {
                    e.preventDefault();
                    editorCamTarget += Math.sign(e.deltaY) * GRID_SIZE * 2;
                }
            }, { passive: false });

            document.getElementById('test-btn').addEventListener('click', () => startGame('PLAYING_CUSTOM'));
            
            document.getElementById('exit-btn').addEventListener('click', () => {
                localStorage.setItem('slimeDashLevel', JSON.stringify(levelData)); 
                showMenu("Slime-Dash", "var(--neon-cyan)");
            });

            document.getElementById('export-btn').addEventListener('click', () => {
                try {
                    const minified = levelData.map(o => [o.x, o.y, typeMap[o.type]]);
                    const baseCode = btoa(JSON.stringify(minified));
                    prompt("Code de ta Map à partager :", baseCode);
                } catch (e) { alert("Erreur d'exportation."); }
            });

            document.getElementById('load-code-btn').addEventListener('click', () => {
                const inputVal = document.getElementById('map-code-input').value.trim();
                if(inputVal !== "") {
                    try {
                        const minified = JSON.parse(atob(inputVal));
                        const newLevel = minified.map(arr => ({ x: arr[0], y: arr[1], type: revTypeMap[arr[2]] }));
                        if (!Array.isArray(newLevel) || newLevel.length === 0) throw new Error();
                        levelData = newLevel;
                        document.getElementById('map-code-input').value = "";
                        startGame('PLAYING_CUSTOM');
                    } catch (e) { alert("Erreur : Code Invalide."); }
                } else { alert("Veuillez coller un code."); }
            });

            function updateEditorCursor(e) {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const mouseX = (clientX - rect.left) * (canvas.width / rect.width / (window.devicePixelRatio || 1));
                const mouseY = (clientY - rect.top) * (canvas.height / rect.height / (window.devicePixelRatio || 1));
                const worldX = mouseX + cameraX;
                
                hoverGridX = Math.floor(worldX / GRID_SIZE);
                const groundY = height - GROUND_HEIGHT;
                hoverGridY = Math.floor((groundY - mouseY) / GRID_SIZE);
                isHovering = true;
            }

            function placeBlockAtCursor() {
                if (hoverGridY < 0 && currentTool !== 'hole') return; 
                if (currentTool === 'flag') levelData = levelData.filter(o => o.type !== 'flag'); 

                const existingIndex = levelData.findIndex(obj => obj.x === hoverGridX && obj.y === hoverGridY);
                if (currentTool === 'eraser') {
                    if (existingIndex !== -1) levelData.splice(existingIndex, 1);
                } else {
                    if (existingIndex !== -1 && levelData[existingIndex].type === currentTool) return;
                    if (existingIndex !== -1) levelData.splice(existingIndex, 1);
                    let finalY = currentTool === 'hole' ? 0 : hoverGridY;
                    levelData.push({x: hoverGridX, y: finalY, type: currentTool});
                }
            }

            canvas.addEventListener('mousedown', (e) => {
                if (gameState.startsWith('PLAYING')) { e.preventDefault(); triggerJump(); return; }
                if (gameState !== 'EDITOR') return;
                isBuilding = true; updateEditorCursor(e); placeBlockAtCursor();
            });
            canvas.addEventListener('mousemove', (e) => {
                if (gameState !== 'EDITOR') return;
                updateEditorCursor(e); if (isBuilding) placeBlockAtCursor();
            });
            canvas.addEventListener('mouseup', () => {
                if (gameState === 'EDITOR' && isBuilding) { isBuilding = false; localStorage.setItem('slimeDashLevel', JSON.stringify(levelData)); }
            });
            canvas.addEventListener('mouseleave', () => {
                isHovering = false;
                if (gameState === 'EDITOR' && isBuilding) { isBuilding = false; localStorage.setItem('slimeDashLevel', JSON.stringify(levelData)); }
            });
            canvas.addEventListener('touchstart', (e) => {
                if (gameState.startsWith('PLAYING')) { e.preventDefault(); triggerJump(); return; }
                if (gameState !== 'EDITOR') return;
                isBuilding = true; updateEditorCursor(e); placeBlockAtCursor();
            }, {passive: false});
            canvas.addEventListener('touchmove', (e) => {
                if (gameState !== 'EDITOR') return;
                updateEditorCursor(e); if (isBuilding) placeBlockAtCursor();
            }, {passive: false});
            canvas.addEventListener('touchend', () => {
                if (gameState === 'EDITOR' && isBuilding) { isBuilding = false; isHovering = false; localStorage.setItem('slimeDashLevel', JSON.stringify(levelData)); }
            });

            // --- 11. GENERATEUR INFINI ---
            function updateEndlessGeneration() {
                const currentGridX = Math.floor(cameraX / GRID_SIZE);
                const targetGridX = currentGridX + Math.floor(width / GRID_SIZE) + 5; 

                if (nextEndlessSpawnX < targetGridX) {
                    const r = Math.random();
                    let type = 'block';
                    if(r > 0.8) type = 'hole';
                    else if(r > 0.5) type = 'spike';
                    else if(r > 0.4) type = 'pad';
                    else if(r > 0.3) type = 'coin';

                    let y = 0;
                    if((type === 'block' || type === 'pad' || type === 'coin') && Math.random() > 0.5) y = Math.floor(Math.random() * 3);
                    if (type === 'coin') y += 1;

                    endlessLevelData.push({x: nextEndlessSpawnX, y: type === 'hole' ? 0 : y, type: type, collected: false});
                    
                    const gap = Math.floor(Math.random() * 3) + Math.floor(gameSpeed / 150);
                    nextEndlessSpawnX += gap;
                }

                if (endlessLevelData.length > 50 && endlessLevelData[0].x < currentGridX - 10) {
                    endlessLevelData.shift();
                }
            }

            // --- 12. CONTROLES SAUT & COLLISIONS ---
            function triggerJump() {
                if (gameState.startsWith('PLAYING')) {
                    if (player.isGrounded) {
                        player.vy = JUMP_FORCE; player.isGrounded = false;
                        setAnimState('JUMP');
                        spawnParticles(player.x + player.size/2, player.y + player.size, 'var(--neon-green)', 15);
                    }
                }
            }

            function checkCollisions(activeLevelData) {
                if (!activeLevelData || !Array.isArray(activeLevelData)) return;

                const playerWorldX = player.x + cameraX;
                const playerCenterGridX = Math.floor((playerWorldX + player.size/2) / GRID_SIZE);
                const holeUnder = activeLevelData.find(o => o.type === 'hole' && o.x === playerCenterGridX);
                const currentGroundLevel = holeUnder ? 9999 : (height - GROUND_HEIGHT - player.size);

                if (player.y >= currentGroundLevel) {
                    player.y = currentGroundLevel; player.vy = 0;
                    if (!player.isGrounded) {
                        player.isGrounded = true; setAnimState('LAND');
                        spawnParticles(player.x + player.size/2, player.y + player.size, 'rgba(57, 255, 20, 0.7)', 8);
                    }
                } else {
                    player.isGrounded = false;
                    if (player.animState !== 'JUMP') setAnimState('JUMP');
                }

                if (player.y > height + 100) { gameOver(false); return; }

                const nearbyObjects = activeLevelData.filter(o => o.type !== 'hole' && Math.abs((o.x * GRID_SIZE) - playerWorldX) < 200);
                
                for (let obs of nearbyObjects) {
                    if(obs.collected || obs.type === 'holo') continue; 

                    const obsScreenX = (obs.x * GRID_SIZE) - cameraX;
                    const obsScreenY = height - GROUND_HEIGHT - ((obs.y + 1) * GRID_SIZE);
                    const obsSize = GRID_SIZE;

                    const tolX = 12, tolY = 12;
                    const hitX = (player.x + tolX < obsScreenX + obsSize) && (player.x + player.size - tolX > obsScreenX);
                    
                    if (obs.type === 'coin') {
                        const hitY = (player.y < obsScreenY + obsSize) && (player.y + player.size > obsScreenY);
                        if (hitX && hitY) {
                            obs.collected = true; score += 500;
                            spawnParticles(obsScreenX + obsSize/2, obsScreenY + obsSize/2, 'var(--neon-yellow)', 20);
                        }
                        continue; 
                    }

                    if (obs.type === 'block' || obs.type === 'pad') {
                        const hitY = (player.y + tolY < obsScreenY + obsSize) && (player.y + player.size - tolY > obsScreenY);
                        if (hitX && hitY) {
                            if (player.vy > 0 && player.y + player.size - player.vy * 0.05 <= obsScreenY + 15) {
                                player.y = obsScreenY - player.size; 
                                if (obs.type === 'pad') {
                                    player.vy = JUMP_FORCE * 1.5; player.isGrounded = false; setAnimState('JUMP');
                                    spawnParticles(obsScreenX + obsSize/2, obsScreenY, 'var(--neon-cyan)', 15);
                                } else {
                                    player.vy = 0; if(!player.isGrounded) { player.isGrounded = true; setAnimState('LAND'); }
                                }
                                continue; 
                            }
                            gameOver(false); return;
                        }
                    } 
                    else if (obs.type === 'spike') {
                        const hitY = (player.y + player.size - tolY > obsScreenY + obsSize * 0.4) && (player.y + tolY < obsScreenY + obsSize);
                        if (hitX && hitY) { gameOver(false); return; }
                    }
                    else if (obs.type === 'flag') {
                        const hitY = (player.y + tolY < obsScreenY + obsSize) && (player.y + player.size > obsScreenY);
                        if (hitX && hitY) { gameOver(true); return; } 
                    }
                }
            }

            // --- 13. BOUCLE MOTEUR (UPDATE & DRAW) ---
            let lastTime = performance.now();

            function mainLoop(currentTime) {
                const dt = Math.min((currentTime - lastTime) / 1000, 0.1);
                lastTime = currentTime;
                update(dt); draw();
                requestAnimationFrame(mainLoop);
            }

            function update(dt) {
                player.animTimer += dt;
                if (player.animTimer >= player.animSpeed) {
                    player.animTimer = 0; player.frameIndex++;
                    if (player.animState === 'JUMP') { if (player.frameIndex >= sprites.jump.length) player.frameIndex = sprites.jump.length - 1; } 
                    else if (player.animState === 'LAND') { if (player.frameIndex >= sprites.land.length) setAnimState('RECOVER'); }
                    else if (player.animState === 'RECOVER') { if (player.frameIndex >= sprites.idle.length) setAnimState('RUN'); }
                    else if (player.animState === 'IDLE') { player.frameIndex = player.frameIndex % sprites.idle.length; }
                    else if (player.animState === 'RUN') { player.frameIndex = player.frameIndex % sprites.run.length; }
                }

                particles.forEach((p, i) => { p.x += p.vx * dt; p.y += p.vy * dt; p.alpha -= p.decay * dt; if (p.alpha <= 0) particles.splice(i, 1); });
                if (shakeTimer > 0) shakeTimer -= dt;

                if (gameState.startsWith('PLAYING')) {
                    cameraX += gameSpeed * dt;
                    player.vy += GRAVITY * dt;
                    player.y += player.vy * dt;

                    player.trail.push({x: player.x, y: player.y, state: player.animState, frame: player.frameIndex});
                    if (player.trail.length > 8) player.trail.shift();

                    score += gameSpeed * dt * 0.1;
                    document.getElementById('score').innerText = Math.floor(score);

                    if (gameState === 'PLAYING_ENDLESS') {
                        gameSpeed += dt * 10; 
                        updateEndlessGeneration();
                        checkCollisions(endlessLevelData);
                    } else {
                        checkCollisions(levelData); 
                    }
                } 
                else if (gameState === 'EDITOR') {
                    cameraX += (editorCamTarget - cameraX) * 10 * dt;
                    if(cameraX < 0) { cameraX = 0; editorCamTarget = 0; }
                }
            }

            function drawEditorObject(type, screenX, screenY, alpha = 1) {
                ctx.globalAlpha = alpha;
                if (type === 'block') {
                    ctx.fillStyle = '#111'; ctx.fillRect(screenX, screenY, GRID_SIZE, GRID_SIZE);
                    ctx.strokeStyle = '#00f0ff'; ctx.lineWidth = 2; ctx.strokeRect(screenX, screenY, GRID_SIZE, GRID_SIZE);
                    ctx.shadowBlur = 10; ctx.shadowColor = '#00f0ff'; ctx.strokeRect(screenX, screenY, GRID_SIZE, GRID_SIZE); ctx.shadowBlur=0;
                } 
                else if (type === 'pad') {
                    ctx.fillStyle = 'var(--neon-cyan)'; ctx.fillRect(screenX, screenY + GRID_SIZE/2, GRID_SIZE, GRID_SIZE/2);
                    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(screenX, screenY + GRID_SIZE/2, GRID_SIZE, GRID_SIZE/2);
                    ctx.shadowBlur = 15; ctx.shadowColor = 'var(--neon-cyan)'; ctx.strokeRect(screenX, screenY + GRID_SIZE/2, GRID_SIZE, GRID_SIZE/2); ctx.shadowBlur=0;
                }
                else if (type === 'holo') {
                    ctx.fillStyle = 'rgba(0, 240, 255, 0.15)'; ctx.fillRect(screenX, screenY, GRID_SIZE, GRID_SIZE);
                    ctx.strokeStyle = 'rgba(0, 240, 255, 0.6)'; ctx.lineWidth = 2; ctx.setLineDash([5, 5]);
                    ctx.strokeRect(screenX, screenY, GRID_SIZE, GRID_SIZE); ctx.setLineDash([]);
                }
                else if (type === 'coin') {
                    const floatY = screenY + Math.sin(performance.now()/200) * 5;
                    ctx.shadowBlur = 15; ctx.shadowColor = 'var(--neon-yellow)'; ctx.fillStyle = 'var(--neon-yellow)';
                    ctx.beginPath(); ctx.moveTo(screenX + GRID_SIZE/2, floatY + GRID_SIZE/4);
                    ctx.lineTo(screenX + GRID_SIZE*0.75, floatY + GRID_SIZE/2);
                    ctx.lineTo(screenX + GRID_SIZE/2, floatY + GRID_SIZE*0.75);
                    ctx.lineTo(screenX + GRID_SIZE/4, floatY + GRID_SIZE/2);
                    ctx.closePath(); ctx.fill(); ctx.shadowBlur=0;
                }
                else if (type === 'spike') {
                    ctx.shadowBlur = 10; ctx.shadowColor = '#ff007f'; ctx.fillStyle = '#111'; ctx.strokeStyle = '#ff007f'; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.moveTo(screenX + GRID_SIZE/2, screenY); ctx.lineTo(screenX + GRID_SIZE, screenY + GRID_SIZE);
                    ctx.lineTo(screenX, screenY + GRID_SIZE); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.shadowBlur=0;
                }
                else if (type === 'flag') {
                    ctx.shadowBlur = 15; ctx.shadowColor = 'var(--neon-yellow)'; ctx.fillStyle = 'var(--neon-yellow)';
                    ctx.fillRect(screenX + GRID_SIZE/2 - 2, screenY - GRID_SIZE, 4, GRID_SIZE * 2); 
                    ctx.beginPath(); ctx.moveTo(screenX + GRID_SIZE/2, screenY - GRID_SIZE); ctx.lineTo(screenX + GRID_SIZE, screenY - GRID_SIZE + 20);
                    ctx.lineTo(screenX + GRID_SIZE/2, screenY - GRID_SIZE + 40); ctx.closePath(); ctx.fill(); ctx.shadowBlur=0;
                }
                else if (type === 'hole') {
                    ctx.fillStyle = '#0b0c10'; ctx.fillRect(screenX, height - GROUND_HEIGHT, GRID_SIZE, GROUND_HEIGHT);
                    ctx.strokeStyle = 'var(--neon-pink)'; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.moveTo(screenX, height - GROUND_HEIGHT); ctx.lineTo(screenX + GRID_SIZE, height - GROUND_HEIGHT); ctx.stroke();
                }
                ctx.globalAlpha = 1;
            }

            function draw() {
                ctx.save();
                if (shakeTimer > 0) ctx.translate((Math.random() - 0.5) * shakeIntensity, (Math.random() - 0.5) * shakeIntensity);
                ctx.clearRect(0, 0, width, height);

                const gridAlpha = gameState === 'EDITOR' ? '0.2' : '0.05';
                ctx.strokeStyle = `rgba(57, 255, 20, ${gridAlpha})`; ctx.lineWidth = 1; ctx.beginPath();
                const offsetX = cameraX % GRID_SIZE;
                for(let x = -offsetX; x < width; x += GRID_SIZE) { ctx.moveTo(x, 0); ctx.lineTo(x, height); }
                for(let y = (height - GROUND_HEIGHT) % GRID_SIZE; y < height; y += GRID_SIZE) { ctx.moveTo(0, y); ctx.lineTo(width, y); }
                ctx.stroke();

                const groundY = height - GROUND_HEIGHT;
                ctx.fillStyle = '#050508'; ctx.fillRect(0, groundY, width, GROUND_HEIGHT);
                ctx.shadowBlur = 10; ctx.shadowColor = 'var(--neon-green)'; ctx.strokeStyle = 'var(--neon-green)'; ctx.lineWidth = 3;
                ctx.beginPath();
                
                let isDrawingLine = true;
                ctx.moveTo(0, groundY);

                const activeLevelData = gameState === 'PLAYING_ENDLESS' ? endlessLevelData : levelData;

                for (let screenX = 0; screenX <= width; screenX += GRID_SIZE) {
                    const worldX = screenX + cameraX; const gridX = Math.floor(worldX / GRID_SIZE);
                    const hasHole = activeLevelData.some(o => o.type === 'hole' && o.x === gridX);
                    if (hasHole) { if (isDrawingLine) { ctx.lineTo(screenX, groundY); isDrawingLine = false; } ctx.moveTo(screenX + GRID_SIZE, groundY); } 
                    else { if (!isDrawingLine) { ctx.moveTo(screenX, groundY); isDrawingLine = true; } ctx.lineTo(screenX + GRID_SIZE, groundY); }
                }
                ctx.stroke(); ctx.shadowBlur = 0;

                if(activeLevelData && Array.isArray(activeLevelData)) {
                    activeLevelData.forEach(obs => {
                        if (obs.type === 'hole' || obs.collected) return; 
                        const screenX = (obs.x * GRID_SIZE) - cameraX;
                        const screenY = groundY - ((obs.y + 1) * GRID_SIZE);
                        if(screenX + GRID_SIZE < 0 || screenX > width) return;
                        drawEditorObject(obs.type, screenX, screenY);
                    });
                }

                if (gameState === 'EDITOR' && isHovering) {
                    const ghostScreenX = (hoverGridX * GRID_SIZE) - cameraX;
                    const ghostScreenY = currentTool === 'hole' ? groundY : groundY - ((hoverGridY + 1) * GRID_SIZE);
                    if (currentTool === 'eraser') { ctx.fillStyle = 'rgba(255, 0, 127, 0.4)'; ctx.fillRect(ghostScreenX, ghostScreenY, GRID_SIZE, GRID_SIZE); } 
                    else { drawEditorObject(currentTool, ghostScreenX, ghostScreenY, 0.5); }
                }

                if(gameState.startsWith('PLAYING')) {
                    player.trail.forEach((pos, index) => {
                        const alpha = (index / player.trail.length) * 0.4;
                        const arr = sprites[pos.state.toLowerCase()] || sprites.idle;
                        const trailImg = arr[pos.frame % arr.length];
                        ctx.globalAlpha = alpha;
                        if (trailImg && trailImg.complete) ctx.drawImage(trailImg, pos.x - 15, pos.y, player.size, player.size);
                    });
                    ctx.globalAlpha = 1.0;
                }

                let currentArray = sprites.idle;
                if(player.animState === 'RUN') currentArray = sprites.run;
                else if(player.animState === 'JUMP') currentArray = sprites.jump;
                else if(player.animState === 'LAND') currentArray = sprites.land;
                
                let safeIndex = player.frameIndex % currentArray.length;
                if (player.animState === 'JUMP' && player.frameIndex >= currentArray.length) safeIndex = currentArray.length - 1;
                
                const activeImg = currentArray[safeIndex];

                if (activeImg && activeImg.complete && activeImg.naturalWidth > 0) {
                    ctx.shadowBlur = 15; ctx.shadowColor = 'var(--neon-green)';
                    ctx.drawImage(activeImg, player.x, player.y, player.size, player.size);
                    ctx.shadowBlur = 0;
                } else {
                    ctx.fillStyle = '#0b0c10'; ctx.fillRect(player.x, player.y, player.size, player.size);
                    ctx.strokeStyle = '#39ff14'; ctx.lineWidth = 3; ctx.strokeRect(player.x, player.y, player.size, player.size);
                    ctx.fillStyle = '#39ff14'; ctx.font = '10px Arial'; ctx.fillText('IMG?', player.x + 5, player.y + 25);
                }

                particles.forEach(p => { ctx.fillStyle = p.color; ctx.globalAlpha = Math.max(0, p.alpha); ctx.fillRect(p.x, p.y, p.size, p.size); });
                ctx.globalAlpha = 1;

                ctx.restore();
            }

            requestAnimationFrame(mainLoop);

        }); // FIN DU DOMContentLoaded
    </script>
</body>
