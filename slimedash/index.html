<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Slime-Dash : Infinite Run</title>
    <script src="https://www.youtube.com/iframe_api"></script>
    
    <!-- Ajout de la police Rajdhani commune à tous les jeux -->
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #050811;
            --neon-cyan: #00f0ff;
            --neon-pink: #ff007f;
            --neon-green: #39ff14;
            --neon-yellow: #fce803;
            --neon-red: #ff3333;
            --text-color: #e0e0e0;
            --font-main: 'Rajdhani', sans-serif;
            --panel: rgba(10, 15, 28, 0.85);
        }

        body, html {
            margin: 0; padding: 0; width: 100vw; height: 100vh;
            background-color: var(--bg-color); color: var(--text-color);
            font-family: var(--font-main); overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        /* --- CONTENEUR PRINCIPAL DU JEU --- */
        #game-container {
            position: relative; width: 100%; height: 100%; max-width: 1200px; max-height: 700px;
            background: var(--panel); box-shadow: 0 0 30px rgba(57, 255, 20, 0.2);
            touch-action: none; overflow: hidden; border: 2px solid rgba(57, 255, 20, 0.3); border-radius: 15px;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); 
            backdrop-filter: blur(10px);
        }

        canvas { display: block; width: 100%; height: 100%; border-radius: inherit; }

        /* --- GESTION DES 3 TAILLES D'ÉCRAN --- */
        .size-classic canvas { width: 100%; height: 100%; }
        
        /* Le jeu se lance de base en Full Screen Web */
        #game-container.size-wide, #game-container.size-full {
            position: fixed !important; top: 0; left: 0; 
            width: 100vw !important; height: 100vh !important;
            max-width: none; max-height: none; border-radius: 0; border: none; padding: 0; 
            z-index: 999; background: var(--bg-color); 
        }
        #game-container.size-wide canvas, #game-container.size-full canvas {
            width: 100vw; height: 100vh; border-radius: 0; border: none; object-fit: fill;
        }

        /* --- BOUTON RETOUR AU HUB --- */
        #btn-retour-hub {
            position: fixed; top: 20px; left: 20px; z-index: 9999;
            color: rgba(255,255,255,0.8); text-decoration: none; font-weight: bold; font-size: 1.2rem;
            background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 8px; border: 1px solid rgba(0, 240, 255, 0.3); backdrop-filter: blur(10px);
            transition: all 0.3s ease; display: flex; align-items: center; gap: 8px; font-family: 'Rajdhani', sans-serif;
        }
        #btn-retour-hub:hover {
            color: #fff; background: rgba(0, 240, 255, 0.2); border-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(0, 240, 255, 0.6); transform: translateX(-5px);
        }

        /* --- BOUTONS OPTIONS FLOTTANTS --- */
        .floating-controls {
            position: absolute; top: 20px; right: 80px; z-index: 1000;
            display: flex; gap: 15px;
        }

        #btn-mute, #btn-stop-test {
            background-color: rgba(0, 0, 0, 0.5); border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan); padding: 8px 15px; font-family: inherit; font-size: 1.1rem; border-radius: 8px; 
            cursor: pointer; font-weight: bold; transition: 0.2s ease; backdrop-filter: blur(5px);
        }
        #btn-mute:hover, #btn-stop-test:hover { background-color: rgba(0, 240, 255, 0.15); box-shadow: 0 0 15px rgba(0, 240, 255, 0.5); color: #fff;}
        #btn-stop-test { border-color: var(--neon-pink); color: var(--neon-pink); display: none; }
        #btn-stop-test:hover { background-color: rgba(255, 0, 127, 0.15); box-shadow: 0 0 15px rgba(255, 0, 127, 0.5); color: #fff; }

        /* --- BOUTON SETTINGS & ORBITE --- */
        .settings-btn-wrapper { position: fixed; top: 15px; right: 25px; width: 45px; height: 45px; cursor: pointer; z-index: 9999; }
        .settings-btn { width: 100%; height: 100%; object-fit: contain; transition: transform 0.2s ease; filter: drop-shadow(0 0 10px rgba(0, 229, 255, 0.8)); position: relative; z-index: 2;}
        .orbit-container { position: absolute; top: -15px; left: -15px; right: -15px; bottom: -15px; border-radius: 50%; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; z-index: 1;}
        .orbit-slime { position: absolute; top: 0; left: 50%; transform: translate(-50%, -50%); width: 16px; height: 14px; background: var(--neon-green); border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; box-shadow: 0 0 15px var(--neon-green), 0 0 5px #ffffff; }
        .settings-btn-wrapper:hover .settings-btn { transform: scale(1.15); }
        .settings-btn-wrapper:hover .orbit-container { opacity: 1; animation: spinOrbit 1.2s linear infinite; }
        @keyframes spinOrbit { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* --- MODAL PARAMETRES & TAILLE D'ÉCRAN --- */
        #settings-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 99999; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; backdrop-filter: blur(5px); }
        #settings-modal.show { opacity: 1; pointer-events: auto; }
        .settings-content { background: rgba(15, 20, 30, 0.95); border: 2px solid var(--neon-cyan); border-radius: 15px; padding: 30px 40px; color: white; text-align: center; box-shadow: 0 0 30px rgba(0,229,255,0.4); min-width: 380px; }
        .size-options { display: flex; justify-content: center; gap: 10px; margin-top: 15px; }
        .btn-size { background: #222; color: #fff; border: 1px solid var(--neon-cyan); padding: 10px 15px; border-radius: 5px; cursor: pointer; font-family: 'Rajdhani'; font-weight: bold; transition: 0.2s; }
        .btn-size:hover { background: rgba(0, 240, 255, 0.2); }
        .btn-size.active { background: var(--neon-cyan); color: #000; box-shadow: 0 0 15px var(--neon-cyan); }
        .close-btn { margin-top: 25px; background: var(--neon-cyan); color: #000; border: none; padding: 10px 25px; font-size: 1.1rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; text-transform: uppercase; }
        .close-btn:hover { box-shadow: 0 0 20px var(--neon-cyan); transform: scale(1.05); }

        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column;
            justify-content: space-between; padding: 25px; box-sizing: border-box;
            z-index: 50;
        }

        .score-board {
            display: flex; justify-content: space-between; font-size: 1.8rem; font-weight: bold;
            color: var(--neon-pink); text-shadow: 0 0 12px var(--neon-pink); letter-spacing: 2px;
            pointer-events: auto; padding-top: 60px; /* Evite de passer sous les boutons */
        }

        /* --- MENUS EN GLASSMORPHISM (Look Cyber Smash) --- */
        #menu-screen, #gameover-screen {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; pointer-events: auto; 
            background: rgba(10, 15, 28, 0.6); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            padding: 40px 60px; border: 1px solid rgba(0, 240, 255, 0.2); 
            box-shadow: 0 15px 50px rgba(0,0,0,0.8), inset 0 0 20px rgba(0, 240, 255, 0.05);
            border-radius: 20px; z-index: 100; width: 90%; max-width: 600px;
        }

        #gameover-screen { border-color: rgba(255, 0, 127, 0.3); box-shadow: 0 15px 50px rgba(0,0,0,0.8), inset 0 0 20px rgba(255, 0, 127, 0.1); display: none; }

        h1 { margin-top: 0; color: #fff; text-shadow: 0 0 20px #fff, 0 0 30px var(--neon-cyan); text-transform: uppercase; font-size: 3.5rem; letter-spacing: 5px; }

        p { color: #ccc; margin-bottom: 25px; font-size: 1.2rem; line-height: 1.5; font-weight: bold;}

        .btn-group { display: flex; flex-direction: column; gap: 15px; justify-content: center; align-items: center; margin-bottom: 20px;}
        .btn-row { display: flex; gap: 15px; justify-content: center; width: 100%; }

        /* BOUTONS D'ACTION (Style Cyber Smash) */
        .action-btn-main {
            width: 100%; max-width: 400px; padding: 15px; margin: 5px 0;
            font-size: 1.3rem; font-family: 'Rajdhani', sans-serif; font-weight: bold;
            color: #fff; text-transform: uppercase; letter-spacing: 1px;
            background: rgba(0,0,0,0.5); border: 2px solid transparent; border-radius: 10px; 
            cursor: pointer; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative; overflow: hidden; pointer-events: auto;
        }
        .action-btn-main::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent); transition: 0.5s;
        }
        .action-btn-main:hover::after { left: 150%; }
        .action-btn-main:hover { transform: translateY(-4px); color: #000;}

        .btn-play { border-color: var(--neon-green); box-shadow: 0 0 15px rgba(57, 255, 20, 0.2); }
        .btn-play:hover { background: var(--neon-green); box-shadow: 0 10px 30px rgba(57, 255, 20, 0.6); }
        
        .btn-edit { border-color: var(--neon-yellow); box-shadow: 0 0 15px rgba(252, 232, 3, 0.2); }
        .btn-edit:hover { background: var(--neon-yellow); box-shadow: 0 10px 30px rgba(252, 232, 3, 0.6); }
        
        .btn-code { border-color: var(--neon-pink); box-shadow: 0 0 15px rgba(255, 0, 127, 0.2); }
        .btn-code:hover { background: var(--neon-pink); box-shadow: 0 10px 30px rgba(255, 0, 127, 0.6); }

        #code-section {
            border-top: 1px solid rgba(255,255,255,0.1); padding-top: 25px; margin-top: 15px;
            display: none; flex-direction: column; gap: 15px; align-items: center; width: 100%;
        }
        input[type="text"] {
            background: rgba(0,0,0,0.8); border: 1px solid var(--neon-pink); color: #fff;
            padding: 15px; font-size: 1.2rem; font-family: inherit; font-weight: bold; outline: none; 
            text-align: center; width: 80%; border-radius: 8px;
        }
        input[type="text"]:focus { box-shadow: 0 0 15px var(--neon-pink); }

        #editor-panel {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(11, 12, 16, 0.95); border: 2px solid var(--neon-yellow);
            padding: 15px 20px; border-radius: 10px; display: none; gap: 10px; pointer-events: auto;
            box-shadow: 0 0 15px var(--neon-yellow); z-index: 100; align-items: center; flex-wrap: nowrap; 
            cursor: grab;
        }
        #editor-panel:active { cursor: grabbing; }

        .tool-btn { 
            padding: 10px; font-size: 1.3rem; border-color: gray; color: gray; min-width: 45px; 
            background: #000; cursor: pointer; border-radius: 5px; border-style: solid; border-width: 2px;
        }
        .tool-btn.active { border-color: var(--neon-yellow); color: var(--neon-yellow); box-shadow: 0 0 10px var(--neon-yellow); }
        .divider { width: 2px; height: 40px; background: gray; margin: 0 5px; }
        .action-btn { padding: 10px 15px; font-size: 1rem; border-radius: 5px; cursor: pointer; text-transform: uppercase; font-weight: bold; background: #000; font-family: inherit; }
        .action-tester { border: 2px solid var(--neon-green); color: var(--neon-green); }
        .action-exporter { border: 2px solid var(--neon-cyan); color: var(--neon-cyan); }
        .action-quitter { border: 2px solid var(--neon-pink); color: var(--neon-pink); }
        .action-tester:hover { background: var(--neon-green); color: #000; }
        .action-exporter:hover { background: var(--neon-cyan); color: #000; }
        .action-quitter:hover { background: var(--neon-pink); color: #000; }
    </style>
</head>
<body>

    <script>
        document.addEventListener('touchstart', (e) => { 
            if(e.target.closest('.no-swipe')) e.stopPropagation(); 
        }, { passive: false });
    </script>

    <!-- BOUTONS FLOTTANTS (Hors Container pour le Settings) -->
    <a href="../index.html" id="btn-retour-hub" title="Retour au Hub Global">⬅ Retour au Hub</a>

    <div class="settings-btn-wrapper" onmouseenter="startSettingsAnim()" onmouseleave="stopSettingsAnim()" onclick="clickSettingsAnim()">
        <div class="orbit-container"><div class="orbit-slime"></div></div>
        <img src="../img/setting.png" alt="Paramètres" id="settings-btn-img" class="settings-btn">
    </div>

    <!-- MODAL PARAMETRES -->
    <div id="settings-modal">
        <div class="settings-content">
            <h2 style="margin-top: 0; color: var(--neon-cyan); text-transform: uppercase; letter-spacing: 2px;">Paramètres</h2>
            
            <div class="setting-item" style="flex-direction: column; gap: 15px; margin-bottom: 30px;">
                <span>Format de l'Écran 🖥️</span>
                <div class="size-options">
                    <button id="btn-sz-classic" class="btn-size" onclick="setGameSize('classic')">Petit</button>
                    <button id="btn-sz-wide" class="btn-size active" onclick="setGameSize('wide')">Plein Page</button>
                    <button id="btn-sz-full" class="btn-size" onclick="setGameSize('full')">Plein Écran</button>
                </div>
            </div>
            
            <button onclick="toggleSettings()" class="close-btn">Fermer</button>
        </div>
    </div>

    <!-- SCRIPT GESTION TAILLE ÉCRAN & ANIMATION SETTINGS -->
    <script>
        // ANIMATION DU BOUTON SETTINGS
        const settingsBtnImg = document.getElementById('settings-btn-img');
        const animFrames = ['../img/settings1.png', '../img/settings2.png', '../img/settings3.png', '../img/settings5.png'];
        let hoverInterval; let currentFrame = 0;

        function startSettingsAnim() {
            if (hoverInterval) return;
            currentFrame = 0;
            settingsBtnImg.src = animFrames[currentFrame];
            hoverInterval = setInterval(() => {
                currentFrame = (currentFrame + 1) % animFrames.length;
                settingsBtnImg.src = animFrames[currentFrame];
            }, 100); 
        }

        function stopSettingsAnim() {
            clearInterval(hoverInterval); hoverInterval = null;
            if (!settingsBtnImg.src.includes('settings4.png')) { settingsBtnImg.src = '../img/setting.png'; }
        }

        function clickSettingsAnim() {
            clearInterval(hoverInterval); hoverInterval = null;
            settingsBtnImg.src = '../img/settings4.png';
            toggleSettings();
            setTimeout(() => { settingsBtnImg.src = '../img/setting.png'; }, 300);
        }

        function toggleSettings() {
            document.getElementById('settings-modal').classList.toggle('show');
        }

        // GESTION DE LA TAILLE DU JEU (Se lance en WIDE de base)
        function setGameSize(size) {
            const container = document.getElementById('game-container');
            const btns = document.querySelectorAll('.btn-size');
            btns.forEach(b => b.classList.remove('active'));

            container.classList.remove('size-classic', 'size-wide', 'size-full');
            
            if (size === 'classic') {
                container.classList.add('size-classic');
                document.getElementById('btn-sz-classic').classList.add('active');
                if (document.fullscreenElement) document.exitFullscreen();
            } 
            else if (size === 'wide') {
                container.classList.add('size-wide');
                document.getElementById('btn-sz-wide').classList.add('active');
                if (document.fullscreenElement) document.exitFullscreen();
            } 
            else if (size === 'full') {
                container.classList.add('size-full');
                document.getElementById('btn-sz-full').classList.add('active');
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(e => console.log(e));
                }
            }
        }
        
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement && document.getElementById('game-container').classList.contains('size-full')) {
                setGameSize('wide');
            }
        });
    </script>


    <div id="yt-player" style="display: none;"></div>

    <!-- CONTAINER DU JEU (Initialisé en size-wide) -->
    <div id="game-container" class="no-swipe size-wide">
        
        <div class="floating-controls">
            <button id="btn-stop-test">🛑 STOP TEST</button>
            <button id="btn-mute">🔊 SON: ON</button>
        </div>

        <div id="ui-layer">

                    <div style="font-size: 1.1rem; color: #ccff00; text-shadow: 0 0 10px #ccff00; margin-top: 5px;">LUCIOLES: <span id="fireflies-count" style="color: #fff;">0</span></div>
                    <div style="font-size: 1.1rem; color: var(--neon-red); text-shadow: 0 0 10px var(--neon-red); margin-top: 5px;">DEATHS: <span id="death-count" style="color: #fff;">0</span></div>
                </div>
            </div>
        </div>

        <div id="menu-screen">
            <h1 id="menu-title">Slime-Dash</h1>
            <p id="menu-desc">Échappe à l'infection ou crée ton propre enfer quantique.</p>
            
            <div class="btn-group">
                <button id="btn-play-endless" class="action-btn-main btn-play">▶ JOUER (Infini)</button>
                <div class="btn-row">
                    <button id="btn-create-map" class="action-btn-main btn-edit">🛠️ CRÉER UNE MAP</button>
                    <button id="btn-play-code" class="action-btn-main btn-code">📋 JOUER UN CODE</button>
                </div>
            </div>

            <div id="code-section">
                <input type="text" id="map-code-input" placeholder="Coller le code ici...">

        <div id="gameover-screen">
            <h2 id="go-title">CRASH CRITIQUE</h2>

            <div class="btn-group" style="margin-bottom: 0; width: 100%;">
                <button id="btn-replay" class="action-btn-main btn-play">REJOUER</button>
                <button id="btn-back-menu" class="action-btn-main btn-edit">RETOUR MENU</button>
            </div>
        </div>

        <div id="editor-panel">
            <button class="tool-btn active" data-tool="block" title="Bloc (Carre)">🟦</button>
            <button class="tool-btn" data-tool="spike" title="Pic (Triangle)">🔺</button>
            <button class="tool-btn" data-tool="hole" title="Trou">🕳️</button>
            <button class="tool-btn" data-tool="pad" title="Propulseur (Rebon)">🚀</button>
            <button class="tool-btn" data-tool="holo" title="Hologramme (Fake)">👻</button>
            <button class="tool-btn" data-tool="coin" title="Luciole (Bonus Max 20)">✨</button>
            <button class="tool-btn" data-tool="start_flag" title="Point de Départ (Un seul)">🟢</button>
            <button class="tool-btn" data-tool="flag" title="Fin du niveau">🏁</button>
            <button class="tool-btn" data-tool="eraser" title="Gomme">❌</button>
            
            <div class="divider"></div>
            <button class="tool-btn" id="cam-left" title="Caméra Gauche">◀</button>
            <button class="tool-btn" id="cam-right" title="Caméra Droite">▶</button>
            <div class="divider"></div>

            <button id="test-btn" class="action-btn action-tester">TESTER</button>
            <button id="export-btn" class="action-btn action-exporter">📤 EXPORTER</button>
            <button id="exit-btn" class="action-btn action-quitter">QUITTER</button>
        </div>
    </div>

    <!-- TON SCRIPT MOTEUR DE JEU -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {

            let ytPlayer;
            let audioStarted = false;
            let isMuted = false;

            window.onYouTubeIframeAPIReady = function() {
                ytPlayer = new YT.Player('yt-player', {
                    height: '0', width: '0', videoId: '0QjHiah9Z3I', 
                    playerVars: { 'autoplay': 0, 'controls': 0, 'disablekb': 1 },
                    events: { 
                        'onReady': (e) => {
                            e.target.setVolume(10);
                            if (isMuted) e.target.mute();
                        }, 
                        'onStateChange': (e) => { if (e.data === YT.PlayerState.ENDED) ytPlayer.playVideo(); } 
                    }
                });
            };

            function initAudio() {
                if (!audioStarted && ytPlayer && typeof ytPlayer.playVideo === 'function') {
                    try { 
                        ytPlayer.playVideo(); 
                        if (isMuted) ytPlayer.mute(); else ytPlayer.unMute();
                        audioStarted = true; 
                    } 
                    catch(e) { console.warn("Erreur Audio Youtube :", e); }
                }
            }

            const btnMute = document.getElementById('btn-mute');
            btnMute.addEventListener('click', () => {
                isMuted = !isMuted;
                if (isMuted) {
                    if (ytPlayer && typeof ytPlayer.mute === 'function') ytPlayer.mute();
                    btnMute.innerText = "🔇 SON: OFF";
                    btnMute.style.color = "var(--neon-pink)";
                    btnMute.style.borderColor = "var(--neon-pink)";
                } else {
                    if (ytPlayer && typeof ytPlayer.unMute === 'function') {
                        ytPlayer.unMute();
                        ytPlayer.setVolume(10);
                    }
                    btnMute.innerText = "🔊 SON: ON";
                    btnMute.style.color = "var(--neon-cyan)";
                    btnMute.style.borderColor = "var(--neon-cyan)";
                }
            });

            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const menuScreen = document.getElementById('menu-screen');
            const gameOverScreen = document.getElementById('gameover-screen');
            const editorPanel = document.getElementById('editor-panel');
            const statusText = document.getElementById('status-text');
            const stopTestBtn = document.getElementById('btn-stop-test');

            let width, height;
            let gameState = 'START'; 
            let currentActiveMode = 'PLAYING_ENDLESS'; 
            let currentIsTest = false; 
            
            const GRID_SIZE = 60; 
            const GROUND_HEIGHT = 90;
            let gameSpeed = 300; 
            
            const GRAVITY = 3600; 
            const JUMP_FORCE = -1050; 
            let jumpBufferTimer = 0; 

            let cameraX = 0;
            let editorCamTarget = 0;
            let score = 0;
            
            let currentEndlessSeed = 12345;
            let activePRNGSeed = 12345;
            function resetSeed(s) { activePRNGSeed = s; }
            function seededRandom() {
                let t = activePRNGSeed += 0x6D2B79F5;
                t = Math.imul(t ^ t >>> 15, t | 1);
                t ^= t + Math.imul(t ^ t >>> 7, t | 61);
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            }

            const player = {

                    particles.push({
                        x: x, y: y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
                        size: Math.random() * 5 + 2, color: color, alpha: 1, decay: Math.random() * 2 + 1.5

            function updateEditorCursor(e) {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const mouseX = (clientX - rect.left) * (canvas.width / rect.width / (window.devicePixelRatio || 1));
                const mouseY = (clientY - rect.top) * (canvas.height / rect.height / (window.devicePixelRatio || 1));
                const worldX = mouseX + cameraX;
                
                hoverGridX = Math.floor(worldX / GRID_SIZE);
                const groundY = height - GROUND_HEIGHT;
                hoverGridY = Math.floor((groundY - mouseY) / GRID_SIZE);
                isHovering = true;
            }

            function placeBlockAtCursor() {
                if (hoverGridY < 0 && currentTool !== 'hole') return; 
                
                if (currentTool === 'flag') levelData = levelData.filter(o => o.type !== 'flag'); 
                if (currentTool === 'start_flag') levelData = levelData.filter(o => o.type !== 'start_flag'); 

                if (currentTool === 'coin') {
                    const currentCoins = levelData.filter(o => o.type === 'coin').length;
                    const existingIndex = levelData.findIndex(obj => obj.x === hoverGridX && obj.y === hoverGridY);
                    
                    if (existingIndex === -1 || levelData[existingIndex].type !== 'coin') {
                        if (currentCoins >= 20) return; 
                    }
                }

                const existingIndex = levelData.findIndex(obj => obj.x === hoverGridX && obj.y === hoverGridY);
                if (currentTool === 'eraser') {
                    if (existingIndex !== -1) levelData.splice(existingIndex, 1);
                } else {
                    if (existingIndex !== -1 && levelData[existingIndex].type === currentTool) return;
                    if (existingIndex !== -1) levelData.splice(existingIndex, 1);
                    let finalY = currentTool === 'hole' ? 0 : hoverGridY;
                    levelData.push({x: hoverGridX, y: finalY, type: currentTool});
                }
            }

            canvas.addEventListener('mousedown', (e) => {
                if (gameState.startsWith('PLAYING')) { e.preventDefault(); triggerJump(); return; }
                if (gameState !== 'EDITOR') return;
                isBuilding = true; updateEditorCursor(e); placeBlockAtCursor();
            });
            canvas.addEventListener('mousemove', (e) => {
                if (gameState !== 'EDITOR') return;
                updateEditorCursor(e); if (isBuilding) placeBlockAtCursor();
            });
            canvas.addEventListener('mouseup', () => {
                if (gameState === 'EDITOR' && isBuilding) { isBuilding = false; localStorage.setItem('slimeDashLevel', JSON.stringify(levelData)); }
            });
            canvas.addEventListener('mouseleave', () => {
                isHovering = false;
                if (gameState === 'EDITOR' && isBuilding) { isBuilding = false; localStorage.setItem('slimeDashLevel', JSON.stringify(levelData)); }
            });
            canvas.addEventListener('touchstart', (e) => {
                if (gameState.startsWith('PLAYING')) { e.preventDefault(); triggerJump(); return; }
                if (gameState !== 'EDITOR') return;
                isBuilding = true; updateEditorCursor(e); placeBlockAtCursor();
            }, {passive: false});
            canvas.addEventListener('touchmove', (e) => {
                if (gameState !== 'EDITOR') return;
                updateEditorCursor(e); if (isBuilding) placeBlockAtCursor();
            }, {passive: false});
            canvas.addEventListener('touchend', () => {
                if (gameState === 'EDITOR' && isBuilding) { isBuilding = false; isHovering = false; localStorage.setItem('slimeDashLevel', JSON.stringify(levelData)); }
            });

            function updateEndlessGeneration() {
                const currentGridX = Math.floor(cameraX / GRID_SIZE);
                const targetGridX = currentGridX + Math.floor(width / GRID_SIZE) + 6; 

                if (nextEndlessSpawnX < targetGridX) {
                    const r = seededRandom();
                    let type = 'coin';
                    let y = 0;
                    let gap = 2; 

                    if (consecutiveObstacles >= 2) {
                        type = 'coin';
                        y = 1;
                        gap = 2;
                        consecutiveObstacles = 0;
                    } else {
                        if (r > 0.85) { type = 'hole'; gap = 3; consecutiveObstacles++; }
                        else if (r > 0.65) { type = 'spike'; gap = 3; consecutiveObstacles++; }
                        else if (r > 0.4) { type = 'block'; y = seededRandom() > 0.5 ? 1 : 0; gap = 2; consecutiveObstacles++; }
                        else if (r > 0.25) { type = 'pad'; gap = 2; consecutiveObstacles = 0; }
                        else { type = 'coin'; y = 1; gap = 2; consecutiveObstacles = 0; }
                    }

                    endlessLevelData.push({x: nextEndlessSpawnX, y: type === 'hole' ? 0 : y, type: type, collected: false});
                    nextEndlessSpawnX += gap;
                }

                if (endlessLevelData.length > 50 && endlessLevelData[0].x < currentGridX - 10) {
                    endlessLevelData.shift();
                }
            }

            function executeJump() {
                player.vy = JUMP_FORCE; 
                player.isGrounded = false;
                setAnimState('JUMP');
                spawnParticles(player.x + player.size/2, player.y + player.size, 'var(--neon-green)', 15);
            }

            function triggerJump() {
                if (gameState.startsWith('PLAYING')) {
                    if (player.isGrounded) {
                        executeJump();
                    } else {
                        jumpBufferTimer = 0.15;
                    }
                }
            }

            window.addEventListener('keydown', (e) => {
                if (e.code === 'Space' || e.code === 'ArrowUp') {
                    if (gameState.startsWith('PLAYING')) {
                        e.preventDefault();
                        triggerJump();
                    } else if (gameState === 'GAMEOVER' || gameState === 'VICTORY') {
                        e.preventDefault();
                        gameOverScreen.style.display = 'none';
                        startGame(currentActiveMode, currentIsTest);
                    }
                }
            });

            function checkCollisions(activeLevelData) {
                if (!activeLevelData || !Array.isArray(activeLevelData)) return;

                const playerWorldX = player.x + cameraX;
                const playerCenterGridX = Math.floor((playerWorldX + player.size/2) / GRID_SIZE);
                const holeUnder = activeLevelData.find(o => o.type === 'hole' && o.x === playerCenterGridX);
                const currentGroundLevel = holeUnder ? 9999 : (height - GROUND_HEIGHT - player.size);

                if (player.y >= currentGroundLevel) {
                    player.y = currentGroundLevel; player.vy = 0;
                    if (!player.isGrounded) {
                        player.isGrounded = true; setAnimState('LAND');
                        spawnParticles(player.x + player.size/2, player.y + player.size, 'rgba(57, 255, 20, 0.7)', 8);
                        
                        if (jumpBufferTimer > 0) { executeJump(); jumpBufferTimer = 0; }
                    }
                } else {
                    player.isGrounded = false;
                    if (player.animState !== 'JUMP') setAnimState('JUMP');
                }

                if (player.y > height + 100) { gameOver(false); return; }

                const nearbyObjects = activeLevelData.filter(o => o.type !== 'hole' && Math.abs((o.x * GRID_SIZE) - playerWorldX) < 200);
                
                for (let obs of nearbyObjects) {
                    if(obs.collected || obs.type === 'holo' || obs.type === 'start_flag') continue; 

                    const obsScreenX = (obs.x * GRID_SIZE) - cameraX;
                    const obsScreenY = height - GROUND_HEIGHT - ((obs.y + 1) * GRID_SIZE);
                    const obsSize = GRID_SIZE;

                    const tolX = 12, tolY = 12;
                    const hitX = (player.x + tolX < obsScreenX + obsSize) && (player.x + player.size - tolX > obsScreenX);
                    
                    if (obs.type === 'coin') {
                        const hitY = (player.y < obsScreenY + obsSize) && (player.y + player.size > obsScreenY);
                        if (hitX && hitY) {
                            obs.collected = true; 
                            score += 500;
                            
                            totalFireflies++;
                            localStorage.setItem('slimeDashFireflies', totalFireflies);
                            if(firefliesElem) firefliesElem.innerText = totalFireflies;

                            spawnParticles(obsScreenX + obsSize/2, obsScreenY + obsSize/2, '#ccff00', 20);
                        }
                        continue; 
                    }

                    if (obs.type === 'pad') {
                        const hitY = (player.y < obsScreenY + obsSize) && (player.y + player.size > obsScreenY);
                        if (hitX && hitY) {
                            player.vy = JUMP_FORCE * 1.5; 
                            player.isGrounded = false; 
                            setAnimState('JUMP');
                            spawnParticles(obsScreenX + obsSize/2, obsScreenY, 'var(--neon-cyan)', 20);
                            continue;
                        }
                    }

                    if (obs.type === 'block') {
                        const hitY = (player.y + tolY < obsScreenY + obsSize) && (player.y + player.size - tolY > obsScreenY);
                        if (hitX && hitY) {
                            if (player.vy > 0 && player.prevY + player.size <= obsScreenY + 25) {
                                player.y = obsScreenY - player.size; 
                                player.vy = 0; 
                                if(!player.isGrounded) { 
                                    player.isGrounded = true; setAnimState('LAND'); 
                                    if (jumpBufferTimer > 0) { executeJump(); jumpBufferTimer = 0; }
                                }
                                continue; 
                            }
                            gameOver(false); return;
                        }
                    } 
                    else if (obs.type === 'spike') {
                        let inverted = activeLevelData.some(o => o.x === obs.x && o.y === obs.y + 1 && o.type === 'block');
                        let hitY = false;
                        
                        if (inverted) {
                            hitY = (player.y + tolY < obsScreenY + obsSize * 0.6) && (player.y + player.size - tolY > obsScreenY);
                        } else {
                            hitY = (player.y + player.size - tolY > obsScreenY + obsSize * 0.4) && (player.y + tolY < obsScreenY + obsSize);
                        }
                        
                        if (hitX && hitY) { gameOver(false); return; }
                    }
                    else if (obs.type === 'flag') {
                        const hitY = (player.y + tolY < obsScreenY + obsSize) && (player.y + player.size > obsScreenY);
                        if (hitX && hitY) { gameOver(true); return; } 
                    }
                }
            }

            let lastTime = performance.now();

            function mainLoop(currentTime) {
                const dt = Math.min((currentTime - lastTime) / 1000, 0.1);
                lastTime = currentTime;
                update(dt); draw();
                requestAnimationFrame(mainLoop);
            }

            function update(dt) {
                if (jumpBufferTimer > 0) jumpBufferTimer -= dt;

                player.animTimer += dt;
                if (player.animTimer >= player.animSpeed) {
                    player.animTimer = 0; player.frameIndex++;
                    if (player.animState === 'JUMP') { if (player.frameIndex >= sprites.jump.length) player.frameIndex = sprites.jump.length - 1; } 
                    else if (player.animState === 'LAND') { if (player.frameIndex >= sprites.land.length) setAnimState('RECOVER'); }
                    else if (player.animState === 'RECOVER') { if (player.frameIndex >= sprites.idle.length) setAnimState('RUN'); }
                    else if (player.animState === 'IDLE') { player.frameIndex = player.frameIndex % sprites.idle.length; }
                    else if (player.animState === 'RUN') { player.frameIndex = player.frameIndex % sprites.run.length; }
                }

                particles.forEach((p, i) => { p.x += p.vx * dt; p.y += p.vy * dt; p.alpha -= p.decay * dt; if (p.alpha <= 0) particles.splice(i, 1); });
                if (shakeTimer > 0) shakeTimer -= dt;

                if (gameState === 'START') {
                    cameraX += 30 * dt;
                }

                if (gameState.startsWith('PLAYING')) {
                    cameraX += gameSpeed * dt;
                    player.prevY = player.y; 
                    player.vy += GRAVITY * dt;
                    player.y += player.vy * dt;

                    score += gameSpeed * dt * 0.1;
                    const scoreElem = document.getElementById('score');
                    if (scoreElem) scoreElem.innerText = Math.floor(score);

                    if (gameState === 'PLAYING_ENDLESS') {
                        gameSpeed += dt * 5; 
                        updateEndlessGeneration();
                        checkCollisions(endlessLevelData);
                    } else {
                        checkCollisions(levelData); 
                    }
                } 
                else if (gameState === 'EDITOR') {
                    cameraX += (editorCamTarget - cameraX) * 10 * dt;
                    if(cameraX < 0) { cameraX = 0; editorCamTarget = 0; }
                }
            }

            function drawImageBackground() {
                let seqW = 0;
                let widths = [];
                
                for (let i = 0; i < bgImages.length; i++) {
                    let img = bgImages[i];
                    if (img.complete && img.naturalHeight > 0) {
                        let w = (height / img.naturalHeight) * img.naturalWidth;
                        widths.push(w);
                        seqW += w;
                    } else {
                        widths.push(0);
                    }
                }

                if (seqW === 0) return; 

                let scrollX = cameraX * 0.15; 
                let startX = -(scrollX % seqW);
                let currentX = startX;

                while (currentX < width) {
                    for (let i = 0; i < bgImages.length; i++) {
                        let img = bgImages[i];
                        let imgW = widths[i];
                        
                        if (imgW > 0 && currentX + imgW > 0 && currentX < width) {
                            ctx.drawImage(img, currentX, 0, imgW, height);
                        }
                        currentX += imgW;
                    }
                }
            }

            function drawEditorObject(type, screenX, screenY, alpha = 1, isInverted = false) {
                ctx.globalAlpha = alpha;
                
                const VISUAL_SCALE = 1.5; 
                const drawW = Math.floor(GRID_SIZE * VISUAL_SCALE);
                const drawH = Math.floor(GRID_SIZE * VISUAL_SCALE);
                const drawX = Math.floor(screenX - (drawW - GRID_SIZE) / 2);
                
                const BLOCK_SCALE = 1.65;
                const blockW = Math.floor(GRID_SIZE * BLOCK_SCALE);
                const blockH = Math.floor(GRID_SIZE * BLOCK_SCALE);
                const blockX = Math.floor(screenX - (blockW - GRID_SIZE) / 2);
                const blockAlignBottomY = screenY + GRID_SIZE - blockH;

                const alignBottomY = screenY + GRID_SIZE - drawH;

                if (type === 'block') {
                    if (carreImg.complete && carreImg.naturalWidth > 0) {
                        ctx.drawImage(carreImg, blockX, blockAlignBottomY + 27, blockW, blockH); 
                    } else {
                        ctx.fillStyle = '#111'; ctx.fillRect(screenX, screenY, GRID_SIZE, GRID_SIZE);
                        ctx.strokeStyle = '#00f0ff'; ctx.lineWidth = 2; ctx.strokeRect(screenX, screenY, GRID_SIZE, GRID_SIZE);
                    }
                } 
                else if (type === 'pad') {
                    if (rebonImg.complete && rebonImg.naturalWidth > 0) {
                        ctx.drawImage(rebonImg, drawX, alignBottomY + 20, drawW, drawH); 
                    } else {
                        ctx.fillStyle = 'rgba(0, 240, 255, 0.2)'; ctx.fillRect(screenX, screenY + GRID_SIZE/2, GRID_SIZE, GRID_SIZE/2);
                        ctx.strokeStyle = 'var(--neon-cyan)'; ctx.lineWidth = 2; ctx.strokeRect(screenX, screenY, GRID_SIZE, GRID_SIZE);
                    }
                }
                else if (type === 'holo') {
                    ctx.fillStyle = 'rgba(0, 240, 255, 0.15)'; ctx.fillRect(screenX, screenY, GRID_SIZE, GRID_SIZE);
                    ctx.strokeStyle = 'rgba(0, 240, 255, 0.6)'; ctx.lineWidth = 2; ctx.setLineDash([5, 5]);
                    ctx.strokeRect(screenX, screenY, GRID_SIZE, GRID_SIZE); ctx.setLineDash([]);
                }
                else if (type === 'coin') {
                    const floatY = Math.floor(screenY + Math.sin(performance.now()/150) * 8); 
                    const coinY = Math.floor(floatY - (drawH - GRID_SIZE) / 2);
                    if (lucioleImg.complete && lucioleImg.naturalWidth > 0) {
                        ctx.shadowBlur = 15; ctx.shadowColor = '#ccff00';
                        ctx.drawImage(lucioleImg, drawX, coinY, drawW, drawH);
                        ctx.shadowBlur = 0;
                    } else {
                        ctx.shadowBlur = 20; ctx.shadowColor = '#ccff00'; ctx.fillStyle = '#eaff80';
                        ctx.beginPath(); ctx.arc(screenX + GRID_SIZE/2, floatY + GRID_SIZE/2, 8, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
                    }
                }
                else if (type === 'spike') {
                    if (isInverted) {
                        ctx.save();
                        ctx.translate(screenX + GRID_SIZE/2, screenY + GRID_SIZE/2);
                        ctx.scale(1, -1);
                        ctx.translate(-(screenX + GRID_SIZE/2), -(screenY + GRID_SIZE/2));
                    }

                    if (triangleImg.complete && triangleImg.naturalWidth > 0) {
                        ctx.drawImage(triangleImg, drawX, alignBottomY + 25, drawW, drawH); 
                    } else {
                        ctx.shadowBlur = 10; ctx.shadowColor = '#ff007f'; ctx.fillStyle = '#111'; ctx.strokeStyle = '#ff007f'; ctx.lineWidth = 2;
                        ctx.beginPath(); ctx.moveTo(screenX + GRID_SIZE/2, screenY); ctx.lineTo(screenX + GRID_SIZE, screenY + GRID_SIZE);
                        ctx.lineTo(screenX, screenY + GRID_SIZE); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.shadowBlur=0;
                    }

                    if (isInverted) {
                        ctx.restore();
                    }
                }
                else if (type === 'flag') {
                    ctx.shadowBlur = 15; ctx.shadowColor = 'var(--neon-yellow)'; ctx.fillStyle = 'var(--neon-yellow)';
                    ctx.fillRect(screenX + GRID_SIZE/2 - 2, screenY - GRID_SIZE, 4, GRID_SIZE * 2); 
                    ctx.beginPath(); ctx.moveTo(screenX + GRID_SIZE/2, screenY - GRID_SIZE); ctx.lineTo(screenX + GRID_SIZE, screenY - GRID_SIZE + 20);
                    ctx.lineTo(screenX + GRID_SIZE/2, screenY - GRID_SIZE + 40); ctx.closePath(); ctx.fill(); ctx.shadowBlur=0;
                }
                else if (type === 'start_flag') {
                    ctx.shadowBlur = 15; ctx.shadowColor = 'var(--neon-green)'; ctx.fillStyle = 'var(--neon-green)';
                    ctx.fillRect(screenX + GRID_SIZE/2 - 2, screenY - GRID_SIZE, 4, GRID_SIZE * 2); 
                    ctx.beginPath(); ctx.moveTo(screenX + GRID_SIZE/2, screenY - GRID_SIZE); ctx.lineTo(screenX + GRID_SIZE, screenY - GRID_SIZE + 20);
                    ctx.lineTo(screenX + GRID_SIZE/2, screenY - GRID_SIZE + 40); ctx.closePath(); ctx.fill(); ctx.shadowBlur=0;
                }
                ctx.globalAlpha = 1;
            }

            function draw() {
                ctx.save();
                if (shakeTimer > 0) ctx.translate((Math.random() - 0.5) * shakeIntensity, (Math.random() - 0.5) * shakeIntensity);
                ctx.clearRect(0, 0, width, height);

                drawImageBackground(); 

                if (gameState === 'EDITOR') {
                    ctx.strokeStyle = `rgba(57, 255, 20, 0.2)`; ctx.lineWidth = 1; ctx.beginPath();
                    const offsetX = cameraX % GRID_SIZE;
                    for(let x = -offsetX; x < width; x += GRID_SIZE) { ctx.moveTo(x, 0); ctx.lineTo(x, height); }
                    for(let y = (height - GROUND_HEIGHT) % GRID_SIZE; y < height; y += GRID_SIZE) { ctx.moveTo(0, y); ctx.lineTo(width, y); }
                    ctx.stroke();
                }

                const groundY = height - GROUND_HEIGHT;

                if (platformImg.complete && platformImg.naturalWidth > 0) {
                    const scale = GROUND_HEIGHT / platformImg.naturalHeight;
                    const pWidth = Math.ceil(platformImg.naturalWidth * scale); 
                    let scrollX = Math.floor(cameraX) % pWidth;
                    for (let i = -scrollX; i < width; i += pWidth) {
                        ctx.drawImage(platformImg, i, groundY, pWidth, GROUND_HEIGHT);
                    }
                } else {
                    ctx.fillStyle = '#050508'; ctx.fillRect(0, groundY, width, GROUND_HEIGHT);
                    ctx.shadowBlur = 10; ctx.shadowColor = 'var(--neon-green)'; ctx.strokeStyle = 'var(--neon-green)'; ctx.lineWidth = 3;
                    ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(width, groundY); ctx.stroke(); ctx.shadowBlur = 0;
                }

                const activeLevelData = gameState === 'PLAYING_ENDLESS' ? endlessLevelData : levelData;
                for (let screenX = 0; screenX <= width; screenX += GRID_SIZE) {
                    const worldX = screenX + cameraX; 
                    const gridX = Math.floor(worldX / GRID_SIZE);
                    const hasHole = activeLevelData.some(o => o.type === 'hole' && o.x === gridX);
                    if (hasHole) { 
                        const exactScreenX = (gridX * GRID_SIZE) - cameraX;
                        ctx.clearRect(exactScreenX, groundY, GRID_SIZE, GROUND_HEIGHT);
                        ctx.fillStyle = '#000'; 
                        ctx.fillRect(exactScreenX, groundY, GRID_SIZE, GROUND_HEIGHT);
                    } 
                }

                if(activeLevelData && Array.isArray(activeLevelData)) {
                    activeLevelData.forEach(obs => {
                        if (obs.type === 'hole' || obs.collected) return; 
                        const screenX = (obs.x * GRID_SIZE) - cameraX;
                        const screenY = groundY - ((obs.y + 1) * GRID_SIZE);
                        if(screenX + GRID_SIZE < 0 || screenX > width) return;
                        
                        let inverted = false;
                        if (obs.type === 'spike') {
                            inverted = activeLevelData.some(o => o.x === obs.x && o.y === obs.y + 1 && o.type === 'block');
                        }
                        
                        drawEditorObject(obs.type, screenX, screenY, 1, inverted);
                    });
                }

                if (gameState === 'EDITOR' && isHovering) {
                    const ghostScreenX = (hoverGridX * GRID_SIZE) - cameraX;
                    const ghostScreenY = currentTool === 'hole' ? groundY : groundY - ((hoverGridY + 1) * GRID_SIZE);
                    if (currentTool === 'eraser') { 
                        ctx.fillStyle = 'rgba(255, 0, 127, 0.4)'; ctx.fillRect(ghostScreenX, ghostScreenY, GRID_SIZE, GRID_SIZE); 
                    } else { 
                        let inverted = false;
                        if (currentTool === 'spike') {
                            inverted = levelData.some(o => o.x === hoverGridX && o.y === hoverGridY + 1 && o.type === 'block');
                        }
                        drawEditorObject(currentTool, ghostScreenX, ghostScreenY, 0.5, inverted); 
                    }
                }

                let currentArray = sprites.idle;
                if(player.animState === 'RUN') currentArray = sprites.run;
                else if(player.animState === 'JUMP') currentArray = sprites.jump;
                else if(player.animState === 'LAND') currentArray = sprites.land;
                
                let safeIndex = player.frameIndex % currentArray.length;
                if (player.animState === 'JUMP' && player.frameIndex >= currentArray.length) safeIndex = currentArray.length - 1;
                
                const activeImg = currentArray[safeIndex];

                if (activeImg && activeImg.complete && activeImg.naturalWidth > 0) {
                    ctx.shadowBlur = 15; ctx.shadowColor = 'var(--neon-cyan)';
                    ctx.drawImage(activeImg, Math.floor(player.x), Math.floor(player.y), player.size, player.size);
                    ctx.shadowBlur = 0;
                } else {
                    ctx.fillStyle = '#0b0c10'; ctx.fillRect(Math.floor(player.x), Math.floor(player.y), player.size, player.size);
                    ctx.strokeStyle = 'var(--neon-cyan)'; ctx.lineWidth = 3; ctx.strokeRect(Math.floor(player.x), Math.floor(player.y), player.size, player.size);
                }

                particles.forEach(p => { ctx.fillStyle = p.color; ctx.globalAlpha = Math.max(0, p.alpha); ctx.fillRect(p.x, p.y, p.size, p.size); });
                ctx.globalAlpha = 1;

                ctx.restore();
            }

            requestAnimationFrame(mainLoop);

        });
    </script>
