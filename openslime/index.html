<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Open Front - Global Conquest</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <!-- Chargement de Three.js et des contrôles de caméra -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="game-container" class="size-wide">
        <a href="../index.html" class="hub-link">⬅ Retour au Hub</a>
        
        <div class="settings-btn-wrapper" onmouseenter="startSettingsAnim()" onmouseleave="stopSettingsAnim()" onclick="clickSettingsAnim()">
            <img src="../img/setting.png" alt="Paramètres" id="settings-btn-img" class="settings-btn">
        </div>

        <div id="ui-container">
            <h1 class="game-title">OPEN <span style="color: var(--p1);">FRONT</span></h1>
            <div id="status-panel">
                <p>Phase : <span style="color: var(--p3);">Déploiement</span></p>
                <div class="troop-slider-container">
                    <label for="troop-slider">Troupes : <span id="troop-val" style="color: var(--p4);">50%</span></label>
                    <input type="range" id="troop-slider" min="1" max="100" value="50" oninput="updateTroopVal(this.value)">
                </div>
            </div>
        </div>

        <!-- MENU CONTEXTUEL DE CONSTRUCTION (Caché par défaut) -->
        <div id="build-menu" style="display: none;">
            <div class="build-header" id="build-terrain-type">TERRAIN</div>
            <button class="btn-build" id="btn-city" onclick="buildStructure('city')">🏙️ Fonder une Ville</button>
            <button class="btn-build" id="btn-port" onclick="buildStructure('port')">⚓ Créer un Port</button>
            <button class="btn-build" id="btn-missile" onclick="buildStructure('missile')">🚀 Base de Missiles</button>
            <button class="btn-build" id="btn-anti-missile" onclick="buildStructure('anti-missile')">🛡️ Anti-Missile</button>
            <button class="btn-build cancel" onclick="closeBuildMenu()">✖ Annuler</button>
        </div>

        <div id="webgl-container"></div>
    </div>

    <!-- MODAL PARAMÈTRES (inchangée) -->
    <div id="settings-modal">
        <div class="settings-content">
            <h2 style="margin-top: 0; color: var(--p1); text-transform: uppercase; letter-spacing: 2px;">Paramètres</h2>
            <div class="setting-item" style="display:flex; flex-direction: column; gap: 10px; margin-bottom: 20px;">
                <span>Format de l'Écran 🖥️</span>
                <div class="size-options">
                    <button id="btn-sz-classic" class="btn-size" onclick="setGameSize('classic')">Petit</button>
                    <button id="btn-sz-wide" class="btn-size active" onclick="setGameSize('wide')">Plein Page</button>
                    <button id="btn-sz-full" class="btn-size" onclick="setGameSize('full')">Plein Écran</button>
                </div>
            </div>
            <button onclick="toggleSettings()" class="close-btn">Fermer</button>
        </div>
    </div>

    <script src="map_three.js"></script>
    <script src="gameplay.js"></script>
</body>
</html>
