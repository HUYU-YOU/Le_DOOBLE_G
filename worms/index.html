<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Slimes Artillery (Worms-like)</title>
    <style>
        :root { --bg: #090a0f; --panel: rgba(20, 22, 35, 0.9); --p1: #00f0ff; --p2: #ff007f; --sys: #39ff14; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg); color: #fff; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; touch-action: none; user-select: none; }
        
        .hub-link { position: absolute; top: 15px; left: 15px; color: rgba(255,255,255,0.7); text-decoration: none; font-weight: bold; z-index: 1000; background: rgba(0,0,0,0.6); padding: 10px 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); transition: 0.2s; }
        .hub-link:hover { color: #fff; background: rgba(0, 136, 255, 0.8); }

        /* HEADER UI */
        #ui-layer { position: absolute; top: 10px; width: 100%; max-width: 800px; display: flex; justify-content: space-between; padding: 0 20px; box-sizing: border-box; z-index: 100; pointer-events: none; }
        .player-info { background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 8px; border: 1px solid #333; text-align: center; }
        .hp-bar-bg { width: 150px; height: 15px; background: #222; border-radius: 10px; margin-top: 5px; overflow: hidden; border: 1px solid #555; }
        .hp-bar { height: 100%; transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        #hp-p1 { background: var(--p1); width: 100%; box-shadow: 0 0 10px var(--p1); }
        #hp-p2 { background: var(--p2); width: 100%; box-shadow: 0 0 10px var(--p2); }
        
        #turn-indicator { font-size: 1.5em; font-weight: bold; text-transform: uppercase; background: rgba(0,0,0,0.8); padding: 10px 30px; border-radius: 20px; border: 2px solid #fff; transition: 0.3s; }

        /* GAME CONTAINER & CANVASES */
        #game-wrapper { position: relative; width: 100%; max-width: 800px; height: 600px; border-radius: 15px; box-shadow: 0 0 30px rgba(0, 240, 255, 0.15); border: 2px solid rgba(255,255,255,0.1); overflow: hidden; background: #000; cursor: crosshair; }
        
        #bg-video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; opacity: 0.6; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        #canvas-terrain { z-index: 2; }
        #canvas-entities { z-index: 3; }

        /* MENUS */
        .menu-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10,10,20,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 200; backdrop-filter: blur(8px); }
        .menu-overlay h1, .menu-overlay h2 { font-size: 3em; margin-bottom: 20px; text-transform: uppercase; color: var(--sys); text-shadow: 0 0 15px var(--sys); letter-spacing: 2px; }
        
        .btn { background: rgba(0, 240, 255, 0.1); color: var(--p1); border: 2px solid var(--p1); padding: 15px 30px; font-size: 1.2em; font-weight: bold; border-radius: 8px; cursor: pointer; text-transform: uppercase; transition: all 0.2s ease-in-out; margin: 10px; min-width: 250px; text-align: center; font-family: inherit; }
        .btn:hover { background: var(--p1); color: #000; box-shadow: 0 0 20px var(--p1); transform: translateY(-2px); }
        .btn:active { transform: translateY(1px); }
        
        .btn-pink { color: var(--p2); border-color: var(--p2); background: rgba(255, 0, 127, 0.1); }
        .btn-pink:hover { background: var(--p2); color: #fff; box-shadow: 0 0 20px var(--p2); }

        .loader { font-size: 1.2em; color: var(--p1); margin-bottom: 20px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .hidden { display: none !important; }

        @media (max-width: 800px) {
            #game-wrapper { height: 70vh; border-radius: 0; border: none; }
            .hp-bar-bg { width: 100px; }
            #turn-indicator { font-size: 1em; padding: 8px 15px; }
        }
    </style>
</head>
<body>
    <a href="../index.html" class="hub-link">⬅ Retour au Hub</a>

    <div id="game-wrapper">
        <video id="bg-video" autoplay loop muted playsinline>
            <source src="img/background.mp4" type="video/mp4">
        </video>

        <div id="ui-layer" class="hidden">
            <div class="player-info">
                <b style="color: var(--p1)">SLIME 1</b>
                <div class="hp-bar-bg"><div id="hp-p1" class="hp-bar"></div></div>
            </div>
            <div id="turn-indicator" style="color: var(--p1); border-color: var(--p1);">Tour J1</div>
            <div class="player-info">
                <b style="color: var(--p2)">SLIME 2</b>
                <div class="hp-bar-bg"><div id="hp-p2" class="hp-bar"></div></div>
            </div>
        </div>

        <canvas id="canvas-terrain" width="800" height="600"></canvas>
        <canvas id="canvas-entities" width="800" height="600"></canvas>

        <div id="main-menu" class="menu-overlay">
            <h1>Cyber Slimes</h1>
            <div id="loading-text" class="loader">Chargement des assets réseau...</div>
            <div id="menu-buttons" class="hidden" style="display:flex; flex-direction:column;">
                <button class="btn" onclick="startGame('local')">🕹️ 1 vs 1 (Local)</button>
                <button class="btn btn-pink" onclick="startGame('ai')">🤖 Contre l'IA</button>
                <button class="btn" onclick="showOnlineMenu()" style="border-color:var(--sys); color:var(--sys)">🌐 Multijoueur</button>
            </div>
        </div>

        <div id="online-menu" class="menu-overlay hidden">
            <h2>Lobby Cybernétique</h2>
            <p>Code session : <b style="color: var(--p1); font-size:1.5em; letter-spacing:3px;">SLM-404</b></p>
            <input type="text" placeholder="Entrer un code..." style="padding: 12px; font-size: 1.2em; border-radius: 8px; margin-bottom: 20px; border: 2px solid var(--p1); background: rgba(0,0,0,0.5); color: #fff; outline:none; text-align:center;">
            <button class="btn" onclick="alert('En attente de connexion WebRTC (PeerJS)...')">Connecter</button>
            <button class="btn btn-pink" onclick="hideOnlineMenu()">Retour</button>
        </div>

        <div id="game-over" class="menu-overlay hidden">
            <h2 id="winner-text">VICTOIRE</h2>
            <button class="btn" onclick="location.reload()">Relancer la boucle</button>
        </div>
    </div>

    <script>
        // --- INITIALISATION DES CANVAS ---
        const canvasTerrain = document.getElementById('canvas-terrain');
        const ctxTerrain = canvasTerrain.getContext('2d', { willReadFrequently: true });
        const canvasEnt = document.getElementById('canvas-entities');
        const ctxEnt = canvasEnt.getContext('2d');

        const WIDTH = 800;
        const HEIGHT = 600;
        const GRAVITY = 0.18; 
        
        let gameState = 'menu'; // menu, playing, flying, end
        let gameMode = 'local';
        let currentPlayer = 1;
        let retreatFrames = 0; // Chrono post-tir (60 = 1 sec)
        let mapImage = new Image();

        // --- GESTION DES ASSETS & SPRITES ---
        const sprites = {};
        const imagesToLoad = {
            map: 'img/map1.png',
            
            // SLIME 1 (Attention orthographe stricte comme demandée)
            s1_idle_r: 'img/slim1_right.png', s1_idle_l: 'img/slim1_left.png',
            s1_walk_r1: 'img/slime1_moveright1.png', s1_walk_r2: 'img/slime1_moveright2.png', s1_walk_r3: 'img/slime1_moveright3.png',
            s1_walk_l1: 'img/slime1_moveleft1.png', s1_walk_l2: 'img/slime1_moveleft2.png', s1_walk_l3: 'img/slime1_moveleft3.png',
            s1_jump_r1: 'img/slime1_jumpright1.png', s1_jump_r2: 'img/slime1_jumpright2.png', s1_jump_r3: 'img/slime1_jumpright3.png',
            s1_jump_l1: 'img/slime1_jumpleft1.png', s1_jump_l2: 'img/slime1_jumpleft2.png', s1_jump_l3: 'img/slime1_jumpleft3.png',
            
            // SLIME 2
            s2_idle_r: 'img/slim2_right.png', s2_idle_l: 'img/slim2_left.png',
            s2_walk_r1: 'img/slime2_moveright1.png', s2_walk_r2: 'img/slime2_moveright2.png', s2_walk_r3: 'img/slime2_moveright3.png',
            s2_walk_l1: 'img/slime2_moveleft1.png', s2_walk_l2: 'img/slime2_moveleft2.png', s2_walk_l3: 'img/slime2_moveleft3.png',
            s2_jump_r1: 'img/slime2_jumpright1.png', s2_jump_r2: 'img/slime2_jumpright2.png', s2_jump_r3: 'img/slime2_jumpright3.png',
            s2_jump_l1: 'img/slime2_jumpleft1.png', s2_jump_l2: 'img/slime2_jumpleft2.png', s2_jump_l3: 'img/slime2_jumpleft3.png'
        };

        let loadedCount = 0;
        let totalImages = Object.keys(imagesToLoad).length;

        for (let key in imagesToLoad) {
            let img = new Image();
            img.onerror = () => { 
                console.error(`🚨 ERREUR CHARGEMENT ASSET : ${imagesToLoad[key]} introuvable.`);
                onLoadComplete(); 
            };
            img.onload = onLoadComplete;
            img.src = imagesToLoad[key];
            sprites[key] = img;
        }

        function onLoadComplete() {
            loadedCount++;
            if (loadedCount >= totalImages) {
                document.getElementById('loading-text').classList.add('hidden');
                document.getElementById('menu-buttons').classList.remove('hidden');
                mapImage = sprites.map;
            }
        }

        // --- CONTRÔLES CLAVIER OPTIMISÉS ---
        const keys = { left: false, right: false, space: false };
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'q' || e.key === 'a') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
            if (e.key === ' ' || e.code === 'Space') {
                keys.space = true;
                // Bloque le scroll uniquement si on est sur la fenêtre
                if (e.target === document.body || e.target.closest('#game-wrapper')) {
                    e.preventDefault();
                }
            }
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'q' || e.key === 'a') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
            if (e.key === ' ' || e.code === 'Space') keys.space = false;
        });

        // --- PHYSIQUE ET TERRAIN MULTI-CANVAS ---
        function generateTerrain() {
            ctxTerrain.clearRect(0, 0, WIDTH, HEIGHT);
            if (mapImage.complete && mapImage.naturalWidth > 0) {
                ctxTerrain.drawImage(mapImage, 0, 0, WIDTH, HEIGHT);
            } else {
                ctxTerrain.fillStyle = "#45a29e";
                ctxTerrain.fillRect(0, HEIGHT/2, WIDTH, HEIGHT/2);
            }
        }

        function isSolid(x, y) {
            let px = Math.floor(x); let py = Math.floor(y);
            if (px < 0 || px >= WIDTH || py >= HEIGHT) return false;
            if (py < 0) return false;
            return ctxTerrain.getImageData(px, py, 1, 1).data[3] > 50; 
        }

        function explodeTerrain(ex, ey, radius) {
            ctxTerrain.globalCompositeOperation = 'destination-out';
            ctxTerrain.beginPath();
            ctxTerrain.arc(ex, ey, radius, 0, Math.PI * 2);
            ctxTerrain.fill();
            ctxTerrain.globalCompositeOperation = 'source-over';
        }

        // --- ENTITÉS (Slimes & Projectiles) ---
        class Slime {
            constructor(x, y, id, type, color) {
                this.x = x; this.y = y;
                this.id = id; 
                this.type = type; 
                this.color = color;
                this.radius = 12; 
                this.vx = 0; this.vy = 0;
                this.hp = 100;
                this.isDead = false;
                
                this.facing = id === 1 ? 'r' : 'l';
                this.state = 'idle'; // idle, walk, jump
                this.animFrame = 1;
                this.animTimer = 0;
                this.isOnGround = false;
            }

            update() {
                if (this.isDead) return;
                
                // Mouvements possibles si tour J1 ET (partie normale OU pendant le Retreat Time)
                let canMove = (currentPlayer === this.id) && 
                              (gameState === 'playing' || (gameState === 'flying' && retreatFrames > 0)) && 
                              !(gameMode === 'ai' && this.id === 2);
                
                // Entrées claviers
                if (canMove && !isDragging) {
                    if (keys.left) { this.vx = -1.5; this.facing = 'l'; if(this.isOnGround) this.state = 'walk'; }
                    else if (keys.right) { this.vx = 1.5; this.facing = 'r'; if(this.isOnGround) this.state = 'walk'; }
                    else { this.vx = 0; if(this.isOnGround) this.state = 'idle'; }

                    if (keys.space && this.isOnGround) {
                        this.vy = -6; // Saut plus punitif
                        this.isOnGround = false;
                        this.state = 'jump';
                        this.animFrame = 1;
                        this.animTimer = 0;
                        keys.space = false; // Nécessite de relâcher pour resauter
                    }
                } else if (!canMove && this.isOnGround) {
                    this.vx *= 0.5; // Glissade courte et arrêt
                    if(Math.abs(this.vx) < 0.1) this.vx = 0;
                    this.state = 'idle';
                }

                // --- GESTION DU DÉPLACEMENT X & PENTES ---
                if (this.vx !== 0) {
                    let nextX = this.x + this.vx;
                    let step = 0;
                    let maxStep = 6; // Le slime peut franchir un petit obstacle de 6 pixels max

                    // Test si le futur emplacement est un mur qu'on peut escalader
                    while (step <= maxStep && isSolid(nextX, this.y + this.radius - step - 1)) {
                        step++;
                    }

                    if (step > maxStep) {
                        // Mur trop haut, le slime est bloqué, vitesse X tombe à 0
                        this.vx = 0; 
                    } else {
                        // Terrain franchissable, on valide X et on ajuste Y
                        this.x = nextX;
                        this.y -= step;
                    }
                }

                // Application Gravité
                this.vy += GRAVITY;
                this.y += this.vy;

                // --- COLLISION SOL DIRECTE ---
                this.isOnGround = false;
                if (isSolid(this.x, this.y + this.radius)) {
                    this.vy = 0;
                    this.isOnGround = true;
                    if (this.state === 'jump') this.state = 'idle'; 
                    
                    // Repousser au-dessus du sol si enfoncé
                    while(isSolid(this.x, this.y + this.radius - 1)) {
                        this.y -= 1;
                    }
                } else {
                    if (this.vy > 0) this.state = 'jump'; // Chute
                }

                // Animation
                if (this.state === 'walk' || this.state === 'jump') {
                    this.animTimer++;
                    let speed = this.state === 'jump' ? 6 : 8; 
                    if (this.animTimer > speed) {
                        this.animFrame = this.animFrame === 3 ? 1 : this.animFrame + 1;
                        this.animTimer = 0;
                    }
                } else {
                    this.animFrame = 1;
                }

                // Limite du vide
                if (this.y > HEIGHT + 50) {
                    this.hp = 0; this.isDead = true; checkWin();
                }
                
                // Murs arènes
                if(this.x < 10) this.x = 10;
                if(this.x > WIDTH - 10) this.x = WIDTH - 10;
            }

            draw() {
                if (this.isDead) return;

                let spriteName = `s${this.type}_`;
                if (this.state === 'jump') {
                    spriteName += `jump_${this.facing}${this.animFrame}`;
                } else if (this.state === 'walk') {
                    spriteName += `walk_${this.facing}${this.animFrame}`;
                } else {
                    spriteName += `idle_${this.facing}`;
                }

                let img = sprites[spriteName];
                
                // Protection: dessin de fallback rouge/bleu seulement si l'image crash
                if (img && img.complete && img.naturalWidth > 0) {
                    ctxEnt.drawImage(img, this.x - 15, this.y - 18, 30, 30);
                } else {
                    ctxEnt.fillStyle = this.color;
                    ctxEnt.fillRect(this.x - 10, this.y - 10, 20, 20);
                }
                
                // Flèche tour du joueur
                if (currentPlayer === this.id && gameState !== 'end') {
                    ctxEnt.fillStyle = (retreatFrames > 0 && gameState === 'flying') ? "#ffaa00" : "#fff";
                    ctxEnt.shadowBlur = 10;
                    ctxEnt.shadowColor = ctxEnt.fillStyle;
                    ctxEnt.beginPath();
                    ctxEnt.moveTo(this.x - 6, this.y - 32);
                    ctxEnt.lineTo(this.x + 6, this.y - 32);
                    ctxEnt.lineTo(this.x, this.y - 22);
                    ctxEnt.fill();
                    ctxEnt.shadowBlur = 0;
                }
            }
        }

        class Projectile {
            constructor(x, y, vx, vy) {
                this.x = x; this.y = y;
                this.vx = vx; this.vy = vy;
                this.active = true;
                this.radius = 4;
            }
            update() {
                if (!this.active) return;
                this.vy += GRAVITY;
                this.x += this.vx;
                this.y += this.vy;

                particles.push(new Particle(this.x, this.y, 0, 0, "#fff", 2, 10));

                if (isSolid(this.x, this.y) || this.y > HEIGHT || this.x < 0 || this.x > WIDTH) {
                    this.explode();
                }
            }
            explode() {
                this.active = false;
                let expRadius = 45;
                
                explodeTerrain(this.x, this.y, expRadius);
                
                for(let i=0; i<35; i++) {
                    let angle = Math.random() * Math.PI * 2;
                    let speed = Math.random() * 6 + 2;
                    particles.push(new Particle(this.x, this.y, Math.cos(angle)*speed, Math.sin(angle)*speed, "#ff5500", Math.random()*4+2, 40));
                }

                worms.forEach(w => {
                    let dist = Math.hypot(w.x - this.x, w.y - this.y);
                    if (dist < expRadius + 15 && !w.isDead) {
                        let damage = Math.floor((1 - dist / (expRadius + 15)) * 45);
                        w.hp -= damage;
                        
                        let kbAngle = Math.atan2(w.y - this.y, w.x - this.x);
                        w.vx += Math.cos(kbAngle) * (damage * 0.25);
                        w.vy += Math.sin(kbAngle) * (damage * 0.25) - 4; 
                        
                        if (w.hp <= 0) { w.hp = 0; w.isDead = true; }
                        updateUI();
                    }
                });
                
                // Le tour passe après l'explosion, et force le retreatTimer à 0 pour bloquer les mouvements
                setTimeout(() => {
                    retreatFrames = 0;
                    nextTurn();
                }, 1500);
            }
            draw() {
                if (!this.active) return;
                ctxEnt.fillStyle = "#fff";
                ctxEnt.beginPath();
                ctxEnt.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctxEnt.fill();
            }
        }

        class Particle {
            constructor(x, y, vx, vy, color, size, life) {
                this.x = x; this.y = y; this.vx = vx; this.vy = vy;
                this.color = color; this.size = size; this.life = life; this.maxLife = life;
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                this.life--;
            }
            draw() {
                ctxEnt.fillStyle = this.color;
                ctxEnt.globalAlpha = this.life / this.maxLife;
                ctxEnt.fillRect(this.x, this.y, this.size, this.size);
                ctxEnt.globalAlpha = 1;
            }
        }

        // --- GAME STATE & BOUCLE ---
        let worms = [];
        let projectile = null;
        let particles = [];
        let isDragging = false;
        let dragStartX = 0, dragStartY = 0, dragCurrentX = 0, dragCurrentY = 0;

        function startGame(mode) {
            gameMode = mode;
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('ui-layer').classList.remove('hidden');
            
            generateTerrain();
            
            worms = [
                new Slime(150, 100, 1, 1, 'var(--p1)'),
                new Slime(WIDTH - 150, 100, 2, 2, 'var(--p2)')
            ];
            
            currentPlayer = 1;
            gameState = 'playing';
            retreatFrames = 0;
            updateUI();
            
            requestAnimationFrame(gameLoop);
        }

        function showOnlineMenu() { document.getElementById('online-menu').classList.remove('hidden'); }
        function hideOnlineMenu() { document.getElementById('online-menu').classList.add('hidden'); }

        function updateUI() {
            document.getElementById('hp-p1').style.width = worms[0].hp + '%';
            document.getElementById('hp-p2').style.width = worms[1].hp + '%';
            
            let turnInd = document.getElementById('turn-indicator');
            turnInd.innerText = `Tour J${currentPlayer}`;
            turnInd.style.color = currentPlayer === 1 ? 'var(--p1)' : 'var(--p2)';
            turnInd.style.borderColor = currentPlayer === 1 ? 'var(--p1)' : 'var(--p2)';
        }

        function nextTurn() {
            checkWin();
            if (gameState === 'end') return;
            
            currentPlayer = currentPlayer === 1 ? 2 : 1;
            if (worms[currentPlayer-1].isDead) currentPlayer = currentPlayer === 1 ? 2 : 1; 
            
            gameState = 'playing';
            projectile = null;
            updateUI();

            if (gameMode === 'ai' && currentPlayer === 2 && !worms[1].isDead) {
                setTimeout(playAITurn, 1000);
            }
        }

        function playAITurn() {
            let ai = worms[1];
            let target = worms[0];
            
            ai.facing = (target.x < ai.x) ? 'l' : 'r';
            
            let dx = target.x - ai.x;
            let dy = (target.y - ai.y) - 60; 
            let angle = Math.atan2(dy, dx);
            let power = Math.min(Math.abs(dx) * 0.025 + 4, 16); 

            projectile = new Projectile(ai.x, ai.y - 10, Math.cos(angle) * power, Math.sin(angle) * power);
            gameState = 'flying';
            retreatFrames = 0; // IA ne bouge pas après tir
        }

        function checkWin() {
            if (worms[0].isDead || worms[1].isDead) {
                gameState = 'end';
                let winnerText = document.getElementById('winner-text');
                winnerText.style.color = worms[1].isDead ? 'var(--p1)' : 'var(--p2)';
                winnerText.innerText = worms[1].isDead ? "JOUEUR 1 GAGNE" : "JOUEUR 2 GAGNE";
                if(worms[0].isDead && worms[1].isDead) { winnerText.innerText = "ÉGALITÉ"; winnerText.style.color="#fff"; }
                
                setTimeout(() => { document.getElementById('game-over').classList.remove('hidden'); }, 1500);
            }
        }

        // --- VISÉE LANCE-PIERRE ---
        const gameWrapper = document.getElementById('game-wrapper');

        function startAim(e) {
            // Uniquement si c'est notre tour et qu'on a pas déjà tiré
            if (gameState !== 'playing' || (gameMode === 'ai' && currentPlayer === 2)) return;
            e.stopPropagation();
            
            let rect = canvasEnt.getBoundingClientRect();
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            let scaleX = canvasEnt.width / rect.width;
            let scaleY = canvasEnt.height / rect.height;
            
            dragStartX = (clientX - rect.left) * scaleX;
            dragStartY = (clientY - rect.top) * scaleY;
            
            isDragging = true;
            worms[currentPlayer - 1].state = 'idle'; 
        }

        function moveAim(e) {
            if (!isDragging) return;
            e.stopPropagation(); e.preventDefault();
            
            let rect = canvasEnt.getBoundingClientRect();
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            dragCurrentX = (clientX - rect.left) * (canvasEnt.width / rect.width);
            dragCurrentY = (clientY - rect.top) * (canvasEnt.height / rect.height);

            worms[currentPlayer - 1].facing = (dragStartX - dragCurrentX > 0) ? 'r' : 'l';
        }

        function endAim(e) {
            if (!isDragging) return;
            isDragging = false;
            e.stopPropagation();
            
            let activeWorm = worms[currentPlayer - 1];
            let dx = dragStartX - dragCurrentX;
            let dy = dragStartY - dragCurrentY;
            let power = Math.min(Math.hypot(dx, dy) * 0.1, 18);
            let angle = Math.atan2(dy, dx);
            
            if (power > 2) {
                projectile = new Projectile(activeWorm.x, activeWorm.y - 15, Math.cos(angle) * power, Math.sin(angle) * power);
                gameState = 'flying';
                retreatFrames = 60; // Lance le chrono de fuite d'une seconde (60 frames)
            }
        }

        gameWrapper.addEventListener('mousedown', startAim);
        window.addEventListener('mousemove', moveAim);
        window.addEventListener('mouseup', endAim);
        gameWrapper.addEventListener('touchstart', startAim, {passive: false});
        window.addEventListener('touchmove', moveAim, {passive: false});
        window.addEventListener('touchend', endAim);

        function gameLoop() {
            if (gameState === 'menu') return;
            
            // Diminution du chrono de retreat
            if (retreatFrames > 0) retreatFrames--;

            ctxEnt.clearRect(0, 0, WIDTH, HEIGHT);

            worms.forEach(w => { w.update(); w.draw(); });

            if (gameState === 'playing' && isDragging) {
                let activeWorm = worms[currentPlayer - 1];
                let dx = dragStartX - dragCurrentX;
                let dy = dragStartY - dragCurrentY;
                let power = Math.min(Math.hypot(dx, dy), 180);
                let angle = Math.atan2(dy, dx);
                
                ctxEnt.beginPath();
                ctxEnt.moveTo(activeWorm.x, activeWorm.y - 15);
                ctxEnt.lineTo(activeWorm.x + Math.cos(angle)*power, activeWorm.y - 15 + Math.sin(angle)*power);
                ctxEnt.strokeStyle = currentPlayer === 1 ? "rgba(0, 240, 255, 0.7)" : "rgba(255, 0, 127, 0.7)";
                ctxEnt.lineWidth = 3;
                ctxEnt.setLineDash([8, 8]);
                ctxEnt.stroke();
                ctxEnt.setLineDash([]);
            }

            if (projectile) { projectile.update(); projectile.draw(); }

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update(); particles[i].draw();
                if (particles[i].life <= 0) particles.splice(i, 1);
            }

            requestAnimationFrame(gameLoop);
        }
    </script>
    
    <!-- SCRIPT DE NAVIGATION SWIPE GLOBAL (SOURIS & TACTILE) -->
    <script>
        const gamesHubList = [
            "../cybertank/index.html", "../tower_defense/index.html", "../edgeofwar/index.html",
            "../cyber_smash/index.html", "../guessthemanga/index.html", "../drawer/index.html",
            "../texas_poker/index.html", "../blindtest/index.html", "../2048slime/index.html",
            "../worms/index.html"
        ];

        let globalStartX = 0, globalStartY = 0;
        let globalEndX = 0, globalEndY = 0;
        const swipeThreshold = 75;

        function navigateGames(direction) {
            const currentPath = window.location.pathname;
            let currentIndex = gamesHubList.findIndex(game => {
                let folderName = game.split('/')[1]; 
                return currentPath.includes(folderName);
            });
            if (currentIndex === -1) return;
            let nextIndex = (currentIndex + direction + gamesHubList.length) % gamesHubList.length;
            window.location.href = gamesHubList[nextIndex];
        }

        function handleGlobalSwipe() {
            let diffX = globalEndX - globalStartX;
            let diffY = globalEndY - globalStartY;
            
            if (Math.abs(diffX) > swipeThreshold && Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 0) navigateGames(-1); 
                else navigateGames(1); 
            }
        }

        function initSwipe(e, x, y) {
            if (e.target.closest('#game-wrapper') || e.target.tagName.toLowerCase() === 'button') return;
            globalStartX = x; globalStartY = y;
        }

        function endSwipe(e, x, y) {
            if (e.target.closest('#game-wrapper') || e.target.tagName.toLowerCase() === 'button') return;
            globalEndX = x; globalEndY = y;
            handleGlobalSwipe();
        }

        document.addEventListener('touchstart', e => initSwipe(e, e.changedTouches[0].screenX, e.changedTouches[0].screenY), { passive: true });
        document.addEventListener('touchend', e => endSwipe(e, e.changedTouches[0].screenX, e.changedTouches[0].screenY), { passive: true });
        
        document.addEventListener('mousedown', e => initSwipe(e, e.screenX, e.screenY));
        document.addEventListener('mouseup', e => endSwipe(e, e.screenX, e.screenY));
    </script>
