<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Slime-Dash : Neon Overdrive</title>
    <style>
        /* =========================================
           1. VARIABLES CYBERPUNK ET RESET
           ========================================= */
        :root {
            --bg-color: #0b0c10;
            --neon-cyan: #00f0ff;
            --neon-pink: #ff007f;
            --neon-green: #39ff14;
            --text-color: #e0e0e0;
            --font-main: 'Courier New', Courier, monospace;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            overflow: hidden; /* Empêche le scroll natif */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* =========================================
           2. CONTENEUR PRINCIPAL DU JEU
           ========================================= */
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1000px;
            max-height: 600px;
            background: #000;
            box-shadow: 0 0 30px rgba(57, 255, 20, 0.2); /* Lueur verte */
            touch-action: none; /* Bloque le swipe/zoom natif */
            overflow: hidden;
            border: 2px solid rgba(57, 255, 20, 0.3);
            border-radius: 8px;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* =========================================
           3. INTERFACE UTILISATEUR (UI)
           ========================================= */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Les clics passent à travers vers le canvas */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 25px;
            box-sizing: border-box;
        }

        .score-board {
            display: flex;
            justify-content: space-between;
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--neon-green);
            text-shadow: 0 0 12px var(--neon-green);
            letter-spacing: 2px;
        }

        #menu-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: auto; /* Réactive les clics pour le menu */
            background: rgba(11, 12, 16, 0.92);
            padding: 40px;
            border: 2px solid var(--neon-pink);
            box-shadow: 0 0 25px var(--neon-pink);
            border-radius: 12px;
            backdrop-filter: blur(8px);
            z-index: 10;
        }

        h1 {
            margin-top: 0;
            color: var(--neon-green);
            text-shadow: 0 0 15px var(--neon-green);
            text-transform: uppercase;
            font-size: 3rem;
            letter-spacing: 3px;
        }

        p {
            color: var(--text-color);
            margin-bottom: 25px;
            font-size: 1.1rem;
            line-height: 1.5;
        }

        button {
            background: transparent;
            border: 2px solid var(--neon-green);
            color: var(--neon-green);
            padding: 15px 35px;
            font-size: 1.3rem;
            font-family: inherit;
            text-transform: uppercase;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
            border-radius: 4px;
        }

        button:hover {
            background: var(--neon-green);
            color: var(--bg-color);
            box-shadow: 0 0 20px var(--neon-green);
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <!-- =========================================
         PROTECTION GLOBALE CONTRE LE SWIPE HUB
         ========================================= -->
    <script>
        document.addEventListener('touchstart', (e) => {
            if(e.target.closest('.no-swipe')) {
                e.stopPropagation();
            }
        }, { passive: false });
        
        document.addEventListener('mousedown', (e) => {
            if(e.target.closest('.no-swipe')) {
                e.stopPropagation();
            }
        });
    </script>

    <!-- =========================================
         CONTENEUR DU JEU
         ========================================= -->
    <div id="game-container" class="no-swipe">
        <canvas id="gameCanvas"></canvas>
        
        <!-- Score -->
        <div id="ui-layer">
            <div class="score-board">
                <div>SCORE: <span id="score">0</span></div>
                <div>HI: <span id="hi-score">0</span></div>
            </div>
        </div>

        <!-- Menu / Game Over -->
        <div id="menu-screen">
            <h1 id="menu-title">Slime-Dash</h1>
            <p id="menu-desc">
                ESPACE, CLIC ou TAP pour sauter.<br>Échappe à l'infection quantique.
            </p>
            <button id="start-btn">Initialiser</button>
        </div>
    </div>

    <!-- =========================================
         MOTEUR DU JEU (JAVASCRIPT COMPLET)
         ========================================= -->
    <script>
        // --- 1. SETUP CANVAS & VARIABLES GLOBALES ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const hiScoreEl = document.getElementById('hi-score');
        const menuScreen = document.getElementById('menu-screen');
        const startBtn = document.getElementById('start-btn');
        const menuTitle = document.getElementById('menu-title');

        let width, height;
        let gameState = 'START'; // START, PLAYING, GAMEOVER
        let score = 0;
        let hiScore = localStorage.getItem('slimeDashHiScore') || 0;
        hiScoreEl.innerText = Math.floor(hiScore);
        
        // Physique normalisée pour 60 FPS (Delta Time)
        let gameSpeed = 450; // pixels par seconde
        const GRAVITY = 2400; // pixels / sec²
        const JUMP_FORCE = -800; // pixels / sec
        const GROUND_HEIGHT = 90;

        let obstacles = [];
        let particles = [];
        let spawnTimer = 0;
        let bgGridX = 0;
        let shakeTimer = 0;
        let shakeIntensity = 0;

        // --- 2. GESTIONNAIRE DES SPRITES DU SLIME ---
        const sprites = {
            idle: [],   // 1, 2, 3, 4
            run: [],    // 5, 6, 7, 8
            jump: [],   // 10, 11, 12, 13, 14, 15, 16
            land: []    // 17, 18, 19, 20
        };
        
        // Préchargeur d'images
        function loadFrames(category, filenames) {
            filenames.forEach(file => {
                const img = new Image();
                img.src = file;
                sprites[category].push(img);
            });
        }

        // Chargement exact de tes fichiers
        loadFrames('idle', ['slm.png', 'slm2.png', 'slm3.png', 'slm4.png']);
        loadFrames('run',  ['slm5.png', 'slm6.png', 'slm7.png', 'slm8.png']);
        loadFrames('jump', ['slm10.png', 'slm11.png', 'slm12.png', 'slm13.png', 'slm14.png', 'slm15.png', 'slm16.png']);
        loadFrames('land', ['slm17.png', 'slm18.png', 'slm19.png', 'slm20.png']);

        // --- 3. OBJET JOUEUR ET MACHINE A ETATS D'ANIMATION ---
        const player = {
            x: 120,
            y: 0,
            size: 50,
            vy: 0,
            isGrounded: false,
            trail: [], // Enregistre les positions pour la traînée lumineuse
            
            // Paramètres d'animation
            animState: 'IDLE', // IDLE, RUN, JUMP, LAND, RECOVER
            frameIndex: 0,
            animTimer: 0,
            animSpeed: 0.1 // Temps en secondes par image
        };

        // Fonction pour changer l'animation proprement
        function setAnimState(newState) {
            if (player.animState === newState) return; // Ne relance pas si on y est déjà
            player.animState = newState;
            player.frameIndex = 0;
            player.animTimer = 0;
            
            // Ajustement de la vitesse selon l'action (Peut être tweaké)
            if (newState === 'LAND') player.animSpeed = 0.05;       // Très rapide pour l'impact
            else if (newState === 'RECOVER') player.animSpeed = 0.08;
            else if (newState === 'RUN') player.animSpeed = 0.08;   // Vitesse de course
            else if (newState === 'JUMP') player.animSpeed = 0.06;  // Vitesse de déploiement en saut
            else player.animSpeed = 0.15;                           // IDLE (lent au menu)
        }

        // --- 4. HDPI & GESTION DE LA FENETRE ---
        function resize() {
            const container = canvas.parentElement;
            const rect = container.getBoundingClientRect();
            width = rect.width;
            height = rect.height;

            const dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            
            ctx.scale(dpr, dpr);

            // Placement initial du slime au sol
            if(gameState === 'START') {
                player.y = height - GROUND_HEIGHT - player.size;
            }
        }
        window.addEventListener('resize', resize);
        resize();

        // --- 5. SYSTEME DE PARTICULES ET FX ---
        function spawnParticles(x, y, color, count = 10) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 200 + 50;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: Math.random() * 5 + 2,
                    color: color,
                    alpha: 1,
                    decay: Math.random() * 2 + 1.5
                });
            }
        }

        function triggerShake(duration, intensity) {
            shakeTimer = duration;
            shakeIntensity = intensity;
        }

        // --- 6. CONTROLES DU JOUEUR ---
        function triggerJump() {
            if (gameState === 'PLAYING') {
                if (player.isGrounded) {
                    player.vy = JUMP_FORCE;
                    player.isGrounded = false;
                    setAnimState('JUMP');
                    spawnParticles(player.x + player.size/2, player.y + player.size, 'var(--neon-green)', 15);
                }
            } else if (gameState === 'GAMEOVER') {
                resetGame();
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                triggerJump();
            }
        });

        canvas.addEventListener('mousedown', (e) => {
            e.preventDefault();
            triggerJump();
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            triggerJump();
        }, { passive: false });

        startBtn.addEventListener('click', () => {
            if(gameState === 'START' || gameState === 'GAMEOVER') resetGame();
        });

        // --- 7. LOGIQUE DE BOUCLE GLOBALE (START / GAMEOVER) ---
        function resetGame() {
            player.y = height - GROUND_HEIGHT - player.size;
            player.vy = 0;
            player.trail = [];
            setAnimState('RUN'); // Dès qu'on joue, il court
            
            obstacles = [];
            particles = [];
            score = 0;
            gameSpeed = 450;
            spawnTimer = 0;
            shakeTimer = 0;
            
            gameState = 'PLAYING';
            menuScreen.style.display = 'none';
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            triggerShake(0.4, 15);
            spawnParticles(player.x + player.size/2, player.y + player.size/2, '#ff007f', 30);
            
            setAnimState('IDLE'); // Il retourne triste/inerte au game over
            
            menuScreen.style.display = 'block';
            menuTitle.innerText = "CRASH INFECTION";
            menuTitle.style.color = "#ff007f";
            startBtn.innerText = "Ressusciter";
            
            if (score > hiScore) {
                hiScore = score;
                localStorage.setItem('slimeDashHiScore', hiScore);
                hiScoreEl.innerText = Math.floor(hiScore);
            }
        }

        function spawnObstacle() {
            const type = Math.random() > 0.4 ? 'spike' : 'block';
            const size = 40;
            obstacles.push({
                x: width,
                y: height - GROUND_HEIGHT - size,
                size: size,
                type: type
            });
        }

        // Hitbox du slime plus indulgente qu'un carré parfait
        function checkCollision(p, obs) {
            const tolX = 12; // Marge de tolérance X pour le Sprite
            const tolY = 12; // Marge de tolérance Y
            
            const hitX = (p.x + tolX < obs.x + obs.size) && (p.x + p.size - tolX > obs.x);
            let hitY = false;

            if (obs.type === 'block') {
                hitY = (p.y + tolY < obs.y + obs.size) && (p.y + p.size - tolY > obs.y);
            } else if (obs.type === 'spike') {
                // Le spike est un triangle, on tolère encore plus en haut
                hitY = (p.y + p.size - tolY > obs.y + obs.size * 0.4);
            }
            return hitX && hitY;
        }

        // --- 8. LA BOUCLE DU MOTEUR (FIXED DELTA TIME) ---
        let lastTime = performance.now();

        function mainLoop(currentTime) {
            const dt = Math.min((currentTime - lastTime) / 1000, 0.1); // Sécurité anti-lag spike
            lastTime = currentTime;

            update(dt);
            draw();

            requestAnimationFrame(mainLoop);
        }

        // --- 9. LOGIQUE DE MISE A JOUR (UPDATE) ---
        function update(dt) {
            // A. UPDATE ANIMATION SLIME
            player.animTimer += dt;
            if (player.animTimer >= player.animSpeed) {
                player.animTimer = 0;
                player.frameIndex++;

                // Machine à États Spécifique
                if (player.animState === 'JUMP') {
                    // Bloque sur la dernière image du saut (chute) jusqu'à toucher le sol
                    if (player.frameIndex >= sprites.jump.length) {
                        player.frameIndex = sprites.jump.length - 1;
                    }
                } 
                else if (player.animState === 'LAND') {
                    // L'atterrissage est fini -> on passe à l'état de récupération
                    if (player.frameIndex >= sprites.land.length) {
                        setAnimState('RECOVER');
                    }
                }
                else if (player.animState === 'RECOVER') {
                    // La récupération (anim 1,2,3,4) est finie -> il recommence à courir
                    if (player.frameIndex >= sprites.idle.length) {
                        setAnimState('RUN');
                    }
                }
                else if (player.animState === 'IDLE') {
                    player.frameIndex = player.frameIndex % sprites.idle.length;
                }
                else if (player.animState === 'RUN') {
                    player.frameIndex = player.frameIndex % sprites.run.length;
                }
            }

            if (gameState !== 'PLAYING') return;

            // B. UPDATE VITESSE ET SCORE
            gameSpeed += dt * 8; // Le jeu va de plus en plus vite
            score += gameSpeed * dt * 0.1;
            scoreEl.innerText = Math.floor(score);

            // C. UPDATE PARALLAX (Le fond)
            bgGridX -= gameSpeed * dt;
            if (bgGridX <= -50) bgGridX += 50; // Reset seamless

            // D. UPDATE PHYSIQUE JOUEUR
            player.vy += GRAVITY * dt;
            player.y += player.vy * dt;

            // Enregistrement de la traînée (Trail)
            // On sauvegarde l'état complet pour dessiner le fantôme
            player.trail.push({
                x: player.x, 
                y: player.y, 
                state: player.animState, 
                frame: player.frameIndex
            });
            if (player.trail.length > 8) player.trail.shift(); // Longueur du trail

            // Détection du Sol
            const groundLevel = height - GROUND_HEIGHT - player.size;
            if (player.y >= groundLevel) {
                player.y = groundLevel;
                player.vy = 0;
                
                // S'il vient de toucher le sol
                if (!player.isGrounded) {
                    player.isGrounded = true;
                    setAnimState('LAND'); // Déclenche l'animation d'impact
                    spawnParticles(player.x + player.size/2, player.y + player.size, 'rgba(57, 255, 20, 0.7)', 8);
                }
            } else {
                player.isGrounded = false;
                // Si le slime tombe (ex: d'une plateforme si tu en rajoutes) sans avoir sauté
                if (player.animState !== 'JUMP') {
                    setAnimState('JUMP');
                }
            }

            // E. UPDATE OBSTACLES
            spawnTimer -= gameSpeed * dt;
            if (spawnTimer <= 0) {
                spawnObstacle();
                // Espace dynamique entre les obstacles (plus le jeu va vite, plus l'écart est grand)
                const minDistance = 300 + (gameSpeed * 0.3);
                spawnTimer = minDistance + Math.random() * 200;
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x -= gameSpeed * dt;

                if (checkCollision(player, obs)) {
                    gameOver();
                    break;
                }

                if (obs.x + obs.size < 0) {
                    obstacles.splice(i, 1);
                }
            }

            // F. UPDATE FX (Particules et Camera Shake)
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.alpha -= p.decay * dt;
                if (p.alpha <= 0) particles.splice(i, 1);
            }

            if (shakeTimer > 0) shakeTimer -= dt;
        }

        // --- 10. MOTEUR DE RENDU (DRAW) ---
        function draw() {
            ctx.save();

            // Application du Screen Shake global
            if (shakeTimer > 0) {
                const offsetX = (Math.random() - 0.5) * shakeIntensity;
                const offsetY = (Math.random() - 0.5) * shakeIntensity;
                ctx.translate(offsetX, offsetY);
            }

            // Nettoyage fond
            ctx.fillStyle = '#0b0c10';
            ctx.fillRect(0, 0, width, height);

            if (gameState !== 'START') {
                // --- A. GRILLE CYBERPUNK (Fond) ---
                ctx.strokeStyle = 'rgba(57, 255, 20, 0.08)'; // Vert subtil
                ctx.lineWidth = 1;
                ctx.beginPath();
                for(let x = bgGridX; x < width; x += 50) {
                    ctx.moveTo(x, 0); ctx.lineTo(x, height);
                }
                for(let y = 0; y < height; y += 50) {
                    ctx.moveTo(0, y); ctx.lineTo(width, y);
                }
                ctx.stroke();

                // --- B. SOL ---
                const groundY = height - GROUND_HEIGHT;
                ctx.fillStyle = '#050508';
                ctx.fillRect(0, groundY, width, GROUND_HEIGHT);
                
                ctx.shadowBlur = 15;
                ctx.shadowColor = 'var(--neon-green)';
                ctx.strokeStyle = 'var(--neon-green)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(0, groundY);
                ctx.lineTo(width, groundY);
                ctx.stroke();
                ctx.shadowBlur = 0; // On reset l'ombre pour la suite

                // Fonction utilitaire pour récupérer l'image courante
                const getSpriteImage = (state, index) => {
                    let arr = sprites.idle;
                    if(state === 'RUN') arr = sprites.run;
                    else if(state === 'JUMP') arr = sprites.jump;
                    else if(state === 'LAND') arr = sprites.land;
                    else if(state === 'RECOVER') arr = sprites.idle;
                    
                    // Sécurité d'index
                    let safeIndex = index % arr.length;
                    if (state === 'JUMP' && index >= arr.length) safeIndex = arr.length - 1;
                    
                    return arr[safeIndex];
                };

                // --- C. TRAIL (Traînée du Slime fantôme) ---
                player.trail.forEach((pos, index) => {
                    const alpha = (index / player.trail.length) * 0.4;
                    const trailImg = getSpriteImage(pos.state, pos.frame);
                    
                    ctx.globalAlpha = alpha;
                    if (trailImg && trailImg.complete && trailImg.naturalWidth !== 0) {
                        ctx.drawImage(trailImg, pos.x - 10, pos.y, player.size, player.size);
                    }
                });
                ctx.globalAlpha = 1.0; // Reset alpha

                // --- D. JOUEUR (Sprite principal) ---
                const activeImg = getSpriteImage(player.animState, player.frameIndex);

                if (activeImg && activeImg.complete && activeImg.naturalWidth !== 0) {
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = 'var(--neon-green)';
                    ctx.drawImage(activeImg, player.x, player.y, player.size, player.size);
                    ctx.shadowBlur = 0;
                } else {
                    // Fallback Sécurité si image manquante
                    ctx.fillStyle = '#0b0c10';
                    ctx.fillRect(player.x, player.y, player.size, player.size);
                    ctx.strokeStyle = '#39ff14';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(player.x, player.y, player.size, player.size);
                }

                // --- E. OBSTACLES (Rouge Cyberpunk) ---
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#ff007f';
                ctx.fillStyle = '#ff007f';
                
                obstacles.forEach(obs => {
                    if (obs.type === 'block') {
                        ctx.fillRect(obs.x, obs.y, obs.size, obs.size);
                        ctx.strokeStyle = '#fff';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(obs.x, obs.y, obs.size, obs.size);
                    } else if (obs.type === 'spike') {
                        ctx.beginPath();
                        ctx.moveTo(obs.x + obs.size/2, obs.y);
                        ctx.lineTo(obs.x + obs.size, obs.y + obs.size);
                        ctx.lineTo(obs.x, obs.y + obs.size);
                        ctx.closePath();
                        ctx.fill();
                        ctx.strokeStyle = '#fff';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }
                });
                ctx.shadowBlur = 0;

                // --- F. PARTICULES ---
                particles.forEach(p => {
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = Math.max(0, p.alpha);
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                });
                ctx.globalAlpha = 1;
            }

            ctx.restore();
        }

        // --- 11. LANCEMENT DE LA BOUCLE ---
        requestAnimationFrame(mainLoop);
    </script>
</body>
</html>
