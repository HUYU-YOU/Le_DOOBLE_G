<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undercover</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Bouton Paramètres -->
    <img id="settings-btn-img" src="../img/setting.png" 
         onclick="clickSettingsAnim()" 
         onmouseover="startSettingsAnim()" 
         onmouseout="stopSettingsAnim()" alt="Paramètres">

    <!-- Menu Paramètres -->
    <div id="settings-modal" class="modal">
        <h3>Taille de l'écran</h3>
        <button id="btn-sz-classic" class="btn-size" onclick="setGameSize('classic')">Classique</button>
        <button id="btn-sz-wide" class="btn-size" onclick="setGameSize('wide')">Large</button>
        <button id="btn-sz-full" class="btn-size" onclick="setGameSize('full')">Plein Écran</button>
    </div>

    <!-- Conteneur Principal du Jeu -->
    <div id="game-container">
        
        <!-- UI Supérieure (Ressources) -->
        <div id="top-bar">
            <div>💰 Or: <span id="gold-display">150</span></div>
            <div>❤️ Vies: <span id="lives-display">20</span></div>
            <div>🌊 Vague: <span id="wave-display">0</span></div>
        </div>

        <!-- Zone de Rendu -->
        <canvas id="gameCanvas"></canvas>

        <!-- UI Inférieure (Boutons Tours) -->
        <div id="tower-selection">
            <button id="btn-tower-1" onclick="selectTower(1)">Fantassin (20)</button>
            <button id="btn-tower-2" onclick="selectTower(2)">Tireur (60)</button>
            <button id="btn-tower-3" onclick="selectTower(3)">Blindé (120)</button>
            <button id="btn-tower-4" onclick="selectTower(4)">Sniper (100)</button>
            <button id="btn-tower-5" onclick="selectTower(5)">Bombardier (90)</button>
            <button id="btn-tower-6" onclick="selectTower(6)">Alchimiste (80)</button>
        </div>

        <!-- Contrôles de Vague -->
        <div id="controls">
            <button id="btn-wave" onclick="startWave()">Démarrer Scan !</button>
            <button id="btn-auto" onclick="toggleAuto()">Auto-Scan: OFF</button>
            <button id="btn-speed" onclick="toggleSpeed()">Vitesse: x1</button>
        </div>

        <!-- Panneau d'Amélioration (Caché par défaut) -->
        <div id="upgrade-panel">
            <h3 id="tower-name-display">Nom Tour</h3>
            <p id="tower-stats">Stats ici...</p>
            <button id="btn-upgrade" onclick="upgradeSelectedTower()">Optimiser</button>
            <button id="btn-sell" onclick="sellSelectedTower()">Vendre</button>
        </div>

        <!-- Écran de Fin de Jeu -->
        <div id="game-over">
            <h2>ÉCHEC CRITIQUE</h2>
            <p id="survive-message"></p>
            <button onclick="location.reload()">Rebooter le système</button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="main.js"></script>
    <script src="mots.js"></script> <!-- Uniquement si chargé sur la même page -->
</body>
</html>
