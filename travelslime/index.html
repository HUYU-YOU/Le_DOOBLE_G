<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TravelSlime - Jeu du Seau</title>
    
    <!-- Librairie PeerJS pour le multijoueur -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <!-- API YouTube pour la musique de fond -->
    <script src="https://www.youtube.com/iframe_api"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- Appel de la feuille de style externe -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- Player Musique YouTube -->
    <div id="yt-player-container"><div id="yt-player"></div></div>

    <h1 class="game-title">TravelSlime</h1>
    
    <div id="game-container" class="size-wide">
        
        <a href="../index.html" class="hub-link">⬅ Retour au Hub</a>
        
        <div class="settings-btn-wrapper" onmouseenter="startSettingsAnim()" onmouseleave="stopSettingsAnim()" onclick="clickSettingsAnim()">
            <img src="../img/setting.png" alt="Paramètres" id="settings-btn-img" class="settings-btn">
        </div>

        <!-- MENU MULTIJOUEUR -->
        <div class="overlay" id="network-menu">
            <h2 style="color: var(--p1); font-size: 2.5em; margin-bottom: 5px; text-transform: uppercase;">Le Jeu du Seau</h2>
            <div class="menu-title" style="font-size: 1.2em; margin-bottom: 20px; color: #aaa;">Connexion Multijoueur</div>
            
            <input type="text" id="pseudo" placeholder="Ton Pseudo" required>
            
            <p style="margin-top:20px;">Code de ton salon : <span id="my-id" style="color:#0ff;font-weight:bold;font-size:1.5em;">Génération...</span></p>
            <button class="btn-main" id="host-btn" onclick="autoFullscreen(); hostGame()">Héberger une partie</button>
            <button class="btn-main" id="start-net-btn" style="display:none; background:var(--sys); color:#000;" onclick="startGame()">Commencer à jouer !</button>
            
            <p style="margin: 15px 0; color: #888; font-weight: bold;">--- OU ---</p>
            
            <input type="text" id="join-id" placeholder="Code du salon (ex: TRA1234)" style="text-transform: uppercase;">
            <button class="btn-main red" id="join-btn" onclick="autoFullscreen(); joinGame()">Rejoindre</button>
            
            <p id="status-text" style="color: var(--p3); margin-top: 15px; font-weight: bold; font-size: 1.2em;"></p>
        </div>

        <!-- LA TABLE DE JEU (TAVERNE) -->
        <div id="table-area" style="display: none;">
            
            <!-- Les 3 zones autour de la table pour les slimes adverses -->
            <div id="top-opponents"></div>
            <div id="left-opponents"></div>
            <div id="right-opponents"></div>

            <!-- Centre de table : Le Seau et les logs -->
            <div id="center-table">
                <div class="bucket-deck">
                    🪣 SEAU<br><br><span id="deck-count" style="color:var(--p1); font-size:1.5rem;">0</span>
                </div>
                <div id="game-log">En attente du lancement...</div>
            </div>

            <!-- Ta zone (en bas : panel d'action et main de cartes) -->
            <div id="player-bottom-area">
                <div id="action-panel" style="display: none;">
                    <span style="font-weight: bold; font-size: 1.2rem; color: var(--p4)">C'EST TON TOUR !</span><br>
                    Demander 
                    <select id="country-select"></select>
                    à 
                    <select id="opponent-select"></select>
                    <button class="btn-main red" style="padding: 10px; font-size: 1rem;" onclick="askCard()">Voler !</button>
                </div>

                <div id="my-hand"></div>
            </div>
            
            <!-- Tes stats et ton avatar de slime en bas à gauche -->
            <div id="my-stats">
                <img id="my-avatar" src="" style="width:40px; height:40px; vertical-align:middle; margin-right:10px; object-fit:contain;">
                <span id="my-name-display" style="color:var(--p1); font-weight:bold; font-size: 1.2rem;">...</span><br>
                Familles : <span id="my-score-display" style="color:var(--p3); font-weight:bold; font-size: 1.2rem;">0</span>
            </div>
        </div>

        <!-- ÉCRAN DE FIN DE PARTIE -->
        <div class="overlay" id="game-over-overlay" style="display: none;">
            <div class="menu-title" id="winner-text" style="font-size: 3em;">PARTIE TERMINÉE</div>
            <button class="btn-main" id="btn-restart" onclick="location.reload()">Retour au menu</button>
        </div>

    </div> <!-- FIN DU GAME CONTAINER -->

    <!-- MODAL PARAMETRES -->
    <div id="settings-modal">
        <div class="settings-content">
            <h2 style="margin-top: 0; color: var(--p1); text-transform: uppercase; letter-spacing: 2px;">Paramètres</h2>
            <div class="setting-item" style="flex-direction: column; gap: 15px; margin-bottom: 30px;">
                <span>Format de l'Écran 🖥️</span>
                <div class="size-options">
                    <button id="btn-sz-classic" class="btn-size" onclick="setGameSize('classic')">Petit</button>
                    <button id="btn-sz-wide" class="btn-size active" onclick="setGameSize('wide')">Plein Page</button>
                    <button id="btn-sz-full" class="btn-size" onclick="setGameSize('full')">Plein Écran</button>
                </div>
            </div>
            <button onclick="toggleSettings()" class="close-btn">Fermer</button>
        </div>
    </div>

    <!-- Appel du script externe -->
    <script src="travelslime.js"></script>
</body>
</html>
