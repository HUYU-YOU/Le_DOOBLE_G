<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Cyber Tanks - Twin Stick Edition</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #090a0f; --panel: rgba(20, 22, 35, 0.9); --p1: #00f0ff; --p2: #ff007f; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg); color: #fff; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; user-select: none; }
        h1 { color: var(--p1); text-transform: uppercase; letter-spacing: 5px; margin-top: 20px; text-shadow: 0 0 10px var(--p1); }
        
        .menu-container { background: var(--panel); border-radius: 15px; box-shadow: 0 0 30px rgba(0, 240, 255, 0.2); padding: 30px; border: 1px solid rgba(255,255,255,0.1); margin-top: 20px; text-align: center; }
        #game-container { display: none; padding: 15px; position: relative; background: var(--panel); border-radius: 15px; margin-top: 20px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);}
        canvas { border: 2px solid #333; border-radius: 10px; display: block; box-shadow: inset 0 0 50px #000; cursor: crosshair; }
        
        .btn { background: #fff; color: #000; border: none; padding: 12px 25px; font-weight: bold; border-radius: 5px; cursor: pointer; text-transform: uppercase; margin: 10px; transition: 0.2s; }
        .btn:hover { transform: scale(1.05); box-shadow: 0 0 15px #fff; }
        input { padding: 10px; border-radius: 5px; border: none; font-weight: bold; text-align: center; margin: 10px; background: #333; color: #fff; }
        
        #hud { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 1.5em; font-weight: bold; }
        .p1-lives { color: var(--p1); text-shadow: 0 0 10px var(--p1); }
        .p2-lives { color: var(--p2); text-shadow: 0 0 10px var(--p2); }
        .controls-info { font-size: 0.8em; color: #aaa; margin-top: 15px; line-height: 1.5; }

        .hub-link { position: absolute; top: 15px; left: 15px; color: rgba(255,255,255,0.7); text-decoration: none; font-weight: bold; z-index: 1000; background: rgba(0,0,0,0.6); padding: 10px 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); transition: 0.2s; backdrop-filter: blur(5px); }
        .hub-link:hover { color: #fff; background: rgba(0, 136, 255, 0.8); border-color: #fff; transform: scale(1.05); }
    </style>
</head>
<body>
    <a href="../index.html" class="hub-link">⬅ Retour au Hub</a>
    <h1>Cyber Tanks</h1>

    <div class="menu-container" id="main-menu">
        <h2 style="color:var(--p1);">CHOISIS TON MODE</h2>
        <button class="btn" onclick="startSolo()">Mode Solo (Vs IA)</button>
        <button class="btn" onclick="showNetMenu()" style="background:var(--p2);color:#fff;">Mode Réseau (P2P)</button>
        <div class="controls-info"><b>Contrôles :</b> WASD ou Flèches (Déplacements) | Souris (Viser) | Espace (Tirer)</div>
    </div>

    <div class="menu-container" id="net-menu" style="display: none;">
        <h2>Initialisation du Réseau</h2>
        <p>Votre ID : <span id="my-id" style="color:var(--p1);font-weight:bold;">Création...</span></p>
        <hr style="border-color:#333; margin: 20px 0;">
        <button class="btn" onclick="hostGame()">Héberger la partie</button>
        <p>OU</p>
        <input type="text" id="join-id" placeholder="ID de l'Hôte">
        <button class="btn" onclick="joinGame()" style="background:var(--p2);color:#fff;">Rejoindre</button>
        <p id="status-text" style="color: #aaa; margin-top: 20px;"></p>
        <button class="btn" style="background:#333; color:#fff; font-size:0.8em;" onclick="location.reload()">Retour</button>
    </div>

    <div id="game-container">
        <div id="hud">
            <div class="p1-lives">J1 VIES: <span id="l1">3</span></div>
            <div class="p2-lives" id="j2-label">J2 VIES: <span id="l2">3</span></div>
        </div>
        <canvas id="gameCanvas" width="800" height="500"></canvas>
    </div>

    <script>
        const tankImg = new Image(); tankImg.src = 'img/tank1.png';
        const rockImg = new Image(); rockImg.src = 'img/rocher.png';
        const mapImg = new Image(); mapImg.src = 'img/map1.png';

        const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d');
        const peer = new Peer(); let conn = null, isHost = false, gameActive = false, gameMode = null;
        
        const keys = { up: false, down: false, left: false, right: false, space: false };
        let myAngle = 0; 
        let p2 = { keys: { up: false, down: false, left: false, right: false, space: false }, angle: 180, avoidTimer: 0, avoidDir: 'up' };
        
        peer.on('open', id => { if(document.getElementById('my-id')) document.getElementById('my-id').innerText = id; });
        
        function showNetMenu() { document.getElementById('main-menu').style.display = 'none'; document.getElementById('net-menu').style.display = 'block'; }
        function startSolo() { gameMode = 'solo'; isHost = true; document.getElementById('main-menu').style.display = 'none'; document.getElementById('game-container').style.display = 'block'; document.getElementById('j2-label').innerHTML = `IA VIES: <span id="l2">3</span>`; gameActive = true; startGameLoop(); }
        function hostGame() { gameMode = 'network'; document.getElementById('status-text').innerText = "En attente..."; isHost = true; peer.on('connection', connection => { conn = connection; setupConnection(); }); }
        function joinGame() { gameMode = 'network'; const hostId = document.getElementById('join-id').value; if(!hostId) return; document.getElementById('status-text').innerText = "Connexion..."; conn = peer.connect(hostId); isHost = false; setupConnection(); }

        function setupConnection() {
            conn.on('open', () => {
                document.getElementById('net-menu').style.display = 'none'; document.getElementById('game-container').style.display = 'block'; gameActive = true;
                if(isHost) { startGameLoop(); } else { setInterval(() => { if(conn && conn.open && gameMode === 'network') conn.send({type: 'input', keys: keys, angle: myAngle}); }, 1000/60); }
            });
            conn.on('data', data => {
                if(isHost && data.type === 'input') { p2.keys = data.keys; p2.angle = data.angle; }
                if(!isHost && data.type === 'state') { gameState = data.state; updateHUD(gameState.p1.lives, gameState.p2.lives); drawGame(); }
            });
        }

        function setKey(e, isPressed) {
            let k = e.key.toLowerCase();
            if(['arrowup', 'w'].includes(k)) { keys.up = isPressed; e.preventDefault(); }
            if(['arrowdown', 's'].includes(k)) { keys.down = isPressed; e.preventDefault(); }
            if(['arrowleft', 'a'].includes(k)) { keys.left = isPressed; e.preventDefault(); }
            if(['arrowright', 'd'].includes(k)) { keys.right = isPressed; e.preventDefault(); }
            if(k === ' ') { keys.space = isPressed; e.preventDefault(); }
        }
        window.addEventListener('keydown', e => setKey(e, true)); window.addEventListener('keyup', e => setKey(e, false));

        canvas.addEventListener('mousemove', e => {
            if(!gameActive) return; const rect = canvas.getBoundingClientRect();
            let mx = e.clientX - rect.left; let my = e.clientY - rect.top;
            let myTank = isHost ? gameState.p1 : gameState.p2;
            if (myTank) myAngle = Math.atan2(my - myTank.y, mx - myTank.x) * 180 / Math.PI;
        });

        const rocks = [ { x: 250, y: 150, w: 60, h: 60 }, { x: 490, y: 150, w: 60, h: 60 }, { x: 250, y: 290, w: 60, h: 60 }, { x: 490, y: 290, w: 60, h: 60 } ];

        let gameState = {
            p1: { x: 100, y: 250, angle: 0, lives: 3, color: '#00f0ff', cooldown: 0, invincibility: 0 },
            p2: { x: 700, y: 250, angle: 180, lives: 3, color: '#ff007f', cooldown: 0, invincibility: 0 },
            bullets: []
        };

        function checkRockCollision(x, y, radius) { return rocks.some(r => x + radius > r.x && x - radius < r.x + r.w && y + radius > r.y && y - radius < r.y + r.h); }

        function updateAI() {
            let dx = gameState.p1.x - gameState.p2.x; let dy = gameState.p1.y - gameState.p2.y;
            p2.angle = Math.atan2(dy, dx) * 180 / Math.PI;
            p2.keys.left = false; p2.keys.right = false; p2.keys.up = false; p2.keys.down = false; p2.keys.space = false;
            
            // IA ANTI-BLOCAGE
            if (p2.avoidTimer > 0) {
                p2.avoidTimer--;
                if(p2.avoidDir === 'up') p2.keys.up = true; if(p2.avoidDir === 'down') p2.keys.down = true;
                if(p2.avoidDir === 'left') p2.keys.left = true; if(p2.avoidDir === 'right') p2.keys.right = true;
            } else {
                let moveX = 0, moveY = 0;
                if(Math.hypot(dx, dy) > 150) {
                    if(dx > 10) { p2.keys.right = true; moveX = 1; } else if(dx < -10) { p2.keys.left = true; moveX = -1; }
                    if(dy > 10) { p2.keys.down = true; moveY = 1; } else if(dy < -10) { p2.keys.up = true; moveY = -1; }
                }
                
                // Anticipation des rochers
                if (checkRockCollision(gameState.p2.x + moveX*15, gameState.p2.y + moveY*15, 18)) {
                    p2.avoidTimer = 30; // On dévie pendant 30 frames
                    let dirs = [];
                    if (moveX !== 0) dirs.push(dy > 0 ? 'up' : 'down');
                    if (moveY !== 0) dirs.push(dx > 0 ? 'left' : 'right');
                    p2.avoidDir = dirs.length > 0 ? dirs[Math.floor(Math.random() * dirs.length)] : 'up';
                }
            }
            if(Math.random() < 0.05) p2.keys.space = true; 
        }

        function updatePhysics() {
            if(gameMode === 'solo') updateAI();
            const speed = 3.5;
            
            let oldX1 = gameState.p1.x, oldY1 = gameState.p1.y;
            gameState.p1.angle = isHost ? myAngle : gameState.p1.angle; 
            if(keys.left) gameState.p1.x -= speed; if(keys.right) gameState.p1.x += speed;
            if(keys.up) gameState.p1.y -= speed; if(keys.down) gameState.p1.y += speed;
            if(checkRockCollision(gameState.p1.x, gameState.p1.y, 18)) { gameState.p1.x = oldX1; gameState.p1.y = oldY1; }
            if(keys.space && gameState.p1.cooldown === 0) fireBullet(gameState.p1);

            let oldX2 = gameState.p2.x, oldY2 = gameState.p2.y;
            gameState.p2.angle = p2.angle; 
            if(p2.keys.left) gameState.p2.x -= speed; if(p2.keys.right) gameState.p2.x += speed;
            if(p2.keys.up) gameState.p2.y -= speed; if(p2.keys.down) gameState.p2.y += speed;
            if(checkRockCollision(gameState.p2.x, gameState.p2.y, 18)) { gameState.p2.x = oldX2; gameState.p2.y = oldY2; }
            if(p2.keys.space && gameState.p2.cooldown === 0) fireBullet(gameState.p2);

            [gameState.p1, gameState.p2].forEach(p => {
                if(p.cooldown > 0) p.cooldown--; if(p.invincibility > 0) p.invincibility--;
                p.x = Math.max(20, Math.min(canvas.width - 20, p.x)); p.y = Math.max(20, Math.min(canvas.height - 20, p.y));
            });

            for(let i = gameState.bullets.length - 1; i >= 0; i--) {
                let b = gameState.bullets[i]; b.x += b.vx; b.y += b.vy; b.life--;
                if(b.x < 0 || b.x > canvas.width) b.vx *= -1; if(b.y < 0 || b.y > canvas.height) b.vy *= -1;
                if(checkRockCollision(b.x, b.y, 5)) { gameState.bullets.splice(i, 1); continue; }

                if(gameState.p1.invincibility === 0 && Math.hypot(b.x - gameState.p1.x, b.y - gameState.p1.y) < 20) {
                    gameState.p1.lives--; gameState.p1.invincibility = 100; gameState.p1.x = 100; gameState.p1.y = 250; gameState.bullets.splice(i, 1); continue;
                }
                if(gameState.p2.invincibility === 0 && Math.hypot(b.x - gameState.p2.x, b.y - gameState.p2.y) < 20) {
                    gameState.p2.lives--; gameState.p2.invincibility = 100; gameState.p2.x = 700; gameState.p2.y = 250; gameState.bullets.splice(i, 1); continue;
                }
                if(b.life <= 0) gameState.bullets.splice(i, 1);
            }
        }

        function fireBullet(player) {
            player.cooldown = 40;
            gameState.bullets.push({
                // J'ai mis *35 au lieu de *30 pour que la balle sorte bien du canon qui est long
                x: player.x + Math.cos(player.angle * Math.PI / 180) * 35, 
                y: player.y + Math.sin(player.angle * Math.PI / 180) * 35,
                vx: Math.cos(player.angle * Math.PI / 180) * 10, vy: Math.sin(player.angle * Math.PI / 180) * 10,
                color: player.color, life: 150
            });
        }

        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if(mapImg.complete && mapImg.naturalWidth !== 0) ctx.drawImage(mapImg, 0, 0, canvas.width, canvas.height);
            else { ctx.fillStyle = '#1a1a2e'; ctx.fillRect(0,0,canvas.width,canvas.height); }

            rocks.forEach(r => {
                if(rockImg.complete && rockImg.naturalWidth !== 0) ctx.drawImage(rockImg, r.x, r.y, r.w, r.h);
                else { ctx.fillStyle = '#555'; ctx.fillRect(r.x, r.y, r.w, r.h); }
            });

            [gameState.p1, gameState.p2].forEach(p => {
                if(p.invincibility > 0 && Math.floor(Date.now() / 100) % 2 === 0) return;
                
                ctx.save(); 
                ctx.translate(p.x, p.y);
                
                // CORRECTION 1 : On ajoute 90° (Math.PI/2) car ton image de base regarde vers le HAUT
                let rad = p.angle * Math.PI / 180;
                ctx.rotate(rad + Math.PI / 2); 
                
                if(tankImg.complete && tankImg.naturalWidth !== 0) {
                    // CORRECTION 2 : On calcule le ratio pour ne pas écraser l'image
                    let aspect = tankImg.naturalWidth / tankImg.naturalHeight;
                    let th = 60; // Hauteur fixe
                    let tw = th * aspect; // Largeur dynamique respectée !
                    
                    ctx.drawImage(tankImg, -tw/2, -th/2, tw, th); 
                    
                    // On garde l'indicateur de couleur du joueur
                    ctx.fillStyle = p.color; ctx.globalAlpha = 0.3; ctx.beginPath(); ctx.arc(0,0,15,0,Math.PI*2); ctx.fill(); ctx.globalAlpha = 1;
                } else {
                    ctx.fillStyle = p.color; ctx.fillRect(-15, -15, 30, 30);
                }
                ctx.restore();
                
                // Dessin du viseur/canon
                ctx.strokeStyle = p.color; ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                // J'ai mis *35 ici aussi pour que la petite ligne colorée suive bien le bout du canon
                ctx.lineTo(p.x + Math.cos(p.angle * Math.PI / 180) * 35, p.y + Math.sin(p.angle * Math.PI / 180) * 35);
                ctx.stroke();
            });

            gameState.bullets.forEach(b => {
                ctx.fillStyle = b.color; ctx.shadowBlur = 10; ctx.shadowColor = b.color;
                ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;
            });
        }

        function updateHUD(l1, l2) {
            document.getElementById('l1').innerText = l1; document.getElementById('l2').innerText = l2;
            if(l1 <= 0 || l2 <= 0) { gameActive = false; let winner = l1 <= 0 ? (gameMode === 'solo' ? "L'IA GAGNE !" : "J2 GAGNE !") : "TU AS GAGNÉ !"; alert(winner); location.reload(); }
        }

        function startGameLoop() {
            if(!gameActive) return; updatePhysics(); drawGame(); updateHUD(gameState.p1.lives, gameState.p2.lives);
            if(gameMode === 'network' && conn) conn.send({type: 'state', state: gameState});
            requestAnimationFrame(startGameLoop);
        }
    </script>
    
    <script>
        // J'ai intégré tes scripts de vidéos ici pour garder le code propre à l'intérieur du body
        function playVid(card) {
            let vid = card.querySelector('.bg-video');
            if(vid) vid.play();
        }

        function pauseVid(card) {
            let vid = card.querySelector('.bg-video');
            if(vid) {
                vid.pause();
                vid.currentTime = 0; 
            }
        }
    </script>
</body>
    <!-- ========================================== -->
    <!-- SCRIPT DE NAVIGATION PAR SWIPE (TACTILE)   -->
    <!-- ========================================== -->
    <script>
        // 1. Liste de tes jeux dans l'ordre souhaité. 
        // /!\ Vérifie que les noms des dossiers correspondent bien aux tiens.
        const gamesHubList = [
            "../cybertank/index.html",
            "../tower_defense/index.html",
            "../edgeofwar/index.html",
            "../cyber_smash/index.html",
            "../guessthemanga/index.html",
            "../drawer/index.html",
            "../texas_poker/index.html"
        ];

        let touchstartX = 0;
        let touchendX = 0;
        
        function handleSwipeGesture() {
            const swipeThreshold = 75; // Distance minimum (en pixels) pour valider le swipe
            
            if (touchendX < touchstartX - swipeThreshold) {
                // Swipe vers la gauche (Jeu suivant)
                navigateGames(1);
            }
            if (touchendX > touchstartX + swipeThreshold) {
                // Swipe vers la droite (Jeu précédent)
                navigateGames(-1);
            }
        }

        function navigateGames(direction) {
            const currentPath = window.location.pathname;
            
            // Trouve l'index du jeu actuel en regardant l'URL
            let currentIndex = gamesHubList.findIndex(game => {
                let folderName = game.split('/')[1]; 
                return currentPath.includes(folderName);
            });
            
            // Si on ne trouve pas (erreur de nom de dossier), on annule
            if (currentIndex === -1) return;

            // Calcul du prochain jeu avec une boucle (le dernier ramène au premier)
            let nextIndex = (currentIndex + direction + gamesHubList.length) % gamesHubList.length;
            
            // Redirection
            window.location.href = gamesHubList[nextIndex];
        }

        // Écoute du début du touché
        document.addEventListener('touchstart', e => {
            // On ignore le swipe si on touche le canvas pour ne pas gâcher le gameplay
            if (e.target.tagName.toLowerCase() === 'canvas') return;
            touchstartX = e.changedTouches[0].screenX;
        }, { passive: true });

        // Écoute de la fin du touché
        document.addEventListener('touchend', e => {
            if (e.target.tagName.toLowerCase() === 'canvas') return;
            touchendX = e.changedTouches[0].screenX;
            handleSwipeGesture();
        }, { passive: true });
    </script>
</html>
