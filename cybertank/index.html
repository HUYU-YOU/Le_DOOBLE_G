<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Slime - Neon Arena</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- BOUTONS FLOTTANTS (Retour Hub -> Racine) -->
    <a href="../index.html" class="hub-link" id="hub-link-btn">
        <img src="../img/retourhub.png" alt="Retour au Hub" id="hub-img">
    </a>

    <!-- BOUTONS FLOTTANTS (Paramètres -> Racine) -->
    <div class="settings-btn-wrapper" onmouseenter="startSettingsAnim()" onmouseleave="stopSettingsAnim()" onclick="clickSettingsAnim()">
        <div class="orbit-container"><div class="orbit-slime"></div></div>
        <img src="../img/setting.png" alt="Paramètres" id="settings-btn-img" class="settings-btn">
    </div>

    <!-- MODAL PARAMETRES -->
    <div id="settings-modal">
        <div class="settings-content">
            <h2 style="margin-top: 0; color: var(--p1); text-transform: uppercase; letter-spacing: 2px;">Paramètres</h2>
            
            <div class="setting-item" style="flex-direction: column; gap: 15px; margin-bottom: 20px;">
                <span>Langue / Language 🌍</span>
                <div class="size-options">
                    <button id="btn-lang-fr" class="btn-size active" onclick="setLanguage('fr')">FR</button>
                    <button id="btn-lang-en" class="btn-size" onclick="setLanguage('en')">EN</button>
                </div>
            </div>

            <div class="setting-item" style="flex-direction: column; gap: 15px; margin-bottom: 30px;">
                <span>Format de l'Écran 🖥️</span>
                <div class="size-options">
                    <button id="btn-sz-classic" class="btn-size" onclick="setGameSize('classic')">Petit</button>
                    <button id="btn-sz-wide" class="btn-size active" onclick="setGameSize('wide')">Plein Page</button>
                    <button id="btn-sz-full" class="btn-size" onclick="setGameSize('full')">Plein Écran</button>
                </div>
            </div>
            
            <button onclick="toggleSettings()" class="close-btn">Fermer</button>
        </div>
    </div>
    
    <div id="game-container" class="size-wide">
        
        <!-- MENU PRINCIPAL -->
        <div class="overlay menu-bg" id="main-menu">
            
            <img src="./img/chooseyourbattle.png" alt="CHOOSE YOUR BATTLE" class="menu-title-img" onerror="this.style.display='none'">

            <div id="solo-buttons" class="btn-container">
                <img src="./img/duelbot.png" alt="Duel Bot" class="img-btn" onclick="autoFullscreen(); startMode('solo_1v1')">
                <img src="./img/survie.png" alt="Survie" class="img-btn" onclick="autoFullscreen(); startMode('solo_survival')">
                
                <button class="btn-main red" onclick="autoFullscreen(); showNetworkMenu()">🌐 Duel PVP</button>
            </div>
            
        </div>

        <!-- MENU RÉSEAU -->
        <div class="overlay menu-bg" id="network-menu" style="display: none;">
            
            <!-- BLOC CRÉER (Host) -->
            <div class="net-panel">
                <img src="./img/generate.png" class="bg" alt="Créer une arène">
                <div class="net-slot host-slot">
                    <div id="my-id" class="net-id-text">...</div>
                </div>
                <div class="net-btn-zone host-zone" onclick="hostGame()" title="Générer un code"></div>
            </div>

            <!-- BLOC REJOINDRE (Join) -->
            <div class="net-panel">
                <img src="./img/join.png" class="bg" alt="Rejoindre">
                <div class="net-slot join-slot">
                    <input type="text" id="join-id" class="net-input" placeholder="CODE">
                </div>
                <div class="net-btn-zone join-zone" onclick="joinGame()" title="Infiltration"></div>
            </div>
            
            <p id="status-text" class="status-txt"></p>
            <button class="btn-main" style="border: none; box-shadow:none; color: #888; background:transparent; padding: 10px;" onclick="hideOnlineMenu()">Annuler</button>
        </div>

        <!-- ECRAN DE FIN -->
        <div class="overlay" id="game-over" style="display: none;">
            <h2 id="end-message" style="font-size: clamp(2.5rem, 8vw, 4rem); margin-bottom: 10px; text-transform: uppercase;"></h2>
            <p id="end-stats" style="font-size: clamp(1.2rem, 4vw, 1.5rem); color: #aaa; margin-bottom: 30px;"></p>
            <div style="display: flex; gap: 15px; width: 80%; justify-content: center;">
                <button class="btn-main" onclick="requestRestart()">Rejouer</button>
                <button class="btn-main" onclick="location.reload()" style="background:transparent; border-color:#555; color:#aaa; box-shadow:none;">Quitter</button>
            </div>
        </div>

        <!-- HUD & CANVAS -->
        <div id="hud">
            <div class="score-box" id="hud-p1">VAGUE : 1</div>
            <div class="score-box enemy" id="hud-p2"></div>
        </div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <!-- JOYSTICKS (Mobiles) -->
        <div id="mobile-controls">
            <div class="joystick-zone" id="joy-move"><div class="joystick-knob" id="knob-move"></div></div>
            <div class="joystick-zone right" id="joy-aim"><div class="joystick-knob" id="knob-aim"></div></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
