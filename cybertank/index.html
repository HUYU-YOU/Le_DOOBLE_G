<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Cyber Tanks - Arcade</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #090a0f; --panel: rgba(20, 22, 35, 0.9); --p1: #00f0ff; --p2: #ff007f; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg); color: #fff; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; user-select: none; }
        h1 { color: var(--p1); text-transform: uppercase; letter-spacing: 5px; margin-top: 20px; text-shadow: 0 0 10px var(--p1); }
        
        #menu, #game-container { background: var(--panel); border-radius: 15px; box-shadow: 0 0 30px rgba(0, 240, 255, 0.2); padding: 30px; border: 1px solid rgba(255,255,255,0.1); margin-top: 20px; text-align: center; }
        #game-container { display: none; padding: 15px; position: relative; }
        canvas { background: #1a1a2e; border: 2px solid #333; border-radius: 10px; display: block; box-shadow: inset 0 0 50px #000; }
        
        .btn { background: #fff; color: #000; border: none; padding: 12px 25px; font-weight: bold; border-radius: 5px; cursor: pointer; text-transform: uppercase; margin: 10px; transition: 0.2s; }
        .btn:hover { transform: scale(1.05); box-shadow: 0 0 15px #fff; }
        input { padding: 10px; border-radius: 5px; border: none; font-weight: bold; text-align: center; margin: 10px; background: #333; color: #fff; }
        
        #hud { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 1.5em; font-weight: bold; }
        .p1-lives { color: var(--p1); text-shadow: 0 0 10px var(--p1); }
        .p2-lives { color: var(--p2); text-shadow: 0 0 10px var(--p2); }
    </style>
</head>
<body>
    <h1>Cyber Tanks</h1>

    <!-- Menu Multijoueur -->
    <div id="menu">
        <h2>Initialisation du Réseau</h2>
        <p>Votre ID : <span id="my-id" style="color:var(--p1);font-weight:bold;">Création...</span></p>
        <hr style="border-color:#333; margin: 20px 0;">
        <button class="btn" onclick="hostGame()">Héberger la partie</button>
        <p>OU</p>
        <input type="text" id="join-id" placeholder="ID de l'Hôte">
        <button class="btn" onclick="joinGame()" style="background:var(--p2);color:#fff;">Rejoindre</button>
        <p id="status-text" style="color: #aaa; margin-top: 20px;"></p>
    </div>

    <!-- Jeu -->
    <div id="game-container">
        <div id="hud">
            <div class="p1-lives">J1 VIES: <span id="l1">3</span></div>
            <div class="p2-lives">J2 VIES: <span id="l2">3</span></div>
        </div>
        <canvas id="gameCanvas" width="800" height="500"></canvas>
    </div>

    <script>
        // === RÉSEAU (PEERJS) ===
        const peer = new Peer();
        let conn = null, isHost = false, gameActive = false;
        const keys = { up: false, down: false, left: false, right: false, space: false };
        
        peer.on('open', id => document.getElementById('my-id').innerText = id);
        
        function hostGame() {
            document.getElementById('status-text').innerText = "En attente d'un adversaire...";
            isHost = true;
            peer.on('connection', connection => {
                conn = connection;
                setupConnection();
            });
        }
        
        function joinGame() {
            const hostId = document.getElementById('join-id').value;
            if(!hostId) return;
            document.getElementById('status-text').innerText = "Connexion...";
            conn = peer.connect(hostId);
            isHost = false;
            setupConnection();
        }

        function setupConnection() {
            conn.on('open', () => {
                document.getElementById('menu').style.display = 'none';
                document.getElementById('game-container').style.display = 'block';
                gameActive = true;
                if(isHost) startGameLoop(); // Seul l'hôte gère la boucle physique
            });
            
            conn.on('data', data => {
                if(isHost && data.type === 'input') {
                    p2.keys = data.keys; // Hôte reçoit les inputs du J2
                }
                if(!isHost && data.type === 'state') {
                    // Client reçoit l'état du jeu et l'affiche
                    gameState = data.state;
                    updateHUD(gameState.p1.lives, gameState.p2.lives);
                    drawGame();
                }
            });
        }

        // Contrôles locaux envoyés au réseau
        window.addEventListener('keydown', e => {
            if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) {
                e.preventDefault();
                let key = e.key === ' ' ? 'space' : e.key.replace('Arrow','').toLowerCase();
                keys[key] = true;
                if(!isHost && conn) conn.send({type: 'input', keys: keys});
            }
        });
        window.addEventListener('keyup', e => {
            if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) {
                let key = e.key === ' ' ? 'space' : e.key.replace('Arrow','').toLowerCase();
                keys[key] = false;
                if(!isHost && conn) conn.send({type: 'input', keys: keys});
            }
        });

        // === LOGIQUE DE JEU (Gérée par l'Hôte) ===
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // État partagé
        let gameState = {
            p1: { x: 100, y: 250, angle: 0, lives: 3, color: '#00f0ff', cooldown: 0, invincibility: 0 },
            p2: { x: 700, y: 250, angle: 180, lives: 3, color: '#ff007f', cooldown: 0, invincibility: 0 },
            bullets: []
        };
        
        // Le J2 est un "fantôme" côté hôte pour stocker ses inputs
        let p2 = { keys: { up: false, down: false, left: false, right: false, space: false } };

        function updatePhysics() {
            const speed = 3; const rotSpeed = 4;
            
            // Update TANK 1 (Local Hôte)
            if(keys.left) gameState.p1.angle -= rotSpeed;
            if(keys.right) gameState.p1.angle += rotSpeed;
            if(keys.up) { gameState.p1.x += Math.cos(gameState.p1.angle * Math.PI / 180) * speed; gameState.p1.y += Math.sin(gameState.p1.angle * Math.PI / 180) * speed; }
            if(keys.down) { gameState.p1.x -= Math.cos(gameState.p1.angle * Math.PI / 180) * speed; gameState.p1.y -= Math.sin(gameState.p1.angle * Math.PI / 180) * speed; }
            if(keys.space && gameState.p1.cooldown === 0) fireBullet(gameState.p1);

            // Update TANK 2 (Inputs réseau)
            if(p2.keys.left) gameState.p2.angle -= rotSpeed;
            if(p2.keys.right) gameState.p2.angle += rotSpeed;
            if(p2.keys.up) { gameState.p2.x += Math.cos(gameState.p2.angle * Math.PI / 180) * speed; gameState.p2.y += Math.sin(gameState.p2.angle * Math.PI / 180) * speed; }
            if(p2.keys.down) { gameState.p2.x -= Math.cos(gameState.p2.angle * Math.PI / 180) * speed; gameState.p2.y -= Math.sin(gameState.p2.angle * Math.PI / 180) * speed; }
            if(p2.keys.space && gameState.p2.cooldown === 0) fireBullet(gameState.p2);

            // Cooldowns & Murs
            [gameState.p1, gameState.p2].forEach(p => {
                if(p.cooldown > 0) p.cooldown--;
                if(p.invincibility > 0) p.invincibility--;
                p.x = Math.max(20, Math.min(canvas.width - 20, p.x));
                p.y = Math.max(20, Math.min(canvas.height - 20, p.y));
            });

            // Update Bullets
            for(let i = gameState.bullets.length - 1; i >= 0; i--) {
                let b = gameState.bullets[i];
                b.x += b.vx; b.y += b.vy; b.life--;
                
                // Rebond
                if(b.x < 0 || b.x > canvas.width) b.vx *= -1;
                if(b.y < 0 || b.y > canvas.height) b.vy *= -1;
                
                // Collisions Tanks
                if(gameState.p1.invincibility === 0 && Math.hypot(b.x - gameState.p1.x, b.y - gameState.p1.y) < 20) {
                    gameState.p1.lives--; gameState.p1.invincibility = 100;
                    gameState.p1.x = 100; gameState.p1.y = 250; gameState.bullets.splice(i, 1); continue;
                }
                if(gameState.p2.invincibility === 0 && Math.hypot(b.x - gameState.p2.x, b.y - gameState.p2.y) < 20) {
                    gameState.p2.lives--; gameState.p2.invincibility = 100;
                    gameState.p2.x = 700; gameState.p2.y = 250; gameState.bullets.splice(i, 1); continue;
                }
                
                if(b.life <= 0) gameState.bullets.splice(i, 1);
            }
        }

        function fireBullet(player) {
            player.cooldown = 40;
            gameState.bullets.push({
                x: player.x + Math.cos(player.angle * Math.PI / 180) * 30,
                y: player.y + Math.sin(player.angle * Math.PI / 180) * 30,
                vx: Math.cos(player.angle * Math.PI / 180) * 8,
                vy: Math.sin(player.angle * Math.PI / 180) * 8,
                color: player.color, life: 150
            });
        }

        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw Tanks
            [gameState.p1, gameState.p2].forEach(p => {
                if(p.invincibility > 0 && Math.floor(Date.now() / 100) % 2 === 0) return; // Clignotement
                
                ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.angle * Math.PI / 180);
                
                ctx.fillStyle = p.color; ctx.shadowBlur = 15; ctx.shadowColor = p.color;
                ctx.fillRect(-15, -15, 30, 30); // Corps
                ctx.fillRect(0, -5, 25, 10); // Canon
                ctx.restore();
            });

            // Draw Bullets
            gameState.bullets.forEach(b => {
                ctx.fillStyle = b.color; ctx.shadowBlur = 10; ctx.shadowColor = b.color;
                ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;
            });
        }

        function updateHUD(l1, l2) {
            document.getElementById('l1').innerText = l1;
            document.getElementById('l2').innerText = l2;
            if(l1 <= 0 || l2 <= 0) { gameActive = false; alert(l1 <= 0 ? "J2 GAGNE!" : "J1 GAGNE!"); location.reload(); }
        }

        function startGameLoop() {
            if(!gameActive) return;
            updatePhysics();
            drawGame();
            updateHUD(gameState.p1.lives, gameState.p2.lives);
            conn.send({type: 'state', state: gameState}); // Envoi état au J2
            requestAnimationFrame(startGameLoop);
        }
    </script>
</body>
</html>
