<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Arcade - Cyber Draw (Skribbl)</title>
    <style>
        :root { --bg: #0b0c10; --panel: rgba(31, 40, 51, 0.95); --cyan: #66fcf1; --teal: #45a29e; --text: #c5c6c7; --draw-bg: #ffffff; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; user-select: none; }
        h1 { color: var(--cyan); text-transform: uppercase; letter-spacing: 3px; margin: 10px 0; text-shadow: 0 0 15px rgba(102, 252, 241, 0.5); }
        
        #game-wrapper { background: var(--panel); border: 1px solid rgba(102, 252, 241, 0.3); border-radius: 15px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); max-width: 1200px; width: 100%; display: flex; flex-direction: column; gap: 20px; }
        
        /* MENU LOCAL */
        #lobby { text-align: center; }
        .player-input-group { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 20px 0; }
        .p-input { padding: 10px; border-radius: 5px; border: 1px solid var(--teal); background: #111; color: #fff; text-align: center; font-weight: bold; width: 120px; }
        .lang-select { padding: 10px; border-radius: 5px; background: var(--cyan); color: #000; font-weight: bold; border: none; cursor: pointer; }
        .btn { background: var(--cyan); color: #000; border: none; padding: 12px 25px; font-weight: bold; border-radius: 8px; cursor: pointer; text-transform: uppercase; transition: 0.2s; box-shadow: 0 0 10px rgba(102, 252, 241, 0.3); }
        .btn:hover { transform: scale(1.05); box-shadow: 0 0 20px var(--cyan); }

        /* JEU */
        #game-area { display: none; gap: 20px; align-items: flex-start; }
        
        /* Panneau de Gauche : Joueurs */
        #players-panel { flex: 1; background: rgba(0,0,0,0.5); padding: 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; gap: 10px; }
        .player-card { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; border-left: 4px solid var(--teal); }
        .player-card.active-turn { border-color: var(--cyan); background: rgba(102, 252, 241, 0.1); }
        .btn-award { background: #39ff14; color: #000; border: none; padding: 5px 10px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 0.8em; }
        
        /* Centre : Zone de dessin */
        #drawing-zone { flex: 3; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        #top-bar { display: flex; justify-content: space-between; width: 100%; align-items: center; background: #111; padding: 10px 20px; border-radius: 8px; box-sizing: border-box; border: 1px solid var(--teal); }
        #word-display { font-size: 2em; letter-spacing: 5px; font-weight: bold; color: #fff; }
        #timer { font-size: 1.5em; color: #ff007f; font-weight: bold; }
        
        canvas { background: var(--draw-bg); border-radius: 8px; cursor: crosshair; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); touch-action: none; }
        
        /* Outils Paint */
        #toolbar { display: flex; gap: 15px; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 10px; width: 100%; justify-content: center; align-items: center; flex-wrap: wrap; border: 1px solid rgba(255,255,255,0.1); }
        .tool-btn { background: #222; border: 1px solid #444; color: white; padding: 10px; border-radius: 5px; cursor: pointer; transition: 0.2s; }
        .tool-btn.active { background: var(--cyan); color: #000; border-color: #fff; }
        .tool-btn:hover { background: #444; }
        input[type="color"] { cursor: pointer; height: 35px; border: none; border-radius: 5px; background: none; }
        
        /* Deviner par écrit */
        #guess-box { width: 100%; display: flex; gap: 10px; margin-top: 10px; }
        #guess-input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid var(--cyan); background: #111; color: #fff; font-size: 1.1em; }

        /* Overlays Action */
        .game-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; border-radius: 15px; }

        .hub-link { position: absolute; top: 15px; left: 15px; color: rgba(255,255,255,0.7); text-decoration: none; font-weight: bold; background: rgba(0,0,0,0.6); padding: 10px 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); transition: 0.2s; }
        .hub-link:hover { color: #fff; background: rgba(102, 252, 241, 0.8); border-color: #fff; }
    </style>
</head>
<body>
    <a href="../index.html" class="hub-link">⬅ Retour au Hub</a>
    <h1>Cyber Draw</h1>

    <div id="game-wrapper">
        
        <!-- LOBBY (Ajout de joueurs) -->
        <div id="lobby">
            <h2 style="color: var(--teal);">Configuration Locale (2 à 8 Joueurs)</h2>
            <select id="lang-selector" class="lang-select">
                <option value="fr">Dictionnaire : Français 🇫🇷</option>
                <option value="en">Dictionary : English 🇬🇧</option>
            </select>
            
            <div class="player-input-group" id="player-inputs">
                <!-- Généré par JS -->
            </div>
            <button class="btn" onclick="addPlayerField()">+ Ajouter Joueur</button>
            <button class="btn" style="background:#ff007f; color:#fff;" onclick="startGame()">LANCER LA PARTIE</button>
        </div>

        <!-- ZONE DE JEU -->
        <div id="game-area">
            
            <div id="players-panel">
                <!-- Liste des joueurs générée par JS -->
            </div>

            <div id="drawing-zone">
                <div id="top-bar">
                    <div style="font-weight:bold; color:var(--cyan);" id="current-drawer-txt">Tour de : ???</div>
                    <div id="word-display">_ _ _ _</div>
                    <div id="timer">80s</div>
                </div>

                <div style="position: relative;">
                    <canvas id="drawCanvas" width="800" height="450"></canvas>
                    
                    <!-- Overlay pour cacher le mot au début du tour -->
                    <div class="game-overlay" id="turn-overlay" style="display:none;">
                        <h2 id="turn-title" style="color:var(--cyan); font-size:2em;"></h2>
                        <p>Les autres joueurs doivent fermer les yeux !</p>
                        <button class="btn" onclick="revealWord()">Voir le mot secret</button>
                    </div>

                    <!-- Overlay du mot révélé -->
                    <div class="game-overlay" id="word-overlay" style="display:none;">
                        <h2 style="color:#fff;">Ton mot à dessiner :</h2>
                        <h1 id="secret-word-big" style="color:#ff007f; font-size:4em; text-transform:uppercase;"></h1>
                        <button class="btn" onclick="startDrawingPhase()">C'est bon, je dessine !</button>
                    </div>
                </div>

                <div id="toolbar">
                    <button class="tool-btn active" onclick="setTool('pen', this)">✏️ Pinceau</button>
                    <button class="tool-btn" onclick="setTool('eraser', this)">🧹 Gomme</button>
                    <button class="tool-btn" onclick="setTool('line', this)">📏 Ligne</button>
                    <button class="tool-btn" onclick="setTool('rect', this)">⬜ Rectangle</button>
                    <button class="tool-btn" onclick="setTool('circle', this)">⭕ Cercle</button>
                    
                    <input type="color" id="colorPicker" value="#000000">
                    <input type="range" id="sizePicker" min="1" max="50" value="5">
                    
                    <button class="tool-btn" style="background:#ff2a2a;" onclick="clearCanvas()">🗑️ Tout effacer</button>
                </div>

                <div id="guess-box">
                    <input type="text" id="guess-input" placeholder="Taper une réponse ici pour vérifier l'orthographe..." onkeypress="checkGuess(event)">
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 📚 DICTIONNAIRE (100 MOTS) - Facile à étendre
        // ==========================================
        const dictionary = [
            // Animaux
            {fr: "chat", en: "cat"}, {fr: "chien", en: "dog"}, {fr: "oiseau", en: "bird"}, {fr: "poisson", en: "fish"}, {fr: "cheval", en: "horse"},
            {fr: "vache", en: "cow"}, {fr: "cochon", en: "pig"}, {fr: "mouton", en: "sheep"}, {fr: "poule", en: "chicken"}, {fr: "lion", en: "lion"},
            {fr: "tigre", en: "tiger"}, {fr: "ours", en: "bear"}, {fr: "singe", en: "monkey"}, {fr: "elephant", en: "elephant"}, {fr: "girafe", en: "giraffe"},
            {fr: "serpent", en: "snake"}, {fr: "araignee", en: "spider"}, {fr: "grenouille", en: "frog"}, {fr: "lapin", en: "rabbit"}, {fr: "souris", en: "mouse"},
            {fr: "loup", en: "wolf"}, {fr: "renard", en: "fox"}, {fr: "requin", en: "shark"}, {fr: "baleine", en: "whale"}, {fr: "dauphin", en: "dolphin"},
            {fr: "escargot", en: "snail"}, {fr: "papillon", en: "butterfly"}, {fr: "crabe", en: "crab"}, {fr: "tortue", en: "turtle"},
            
            // Objets
            {fr: "table", en: "table"}, {fr: "chaise", en: "chair"}, {fr: "lit", en: "bed"}, {fr: "canape", en: "sofa"}, {fr: "television", en: "television"},
            {fr: "ordinateur", en: "computer"}, {fr: "telephone", en: "phone"}, {fr: "livre", en: "book"}, {fr: "stylo", en: "pen"}, {fr: "crayon", en: "pencil"},
            {fr: "gomme", en: "eraser"}, {fr: "sac", en: "bag"}, {fr: "montre", en: "watch"}, {fr: "lunettes", en: "glasses"}, {fr: "voiture", en: "car"},
            {fr: "velo", en: "bicycle"}, {fr: "avion", en: "airplane"}, {fr: "bateau", en: "boat"}, {fr: "train", en: "train"}, {fr: "porte", en: "door"},
            {fr: "fenetre", en: "window"}, {fr: "cle", en: "key"}, {fr: "tasse", en: "cup"}, {fr: "assiette", en: "plate"}, {fr: "fourchette", en: "fork"},
            {fr: "couteau", en: "knife"}, {fr: "cuillere", en: "spoon"}, {fr: "bouteille", en: "bottle"}, {fr: "guitare", en: "guitar"}, {fr: "piano", en: "piano"},
            
            // Nourriture
            {fr: "pomme", en: "apple"}, {fr: "banane", en: "banana"}, {fr: "orange", en: "orange"}, {fr: "fraise", en: "strawberry"}, {fr: "raisin", en: "grape"},
            {fr: "poire", en: "pear"}, {fr: "cerise", en: "cherry"}, {fr: "pasteque", en: "watermelon"}, {fr: "carotte", en: "carrot"}, {fr: "tomate", en: "tomato"},
            {fr: "pomme de terre", en: "potato"}, {fr: "oignon", en: "onion"}, {fr: "ail", en: "garlic"}, {fr: "pain", en: "bread"}, {fr: "fromage", en: "cheese"},
            {fr: "lait", en: "milk"}, {fr: "oeuf", en: "egg"}, {fr: "viande", en: "meat"}, {fr: "poulet", en: "chicken"}, {fr: "riz", en: "rice"},
            {fr: "pates", en: "pasta"}, {fr: "pizza", en: "pizza"}, {fr: "hamburger", en: "hamburger"}, {fr: "gateau", en: "cake"}, {fr: "chocolat", en: "chocolate"},
            {fr: "glace", en: "ice cream"}, {fr: "bonbon", en: "candy"}, {fr: "cafe", en: "coffee"}, {fr: "the", en: "tea"},
            
            // Nature & Lieux
            {fr: "soleil", en: "sun"}, {fr: "lune", en: "moon"}, {fr: "etoile", en: "star"}, {fr: "nuage", en: "cloud"}, {fr: "pluie", en: "rain"},
            {fr: "neige", en: "snow"}, {fr: "arbre", en: "tree"}, {fr: "fleur", en: "flower"}, {fr: "herbe", en: "grass"}, {fr: "montagne", en: "mountain"},
            {fr: "riviere", en: "river"}, {fr: "lac", en: "lake"}, {fr: "mer", en: "sea"}, {fr: "plage", en: "beach"}, {fr: "foret", en: "forest"},
            {fr: "ville", en: "city"}, {fr: "village", en: "village"}, {fr: "maison", en: "house"}, {fr: "ecole", en: "school"}, {fr: "hopital", en: "hospital"},
            {fr: "feu", en: "fire"}, {fr: "vent", en: "wind"}
        ];

        // ==========================================
        // NORMALISATION (Retire accents, majuscules)
        // ==========================================
        function normalizeWord(str) {
            return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
        }

        // ==========================================
        // MOTEUR DU JEU
        // ==========================================
        let players = [];
        let currentTurnIndex = 0;
        let currentWord = "";
        let currentLang = "fr";
        let timer = null;
        let timeLeft = 80;
        let isTurnActive = false;

        // Initialiser 3 champs de joueurs par défaut
        for(let i=1; i<=3; i++) addPlayerField();

        function addPlayerField() {
            if(document.querySelectorAll('.p-input').length >= 8) return; // Max 8
            let nb = document.querySelectorAll('.p-input').length + 1;
            let input = document.createElement('input');
            input.type = 'text'; input.className = 'p-input'; input.placeholder = `Joueur ${nb}`; input.value = `Joueur ${nb}`;
            document.getElementById('player-inputs').appendChild(input);
        }

        function startGame() {
            let inputs = document.querySelectorAll('.p-input');
            players = [];
            inputs.forEach(inp => { if(inp.value.trim() !== "") players.push({name: inp.value.trim(), score: 0}); });
            
            if(players.length < 2) { alert("Il faut au moins 2 joueurs !"); return; }
            
            currentLang = document.getElementById('lang-selector').value;
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('game-area').style.display = 'flex';
            
            currentTurnIndex = -1;
            nextTurn();
        }

        function updatePlayersUI() {
            let panel = document.getElementById('players-panel');
            panel.innerHTML = '<h3 style="margin:0; color:var(--cyan); text-align:center;">Classement</h3>';
            
            // Trier par score
            let sorted = [...players].sort((a,b) => b.score - a.score);
            
            sorted.forEach(p => {
                let isDrawer = (players[currentTurnIndex] && players[currentTurnIndex].name === p.name);
                let div = document.createElement('div');
                div.className = `player-card ${isDrawer ? 'active-turn' : ''}`;
                
                let info = document.createElement('div');
                info.innerHTML = `<b>${p.name}</b> <br><small>${p.score} pts</small> ${isDrawer ? '✏️' : ''}`;
                div.appendChild(info);

                // Bouton pour attribuer un point manuellement (pratique en local quand quelqu'un crie la réponse)
                if(!isDrawer && isTurnActive) {
                    let btn = document.createElement('button');
                    btn.className = 'btn-award';
                    btn.innerText = "✅ Trouvé !";
                    btn.onclick = () => awardPoint(p.name);
                    div.appendChild(btn);
                }
                
                panel.appendChild(div);
            });
        }

        function nextTurn() {
            clearInterval(timer);
            isTurnActive = false;
            currentTurnIndex = (currentTurnIndex + 1) % players.length;
            
            let drawer = players[currentTurnIndex];
            document.getElementById('current-drawer-txt').innerText = `Dessinateur : ${drawer.name}`;
            document.getElementById('word-display').innerText = "? ? ?";
            document.getElementById('timer').innerText = "80s";
            document.getElementById('guess-input').value = "";
            clearCanvas();
            updatePlayersUI();

            // Overlay secret
            document.getElementById('turn-overlay').style.display = 'flex';
            document.getElementById('turn-title').innerText = `À toi de jouer, ${drawer.name} !`;
        }

        function revealWord() {
            let randItem = dictionary[Math.floor(Math.random() * dictionary.length)];
            currentWord = randItem[currentLang];
            
            document.getElementById('turn-overlay').style.display = 'none';
            document.getElementById('word-overlay').style.display = 'flex';
            document.getElementById('secret-word-big').innerText = currentWord;
        }

        function startDrawingPhase() {
            document.getElementById('word-overlay').style.display = 'none';
            
            // Cacher le mot en haut
            let hidden = currentWord.split('').map(c => c === ' ' ? ' ' : '_').join(' ');
            document.getElementById('word-display').innerText = hidden;
            
            isTurnActive = true;
            timeLeft = 80;
            updatePlayersUI(); // Affiche les boutons "Trouvé"
            
            timer = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft + "s";
                if(timeLeft <= 0) {
                    endTurn("Temps écoulé ! Le mot était : " + currentWord);
                }
            }, 1000);
        }

        // Vérification si un joueur TAPE la réponse dans la barre
        function checkGuess(e) {
            if(e.key === 'Enter' && isTurnActive) {
                let guess = normalizeWord(e.target.value);
                let target = normalizeWord(currentWord);
                
                if(guess === target) {
                    // C'est juste ! Mais comme on partage le clavier, on demande qui a écrit ça :
                    let winnerName = prompt(`🎉 Bonne réponse ! Quel joueur vient de taper ça ?\n(${players.map(p=>p.name).join(', ')})`);
                    if(winnerName) awardPoint(winnerName.trim());
                } else {
                    e.target.style.background = "#ff2a2a";
                    setTimeout(() => e.target.style.background = "#111", 300);
                }
                e.target.value = "";
            }
        }

        function awardPoint(playerName) {
            let p = players.find(x => x.name.toLowerCase() === playerName.toLowerCase());
            if(p) {
                p.score += 10 + Math.floor(timeLeft / 5); // Bonus de temps
                players[currentTurnIndex].score += 5; // Le dessinateur gagne aussi des points
                endTurn(`🎉 ${p.name} a trouvé le mot : ${currentWord} !`);
            }
        }

        function endTurn(message) {
            clearInterval(timer);
            isTurnActive = false;
            alert(message);
            updatePlayersUI();
            nextTurn();
        }


        // ==========================================
        // MOTEUR DE DESSIN (CANVAS - Style Paint)
        // ==========================================
        const drawCanvas = document.getElementById('drawCanvas');
        const ctx = drawCanvas.getContext('2d');
        
        let isDrawing = false;
        let startX = 0, startY = 0;
        let snapshot; // Pour la prévisualisation des formes
        let currentTool = 'pen'; 

        // Initialisation fond blanc
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, drawCanvas.width, drawCanvas.height);
        
        function getMousePos(e) {
            let rect = drawCanvas.getBoundingClientRect();
            // Gère le tactile et la souris
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function setTool(tool, btn) {
            currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function clearCanvas() {
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, drawCanvas.width, drawCanvas.height);
        }

        drawCanvas.addEventListener('mousedown', startDraw);
        drawCanvas.addEventListener('mousemove', drawing);
        drawCanvas.addEventListener('mouseup', stopDraw);
        drawCanvas.addEventListener('mouseout', stopDraw);
        
        // Tactile
        drawCanvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDraw(e); });
        drawCanvas.addEventListener('touchmove', (e) => { e.preventDefault(); drawing(e); });
        drawCanvas.addEventListener('touchend', stopDraw);

        function startDraw(e) {
            if(!isTurnActive) return; // Bloque le dessin si ce n'est pas le tour
            isDrawing = true;
            let pos = getMousePos(e);
            startX = pos.x; startY = pos.y;
            
            // Sauvegarde le canvas pour la prévisualisation des formes
            snapshot = ctx.getImageData(0, 0, drawCanvas.width, drawCanvas.height);
            
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = document.getElementById('sizePicker').value;
            ctx.strokeStyle = currentTool === 'eraser' ? '#ffffff' : document.getElementById('colorPicker').value;
        }

        function drawing(e) {
            if (!isDrawing) return;
            let pos = getMousePos(e);

            if (currentTool === 'pen' || currentTool === 'eraser') {
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            } else {
                // Pour les formes, on restaure le snapshot avant de redessiner par-dessus
                ctx.putImageData(snapshot, 0, 0);
                ctx.beginPath();
                if (currentTool === 'line') {
                    ctx.moveTo(startX, startY);
                    ctx.lineTo(pos.x, pos.y);
                } else if (currentTool === 'rect') {
                    ctx.rect(startX, startY, pos.x - startX, pos.y - startY);
                } else if (currentTool === 'circle') {
                    let radius = Math.sqrt(Math.pow(pos.x - startX, 2) + Math.pow(pos.y - startY, 2));
                    ctx.arc(startX, startY, radius, 0, 2 * Math.PI);
                }
                ctx.stroke();
            }
        }

        function stopDraw() {
            isDrawing = false;
        }
    </script>
</body>
</html>
