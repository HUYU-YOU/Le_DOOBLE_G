<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Smash - MOBA Top-Down</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- BOUTONS FLOTTANTS (Hub et Paramètres) -->
    <a href="../index.html" class="hub-link">⬅ Retour au Hub</a>
    <button class="settings-btn" onclick="toggleSettings()">⚙️ Paramètres</button>

    <!-- FENÊTRE PARAMÈTRES -->
    <div id="settings-modal" class="overlay" style="display: none; z-index: 1000;">
        <div class="panel">
            <h2>PARAMÈTRES</h2>
            <div style="margin: 20px 0;">
                <label style="font-size: 1.2em; margin-right: 10px;">Disposition Clavier :</label>
                <select id="keyboard-layout" style="font-size: 1.2em; padding: 5px;">
                    <option value="azerty">AZERTY (A, Z, E, R)</option>
                    <option value="qwerty">QWERTY (Q, W, E, R)</option>
                </select>
            </div>
            <p style="color: #aaa; margin-bottom: 20px;">
                <b>Déplacement :</b> Clic Gauche<br>
                <b>Lancer un sort :</b> Touche du clavier (Quick-Cast) <br>OU Clic sur le sort en bas + Clic Droit
            </p>
            <button class="btn-main" onclick="toggleSettings()">Fermer</button>
        </div>
    </div>

    <!-- CONTENEUR DU JEU -->
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <!-- HUD MOBA -->
        <div id="hud" style="display: none;">
            <div class="hud-center">
                <div class="hp-bar-container">
                    <div class="hp-bar" id="p1-hp-bar"></div>
                    <div class="shield-bar" id="p1-shield-bar"></div>
                    <div class="hp-text" id="p1-hp-txt">1000/1000</div>
                </div>
                <div class="cd-container">
                    <!-- Les clics sur ces boutons préparent le sort pour le Clic Droit -->
                    <div class="cd-box" id="spell-s1" onclick="prepareSpell('s1')"><span class="key-hint" id="key-s1">A</span></div>
                    <div class="cd-box" id="spell-s2" onclick="prepareSpell('s2')"><span class="key-hint" id="key-s2">Z</span></div>
                    <div class="cd-box" id="spell-s3" onclick="prepareSpell('s3')"><span class="key-hint" id="key-s3">E</span></div>
                    <div class="cd-box ult-box" id="spell-ult" onclick="prepareSpell('ult')"><span class="key-hint" id="key-ult">R</span></div>
                </div>
            </div>
        </div>

        <!-- MENU LOCAL (Choix du champion) -->
        <div class="overlay" id="local-menu">
            <h1 class="game-title">Cyber Smash</h1>
            <div class="menu-title" id="instruction-title">Sélection Joueur 1</div>
            <div id="char-select">
                <div class="card char-card" onclick="chooseChar('ninja')"><b>Ninja</b><br><small>Assassin</small></div>
                <div class="card char-card" onclick="chooseChar('gunner')"><b>Gunner</b><br><small>ADC</small></div>
                <div class="card char-card" onclick="chooseChar('slime')"><b>Slime</b><br><small>Gros Tank</small></div>
                <div class="card char-card" onclick="chooseChar('seth')"><b>Seth</b><br><small>Brawler</small></div>
                <div class="card char-card" onclick="chooseChar('mage')"><b>Mage</b><br><small>Burst</small></div>
                <div class="card char-card" onclick="chooseChar('teemo')"><b>Scout</b><br><small>Poison / Furtif</small></div>
            </div>
            <button class="btn-main" id="start-local-btn" style="display:none; background:var(--sys); color:#000;" onclick="startLocalGame()">LANCER LA PARTIE</button>
        </div>

        <!-- ECRAN DE FIN -->
        <div class="overlay" id="game-over-overlay" style="display: none;">
            <div class="menu-title" id="winner-text" style="font-size: 4em; text-shadow: 0 0 20px #000;"></div>
            <button class="btn-main" onclick="location.reload()">Rejouer</button>
        </div>
    </div>

    <script src="slimelegends.js"></script>
</body>
</html>
