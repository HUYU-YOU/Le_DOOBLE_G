<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Smash - ARAM Edition</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div id="game-container" class="size-wide">
        
        <a href="../index.html" class="hub-link">⬅ Retour au Hub</a>
        
        <div class="settings-btn-wrapper" onmouseenter="startSettingsAnim()" onmouseleave="stopSettingsAnim()" onclick="clickSettingsAnim()">
            <img src="../img/setting.png" alt="Paramètres" id="settings-btn-img" class="settings-btn">
        </div>

        <canvas id="gameCanvas" width="800" height="500"></canvas>
        
        <!-- HUD MOBA -->
        <div id="hud" style="display: none;">
            <div class="hud-center">
                <div class="hp-bar-container">
                    <div class="hp-bar" id="p1-hp-bar"></div>
                    <div class="shield-bar" id="p1-shield-bar"></div>
                    <div class="hp-text" id="p1-hp-txt">1000/1000</div>
                </div>
                <div class="cd-container">
                    <div class="cd-box" id="spell-s1"><span class="key-hint" id="key-s1">A</span></div>
                    <div class="cd-box" id="spell-s2"><span class="key-hint" id="key-s2">Z</span></div>
                    <div class="cd-box" id="spell-s3"><span class="key-hint" id="key-s3">E</span></div>
                    <div class="cd-box ult-box" id="spell-ult"><span class="key-hint" id="key-ult">R</span></div>
                </div>
            </div>
        </div>

        <!-- MENU LOCAL -->
        <div class="overlay" id="local-menu">
            <h1 class="game-title">Cyber Smash</h1>
            <div class="menu-title" id="instruction-title">Sélection Joueur 1</div>
            <div id="char-select">
                <div class="card char-card" onclick="chooseChar('ninja')"><b>Ninja</b></div>
                <div class="card char-card" onclick="chooseChar('gunner')"><b>Gunner</b></div>
                <div class="card char-card" onclick="chooseChar('slime')"><b>Slime</b></div>
                <div class="card char-card" onclick="chooseChar('seth')"><b>Seth</b></div>
                <div class="card char-card" onclick="chooseChar('mage')"><b>Mage</b></div>
                <div class="card char-card" onclick="chooseChar('teemo')"><b>Scout</b></div>
            </div>
            <button class="btn-main" id="start-local-btn" style="display:none; background:var(--sys); color:#000;" onclick="autoFullscreen(); startLocalGame()">LANCER LA PARTIE</button>
        </div>

        <!-- ECRAN DE FIN -->
        <div class="overlay" id="game-over-overlay" style="display: none;">
            <div class="menu-title" id="winner-text" style="font-size: 3em;"></div>
            <button class="btn-main" id="btn-restart" onclick="location.reload()">Retour au menu de sélection</button>
        </div>
    </div>

    <!-- MODAL PARAMÈTRES (AVEC LE SELECTEUR AZERTY / QWERTY RETROUVÉ) -->
    <div id="settings-modal">
        <div class="settings-content">
            <h2 style="margin-top: 0; color: var(--p1); text-transform: uppercase; letter-spacing: 2px;">Paramètres</h2>
            
            <div class="setting-item" style="display:flex; flex-direction: column; gap: 10px; margin-bottom: 20px;">
                <span>Format de l'Écran 🖥️</span>
                <div class="size-options">
                    <button id="btn-sz-classic" class="btn-size" onclick="setGameSize('classic')">Petit</button>
                    <button id="btn-sz-wide" class="btn-size active" onclick="setGameSize('wide')">Plein Page</button>
                    <button id="btn-sz-full" class="btn-size" onclick="setGameSize('full')">Plein Écran</button>
                </div>
            </div>

            <div class="setting-item" style="display:flex; flex-direction: column; gap: 10px; margin-bottom: 30px;">
                <span>Disposition Clavier ⌨️</span>
                <select id="keyboard-layout" style="font-family: 'Rajdhani'; font-weight: bold; font-size: 1.1em; padding: 8px; border-radius: 5px; background: #222; color: white; border: 1px solid var(--p1); text-align: center;">
                    <option value="azerty">AZERTY (A, Z, E, R)</option>
                    <option value="qwerty">QWERTY (Q, W, E, R)</option>
                </select>
            </div>
            
            <button onclick="toggleSettings()" class="close-btn">Fermer</button>
        </div>
    </div>

    <script src="slimelegends.js"></script>
</body>
</html>
