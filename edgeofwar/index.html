<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Edge of War - Tactical Multiplayer</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #0a0e17; --panel: rgba(18, 25, 43, 0.9); --primary: #0088ff; --enemy: #ff2a2a; --gold: #ffd700; --xp: #b82aff; --spell: #00ffcc;}
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: white; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; user-select: none;}
        h1 { margin-top: 20px; color: #fff; text-transform: uppercase; letter-spacing: 3px; text-shadow: 0 0 10px var(--primary); }
        
        .hub-link { position: absolute; top: 15px; left: 15px; color: rgba(255,255,255,0.7); text-decoration: none; font-weight: bold; z-index: 1000; background: rgba(0,0,0,0.6); padding: 10px 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); transition: 0.2s; backdrop-filter: blur(5px); }
        .hub-link:hover { color: #fff; background: rgba(0, 136, 255, 0.8); border-color: #fff; transform: scale(1.05); }

        #game-container { position: relative; background: var(--panel); padding: 25px; border-radius: 15px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); width: 100%; max-width: 900px; border: 1px solid rgba(0, 136, 255, 0.2); backdrop-filter: blur(10px); overflow: hidden; margin-top: 10px; }
        
        /* Overlays Menus */
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 14, 23, 0.95); z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .btn-main { background: var(--primary); color: white; border: none; padding: 15px 35px; font-size: 1.2em; border-radius: 8px; cursor: pointer; text-transform: uppercase; font-weight: bold; box-shadow: 0 0 15px rgba(0, 136, 255, 0.4); margin: 10px; transition: 0.2s; }
        .btn-main:hover { transform: scale(1.05); box-shadow: 0 0 25px rgba(0, 136, 255, 0.6); }
        input.net-input { padding: 12px; border-radius: 5px; border: 1px solid var(--primary); font-weight: bold; text-align: center; margin: 10px; background: #111; color: #fff; font-size: 1.1em; }

        .hud { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; background: rgba(0,0,0,0.4); padding: 15px 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }
        .base-stats { display: flex; flex-direction: column; width: 32%; }
        .base-name { font-weight: bold; font-size: 1.1em; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px;}
        .player-name { color: var(--primary); text-shadow: 0 0 10px rgba(0, 136, 255, 0.5); }
        .enemy-name { color: var(--enemy); text-align: right; text-shadow: 0 0 10px rgba(255, 42, 42, 0.5); }
        .health-bar-container { width: 100%; height: 12px; background: rgba(0,0,0,0.6); border-radius: 6px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); }
        .health-bar { height: 100%; transition: width 0.3s ease; }
        #p1-hp-bar { background: linear-gradient(90deg, #0055ff, var(--primary)); width: 100%; box-shadow: 0 0 10px var(--primary); }
        #p2-hp-bar { background: linear-gradient(90deg, #aa0000, var(--enemy)); width: 100%; float: right; box-shadow: 0 0 10px var(--enemy); }
        .economy { display: flex; justify-content: space-evenly; width: 35%; align-items: center;}
        .gold { font-size: 2em; color: var(--gold); font-weight: bold; text-shadow: 0 0 15px rgba(255, 215, 0, 0.5); margin-bottom: 5px;}
        .xp-container { margin-top: 8px; background: rgba(0,0,0,0.6); height: 8px; border-radius: 4px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1);}
        .btn-evolve { display: none; width: 100%; background: var(--xp); color: white; border: none; padding: 10px; margin-top: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; box-shadow: 0 0 15px var(--xp); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); box-shadow: 0 0 15px var(--xp); } 50% { transform: scale(1.03); box-shadow: 0 0 25px var(--xp); } 100% { transform: scale(1); box-shadow: 0 0 15px var(--xp); } }
        canvas { border-radius: 8px; width: 100%; box-shadow: inset 0 0 30px rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.1); background: #111; margin-bottom: 15px; }
        
        .controls-container { display: flex; gap: 15px; width: 100%; justify-content: center; }
        .team-controls { flex: 1; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.05); }
        .team-controls h3 { text-align: center; margin-top: 0; font-size: 0.9em; color: #aaa; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px;}
        .controls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .spells { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 10px;}
        
        .unit-btn { background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1); padding: 8px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; align-items: center; position: relative; overflow: hidden; backdrop-filter: blur(5px); font-size: 0.9em;}
        .unit-btn img { height: 35px; object-fit: contain; margin-bottom: 5px; }
        .unit-btn:hover:not(:disabled) { background: rgba(0, 136, 255, 0.15); border-color: var(--primary); transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0, 136, 255, 0.2); }
        .unit-btn:disabled { opacity: 0.4; cursor: not-allowed; background: rgba(0,0,0,0.3); filter: grayscale(100%); }
        
        .spell-btn { background: rgba(0, 255, 204, 0.1); border: 1px solid var(--spell); color: white; padding: 8px; border-radius: 8px; cursor: pointer; font-weight: bold; position: relative; overflow: hidden; font-size: 0.9em;}
        .spell-btn:hover:not(:disabled) { background: rgba(0, 255, 204, 0.3); box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);}
        .spell-btn:disabled { opacity: 0.5; cursor: not-allowed; border-color: #555;}
        .cooldown-overlay { position: absolute; bottom: 0; left: 0; height: 100%; width: 0%; background: rgba(0,0,0,0.6); transition: width 0.1s linear; pointer-events: none;}
        
        .unit-cost { color: var(--gold); font-size: 1.1em; text-shadow: 0 0 5px rgba(255, 215, 0, 0.3); }
        .unit-locked { position: absolute; font-size: 1.2em; color: var(--enemy); transform: rotate(-20deg); opacity: 0.9; top: 25%; font-weight: 900; background: rgba(0,0,0,0.8); padding: 2px 10px; border-radius: 5px; border: 1px solid var(--enemy); text-shadow: 0 0 5px var(--enemy); }
    </style>
</head>
<body>
    <a href="../index.html" class="hub-link">⬅ Retour au Hub</a>
    <h1>Tactical Command</h1>
    
    <div id="game-container">
        
        <!-- MENU PRINCIPAL -->
        <div class="overlay" id="main-menu">
            <h1 style="font-size: 3em; margin-bottom: 40px; color: var(--primary);">SÉLECTION DU MODE</h1>
            <button class="btn-main" onclick="startSolo('solo')">Mode Solo (Normal)</button>
            <button class="btn-main" onclick="startSolo('hardcore')" style="background:var(--enemy);">Mode Survie (Hardcore !)</button>
            <button class="btn-main" onclick="startLocal()" style="background:var(--xp);">Mode Local (1 Clavier)</button>
            <button class="btn-main" onclick="showNetworkMenu()" style="background:#555;">Mode Réseau (P2P)</button>
        </div>

        <!-- MENU RÉSEAU -->
        <div class="overlay" id="network-menu" style="display: none;">
            <h2 style="color: var(--primary); font-size: 2.5em;">Lobby Réseau</h2>
            <p style="font-size: 1.2em;">Votre ID : <span id="my-id" style="color:var(--primary);font-weight:bold;">Création...</span></p>
            <button class="btn-main" onclick="hostGame()">Créer (Hôte - Base Ouest)</button>
            <p style="margin: 20px 0;">OU</p>
            <input type="text" id="join-id" class="net-input" placeholder="Coller l'ID de l'hôte">
            <button class="btn-main" onclick="joinGame()" style="background:var(--enemy);">Rejoindre (Client - Base Est)</button>
            <p id="status-text" style="color: #aaa; margin-top: 20px; font-weight:bold;"></p>
            <button class="btn-main" style="background:#333; font-size: 0.9em; margin-top: 30px;" onclick="location.reload()">Retour</button>
        </div>

        <!-- ECRAN DE FIN -->
        <div class="overlay" id="game-over" style="display: none;">
            <h2 id="end-message" style="font-size: 3.5em; margin-bottom: 15px; text-transform: uppercase; text-align: center;"></h2>
            <button class="btn-main" onclick="location.reload()">Nouvelle Bataille</button><br>
        </div>

        <!-- HUD EN JEU -->
        <div class="hud" id="game-hud" style="visibility: hidden;">
            <div class="base-stats">
                <div class="base-name player-name">Base Ouest (Tech <span id="p1-age">1</span>)</div>
                <div class="health-bar-container"><div class="health-bar" id="p1-hp-bar"></div></div>
                <div style="font-size: 0.75em; margin-top: 6px; color: #a9a9b3;">XP : <span id="p1-xp-text">0/100</span></div>
                <div class="xp-container"><div id="p1-xp-bar" style="height: 100%; background: linear-gradient(90deg, #7a00cc, var(--xp)); width: 0%; transition: width 0.3s; box-shadow: 0 0 10px var(--xp);"></div></div>
                <button id="btn-evolve-p1" class="btn-evolve" onclick="sendAction(1, 'evolve', null)">Upgrade Tech !</button>
            </div>
            
            <div class="economy">
                <div style="text-align:center;" id="p1-gold-container">
                    <div style="font-size: 0.9em; color: #aaa; text-transform:uppercase;" id="p1-gold-label">Vos Ressources</div>
                    <div class="gold"><span id="p1-gold">50</span> 💰</div>
                </div>
                <div style="text-align:center; display:none;" id="p2-gold-container">
                    <div style="font-size: 0.9em; color: #aaa; text-transform:uppercase;">Or J2</div>
                    <div class="gold"><span id="p2-gold">50</span> 💰</div>
                </div>
            </div>
            
            <div class="base-stats" style="text-align: right;">
                <div class="base-name enemy-name">Base Est (Tech <span id="p2-age">1</span>)</div>
                <div class="health-bar-container"><div class="health-bar" id="p2-hp-bar"></div></div>
                <div id="p2-xp-info" style="font-size: 0.75em; margin-top: 6px; color: #a9a9b3; display:none;">XP : <span id="p2-xp-text">0/100</span></div>
                <div class="xp-container" id="p2-xp-container" style="display:none;"><div id="p2-xp-bar" style="height: 100%; background: linear-gradient(90deg, #7a00cc, var(--xp)); width: 0%; transition: width 0.3s; box-shadow: 0 0 10px var(--xp);"></div></div>
                <button id="btn-evolve-p2" class="btn-evolve" onclick="sendAction(2, 'evolve', null)">Upgrade Tech !</button>
            </div>
        </div>

        <canvas id="gameCanvas" width="800" height="250"></canvas>
        
        <div class="controls-container" id="deployment-controls">
            <!-- Rempli dynamiquement par JS -->
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d');
        
        // --- CHARGEMENT IMAGES ---
        const imgs = {};
        const imgFiles = {
            'map1': 'img/map1.png', 'map2': 'img/map2.png',
            'fantassin_est': 'img/fantassin_est.png', 'fantassin_ouest': 'img/fantassin_ouest.png',
            'tirreur_est': 'img/tirreur_est.png', 'tirreur_ouest': 'img/tirreur_ouest.png',
            'blindé_est': 'img/blindé_est.png', 'blindé_ouest': 'img/blindé_ouest.png',
            'sniper_est': 'img/sniper_est.png', 'sniper_ouest': 'img/sniper_ouest.png'
        };
        Object.keys(imgFiles).forEach(k => { imgs[k] = new Image(); imgs[k].src = imgFiles[k]; });

        // --- RESEAU & ETAT ---
        const peer = new Peer();
        let conn = null, gameMode = null, myTeam = 1, gameActive = false, timeElapsed = 0;
        
        let gameState = {
            p1: { gold: 50, xp: 0, age: 1, hp: 500, maxHp: 500, spells: { 1: 0, 2: 0 } },
            p2: { gold: 50, xp: 0, age: 1, hp: 500, maxHp: 500, spells: { 1: 0, 2: 0 } }, 
            units: [],
            effects: [] 
        };

        const xpToEvolve = 100;
        const bases = { 
            1: { x: -20, w: 90, h: 120, spawnX: 70, dir: 1 }, 
            2: { x: 730, w: 90, h: 120, spawnX: 730, dir: -1 } 
        };
        
        // STATS UNIFIEES + AJOUT DU BOSS
        const unitStats = {
            fantassin: { cost: 15, hp: 45, dmg: 6, spd: 0.6, rng: 15, cd: 50, skin: 'fantassin', w: 25, h: 40, type: 'melee', rew: 10, xp: 10 }, 
            tireur: { cost: 35, hp: 30, dmg: 12, spd: 0.75, rng: 90, cd: 60, skin: 'tirreur', w: 20, h: 35, type: 'ranged', rew: 15, xp: 15 },
            blindé: { cost: 100, hp: 180, dmg: 25, spd: 0.4, rng: 20, cd: 40, skin: 'blindé', w: 35, h: 50, type: 'melee', rew: 25, xp: 25 }, 
            sniper: { cost: 75, hp: 50, dmg: 20, spd: 0.65, rng: 160, cd: 45, skin: 'sniper', w: 25, h: 45, type: 'ranged', rew: 20, xp: 20 },
            boss: { cost: 500, hp: 1800, dmg: 50, spd: 0.3, rng: 30, cd: 50, skin: 'blindé', w: 70, h: 100, type: 'melee', rew: 200, xp: 100 }
        };
        const spellStats = { 1: { cost: 40, cdMax: 300 }, 2: { cost: 60, cdMax: 400 } };

        class Unit {
            constructor(team, type) {
                const s = unitStats[type]; 
                this.id = Math.random().toString(36).substr(2, 9);
                this.team = team; this.type = type;
                this.w = s.w; this.h = s.h; 
                this.x = team === 1 ? bases[1].spawnX : bases[2].spawnX - this.w; 
                this.y = 215 - this.h; 
                
                this.speed = s.spd * bases[team].dir; 
                this.hp = s.hp; this.maxHp = s.hp; this.dmg = s.dmg; this.rng = s.rng; 
                this.cdMax = s.cd; this.cd = 0; 
                this.skin = s.skin; this.rew = s.rew; this.xp = s.xp;
                this.action = 'walk'; this.animCycle = 0;
            }
        }

        // --- GESTION MENUS & PEERJS ---
        peer.on('open', id => { document.getElementById('my-id').innerText = id; });

        function startSolo(mode) {
            gameMode = mode; myTeam = 1; 
            startGame();
        }

        function startLocal() {
            gameMode = 'local'; myTeam = 1; 
            startGame();
        }

        function showNetworkMenu() {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('network-menu').style.display = 'flex';
        }

        function hostGame() {
            document.getElementById('status-text').innerText = "En attente d'un joueur...";
            gameMode = 'host'; myTeam = 1;
            peer.on('connection', connection => { conn = connection; setupConnection(); });
        }

        function joinGame() {
            const hostId = document.getElementById('join-id').value;
            if(!hostId) return;
            document.getElementById('status-text').innerText = "Connexion...";
            gameMode = 'client'; myTeam = 2;
            conn = peer.connect(hostId);
            setupConnection();
        }

        function setupConnection() {
            conn.on('open', () => { startGame(); });
            conn.on('data', data => {
                if (gameMode === 'host' && data.type === 'action') processAction(2, data.action, data.val);
                if (gameMode === 'client' && data.type === 'state') {
                    gameState = data.state;
                    updateHUD();
                }
            });
        }

        // --- SHORTCUTS CLAVIER ---
        window.addEventListener('keydown', e => {
            if(!gameActive) return;
            let key = e.key.toLowerCase();
            
            // Touches J1 (Ouest)
            if (myTeam === 1 || gameMode === 'local') {
                if(key === 'a') sendAction(1, 'spawn', 'fantassin');
                if(key === 'z') sendAction(1, 'spawn', 'tireur');
                if(key === 'e') sendAction(1, 'spawn', 'blindé');
                if(key === 'r') sendAction(1, 'spawn', 'sniper');
                if(key === 'q') sendAction(1, 'spell', 1);
                if(key === 's') sendAction(1, 'spell', 2);
                if(key === 'd') sendAction(1, 'evolve', null);
            }

            // Touches J2 pour Client Réseau (Joue avec les touches de base sur son PC)
            if (myTeam === 2 && gameMode === 'client') {
                if(key === 'a') sendAction(2, 'spawn', 'fantassin');
                if(key === 'z') sendAction(2, 'spawn', 'tireur');
                if(key === 'e') sendAction(2, 'spawn', 'blindé');
                if(key === 'r') sendAction(2, 'spawn', 'sniper');
                if(key === 'q') sendAction(2, 'spell', 1);
                if(key === 's') sendAction(2, 'spell', 2);
                if(key === 'd') sendAction(2, 'evolve', null);
            }

            // Touches J2 pour Mode Local (Même PC, pavé numérique)
            if (gameMode === 'local') {
                if(e.key === '1') sendAction(2, 'spawn', 'fantassin');
                if(e.key === '2') sendAction(2, 'spawn', 'tireur');
                if(e.key === '3') sendAction(2, 'spawn', 'blindé');
                if(e.key === '4') sendAction(2, 'spawn', 'sniper');
                if(e.key === '7') sendAction(2, 'spell', 1);
                if(e.key === '8') sendAction(2, 'spell', 2);
                if(e.key === '9') sendAction(2, 'evolve', null);
            }
        });

        // --- INTERFACE DEPLOIEMENT DYNAMIQUE ---
        function buildControls(team) {
            let dir = team === 1 ? 'est' : 'ouest';
            let prefix = team === 1 ? 'p1' : 'p2';
            let teamName = team === 1 ? 'OUEST' : 'EST';
            let keys = team === 1 ? "(A, Z, E, R | Sorts: Q, S | Tech: D)" : "(Num 1, 2, 3, 4 | Sorts: 7, 8 | Tech: 9)";
            
            if (gameMode === 'client' || gameMode === 'solo' || gameMode === 'hardcore') {
                keys = "(A, Z, E, R | Sorts: Q, S | Tech: D)";
            }
            
            return `
                <div class="team-controls">
                    <h3>BASE ${teamName} <br><span style="font-size:0.8em; color:var(--primary); font-weight:normal;">${keys}</span></h3>
                    <div class="spells">
                        <button class="spell-btn" id="btn-${prefix}-spell1" onclick="sendAction(${team}, 'spell', 1)">
                            Plasma (40 💰) <div class="cooldown-overlay" id="cd-${prefix}-spell1"></div>
                        </button>
                        <button class="spell-btn" id="btn-${prefix}-spell2" onclick="sendAction(${team}, 'spell', 2)">
                            Soins (60 💰) <div class="cooldown-overlay" id="cd-${prefix}-spell2"></div>
                        </button>
                    </div>
                    <div class="controls">
                        <button class="unit-btn" id="btn-${prefix}-u1" onclick="sendAction(${team}, 'spawn', 'fantassin')"><img src="img/fantassin_${dir}.png">Fantassin <br><span class="unit-cost">15 💰</span></button>
                        <button class="unit-btn" id="btn-${prefix}-u2" onclick="sendAction(${team}, 'spawn', 'tireur')"><img src="img/tirreur_${dir}.png">Tireur <br><span class="unit-cost">35 💰</span></button>
                        <button class="unit-btn" id="btn-${prefix}-u3" onclick="sendAction(${team}, 'spawn', 'blindé')" disabled><img src="img/blindé_${dir}.png">Blindé <br><span class="unit-cost">100 💰</span><span class="unit-locked" id="lock-${prefix}-3">TECH 2</span></button>
                        <button class="unit-btn" id="btn-${prefix}-u4" onclick="sendAction(${team}, 'spawn', 'sniper')" disabled><img src="img/sniper_${dir}.png">Sniper <br><span class="unit-cost">75 💰</span><span class="unit-locked" id="lock-${prefix}-4">TECH 2</span></button>
                    </div>
                </div>
            `;
        }

        function startGame() {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('network-menu').style.display = 'none';
            document.getElementById('game-hud').style.visibility = 'visible';
            
            if (gameMode === 'local') {
                document.getElementById('deployment-controls').innerHTML = buildControls(1) + buildControls(2);
                document.getElementById('p2-gold-container').style.display = 'block';
                document.getElementById('p1-gold-label').innerText = 'OR J1';
                document.getElementById('p2-xp-info').style.display = 'block';
                document.getElementById('p2-xp-container').style.display = 'block';
            } else {
                document.getElementById('deployment-controls').innerHTML = buildControls(myTeam);
            }

            gameActive = true;
            if(gameMode === 'host' || gameMode === 'solo' || gameMode === 'hardcore' || gameMode === 'local') {
                setInterval(economyTick, 1000);
            }
            requestAnimationFrame(gameLoop);
        }

        // --- MOTEUR DE JEU (Géré par Hôte, Solo, Hardcore ou Local) ---
        function economyTick() {
            if(!gameActive) return;
            timeElapsed++;
            gameState.p1.gold += 3 + gameState.p1.age;
            gameState.p2.gold += 3 + gameState.p2.age;
            
            // INTELLIGENCE ARTIFICIELLE
            if(gameMode === 'solo' || gameMode === 'hardcore') {
                if(timeElapsed === 60) { gameState.p2.age = 2; document.getElementById('p2-age').innerText = "MAX"; }
                
                let r = Math.random();
                let isHard = (gameMode === 'hardcore');

                if (isHard) {
                    gameState.p2.gold += Math.floor(timeElapsed / 10); // Génération exponentielle !
                }

                if(gameState.p2.age === 1) {
                    if(gameState.p2.gold >= 35 && r > 0.6) processAction(2, 'spawn', 'tireur');
                    else if(gameState.p2.gold >= 15 && r > 0.2) processAction(2, 'spawn', 'fantassin');
                } else {
                    if(isHard && gameState.p2.gold >= 500 && r > 0.7) processAction(2, 'spawn', 'boss');
                    else if(gameState.p2.gold >= 100 && r > 0.6) processAction(2, 'spawn', 'blindé');
                    else if(gameState.p2.gold >= 75 && r > 0.4) processAction(2, 'spawn', 'sniper');
                    else if(gameState.p2.gold >= 35 && r > 0.2) processAction(2, 'spawn', 'tireur');
                    else if(gameState.p2.gold >= 15) processAction(2, 'spawn', 'fantassin');
                }

                if (isHard) {
                    if (gameState.p2.spells[1] === 0 && Math.random() < 0.03) processAction(2, 'spell', 1);
                    if (gameState.p2.hp < 700 && gameState.p2.spells[2] === 0 && Math.random() < 0.05) processAction(2, 'spell', 2);
                }
            }
        }

        function sendAction(team, action, val) {
            if(gameMode === 'client' && team === 2) {
                conn.send({type: 'action', action: action, val: val});
            } else if (gameMode === 'host' && team === 1) {
                processAction(1, action, val);
            } else if (gameMode === 'local' || gameMode === 'solo' || gameMode === 'hardcore') {
                processAction(team, action, val);
            }
        }

        function processAction(team, action, val) {
            let p = team === 1 ? gameState.p1 : gameState.p2;
            if(action === 'spawn' && p.gold >= unitStats[val].cost) {
                p.gold -= unitStats[val].cost;
                gameState.units.push(new Unit(team, val));
            }
            else if(action === 'spell' && p.gold >= spellStats[val].cost && p.spells[val] === 0) {
                p.gold -= spellStats[val].cost;
                p.spells[val] = spellStats[val].cdMax;
                if(val === 1) {
                    gameState.effects.push({ type: 'plasma', team: team, life: 30 });
                    gameState.units.filter(u => u.team !== team).forEach(u => u.hp -= 40);
                } else if(val === 2) {
                    gameState.effects.push({ type: 'nano', team: team, life: 30 });
                    gameState.units.filter(u => u.team === team).forEach(u => u.hp = Math.min(u.maxHp, u.hp + 50));
                    p.hp = Math.min(p.maxHp, p.hp + 100);
                }
            }
            else if(action === 'evolve' && p.xp >= xpToEvolve && p.age === 1) {
                p.age = 2; p.xp = 0; p.maxHp = 1000; p.hp = 1000;
            }
        }

        function updatePhysics() {
            // Refroidissement des sorts
            [gameState.p1, gameState.p2].forEach(p => {
                if(p.spells[1] > 0) p.spells[1]--;
                if(p.spells[2] > 0) p.spells[2]--;
            });
            
            // Effets
            for(let i = gameState.effects.length-1; i >= 0; i--) {
                gameState.effects[i].life--;
                if(gameState.effects[i].life <= 0) gameState.effects.splice(i, 1);
            }

            // Unités
            for (let i = gameState.units.length - 1; i >= 0; i--) {
                let u = gameState.units[i]; let target = null; u.action = 'walk';
                
                // Recherche de cible
                for (let j = 0; j < gameState.units.length; j++) { 
                    let other = gameState.units[j]; 
                    if (u.team !== other.team) { 
                        let dist = u.team === 1 ? (other.x - (u.x + u.w)) : (u.x - (other.x + other.w)); 
                        if (dist <= u.rng && dist >= -10) { target = other; break; } 
                    } 
                }
                if (!target) { 
                    let distToBase = u.team === 1 ? (bases[2].x - (u.x + u.w)) : (u.x - (bases[1].x + bases[1].w)); 
                    if (distToBase <= u.rng) target = u.team === 1 ? gameState.p2 : gameState.p1; 
                }
                
                if (target) { 
                    u.action = 'attack'; 
                    if (u.cd <= 0) { 
                        target.hp -= u.dmg; u.cd = u.cdMax; 
                    } 
                } else {
                    // Anti-Stacking
                    let canMove = true; let hitboxSpacing = u.w + 10;
                    for (let j = 0; j < gameState.units.length; j++) {
                        let other = gameState.units[j];
                        if (u.team === other.team && u.id !== other.id) {
                            if (u.team === 1 && other.x > u.x && (other.x - u.x) < hitboxSpacing) canMove = false;
                            if (u.team === 2 && u.x > other.x && (u.x - other.x) < hitboxSpacing) canMove = false;
                        }
                    }
                    if(canMove) u.x += u.speed;
                }
                
                if (u.cd > 0) u.cd--;
                if (u.hp <= 0) { 
                    let killer = u.team === 1 ? gameState.p2 : gameState.p1;
                    killer.gold += u.rew; 
                    if (killer.age === 1) killer.xp += u.xp; 
                    gameState.units.splice(i, 1); 
                }
            }

            // Conditions de Victoire
            if (gameState.p1.hp <= 0 || gameState.p2.hp <= 0) {
                gameActive = false; document.getElementById('game-over').style.display = 'flex'; 
                const msg = document.getElementById('end-message');
                if (gameMode === 'hardcore') {
                    if(gameState.p2.hp <= 0) { msg.innerText = "IMPOSSIBLE... VOUS AVEZ BATTU LE MODE SURVIE !"; msg.style.color = '#fff'; }
                    else { msg.innerText = "VOUS AVEZ SURVÉCU " + timeElapsed + " SECONDES."; msg.style.color = 'var(--enemy)'; }
                } else {
                    if (gameState.p1.hp <= 0 && myTeam === 1 || gameState.p2.hp <= 0 && myTeam === 2) { 
                        msg.innerText = "DÉFAITE TACTIQUE"; msg.style.color = 'var(--enemy)'; msg.style.textShadow = '0 0 20px var(--enemy)'; 
                    } else { 
                        msg.innerText = "VICTOIRE ABSOLUE"; msg.style.color = 'var(--gold)'; msg.style.textShadow = '0 0 20px var(--gold)'; 
                    }
                }
            }
        }

        // --- AFFICHAGE & RENDU ---
        function drawBackground() {
            if (imgs['map1'].complete && imgs['map1'].naturalWidth !== 0) ctx.drawImage(imgs['map1'], 0, 0, canvas.width / 2, canvas.height);
            if (imgs['map2'].complete && imgs['map2'].naturalWidth !== 0) ctx.drawImage(imgs['map2'], canvas.width / 2, 0, canvas.width / 2, canvas.height);
        }

        function updateHUD() {
            // Affichage de l'or
            if (gameMode === 'local') {
                document.getElementById('p1-gold').innerText = Math.floor(gameState.p1.gold);
                document.getElementById('p2-gold').innerText = Math.floor(gameState.p2.gold);
            } else {
                document.getElementById('p1-gold').innerText = Math.floor(myTeam === 1 ? gameState.p1.gold : gameState.p2.gold);
            }
            
            document.getElementById('p1-hp-bar').style.width = (gameState.p1.hp / gameState.p1.maxHp * 100) + '%'; 
            document.getElementById('p2-hp-bar').style.width = (gameState.p2.hp / gameState.p2.maxHp * 100) + '%';
            
            // HUD XP & Age J1
            if (gameState.p1.age === 1) { 
                document.getElementById('p1-xp-text').innerText = `${gameState.p1.xp}/${xpToEvolve}`; 
                document.getElementById('p1-xp-bar').style.width = Math.min(100, (gameState.p1.xp / xpToEvolve * 100)) + '%'; 
                if (gameState.p1.xp >= xpToEvolve && (myTeam === 1 || gameMode === 'local')) document.getElementById('btn-evolve-p1').style.display = 'block'; else document.getElementById('btn-evolve-p1').style.display = 'none';
            } else { 
                document.getElementById('p1-xp-text').innerText = "MAX"; document.getElementById('p1-xp-bar').style.width = '100%'; document.getElementById('btn-evolve-p1').style.display = 'none';
                if(document.getElementById('lock-p1-3')) { document.getElementById('lock-p1-3').style.display = 'none'; document.getElementById('lock-p1-4').style.display = 'none'; }
            }
            document.getElementById('p1-age').innerText = gameState.p1.age === 1 ? "1" : "MAX";

            // HUD XP & Age J2 (Seulement en Local ou si on est J2 en réseau)
            if (gameMode === 'local' || gameMode === 'client') {
                if (gameState.p2.age === 1) { 
                    document.getElementById('p2-xp-text').innerText = `${gameState.p2.xp}/${xpToEvolve}`; 
                    document.getElementById('p2-xp-bar').style.width = Math.min(100, (gameState.p2.xp / xpToEvolve * 100)) + '%'; 
                    if (gameState.p2.xp >= xpToEvolve && (myTeam === 2 || gameMode === 'local')) document.getElementById('btn-evolve-p2').style.display = 'block'; else document.getElementById('btn-evolve-p2').style.display = 'none';
                } else { 
                    document.getElementById('p2-xp-text').innerText = "MAX"; document.getElementById('p2-xp-bar').style.width = '100%'; document.getElementById('btn-evolve-p2').style.display = 'none';
                    if(document.getElementById('lock-p2-3')) { document.getElementById('lock-p2-3').style.display = 'none'; document.getElementById('lock-p2-4').style.display = 'none'; }
                }
            }
            document.getElementById('p2-age').innerText = gameState.p2.age === 1 ? "1" : "MAX";

            // Mise à jour de l'opacité et de la disponibilité des boutons
            let teamsToUpdate = gameMode === 'local' ? [1, 2] : [myTeam];
            teamsToUpdate.forEach(t => {
                let p = t === 1 ? gameState.p1 : gameState.p2;
                let pre = t === 1 ? 'p1' : 'p2';
                ['fantassin', 'tireur'].forEach((type, i) => { let b = document.getElementById(`btn-${pre}-u${i+1}`); if(b) b.disabled = p.gold < unitStats[type].cost; });
                ['blindé', 'sniper'].forEach((type, i) => { let b = document.getElementById(`btn-${pre}-u${i+3}`); if(b) b.disabled = p.gold < unitStats[type].cost || p.age < 2; });
                
                [1, 2].forEach(i => {
                    let btn = document.getElementById(`btn-${pre}-spell${i}`);
                    if(btn) {
                        btn.disabled = (p.gold < spellStats[i].cost) || (p.spells[i] > 0);
                        document.getElementById(`cd-${pre}-spell${i}`).style.width = (p.spells[i] / spellStats[i].cdMax * 100) + '%';
                    }
                });
            });
        }

        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBackground();

            // BASES
            ctx.fillStyle = 'rgba(0,0,0,0)'; 
            ctx.fillRect(bases[1].x, 130, bases[1].w, bases[1].h); 
            ctx.fillRect(bases[2].x, 130, bases[2].w, bases[2].h);

            // ANIMATION DES SORTS
            gameState.effects.forEach(eff => {
                if(eff.type === 'plasma') {
                    ctx.fillStyle = eff.team === 1 ? 'rgba(0, 136, 255, 0.6)' : 'rgba(255, 42, 42, 0.6)';
                    for(let i=0; i<15; i++) {
                        let lx = Math.random() * canvas.width;
                        ctx.fillRect(lx, 0, 3, canvas.height); 
                    }
                } else if (eff.type === 'nano') {
                    ctx.fillStyle = '#39ff14';
                    gameState.units.filter(u => u.team === eff.team).forEach(u => {
                        ctx.fillText('+', u.x + u.w/2 - 5, u.y - eff.life); 
                    });
                }
            });

            // UNITES
            gameState.units.forEach(u => {
                // Barre de vie
                ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(u.x, u.y - 10, u.w, 4); 
                ctx.fillStyle = '#2ecc71'; ctx.fillRect(u.x, u.y - 10, u.w * (u.hp / u.maxHp), 4);
                
                let direction = (u.team === 1) ? 'est' : 'ouest';
                if (u.type === 'fantassin') {
                    direction = (u.team === 1) ? 'ouest' : 'est'; 
                }
                
                let imgKey = `${u.skin}_${direction}`;
                let img = imgs[imgKey];

                ctx.save();
                ctx.translate(u.x + u.w/2, u.y + u.h/2);

                if (u.action === 'walk') {
                    u.animCycle = (u.animCycle || 0) + 0.15;
                    let bob = Math.abs(Math.sin(u.animCycle)) * 3;
                    let rot = Math.sin(u.animCycle) * 0.05;
                    if(u.type === 'melee' && u.hp > 100) { bob *= 0.5; rot = 0; } 
                    ctx.translate(0, -bob);
                    ctx.rotate(rot);
                } else if (u.action === 'attack') {
                    let progress = (u.cdMax - u.cd) / u.cdMax;
                    if(unitStats[u.type].type === 'melee') { 
                        let thrust = (progress < 0.2) ? progress * 60 : 0;
                        ctx.translate(u.team === 1 ? thrust : -thrust, 0);
                    } else { 
                        let recoil = (progress < 0.2) ? -3 : 0;
                        ctx.translate(u.team === 1 ? recoil : -recoil, 0);
                        if(u.cd === u.cdMax - 1) {
                            ctx.fillStyle = '#ff0';
                            ctx.beginPath(); ctx.arc(u.team === 1 ? u.w : -u.w, 0, 8, 0, Math.PI*2); ctx.fill();
                        }
                    }
                }

                if (img && img.complete && img.naturalWidth !== 0) {
                    ctx.drawImage(img, -u.w/2, -u.h/2, u.w, u.h);
                } else {
                    ctx.fillStyle = u.team === 1 ? '#0088ff' : '#ff2a2a';
                    ctx.fillRect(-u.w/2, -u.h/2, u.w, u.h);
                }
                ctx.restore();
            });
        }

        function gameLoop() {
            if(!gameActive) return;
            
            if(gameMode === 'host' || gameMode === 'solo' || gameMode === 'hardcore' || gameMode === 'local') {
                updatePhysics();
                if(gameMode === 'host' && conn && conn.open) {
                    conn.send({type: 'state', state: gameState});
                }
            }
            
            updateHUD();
            drawGame();
            requestAnimationFrame(gameLoop);
        }
    </script>

    <!-- SCRIPT DE NAVIGATION PAR SWIPE (TACTILE)   -->
    <!-- ========================================== -->
    <script>
        // 1. Liste de tes jeux dans l'ordre souhaité. 
        // /!\ Vérifie que les noms des dossiers correspondent bien aux tiens.
        const gamesHubList = [
            "../cybertank/index.html",
            "../tower_defense/index.html",
            "../edgeofwar/index.html",
            "../cyber_smash/index.html",
            "../guessthemanga/index.html",
            "../drawer/index.html",
            "../texas_poker/index.html"
        ];

        let touchstartX = 0;
        let touchendX = 0;
        
        function handleSwipeGesture() {
            const swipeThreshold = 75; // Distance minimum (en pixels) pour valider le swipe
            
            if (touchendX < touchstartX - swipeThreshold) {
                // Swipe vers la gauche (Jeu suivant)
                navigateGames(1);
            }
            if (touchendX > touchstartX + swipeThreshold) {
                // Swipe vers la droite (Jeu précédent)
                navigateGames(-1);
            }
        }

        function navigateGames(direction) {
            const currentPath = window.location.pathname;
            
            // Trouve l'index du jeu actuel en regardant l'URL
            let currentIndex = gamesHubList.findIndex(game => {
                let folderName = game.split('/')[1]; 
                return currentPath.includes(folderName);
            });
            
            // Si on ne trouve pas (erreur de nom de dossier), on annule
            if (currentIndex === -1) return;

            // Calcul du prochain jeu avec une boucle (le dernier ramène au premier)
            let nextIndex = (currentIndex + direction + gamesHubList.length) % gamesHubList.length;
            
            // Redirection
            window.location.href = gamesHubList[nextIndex];
        }

        // Écoute du début du touché
        document.addEventListener('touchstart', e => {
            // On ignore le swipe si on touche le canvas pour ne pas gâcher le gameplay
            if (e.target.tagName.toLowerCase() === 'canvas') return;
            touchstartX = e.changedTouches[0].screenX;
        }, { passive: true });

        // Écoute de la fin du touché
        document.addEventListener('touchend', e => {
            if (e.target.tagName.toLowerCase() === 'canvas') return;
            touchendX = e.changedTouches[0].screenX;
            handleSwipeGesture();
        }, { passive: true });
    </script>
