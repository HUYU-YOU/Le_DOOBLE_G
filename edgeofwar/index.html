<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Edge of War - Tactical Strike</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #090a0f; --panel: rgba(20, 22, 35, 0.9); --p1: #00f0ff; --p2: #ff007f; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: #fff; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; user-select: none; }
        h1 { color: #fff; text-transform: uppercase; letter-spacing: 5px; margin-top: 20px; text-shadow: 0 0 10px #fff; }
        
        .menu-container { background: var(--panel); padding: 30px; border-radius: 15px; box-shadow: 0 0 30px rgba(0, 240, 255, 0.2); text-align: center; margin-top: 50px; border: 1px solid rgba(255,255,255,0.1); }
        .input-box { padding: 10px; margin: 10px; border-radius: 5px; border: 1px solid #45a29e; background: #0b0c10; color: #fff; text-align: center; font-weight: bold; }
        .btn { background: #fff; color: #000; border: none; padding: 12px 25px; font-weight: bold; border-radius: 8px; cursor: pointer; text-transform: uppercase; margin: 10px; transition: 0.2s; }
        .btn:hover { transform: scale(1.05); box-shadow: 0 0 15px #fff; }
        
        #game-container { display: none; position: relative; margin-top: 20px; background: #1a1a2e; border: 2px solid #333; border-radius: 10px; box-shadow: inset 0 0 50px #000; overflow: hidden; }
        canvas { display: block; }
        
        #hud { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; pointer-events: none; }
        .base-hp { background: rgba(0,0,0,0.8); padding: 10px 20px; border-radius: 8px; font-size: 1.2em; font-weight: bold; border: 1px solid; }
        #hp-left { border-color: var(--p1); color: var(--p1); }
        #hp-right { border-color: var(--p2); color: var(--p2); }
        
        #controls { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; background: rgba(0,0,0,0.8); padding: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); }
        .unit-btn { background: #333; border: 2px solid #555; color: #fff; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .unit-btn:hover:not(:disabled) { border-color: var(--p1); background: #444; }
        .unit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        #money-display { position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); padding: 5px 15px; border-radius: 20px; font-weight: bold; color: #ffd700; border: 1px solid #ffd700; }

        .hub-link { position: absolute; top: 15px; left: 15px; color: rgba(255,255,255,0.7); text-decoration: none; font-weight: bold; z-index: 1000; background: rgba(0,0,0,0.6); padding: 10px 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); transition: 0.2s; backdrop-filter: blur(5px); }
        .hub-link:hover { color: #fff; background: rgba(0, 136, 255, 0.8); border-color: #fff; transform: scale(1.05); }
    </style>
</head>
<body>
    <a href="../index.html" class="hub-link">⬅ Retour au Hub</a>
    <h1>Edge of War</h1>

    <!-- MENU PRINCIPAL -->
    <div class="menu-container" id="main-menu">
        <h2 style="color:var(--p1);">DÉPLOIEMENT TACTIQUE</h2>
        <button class="btn" onclick="startSolo()">Campagne Solo (Vs IA)</button>
        <button class="btn" onclick="showNetMenu()" style="background:var(--p2);color:#fff;">Mode Réseau (P2P)</button>
    </div>

    <!-- MENU RESEAU -->
    <div class="menu-container" id="net-menu" style="display: none;">
        <h2>Connexion Serveur</h2>
        <p>Votre ID : <span id="my-id" style="color:var(--p1);font-weight:bold;">Création...</span></p>
        <button class="btn" onclick="hostGame()">Héberger la partie</button>
        <p>OU</p>
        <input type="text" id="join-id" class="input-box" placeholder="ID de la partie">
        <button class="btn" onclick="joinGame()" style="background:var(--p2);color:#fff;">Rejoindre</button>
        <p id="status-text" style="color: #aaa; margin-top: 15px;"></p>
        <button class="btn" style="background:#333; color:#fff; margin-top:20px; font-size:0.8em;" onclick="location.reload()">Retour</button>
    </div>

    <!-- JEU -->
    <div id="game-container">
        <canvas id="gameCanvas" width="900" height="400"></canvas>
        <div id="hud">
            <div class="base-hp" id="hp-left">BASE GAUCHE: <span id="b1-hp">1000</span></div>
            <div class="base-hp" id="hp-right">BASE DROITE: <span id="b2-hp">1000</span></div>
        </div>
        <div id="money-display">Crédits: <span id="money">0</span></div>
        <div id="controls">
            <button class="unit-btn" id="btn-fantassin" onclick="spawnUnit('fantassin')">Fantassin (10)</button>
            <button class="unit-btn" id="btn-drone" onclick="spawnUnit('drone')">Drone (30)</button>
            <button class="unit-btn" id="btn-tank" onclick="spawnUnit('tank')">Tank (50)</button>
        </div>
    </div>

    <script>
        // --- ASSETS ---
        const imgs = {};
        const imgFiles = {
            'fantassin': 'img/fantassin.png',
            'drone': 'img/drone.png',
            'tank': 'img/tank.png',
            'bg': 'img/bg.png' // Image de fond facultative
        };
        Object.keys(imgFiles).forEach(key => { imgs[key] = new Image(); imgs[key].src = imgFiles[key]; });

        const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d');
        const peer = new Peer(); let conn = null, isHost = false, gameMode = null, gameActive = false;
        let gameLoopId = null;

        peer.on('open', id => { document.getElementById('my-id').innerText = id; });

        function showNetMenu() { document.getElementById('main-menu').style.display = 'none'; document.getElementById('net-menu').style.display = 'block'; }
        
        function startSolo() {
            gameMode = 'solo'; isHost = true;
            document.getElementById('main-menu').style.display = 'none'; document.getElementById('game-container').style.display = 'block';
            gameActive = true; startGameLoop();
        }

        function hostGame() {
            let id = document.getElementById('my-id').innerText;
            if(id && id !== "Création...") {
                navigator.clipboard.writeText(id).catch(e => console.log(e)); // COPIE AUTOMATIQUE DE L'ID
                document.getElementById('status-text').innerText = "ID COPIÉ ! En attente d'un adversaire..."; 
            } else {
                document.getElementById('status-text').innerText = "En attente...";
            }
            isHost = true; gameMode = 'network';
            peer.on('connection', c => { conn = c; setupConnection(); });
        }

        function joinGame() {
            let id = document.getElementById('join-id').value; if(!id) return;
            document.getElementById('status-text').innerText = "Connexion..."; isHost = false; gameMode = 'network';
            conn = peer.connect(id); setupConnection();
        }

        function setupConnection() {
            conn.on('open', () => {
                document.getElementById('net-menu').style.display = 'none'; document.getElementById('game-container').style.display = 'block';
                gameActive = true;
                if(isHost) { startGameLoop(); }
            });
            conn.on('data', data => {
                if(isHost && data.type === 'spawn') createUnit(data.unitType, 2);
                if(!isHost && data.type === 'state') {
                    gameState = data.state; updateHUDClient(); drawGame();
                }
            });
        }

        // --- DONNÉES DU JEU ---
        const unitData = {
            'fantassin': { cost: 10, hp: 40, dmg: 5, range: 40, speed: 0.8, w: 30, h: 40, type: 'melee' },
            'drone': { cost: 30, hp: 60, dmg: 8, range: 150, speed: 1.2, w: 40, h: 40, type: 'ranged' },
            'tank': { cost: 50, hp: 200, dmg: 20, range: 60, speed: 0.5, w: 70, h: 50, type: 'melee' }
        };

        let gameState = {
            base1: { hp: 1000, maxHp: 1000, x: 50 },
            base2: { hp: 1000, maxHp: 1000, x: 850 },
            units: [], particles: [], money: 20
        };

        // --- GESTION DES UNITÉS ET PHYSIQUE ---
        let moneyTimer = 0;

        function spawnUnit(type) {
            if(gameMode === 'solo' || isHost) {
                if(gameState.money >= unitData[type].cost) {
                    gameState.money -= unitData[type].cost;
                    createUnit(type, 1);
                }
            } else {
                // Le client envoie la requête
                conn.send({type: 'spawn', unitType: type});
            }
        }

        function createUnit(type, team) {
            let u = unitData[type];
            gameState.units.push({
                id: Math.random().toString(36).substr(2, 9),
                type: type, team: team, hp: u.hp, maxHp: u.hp, dmg: u.dmg, range: u.range, speed: u.speed,
                w: u.w, h: u.h, atkType: u.type,
                x: team === 1 ? gameState.base1.x + 40 : gameState.base2.x - 40,
                y: type === 'drone' ? 100 + Math.random()*50 : 320,
                cooldown: 0
            });
            // Effet visuel Nanobots (Vert)
            for(let i=0; i<10; i++) gameState.particles.push(new Particle(team===1?100:800, 320, '#39ff14'));
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y; this.color = color;
                this.vx = (Math.random()-0.5)*4; this.vy = (Math.random()-0.5)*4;
                this.life = 1.0; this.decay = Math.random()*0.05 + 0.02;
            }
        }
        
        class PlasmaBeam {
            constructor(x1, y1, x2, y2, color) {
                this.x1=x1; this.y1=y1; this.x2=x2; this.y2=y2; this.color=color; this.life=10;
            }
        }

        let beams = [];

        function updatePhysics() {
            moneyTimer++;
            if(moneyTimer >= 60) { gameState.money += 2; moneyTimer = 0; } // 2 crédits par seconde

            // IA Solo basique
            if(gameMode === 'solo' && Math.random() < 0.01) {
                const types = ['fantassin', 'drone', 'tank'];
                createUnit(types[Math.floor(Math.random()*types.length)], 2);
            }

            gameState.units.forEach(u => {
                if(u.cooldown > 0) u.cooldown--;

                // Trouver cible
                let target = null; let minDist = Infinity;
                gameState.units.forEach(enemy => {
                    if(enemy.team !== u.team) {
                        let dist = Math.abs(enemy.x - u.x);
                        if(dist < minDist) { minDist = dist; target = enemy; }
                    }
                });

                // Cibler la base si aucune unité
                let enemyBase = u.team === 1 ? gameState.base2 : gameState.base1;
                if(!target) {
                    minDist = Math.abs(enemyBase.x - u.x);
                    target = { isBase: true, x: enemyBase.x, obj: enemyBase };
                }

                // Avancer ou attaquer
                if(minDist > u.range) {
                    u.x += u.team === 1 ? u.speed : -u.speed;
                } else if(u.cooldown === 0) {
                    u.cooldown = 60; // 1 attaque par seconde
                    if(target.isBase) {
                        target.obj.hp -= u.dmg;
                        for(let i=0; i<5; i++) gameState.particles.push(new Particle(target.x, 320, '#ffaa00'));
                    } else {
                        target.hp -= u.dmg;
                        for(let i=0; i<5; i++) gameState.particles.push(new Particle(target.x, target.y, '#ff0000'));
                    }
                    
                    if(u.atkType === 'ranged') {
                        beams.push(new PlasmaBeam(u.x, u.y, target.x, target.y||320, u.team===1?'#00f0ff':'#ff007f'));
                    }
                }
            });

            // Nettoyage morts
            gameState.units = gameState.units.filter(u => u.hp > 0);

            // Particules et Lasers
            for(let i=gameState.particles.length-1; i>=0; i--) {
                let p = gameState.particles[i]; p.x+=p.vx; p.y+=p.vy; p.life-=p.decay;
                if(p.life <= 0) gameState.particles.splice(i,1);
            }
            for(let i=beams.length-1; i>=0; i--) {
                beams[i].life--; if(beams[i].life <= 0) beams.splice(i,1);
            }
        }

        // --- RENDU ---
        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Background
            if(imgs['bg'].complete && imgs['bg'].naturalWidth !== 0) ctx.drawImage(imgs['bg'], 0, 0, canvas.width, canvas.height);
            else {
                ctx.fillStyle = '#1a1a2e'; ctx.fillRect(0,0,canvas.width,canvas.height);
                ctx.fillStyle = '#222'; ctx.fillRect(0,350,canvas.width,50); // Sol
            }

            // Hitbox des Bases Invisibles (On dessine juste la barre de vie si besoin, mais HUD le fait déjà)
            // On peut ajouter une lueur pour montrer où est la base
            ctx.shadowBlur = 30; ctx.shadowColor = '#00f0ff'; ctx.fillStyle = 'rgba(0, 240, 255, 0.2)';
            ctx.fillRect(0, 200, 50, 150);
            ctx.shadowColor = '#ff007f'; ctx.fillStyle = 'rgba(255, 0, 127, 0.2)';
            ctx.fillRect(850, 200, 50, 150);
            ctx.shadowBlur = 0;

            // Unités
            gameState.units.forEach(u => {
                ctx.save();
                ctx.translate(u.x, u.y);
                
                // --- INVERSION DU FANTASSIN ---
                let flip = (u.team === 2);
                // Si l'image de base du fantassin regarde à l'Est, et que tu veux qu'il regarde à l'Ouest par défaut (ou inversement), on inverse sa logique.
                if(u.type === 'fantassin') flip = !flip; 
                
                if(flip) ctx.scale(-1, 1);

                if(imgs[u.type].complete && imgs[u.type].naturalWidth !== 0) {
                    ctx.drawImage(imgs[u.type], -u.w/2, -u.h/2, u.w, u.h);
                } else {
                    ctx.fillStyle = u.team === 1 ? '#00f0ff' : '#ff007f';
                    ctx.fillRect(-u.w/2, -u.h/2, u.w, u.h);
                }
                ctx.restore();

                // Barre de vie de l'unité
                ctx.fillStyle = 'red'; ctx.fillRect(u.x - 15, u.y - u.h/2 - 10, 30, 4);
                ctx.fillStyle = '#39ff14'; ctx.fillRect(u.x - 15, u.y - u.h/2 - 10, 30 * (u.hp / u.maxHp), 4);
            });

            // Lasers Plasma
            beams.forEach(b => {
                ctx.strokeStyle = b.color; ctx.lineWidth = 3; ctx.shadowBlur = 10; ctx.shadowColor = b.color;
                ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke(); ctx.shadowBlur = 0;
            });

            // Particules (Nanobots et Explosions)
            gameState.particles.forEach(p => {
                ctx.fillStyle = p.color; ctx.globalAlpha = Math.max(0, p.life);
                ctx.fillRect(p.x, p.y, 4, 4); ctx.globalAlpha = 1.0;
            });
        }

        function updateHUDHost() {
            document.getElementById('b1-hp').innerText = Math.floor(gameState.base1.hp);
            document.getElementById('b2-hp').innerText = Math.floor(gameState.base2.hp);
            document.getElementById('money').innerText = Math.floor(gameState.money);

            // Boutons Grisables
            document.getElementById('btn-fantassin').disabled = gameState.money < 10;
            document.getElementById('btn-drone').disabled = gameState.money < 30;
            document.getElementById('btn-tank').disabled = gameState.money < 50;

            if(gameState.base1.hp <= 0 || gameState.base2.hp <= 0) {
                gameActive = false;
                alert(gameState.base1.hp <= 0 ? "DEFAITE !" : "VICTOIRE !");
                location.reload();
            }
        }
        function updateHUDClient() {
            document.getElementById('b1-hp').innerText = Math.floor(gameState.base1.hp);
            document.getElementById('b2-hp').innerText = Math.floor(gameState.base2.hp);
            document.getElementById('money').parentElement.style.display = 'none'; // Client gère pas l'argent visuellement de la même façon si P2P basique
        }

        function startGameLoop() {
            if(!gameActive) return;
            updatePhysics(); drawGame(); updateHUDHost();
            if(gameMode === 'network' && conn && conn.open) conn.send({type: 'state', state: gameState});
            gameLoopId = requestAnimationFrame(startGameLoop);
        }
    </script>
</body>
</html>
