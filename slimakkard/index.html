<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Viking Slime Battle - Prototype</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>VIKING SLIME BATTLE</h1>

    <div class="game-container">
        <!-- Grille du Joueur -->
        <div class="grid-container">
            <h2>Ma Flotte (Slime)</h2>
            <div id="player-grid" class="grid"></div>
        </div>

        <!-- Grille de l'Adversaire -->
        <div class="grid-container">
            <h2>Flotte Ennemie</h2>
            <div id="adversary-grid" class="grid"></div>
        </div>
    </div>

    <div class="command-panel">
        <p id="game-status">Cliquez sur la grille ennemie pour attaquer !</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
