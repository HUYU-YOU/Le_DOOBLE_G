<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Éline in Slimerland</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="main-menu">
        <div class="menu-container">
            <div class="menu-btn-wrapper" onclick="startNewGame()">
                <img src="assets/start.png" alt="Nouvelle partie" class="menu-btn-img">
                <span class="menu-text" id="menu-text-start">Commencer l'aventure</span>
            </div>
            <div class="menu-btn-wrapper" onclick="toggleSettings()">
                <img src="assets/option.png" alt="Options" class="menu-btn-img">
                <span class="menu-text" id="menu-text-option">Options..!</span>
            </div>
            <div class="menu-btn-wrapper" onclick="quitGame()">
                <img src="assets/leave.png" alt="Quitter" class="menu-btn-img">
                <span class="menu-text" id="menu-text-leave">Quitter</span>
            </div>
        </div>
    </div>

    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title-options">Options</h2>
            
            <div class="setting-item">
                <span id="modal-text-lang">Langue 🌍</span>
                <select id="lang-select" onchange="changeLanguage()">
                    <option value="fr">Français</option>
                    <option value="en">English</option>
                </select>
            </div>

            <div class="setting-item">
                <span id="modal-text-theme">Mode Sombre 🌙</span>
                <label class="switch">
                    <input type="checkbox" id="theme-toggle" onchange="toggleTheme()">
                    <span class="slider"></span>
                </label>
            </div>

            <button onclick="toggleSettings()" class="close-btn" id="modal-text-close">Fermer</button>
        </div>
    </div>

    <div id="game-ui">
        <h1 class="in-game-title">Éline in Slimerland</h1>
    </div>
    
    <div id="game-container">
        <video id="story-video" playsinline></video>
        
        <div id="video-ui">
            <h2 id="top-text" class="story-text"></h2>
            
            <div id="bottom-section">
                <p id="bottom-text" class="story-text"></p>
                <div id="choices-container">
                    </div>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
